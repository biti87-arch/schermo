<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Schermo del Narratore</title>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="icon" href="icona.png">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Schermo da GM a tre colonne (Tavolo · Iniziativa · Viaggio/Log): pannelli di legno scuro,
   numeri in monospazio come su uno schermo cartaceo, oro e arancio della Collana per i titoli. */
:root{
  --bg:#15120E; --pannello:#1E1914; --pannello2:#28211A; --riga:#3A3127; --testo:#ECE3D1; --tenue:#A5977F;
  --arancio:#E07A35; --oro:#D4A84B; --oro-scuro:#8B6914; --rosso:#C00000; --rosso-chiaro:#F07A6E; --verde:#1E7A1E;
  --fatica:#C9A13F; --ferita:#B84A3A; --sel:#3B2E1E; --ombra:0 8px 30px rgb(0 0 0 / .45);
  --f-titolo:"Spectral SC", Georgia, serif; --f-testo:"IBM Plex Sans", system-ui, sans-serif; --f-num:"IBM Plex Mono", ui-monospace, monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#EFEAE0; --pannello:#FBF8F2; --pannello2:#F1EADC; --riga:#D6CBB6; --testo:#1E1A15; --tenue:#6B5F4D;
  --arancio:#C45911; --oro:#8B6914; --oro-scuro:#8B6914; --rosso:#C00000; --rosso-chiaro:#C00000; --verde:#1E7A1E;
  --fatica:#B48A1E; --ferita:#A8372A; --sel:#F3E2C4; --ombra:0 8px 30px rgb(60 40 10 / .18); color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--testo);font:15px/1.45 var(--f-testo)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px;max-width:1700px;margin:0 auto}
h1,h2,h3{font-family:var(--f-titolo);font-weight:700;letter-spacing:.02em;text-wrap:balance;margin:0}
h2{font-size:1.15rem;color:var(--arancio)}
h3{font-size:1rem;color:var(--oro)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tenue{color:var(--tenue)}
.piccolo{font-size:.82rem}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px}

/* pulsanti */
.btn{border:1px solid var(--riga);background:var(--pannello2);border-radius:6px;padding:6px 11px;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--oro-scuro)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.prim{background:var(--arancio);border-color:var(--arancio);color:#1A0F05;font-weight:600}
.btn.oro{border-color:var(--oro-scuro);color:var(--oro)}
.btn.peric{border-color:var(--rosso);color:var(--rosso-chiaro)}
.btn.min{padding:3px 8px;font-size:.85rem}
.btn.grande{padding:10px 18px;font-size:1.05rem}
.fila{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.spazio{flex:1}

/* testata con orologio */
header.testa{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--riga);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.testa-riga{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.marchio{font-family:var(--f-titolo);color:var(--oro);font-size:.95rem;letter-spacing:.06em}
.marchio b{color:var(--arancio)}
.orologio{display:flex;flex-direction:column;min-width:0}
.orologio .data{font-family:var(--f-titolo);font-size:1.2rem;color:var(--testo)}
.orologio .ora{font-family:var(--f-num);font-size:1.55rem;color:var(--oro);line-height:1}
.orologio .ora small{font-size:.8rem;color:var(--tenue);margin-left:6px}
.meteo-chip{border:1px solid var(--riga);border-radius:999px;padding:4px 12px;background:var(--pannello);cursor:pointer;display:flex;gap:8px;align-items:center}
.meteo-chip .z{color:var(--tenue);font-size:.8rem}
.tasti-tempo{display:flex;flex-wrap:wrap;gap:5px}
.coda{margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--oro-scuro);background:color-mix(in srgb,var(--oro-scuro) 18%,var(--pannello));border-radius:8px;padding:7px 10px}
.coda .t{flex:1;min-width:200px}

/* tre colonne */
.colonne{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,.9fr);gap:16px;margin-top:16px;align-items:start}
@media (max-width:899px){.colonne{grid-template-columns:minmax(0,1fr)}header.testa{position:static}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.col-testa{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--riga);padding-bottom:6px}
.vuoto{border:1px dashed var(--riga);border-radius:8px;padding:16px;color:var(--tenue)}

/* riquadro del PG */
.pg{background:var(--pannello);border:1px solid var(--riga);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pg.attivo{border-color:var(--arancio);box-shadow:0 0 0 1px var(--arancio)}
.pg-testa{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pg-nome{font-family:var(--f-titolo);font-size:1.15rem;color:var(--arancio)}
.pg-classe{color:var(--tenue);font-size:.88rem}
.eroe{cursor:pointer;border:0;background:none;padding:0 2px;color:var(--oro);font-size:.9rem}
.eroe.no{color:var(--tenue)}
.barre{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:.86rem}
.barra{height:9px;border-radius:5px;background:var(--pannello2);overflow:hidden;border:1px solid var(--riga)}
.barra i{display:block;height:100%}
.barra.fa i{background:var(--fatica)} .barra.fe i{background:var(--ferita)}
.barra.neg{border-color:var(--rosso);background:repeating-linear-gradient(45deg,var(--pannello2) 0 5px,color-mix(in srgb,var(--rosso) 35%,transparent) 5px 10px)}
.stat{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:.88rem}
.stat b{font-weight:500;color:var(--tenue);margin-right:3px}
.mod{color:var(--rosso-chiaro);font-weight:600;cursor:help}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:.78rem;border-radius:4px;padding:1px 7px;border:1px solid var(--riga);background:var(--pannello2)}
.chip.cond{background:var(--rosso);border-color:var(--rosso);color:#fff}
.chip.sv{background:var(--rosso);border-color:var(--rosso);color:#fff}
.chip.ok{background:var(--verde);border-color:var(--verde);color:#fff}
.cond-t{color:var(--rosso-chiaro);font-weight:600}
[hidden]{display:none!important}
button.chip{cursor:pointer;font:inherit;font-size:.78rem;color:inherit;text-align:left}
.chip.fer{border-color:var(--rosso);color:var(--rosso-chiaro);background:color-mix(in srgb,var(--rosso) 14%,var(--pannello2))}
.chip.vel{border-color:#5E8C3A;color:#9BC97A;background:color-mix(in srgb,#5E8C3A 16%,var(--pannello2))}
:root[data-theme="light"] .chip.vel{color:#3D6B1F}
.mod.su{color:#7FC86F}
:root[data-theme="light"] .mod.su{color:var(--verde)}
.btn.ok{border-color:var(--verde);color:#7FC86F}
:root[data-theme="light"] .btn.ok{color:var(--verde)}
.note-pg{font-size:.78rem;color:var(--tenue);display:flex;flex-direction:column;gap:1px}
.ordine .chips .chip{font-size:.72rem}
.pend{border-top:1px solid var(--riga);padding-top:6px;display:flex;flex-direction:column;gap:6px}

/* iniziativa */
.barra-turno{background:var(--pannello);border:1px solid var(--oro-scuro);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.barra-turno .chi{font-family:var(--f-titolo);font-size:1.35rem;color:var(--arancio)}
.timer{font-family:var(--f-num);font-size:1rem;color:var(--oro)}
.timer.allarme{color:var(--rosso-chiaro)}
.ordine{list-style:none;margin:0;padding:0;border:1px solid var(--riga);border-radius:8px;overflow:hidden;background:var(--pannello)}
.ordine li{display:grid;grid-template-columns:3.2em 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--riga);cursor:pointer}
.ordine li:first-child{border-top:0}
.ordine li.ora{background:var(--sel);box-shadow:inset 3px 0 0 var(--arancio)}
.ordine li.sel{outline:1px solid var(--oro);outline-offset:-1px}
.ordine li.fuori .nome{text-decoration:line-through;color:var(--tenue)}
.ordine .tot{font-family:var(--f-num);font-size:1.1rem;color:var(--oro);text-align:right}
.ordine .nome{min-width:0;overflow-wrap:anywhere}
.ordine .tipo-pg .nome{color:var(--arancio);font-weight:600}
.azioni-riga{background:var(--pannello2);border:1px solid var(--riga);border-radius:8px;padding:8px}
.comandi{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* moduli */
.campo{display:flex;flex-direction:column;gap:3px;min-width:0}
.campo>span{font-size:.78rem;color:var(--tenue);text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--riga);border-radius:5px;padding:6px 8px;width:100%;min-width:0}
input[type=number]{font-family:var(--f-num)}
textarea{min-height:90px;font-family:var(--f-num);font-size:.82rem}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.griglia.stretta{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}
fieldset{border:1px solid var(--riga);border-radius:8px;padding:8px 10px 10px;margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
legend{font-family:var(--f-titolo);color:var(--oro);padding:0 6px}
label.spunta.spento{opacity:.55}
label.spunta{display:flex;gap:6px;align-items:center;cursor:pointer}
.tab-nemici{display:flex;flex-direction:column;gap:6px}
.nemico{display:grid;grid-template-columns:minmax(0,2fr) 4.2em 3.6em minmax(0,1.3fr) auto;gap:5px;align-items:center}
@media (max-width:520px){.nemico{grid-template-columns:minmax(0,1fr) 4.2em 3.6em}}
.pgini{display:grid;grid-template-columns:minmax(0,1fr) 6em auto;gap:6px;align-items:center}

/* pannelli della terza colonna */
.pannello{background:var(--pannello);border:1px solid var(--riga);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.schede{display:flex;gap:2px;border-bottom:1px solid var(--riga)}
.schede button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--tenue);border-bottom:2px solid transparent}
.schede button.on{color:var(--arancio);border-bottom-color:var(--arancio)}
.effetto{border-left:3px solid var(--oro-scuro);padding-left:8px;font-size:.88rem}
.effetto b{color:var(--oro);font-weight:600}
.scorta{display:grid;grid-template-columns:4.5em 1fr auto;gap:6px;align-items:center}
.scorta .q{font-family:var(--f-num);font-size:1.3rem;color:var(--oro)}
.log{list-style:none;margin:0;padding:0;font-size:.85rem;max-height:60vh;overflow:auto}
.log li{padding:4px 0;border-top:1px solid var(--riga);display:grid;grid-template-columns:7.5em 1fr;gap:8px}
.log li .q{font-family:var(--f-num);color:var(--tenue);font-size:.76rem}

/* elenco campagne */
.lista-camp{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:18px}
.camp{background:var(--pannello);border:1px solid var(--riga);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.camp h2{font-size:1.3rem}
.titolo-app{padding-block:28px 6px;display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.titolo-app h1{font-size:clamp(1.8rem,4vw,2.6rem);color:var(--oro)}
.titolo-app h1 b{color:var(--arancio)}

/* finestre */
.velo{position:fixed;inset:0;background:rgb(0 0 0 / .55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.finestra{background:var(--pannello);border:1px solid var(--oro-scuro);border-radius:10px;box-shadow:var(--ombra);width:min(560px,100%);display:flex;flex-direction:column;max-height:calc(100dvh - 48px)}
.finestra.larga{width:min(900px,100%)}
.finestra>header{padding:12px 14px;border-bottom:1px solid var(--riga)}
.finestra>.corpo{padding:12px 14px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.finestra>footer{padding:10px 14px;border-top:1px solid var(--riga);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.passi{display:flex;gap:4px;flex-wrap:wrap;font-size:.75rem;color:var(--tenue)}
.passi span{padding:1px 6px;border-radius:4px;border:1px solid var(--riga)}
.passi span.on{border-color:var(--arancio);color:var(--arancio)}
.mesi{display:flex;flex-direction:column;gap:5px}
.mese{display:grid;grid-template-columns:minmax(0,1fr) 4.5em 8em auto;gap:5px}
.avviso{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--pannello2);border:1px solid var(--oro-scuro);border-radius:8px;padding:9px 14px;box-shadow:var(--ombra);max-width:min(92vw,560px)}
.avviso.err{border-color:var(--rosso);color:var(--rosso-chiaro)}
.banda{border:1px solid var(--rosso);border-radius:8px;padding:8px 10px;color:var(--rosso-chiaro);margin-top:10px}
.risultato{font-family:var(--f-num);font-size:1.4rem;color:var(--oro)}
@media (prefers-reduced-motion:no-preference){.btn,.ordine li{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="finestre"></div>
<script>
const DATI = {"meteo":{"fonte":"Guida del DM.pdf: «Tabelle del tempo atmosferico» e «Fame e sete» (estratto in sorgenti/guida/guida_meteo_fame_sete.txt)","correzioni":["Zona temperata, estate: «2 giugno – 22 settembre» letto 22 giugno (la primavera finisce il 21 giugno).","Sete: «non abbia mangiato nel giorno precedente» letto «non abbia bevuto»."],"zone":[{"id":"temperata","nome":"Temperata"},{"id":"desertica","nome":"Desertica"},{"id":"artica","nome":"Artica"}],"stagioni":{"temperata":[{"id":"primavera","nome":"Primavera","da":[21,3],"a":[21,6]},{"id":"estate","nome":"Estate","da":[22,6],"a":[22,9]},{"id":"autunno","nome":"Autunno","da":[23,9],"a":[21,12]},{"id":"inverno","nome":"Inverno","da":[22,12],"a":[20,3]}],"desertica":[{"id":"primavera-estate","nome":"Primavera – estate","da":[21,3],"a":[22,9]},{"id":"autunno-inverno","nome":"Autunno – inverno","da":[23,9],"a":[20,3]}],"artica":[{"id":"primavera-estate","nome":"Primavera – estate","da":[21,3],"a":[22,9]},{"id":"autunno-inverno","nome":"Autunno – inverno","da":[23,9],"a":[20,3]}]},"stagione_del_mese":{"temperata":{"primavera":"primavera","estate":"estate","autunno":"autunno","inverno":"inverno"},"desertica":{"primavera":"primavera-estate","estate":"primavera-estate","autunno":"autunno-inverno","inverno":"autunno-inverno"},"artica":{"primavera":"primavera-estate","estate":"primavera-estate","autunno":"autunno-inverno","inverno":"autunno-inverno"}},"tabelle":{"temperata":{"primavera":[{"da":1,"a":85,"testo":"Clima mite"},{"da":86,"a":90,"testo":"Pioggia battente"},{"da":91,"a":94,"testo":"Acquazzone"},{"da":95,"a":97,"testo":"Vento forte"},{"da":98,"a":99,"testo":"Vento molto forte"},{"da":100,"a":100,"testo":"Nebbia"}],"estate":[{"da":1,"a":75,"testo":"Clima caldo"},{"da":76,"a":90,"testo":"Pioggia battente"},{"da":91,"a":94,"testo":"Arsura"},{"da":95,"a":96,"testo":"Acquazzone"},{"da":97,"a":98,"testo":"Vento forte"},{"da":99,"a":100,"testo":"Vento molto forte"}],"autunno":[{"da":1,"a":80,"testo":"Clima fresco"},{"da":81,"a":89,"testo":"Pioggia battente"},{"da":90,"a":94,"testo":"Acquazzone"},{"da":95,"a":96,"testo":"Vento forte"},{"da":97,"a":98,"testo":"Vento molto forte"},{"da":99,"a":100,"testo":"Nebbia"}],"inverno":[{"da":1,"a":75,"testo":"Clima freddo"},{"da":76,"a":90,"testo":"Pioggia battente / Neve"},{"da":91,"a":94,"testo":"Gelo"},{"da":95,"a":96,"testo":"Acquazzone / Neve fitta"},{"da":97,"a":98,"testo":"Vento forte"},{"da":99,"a":100,"testo":"Vento molto forte"}]},"desertica":{"primavera-estate":[{"da":1,"a":85,"testo":"Arsura"},{"da":86,"a":90,"testo":"Clima caldo"},{"da":91,"a":94,"testo":"Clima caldo + Vento forte"},{"da":95,"a":97,"testo":"Clima caldo + Vento molto forte"},{"da":98,"a":99,"testo":"Monsone"},{"da":100,"a":100,"testo":"Clima caldo + Tempesta di polvere/sabbia"}],"autunno-inverno":[{"da":1,"a":75,"testo":"Clima caldo"},{"da":76,"a":90,"testo":"Arsura"},{"da":91,"a":94,"testo":"Clima caldo + Vento forte"},{"da":95,"a":96,"testo":"Clima caldo + Vento molto forte"},{"da":97,"a":98,"testo":"Acquazzone"},{"da":99,"a":100,"testo":"Monsone"}]},"artica":{"primavera-estate":[{"da":1,"a":75,"testo":"Clima freddo"},{"da":76,"a":90,"testo":"Gelo"},{"da":91,"a":94,"testo":"Clima freddo + Vento forte"},{"da":95,"a":96,"testo":"Clima freddo + Vento molto forte"},{"da":97,"a":98,"testo":"Clima freddo + Neve"},{"da":99,"a":100,"testo":"Clima freddo + Neve fitta"}],"autunno-inverno":[{"da":1,"a":85,"testo":"Gelo"},{"da":86,"a":90,"testo":"Gelo + Vento forte"},{"da":91,"a":94,"testo":"Gelo + Vento molto forte"},{"da":95,"a":97,"testo":"Gelo + Neve"},{"da":98,"a":99,"testo":"Gelo + Neve fitta"},{"da":100,"a":100,"testo":"Gelo + Tempesta di grandine"}]}},"voci":{"Clima mite":"Clima mite/fresco","Clima fresco":"Clima mite/fresco","Clima caldo":"Clima caldo/freddo","Clima freddo":"Clima caldo/freddo","Arsura":"Arsura/gelo","Gelo":"Arsura/gelo","Pioggia battente":"Pioggia battente","Acquazzone":"Acquazzone","Monsone":"Monsone","Nebbia":"Nebbia","Neve":"Neve e nevischio","Neve fitta":"Neve fitta","Vento forte":"Vento forte","Vento molto forte":"Vento molto forte","Tempesta di polvere/sabbia":"Tempesta di grandine/polvere/sabbia","Tempesta di grandine":"Tempesta di grandine/polvere/sabbia"},"effetti":{"Acquazzone":"Visibilità massima 15 caselle. Penalità -4 alle prove di Percezione. Si spengono automaticamente le fiamme non protette.","Arsura/gelo":"Giornata di caldo/freddo intenso. Una creatura senza abiti estivi/invernali, dopo 1 ora è esausta.","Clima caldo/freddo":"Il tipico clima estivo/invernale. Una creatura senza abiti estivi/invernali, dopo 1 ora è affaticata.","Clima mite/fresco":"Il tipico clima primaverile/autunnale. Nessun effetto particolare.","Monsone":"Visibilità massima 15 caselle. Penalità -4 ai tiri per colpire a distanza e alle prove di Percezione. Si spengono automaticamente le fiamme non protette.","Nebbia":"Le creature oltre 3 metri godono di Occultamento 50%.","Neve e nevischio":"Visibilità massima 15 caselle. Penalità -4 alle prove di Percezione e -2 ai tiri per colpire a distanza. Se la neve si è già depositata il terreno è difficile (x2).","Neve fitta":"(solo in luoghi plausibili). Visibilità massima 10 caselle. Penalità -4 alle prove di Percezione e -2 ai Tiri per Colpire a distanza. Le creature oltre 3 metri godono di Occultamento 50%. Se la neve si è già depositata il terreno è difficile (x4).","Pioggia battente":"Penalità -2 alle prove di Percezione. Si spengono automaticamente le fiamme non protette.","Tempesta di grandine/polvere/sabbia":"Visibilità massima 5 caselle. I tiri per colpire a distanza falliscono automaticamente. Si spengono automaticamente le fiamme protette e non. Ogni minuto si subiscono 1d4 danni letali a causa delle escoriazioni, cadute, asfissia, etc.","Vento forte":"Penalità -2 ai Tiri per Colpire a distanza. Si spengono automaticamente le fiamme non protette.","Vento molto forte":"Penalità -4 ai Tiri per Colpire a distanza. Si spengono automaticamente le fiamme non protette e quelle protette hanno una probabilità del 50% di spegnersi ogni 10 minuti."},"fame_sete":{"sete":{"nome":"Sete","scorta":"acqua","giorno_prova":4,"cd":10,"testo":"1) Una creatura che non abbia bevuto nel giorno precedente subisce penalità di -1 a tutti i tiri per colpire, Tiri Salvezza e prove (cumulativa per ogni giorno in cui non beve). La penalità diminuisce di 1 il giorno seguente a quello in cui si è bevuto. 2) A partire dal quarto, oltre alla penalità ai tiri di dado, la creatura deve superare una prova di Costituzione all’inizio di ogni nuovo giorno con CD pari a 10. Se fallisce il tiro, cade priva di sensi e muore nel giro di 1d12 ore."},"fame":{"nome":"Fame","scorta":"cibo","giorno_prova":7,"cd":10,"testo":"1) Una creatura che non abbia mangiato nel giorno precedente subisce penalità di -1 a tutti i tiri per colpire, Tiri Salvezza e prove (cumulativa per ogni giorno in cui non mangia). La penalità diminuisce di 1 il giorno seguente a quello in cui si è mangiato. 2) A partire dal settimo, oltre alla penalità ai tiri di dado, la creatura deve superare una prova di Costituzione all’inizio di ogni nuovo giorno con CD pari a 10. Se fallisce il tiro, cade priva di sensi e muore nel giro di 1d12 ore."},"nota_vol1":"Affaticato o esausto dovuti a fame o sete si tolgono solo rifocillandosi (Vol. 1)."}},"ferite":{"fonte":"Vol. 3 - Miscellanea 2.5.8, Cap. 3 Imprevisti (estratto in sorgenti/guida/vol3_imprevisti.txt)","ferite_gravi":[{"id":"colpire","nome":"Armi e incantesimi con tiro per colpire","dado":"1d8","righe_per_locazione":{"testa":{"-1":"Sangue, polvere, detriti o scintille ti finiscono negli occhi: sei offuscato (20%) per 2 round.","-2":"Un colpo all’altezza dell’orecchio ti fa perdere l’equilibrio mandandoti prono.","-3":"Il colpo ti spacca il naso rendendoti infermo per 1 minuto.","-4":"Un colpo di rimbalzo, il manico dell’arma o un gesto involontario del nemico ti colpisce alla gola: sei nauseato per 1 round.","-5":"Il colpo è forte e la testa ti inizia a girare: sei barcollante per 2 round.","-6":"Il colpo ti lascia intontito e sei barcollante per 2 round. Inoltre, l’oggetto indossato si danneggia1 (1d3 = 1: slot volto, 2: slot gola, 3: slot testa).","-7":"Il colpo ti squarcia la fronte e il sangue ti gronda copioso sul volto: sei offuscato (33%) finché l’emorragia lieve (8 PF) non viene curata.","-8":"La violenza del colpo è tale da renderti frastornato per 1 round. Inoltre, l’oggetto indossato si danneggia1 (1d3 = 1: slot volto, 2: slot gola, 3: slot testa).","-9":"Il colpo giunge inaspettato e potente e per il trauma cranico sei stordito per 1 round e poi barcollante in quello seguente.","-10":"Il colpo ti recide una parte del volto (1d4 = 1: orecchio destro, 2: orecchio sinistro, 3: punta del mento, 4: naso). Inoltre, l’oggetto indossato si danneggia due volte1 (1d3 = 1: slot volto, 2: slot gola, 3: slot testa).Infine, sei barcollante finché la ferita di gravità 2 (20 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-11":"Il colpo ti cava un occhio (1d4 = 1-2: sinistro, 3-4: destro).Per l’improvviso cambio di prospettive e per il dolore, sei offuscato 50% finché la ferita di gravità 3 (30 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-12":"Il colpo è così potente che cadi privo di sensi per 1 ora. Inoltre, l’oggetto indossato al 50% si distrugge, altrimenti si danneggia due volte1 (1d3 = 1: slot volto, 2: slot gola, 3: slot testa).Infine, il cervello risulta danneggiato e un tuo punteggio mentale è ridotto di 2 punti in modo permanente (tira 1d3: 1: Intelligenza, 2: Saggezza, 3: Carisma).","-13":"Il colpo è così potente che cadi privo di sensi per 1 ora. Inoltre, il cervello risulta gravemente danneggiato e un tuo punteggio mentale è ridotto di 1d3+1 punti in modo permanente (tira 1d3: 1: Intelligenza, 2: Saggezza, 3: Carisma).","-14":"L’oggetto indossato è distrutto1 (1d3 = 1: slot volto, 2: slot gola, 3: slot testa).Inoltre, il colpo ti fracassa il cranio e cadi in un coma dal quale potrai uscire solo con l’1% di possibilità ogni 30 giorni.","-15":"Sei morto. A discrezione del DM, puoi invece restare morente per creare scene struggenti o permettere eventuali “ultime parole”."},"busto":{"-1":"Costretto ad una goffa manovra, incespichi e ti posizioni ultimo nell’ordine di Iniziativa (non agisci nuovamente se hai già agito durante questo turno).","-2":"Il colpo è potente e ti fa perdere l’equilibrio mandandoti prono.","-3":"Sei colpito duramente alle costole e diventi infermo per 1 minuto.","-4":"Il colpo è ben assestato e diretto allo stomaco: sei nauseato per 1 round.","-5":"Il colpo ti raggiunge all’inguine: sei barcollante per 2 round.","-6":"Il tremendo colpo ti lascia barcollante per 2 round. Inoltre, l’oggetto indossato si danneggia1 (1d8 = 1-4: slot corpo (armatura), 5-6: slot torso, 7: slot spalle, 8: slot vita).","-7":"Vieni colpito duramente al fianco e il dolore ti rende infermo finché la ferita di gravità 1 (10 PF) non viene curata.","-8":"Il colpo è potente e ti lascia frastornato per 1 round. Inoltre, l’oggetto indossato si danneggia1 (1d8 = 1-4: slot corpo (armatura), 5-6: slot torso, 7: slot spalle, 8: slot vita).","-9":"Il colpo ti incrina alcune costole e a causa del dolore intenso sei barcollante finché la ferita di gravità 2 (20 PF) non viene curata.","-10":"Un organo interno è compromesso dall’attacco: d’ora in poi, i Punti Fatica che recuperi tramite il Rifiatare e le notti di riposo sono dimezzati. Subire una seconda volta questa Ferita grave, riduce a un terzo i Punti Fatica recuperati. Inoltre, l’oggetto indossato si danneggia due volte1 (1d8 = 1-4: slot corpo (armatura), 5-6: slot torso, 7: slot spalle, 8: slot vita). Infine, il dolore ti rende barcollante finché la ferita di gravità 3 (30 PF) non viene curata.","-11":"Il colpo è così potente che cadi privo di sensi per 1 ora. Inoltre, alcuni muscoli del tronco vengono danneggiati seriamente e subisci una penalità permanente (tira 1d3: 1: -1 ai Tiri Salvezza su Riflessi, 2: -1 ai Tiri Salvezza su Tempra, 3: -2 Iniziativa). Queste penalità sono cumulabili con sé stesse. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-12":"Il colpo è così potente che cadi privo di sensi per 1 ora. Inoltre, alcuni muscoli del tronco vengono danneggiati seriamente e subisci una penalità permanente (tira 1d3: 1: -2 ai Tiri Salvezza su Riflessi, 2: -2 ai Tiri Salvezza su Tempra, 3: -4 Iniziativa). Queste penalità sono cumulabili con sé stesse. Infine, l’oggetto indossato si danneggia due volte1 (1d8 = 1-4: slot corpo (armatura), 5-6: slot torso, 7: slot spalle, 8: slot vita). Alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per emorragia grave (24 PF).","-13":"Il colpo è così potente che cadi privo di sensi per 1 ora. Inoltre, un organo interno viene irrimediabilmente compromesso e sia i tuoi Punti Ferita che i tuoi Punti Fatica sono ridotti in modo permanente di 1 punto per livello. Quando ottieni un nuovo livello, sottrai 2 punti dal totale guadagnato. Alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per emorragia grave (24 PF).","-14":"Il colpo è così potente che cadi privo di sensi per 1 ora. Inoltre, l’oggetto indossato si distrugge1 (1d8 = 1-4: slot corpo (armatura), 5-6: slot torso, 7: slot spalle, 8: slot vita).Infine, la tua colonna vertebrale si è lesionata in modo critico e i tuoi arti inferiori sono paralizzati per sempre. Se mai tu dovessi tornare a camminare per un qualsiasi motivo, non potrai comunque effettuare azioni di carica, corsa o ritirata, anche parziali.","-15":"Sei morto. A discrezione del DM, puoi invece restare morente per creare scene struggenti o permettere eventuali “ultime parole”."},"braccio":{"-1":"Vieni colpito alla mano. Se con quella mano impugni un oggetto, esso cade a terra ai tuoi piedi, altrimenti, se imbracci uno scudo, questo si slaccia non fornendo il bonus alla CA e imponendoti penalità di -1 ai tiri per colpire finché non usi un’azione di movimento per sistemarlo.","-2":"Il colpo è potente e ti fa perdere l’equilibrio mandandoti prono.","-3":"Il colpo ti schiaccia alcune nocche e il dolore ti rende infermo per 1 minuto.","-4":"L’oggetto che impugni ti scivola di mano e cade a terra a 1d3+1 caselle in una direzione casuale.","-5":"Il colpo ti intorpidisce il bicipite rendendo il braccio inutilizzabile per 2 round.","-6":"Il colpo è secco e preciso e rende il braccio inutilizzabile per 2 round. Inoltre, l’oggetto indossato si danneggia1 (1d6 = 1-3: oggetto impugnato, 4: slot braccia, 5: slot mani, 6: slot anello).","-7":"Sei ferito alla mano e il dolore ti rende infermo finché la ferita di gravità 1 (10 PF) non viene curata.","-8":"Il colpo ti ferisce gravemente e il braccio è inutilizzabile finché la ferita di gravità 1 (10 PF) non viene curata. Inoltre, l’oggetto indossato si danneggia1 (1d6 = 1-3: oggetto impugnato, 4: slot braccia, 5: slot mani, 6: slot anello).","-9":"Il colpo ti stacca 1 dito della mano. Inoltre, il dolore rende il braccio inutilizzabile finché la ferita di gravità 2 (20 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 2d4 minuti.","-10":"Il colpo ti stacca 1d2 dita della mano. Inoltre, l’oggetto indossato si danneggia due volte1 (1d6 = 1-3: oggetto impugnato, 4: slot braccia, 5: slot mani, 6: slot anello). Infine, il dolore rende il braccio inutilizzabile finché la ferita di gravità 2 (20 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-11":"Il colpo ti stacca 2 dita della mano. Inoltre, il dolore rende il braccio inutilizzabile finché la ferita di gravità 3 (30 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-12":"Il colpo ti stacca 2 dita della mano. Inoltre, l’oggetto indossato al 50% si distrugge, altrimenti si danneggia due volte1 (1d6 = 1-3: oggetto impugnato, 4: slot braccia, 5: slot mani, 6: slot anello). Infine, il dolore rende il braccio inutilizzabile finché la ferita di gravità 3 (30 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-13":"Il colpo ti stacca di netto la mano. L’oggetto impugnato e quelli negli slot mani e anelli devono essere recuperati da terra. Inoltre, per lo shock cadi privo di sensi per 1 ora. Alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per emorragia grave (24 PF).","-14":"Il colpo ti stacca il braccio all’altezza del gomito. L’oggetto impugnato e quelli negli slot braccia, mani e anelli devono essere recuperati da terra. Inoltre, per lo shock cadi privo di sensi per 1 ora. Alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per emorragia grave (24 PF).","-15":"Sei morto. A discrezione del DM, puoi invece restare morente per creare scene struggenti o permettere eventuali “ultime parole”."},"gamba":{"-1":"Costretto ad una goffa manovra, incespichi e ti posizioni ultimo nell’ordine di Iniziativa (non agisci nuovamente se hai già agito durante questo turno).","-2":"Il colpo è potente e ti fa perdere l’equilibrio mandandoti prono.","-3":"Il colpo ti schiaccia le dita dei piedi e il dolore ti rende infermo per 1 minuto.","-4":"Il colpo è ben assestato e diretto all’inguine: sei nauseato per 1 round.","-5":"Il colpo è ben diretto e ti lascia azzoppato per 2 round.","-6":"Il colpo è ben diretto e ti lascia azzoppato per 2 round. Inoltre, l’oggetto indossato si danneggia1 (1d4 = 1-2: slot cintura, 3-4: slot piedi).","-7":"Vieni ferito al piede e il dolore ti rende infermo finché la ferita di gravità 1 (10 PF) non viene curata.","-8":"Il colpo ti lussa l’anca o una caviglia e sei azzoppato finché la ferita di gravità 1 (10 PF) non viene curata. Inoltre, l’oggetto indossato si danneggia1 (1d4 = 1-2: slot cintura, 3-4: slot piedi).","-9":"Il colpo ti stacca 1 dito del piede. Inoltre, il dolore ti rende azzoppato finché la ferita di gravità 2 (20 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 2d4 minuti.","-10":"Il colpo ti stacca 1d2 dita del piede. Inoltre, l’oggetto indossato si danneggia due volte1 (1d4 = 1-2: slot cintura, 3-4: slot piedi). Infine, il dolore ti rende azzoppato finché la ferita di gravità 2 (20 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-11":"Il colpo ti stacca 2 dita del piede. Inoltre, il dolore ti rende azzoppato finché la ferita di gravità 3 (30 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-12":"Il colpo ti stacca 2 dita del piede. Inoltre, l’oggetto indossato al 50% si distrugge, altrimenti si danneggia due volte1 (1d4 = 1-2: slot cintura, 3-4: slot piedi). Infine, il dolore ti rende azzoppato finché la ferita di gravità 3 (30 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-13":"Il colpo ti stacca di netto il piede. L’oggetto nello slot piedi deve essere recuperato da terra. Inoltre, per lo shock cadi privo di sensi per 1 ora. Alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per emorragia grave (24 PF).","-14":"Il colpo ti stacca la gamba all’altezza del ginocchio. L’oggetto nello slot piedi deve essere recuperato da terra. Inoltre, per lo shock cadi privo di sensi per 1 ora. Alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per emorragia grave (24 PF).","-15":"Sei morto. A discrezione del DM, puoi invece restare morente per creare scene struggenti o permettere eventuali “ultime parole”."}},"locazioni":[{"da":1,"a":1,"nome":"Testa","righe":"testa","lato":""},{"da":2,"a":4,"nome":"Busto","righe":"busto","lato":""},{"da":5,"a":5,"nome":"Braccio sinistro","righe":"braccio","lato":"sinistro"},{"da":6,"a":6,"nome":"Braccio destro","righe":"braccio","lato":"destro"},{"da":7,"a":7,"nome":"Gamba sinistra","righe":"gamba","lato":"sinistro"},{"da":8,"a":8,"nome":"Gamba destra","righe":"gamba","lato":"destro"}]},{"id":"area","nome":"Attacchi con area di effetto o effetti senza tiro per colpire","righe":{"-1":"Costretto const WEB = false;   // true nella pagina di prova: lì i file non si scaricano, si copiano
// Schermo del Narratore — motore di calcolo (funzioni pure), testato da test_motore.js.
// Usabile da Node (module.exports) e dalla pagina. Ogni funzione che "cambia" una campagna
// ne restituisce una copia: l'originale non viene toccato. Il caso arriva sempre da `rng`
// (funzione che restituisce un numero in [0,1)), così i test sono ripetibili.
// Tempo: tutto in round assoluti dall'inizio dell'anno di partenza (1 round = 6 s,
// 10 round = 1 minuto, 600 = 1 ora, 14400 = 1 giorno).
'use strict';
const Motore = (() => {
const FORMATO = 'schermo-v1';
const ROUND_MIN = 10, ROUND_ORA = 600, ROUND_GIORNO = 14400;
const clona = o => JSON.parse(JSON.stringify(o));
const nuovoId = rng => Math.floor(rng() * 36 ** 8).toString(36).padStart(8, '0');
// id interni (PG, righe dell'iniziativa): contatore della campagna, sempre univoci
const prossimoId = (c, pre) => { c.contatore = (c.contatore || 0) + 1; return pre + c.contatore; };

// ------------------------------------------------------------------ dadi
function d(n, rng) { return 1 + Math.floor(rng() * n); }
// d20 della Collana: 20 naturale = 30, 1 naturale = −10 (Vol. 1)
function valoreD20(nat) { return nat === 20 ? 30 : nat === 1 ? -10 : nat; }
// Espressioni semplici: "2d6+3", "1d20-1", "4d6kh3", "d100", "5". Restituisce {totale, dadi, testo}
function tira(espr, rng) {
  const s = String(espr).replace(/\s+/g, '').toLowerCase();
  if (!/^[+-]?(\d*d\d+(k[hl]\d+)?|\d+)([+-](\d*d\d+(k[hl]\d+)?|\d+))*$/.test(s)) throw new Error('Espressione non valida: ' + espr);
  let totale = 0; const dadi = [];
  for (const m of s.matchAll(/([+-]?)(?:(\d*)d(\d+)(?:k([hl])(\d+))?|(\d+))/g)) {
    const segno = m[1] === '-' ? -1 : 1;
    if (m[6] !== undefined) { totale += segno * +m[6]; continue; }
    const n = m[2] ? +m[2] : 1, f = +m[3];
    let r = Array.from({ length: n }, () => d(f, rng));
    let tenuti = r;
    if (m[4]) { const k = +m[5]; tenuti = [...r].sort((a, b) => m[4] === 'h' ? b - a : a - b).slice(0, k); }
    dadi.push({ facce: f, risultati: r, tenuti });
    totale += segno * tenuti.reduce((a, b) => a + b, 0);
  }
  return { totale, dadi, testo: espr };
}

// ------------------------------------------------------------------ calendario
const MESI_REALI = [['gennaio', 31], ['febbraio', 28], ['marzo', 31], ['aprile', 30], ['maggio', 31], ['giugno', 30],
  ['luglio', 31], ['agosto', 31], ['settembre', 30], ['ottobre', 31], ['novembre', 30], ['dicembre', 31]];
const SETTIMANA_REALE = ['lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato', 'domenica'];
function calendarioReale() {
  return { tipo: 'reale', mesi: MESI_REALI.map(([nome, giorni]) => ({ nome, giorni })), settimana: SETTIMANA_REALE.slice() };
}
function lunghezzaAnno(cal) { return cal.mesi.reduce((a, m) => a + m.giorni, 0); }
function controllaCalendario(cal) {
  const err = [];
  if (!cal || !Array.isArray(cal.mesi) || !cal.mesi.length) err.push('servono dei mesi');
  else cal.mesi.forEach((m, i) => {
    if (!m.nome || !String(m.nome).trim()) err.push(`mese ${i + 1} senza nome`);
    if (!Number.isInteger(m.giorni) || m.giorni < 1 || m.giorni > 400) err.push(`mese ${m.nome || i + 1}: giorni non validi`);
    if (cal.tipo === 'personalizzato' && !['primavera', 'estate', 'autunno', 'inverno'].includes(m.stagione)) err.push(`mese ${m.nome || i + 1}: stagione mancante`);
  });
  if (cal && cal.settimana && cal.settimana.some(g => !String(g).trim())) err.push('giorno della settimana senza nome');
  return err;
}
// giorno dell'anno (0-based) → {mese (0-based), giorno (1-based)}
function dataDaGiornoAnno(cal, doy) {
  let r = doy;
  for (let i = 0; i < cal.mesi.length; i++) { if (r < cal.mesi[i].giorni) return { mese: i, giorno: r + 1 }; r -= cal.mesi[i].giorni; }
  throw new Error('giorno fuori dall\'anno');
}
function giornoAnnoDaData(cal, mese, giorno) {
  if (mese < 0 || mese >= cal.mesi.length || giorno < 1 || giorno > cal.mesi[mese].giorni) throw new Error('data non valida');
  let n = 0; for (let i = 0; i < mese; i++) n += cal.mesi[i].giorni; return n + giorno - 1;
}
// scompone il tempo assoluto (round) della campagna
function scomponi(camp, R) {
  if (R === undefined) R = camp.tempo.R;
  const cal = camp.calendario, Y = lunghezzaAnno(cal);
  const N = Math.floor(R / ROUND_GIORNO), resto = R - N * ROUND_GIORNO;
  const anno = camp.anno.base + Math.floor(N / Y), doy = ((N % Y) + Y) % Y;
  const { mese, giorno } = dataDaGiornoAnno(cal, doy);
  const minuti = Math.floor(resto / ROUND_MIN);
  const L = cal.settimana && cal.settimana.length ? cal.settimana.length : 0;
  const sett = L ? ((((cal.settimana0 || 0) + N) % L) + L) % L : null;
  return { N, anno, doy, mese, giorno, ore: Math.floor(minuti / 60), min: minuti % 60, round: resto % ROUND_MIN, sett };
}

    <section class="col" aria-label="Tavolo">${disegnaTavolo()}</section>
    <section class="col" aria-label="Iniziativa">${disegnaIniziativa()}</section>
    <section class="col" aria-label="Viaggio e log">${disegnaTerza()}</section></div>`;
  aggiornaTimer();
}

// ---------- elenco campagne
function disegnaElenco() {
  const carte = S.elenco.map(e => !e.c ? `<article class="camp"><h2>${esc(e.nome)}</h2><div class="banda">${esc(e.errore || 'file non leggibile')}</div></article>` : `<article class="camp">
      <h2>${esc(e.nome)}</h2>
      <div class="tenue piccolo">${esc(M.formatoData(e.c))} · ${e.pg} PG</div>
      <div class="tenue piccolo">Modificata ${e.modificata ? new Date(e.modificata).toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'short' }) : '—'}</div>
      <div class="fila"><button class="btn prim" data-az="apri" data-id="${e.id}">Apri</button>
        <button class="btn" data-az="duplica" data-id="${e.id}">Duplica</button>
        <button class="btn" data-az="esportaCamp" data-id="${e.id}">Esporta</button>
        <span class="spazio"></span><button class="btn peric min" data-az="elimina" data-id="${e.id}">Elimina</button></div></article>`).join('');
  return `<div class="titolo-app"><h1><b>Schermo</b> del Narratore</h1><span class="spazio"></span>
      <button class="btn" data-az="temaElenco">${leggiPref('tema') === 'chiaro' ? 'Tema scuro' : 'Tema chiaro'}</button></div>
    <p class="tenue">Ogni campagna è uno schermo a sé: PG, calendario, orologio, meteo, scorte e iniziativa.</p>
    <div class="fila"><button class="btn prim grande" data-az="crea">Crea Schermo campagna</button>
      <button class="btn" data-az="importa">Importa</button><button class="btn" data-az="esportaTutto" ${S.elenco.length ? '' : 'disabled'}>Esporta tutto</button>
      <button class="btn" data-az="esempio">Carica una campagna d'esempio</button></div>
    ${Archivio.problema ? `<div class="banda">${esc(Archivio.problema)}</div>` : ''}
    <div class="lista-camp">${carte || '<div class="vuoto">Nessuna campagna. Crea uno schermo nuovo o carica la campagna d\'esempio per provare l\'app.</div>'}</div>`;
}

// ---------- testata con orologio, meteo, tempo e coda
function disegnaTesta() {
  const c = S.camp, t = M.scomponi(c), m = M.meteoCorrente(c, MET);
  const giorno = t.sett !== null ? c.calendario.settimana[t.sett] : '';
  const data = `${t.giorno} ${c.calendario.mesi[t.mese].nome} ${t.anno}${c.anno.etichetta ? ' ' + c.anno.etichetta : ''}`;
  const comb = c.combattimento;
  const iq = primoInCoda(c), q0 = c.coda[iq];
  const coda = q0 ? `<div class="coda" role="alert"><span class="chip sv num">${c.coda.length}</span><span class="t">${esc(q0.testo)} <span class="tenue piccolo">(${esc(M.formatoData(c, q0.R))})</span></span>
      ${bottoniCoda(q0, iq)}${c.coda.filter(x => !DA_RISPONDERE.includes(x.tipo)).length > 1 ? '<button class="btn min" data-az="codaTutti">Tutti fatti</button>' : ''}</div>` : '';
  return `<header class="testa"><div class="testa-riga">
      <button class="btn min" data-az="campagne" title="Elenco delle campagne">◂ Campagne</button>
      <div class="marchio"><b>${esc(c.nome)}</b></div>
      <div class="orologio"><span class="data">${esc(giorno)} ${esc(data)}</span>
        <span class="ora">${String(t.ore).padStart(2, '0')}:${String(t.min).padStart(2, '0')}<small>${comb ? `round ${comb.round}` : ''}</small></span></div>
      <button class="meteo-chip" data-az="vediMeteo" title="Meteo del giorno">${m ? `<span>${esc(m.voci.join(' + '))}</span>` : '<span>—</span>'}<span class="z">${esc(M.nomeZona(MET, c.zona))}</span></button>
      <span class="spazio"></span>
      <div class="tasti-tempo" aria-label="Avanza il tempo">
        <button class="btn min" data-az="tempo" data-r="1">+1 round</button><button class="btn min" data-az="tempo" data-r="10">+1 min</button>
        <button class="btn min" data-az="tempo" data-r="100">+10 min</button><button class="btn min" data-az="tempo" data-r="600">+1 ora</button>
        <button class="btn min oro" data-az="riposo">Riposo 8 ore</button><button class="btn min" data-az="salto">Salto…</button>
        <button class="btn min" data-az="impostazioni" title="Impostazioni della campagna">⚙</button></div>
    </div>${coda}</header>`;
}

// ---------- prima colonna: PG
function disegnaTavolo() {
  const c = S.camp;
  const agente = c.combattimento && M.attuale(c.combattimento);
  const pg = c.pg.map(p => disegnaPG(p, agente && agente.pgId === p.id)).join('');
  return `<div class="col-testa"><h2>Tavolo</h2><span class="tenue piccolo">${c.pg.length} PG · ${c.scorte.accompagnatori} accompagnatori</span><span class="spazio"></span>
      <button class="btn min" data-az="nuovoPG">+ PG</button></div>
    ${pg || '<div class="vuoto">Nessun PG. Aggiungi i personaggi con «+ PG».</div>'}`;
}
function disegnaPG(p, attivo) {
  const s = p.scheda, st = p.stato, v = M.valoriPG(S.camp, p);
  const pct = (a, b) => b > 0 ? Math.max(0, Math.min(100, a / b * 100)) : 0;
  const n = (x, nosegno) => { const f = nosegno ? String(x.valore) : segno(x.valore); return x.mod ? `<span class="mod${x.mod > 0 ? ' su' : ''}" title="Base ${nosegno ? x.base : segno(x.base)}" data-az="base" data-b="Base ${nosegno ? x.base : segno(x.base)}">${f}</span>` : f; };
  const fmx = v.fatica_max, femx = v.ferita_max;
  const temp = st.temp.length ? st.temp.map(t => `${t.fonte} ${t.valore}${t.scade !== null ? ' (fino a ' + M.formatoData(S.camp, t.scade) + ')' : ''}`).join('; ') : '';
  const chips = [...v.malus.map(m => `<span class="chip ${m.condizione ? 'cond' : 'sv'}">${esc(m.nome)}</span>`), ...st.malus.map(m => chipMalus({ pg: p.id }, m))];
  const note = v.note.filter(x => x.length < 90);
  return `<article class="pg${attivo ? ' attivo' : ''}" data-pg="${p.id}">
    <div class="pg-testa"><span class="pg-nome">${esc(s.nome)}</span><span class="pg-classe">${esc([s.classe || `Livello ${s.livello}`, s.razza].filter(Boolean).join(' · '))}</span>
      <span class="spazio"></span><span class="num piccolo">Init ${n(v.iniziativa)}</span>
      <button class="eroe${st.eroe ? '' : ' no'}" data-az="eroe" data-id="${p.id}" title="Punto eroe (clic per dare o togliere)">Eroe ${st.eroe ? '●' : '○'}</button></div>
    <div class="barre num">
      <span>Fatica</span><div class="barra fa"><i style="width:${pct(st.fatica, fmx.valore)}%"></i></div><span>${st.fatica}/${n(fmx, true)}</span>
      <span>Ferita</span><div class="barra fe${st.ferita < 0 ? ' neg' : ''}"><i style="width:${pct(st.ferita, femx.valore)}%"></i></div><span><span class="${st.ferita < 0 ? 'mod' : ''}">${st.ferita}</span>/${n(femx, true)}</span></div>
    <div class="stat num"><span title="${esc(temp)}"><b>Temp</b>${v.temp}</span><span><b>Non letali</b>${st.nonletali}</span><span><b>Rifiatare</b>${st.rif_riserva}/${s.rif_dadi} d${s.rif_tipo}${s.rif_ripete ? '↻' : ''}</span></div>
    <div class="stat num"><span><b>CA</b>${n(v.ca, true)}</span><span><b>Ctt</b>${n(v.ca_contatto, true)}</span><span><b>Spr</b>${n(v.ca_sprovvista, true)}</span><span><b>DMC</b>${n(v.dmc, true)}</span>${s.rd ? `<span><b>RD</b>${esc(s.rd)}</span>` : ''}${v.offuscato ? `<span class="cond-t">Offuscato ${v.offuscato}%</span>` : ''}</div>
    <div class="stat num"><span><b>Tem</b>${n(v.tempra)}</span><span><b>Rif</b>${n(v.riflessi)}</span><span><b>Vol</b>${n(v.volonta)}</span>${s.ts_note ? `<span class="tenue">${esc(s.ts_note)}</span>` : ''}</div>
    <div class="stat num"><span><b>Perc</b>${n(v.percezione)}</span><span><b>Intu</b>${n(v.intuizione)}</span><span><b>Furt</b>${n(v.furtivita)}</span>${v.libere.map(a => `<span><b>${esc(a.nome)}</b>${n(a)}</span>`).join('')}</div>
    ${st.morte && S.camp.coda.some(q => q.tipo === 'morte' && q.chi && q.chi.pg === p.id) ? `<div class="banda">Morte in sospeso: ${esc(st.morte.causa)}</div>` : ''}
    ${chips.length ? `<div class="chips">${chips.join('')}</div>` : ''}${note.length ? `<div class="note-pg">${note.map(x => `<span>${esc(x)}</span>`).join('')}</div>` : ''}
    <div class="fila"><button class="btn min" data-az="danno" data-id="${p.id}">Danno</button><button class="btn min" data-az="cura" data-id="${p.id}">Cura</button>
      <button class="btn min" data-az="temp" data-id="${p.id}">PF temp</button><button class="btn min" data-az="rifiata" data-id="${p.id}">Rifiata</button>
      <button class="btn min oro" data-az="malus" data-chi="pg:${p.id}">Malus/Bonus</button><button class="btn min" data-az="feritaGrave" data-id="${p.id}">Ferita grave</button>
      <span class="spazio"></span><button class="btn min" data-az="modificaPG" data-id="${p.id}" title="Scheda">Scheda</button></div></article>`;
}

// ---------- seconda colonna: iniziativa
function disegnaIniziativa() {
  const c = S.camp, cb = c.combattimento;
  if (!cb) return `<div class="col-testa"><h2>Iniziativa</h2></div>${disegnaAvvio()}`;
  const a = M.attuale(cb);
  const pros = cb.ordine.slice(cb.turno + 1).map(id => cb.righe[id]).filter(r => r.stato !== 'fuori').slice(0, 2).map(M.etichetta);
  const timer = cb.timer ? `<span class="timer" id="timer"></span>` : '';
  const righe = cb.ordine.map((id, i) => {
    const r = cb.righe[id];
    const badge = [r.prepara ? `<span class="chip">Prepara: ${esc(r.prepara.azione)}</span>` : '', r.nascosta ? '<span class="chip">Nascosta</span>' : '', r.nat === 20 ? '<span class="chip ok">20</span>' : r.nat === 1 ? '<span class="chip sv">1</span>' : '', r.stato === 'fuori' ? '<span class="chip">Fuori</span>' : '', ...(r.tipo !== 'pg' ? (r.malus || []).map(m => chipMalus({ riga: r.id }, m)) : [])].join('');
    return `<li class="tipo-${r.tipo}${i === cb.turno ? ' ora' : ''}${S.ui.sel === id ? ' sel' : ''}${r.stato === 'fuori' ? ' fuori' : ''}" data-az="selRiga" data-id="${id}" tabindex="0">
      <span class="tot">${r.totale}</span><span class="nome">${esc(M.etichetta(r))}${r.nomeTv ? ` <span class="tenue piccolo">(TV: ${esc(r.nomeTv)})</span>` : ''}</span><span class="chips">${badge}</span></li>`;
  }).join('');
  const attesa = cb.attesa.map(id => `<div class="fila"><span class="spazio">${esc(M.etichetta(cb.righe[id]))} <span class="tenue piccolo">in attesa</span></span>
      <button class="btn min oro" data-az="entraOra" data-id="${id}">Entra ora</button></div>`).join('');
  return `<div class="col-testa"><h2>Iniziativa</h2><span class="num tenue">Round ${cb.round}</span><span class="spazio"></span>${timer}</div>
    <div class="barra-turno"><span class="tenue piccolo">Tocca a</span><span class="chi">${a ? esc(M.etichetta(a)) : '—'}</span>
      ${a && a.prepara ? `<span class="piccolo">Azione preparata: ${esc(a.prepara.azione)}${a.prepara.innesco ? ' — se ' + esc(a.prepara.innesco) : ''}</span>` : ''}
      ${a ? barraMalus(a) : ''}
      <span class="tenue piccolo">Poi: ${esc(pros.join(', ') || '—')}</span></div>
    <div class="comandi"><button class="btn grande prim" data-az="cmd" data-c="avanti">Avanti ▸</button>
      <button class="btn" data-az="indietro" ${cb.storia.length ? '' : 'disabled'}>◂ Indietro</button>
      <button class="btn" data-az="cmd" data-c="ritardare">Ritardare</button>
      ${cb.timer ? `<button class="btn" data-az="cmd" data-c="pausa">${cb.timer.pausa !== null ? 'Riprendi' : 'Pausa'}</button>` : ''}</div>
    <ol class="ordine">${righe}</ol>
    ${attesa ? `<div class="pannello"><h3>In attesa</h3>${attesa}</div>` : ''}
    ${S.ui.sel && cb.righe[S.ui.sel] ? disegnaAzioniRiga(cb.righe[S.ui.sel]) : '<p class="tenue piccolo">Tocca una riga per le sue azioni: Preparare, Punto eroe, Separa, Fuori combattimento, Nascondi, Correggi.</p>'}
    <div class="comandi"><button class="btn" data-az="rinforzi">+ Rinforzi</button><span class="spazio"></span><button class="btn peric" data-az="fineComb">Fine combattimento</button></div>`;
}
function disegnaAzioniRiga(r) {
  const cb = S.camp.combattimento, inOrdine = cb.ordine.includes(r.id);
  const pg = r.tipo === 'pg' ? S.camp.pg.find(p => p.id === r.pgId) : null;
  return `<div class="azioni-riga"><div class="fila"><h3>${esc(M.etichetta(r))}</h3><span class="tenue piccolo num">iniziativa ${r.totale} (bonus ${segno(r.bonus)}${r.nat ? ', d20 ' + r.nat : ''})</span></div>
    <div class="fila" style="margin-top:6px">
      ${r.prepara ? `<button class="btn min oro" data-az="cmd" data-c="scatta" data-id="${r.id}">Scatta</button>` : `<button class="btn min" data-az="preparare" data-id="${r.id}">Preparare</button>`}
      ${pg ? `<button class="btn min oro" data-az="cmd" data-c="puntoEroe" data-id="${r.id}" ${pg.stato.eroe ? '' : 'disabled'}>Punto eroe</button>` : ''}
      ${r.n > 1 ? `<button class="btn min" data-az="separa" data-id="${r.id}">Separa</button>` : ''}
      ${inOrdine ? `<button class="btn min" data-az="cmd" data-c="fuori" data-id="${r.id}" data-ritorna="${r.stato === 'fuori' ? 1 : ''}">${r.stato === 'fuori' ? 'Rientra' : 'Fuori combattimento'}</button>` : ''}
      <button class="btn min" data-az="cmd" data-c="nascondi" data-id="${r.id}" data-nascosta="${r.nascosta ? '' : 1}">${r.nascosta ? 'Rivela' : 'Nascondi'}</button>
      <button class="btn min oro" data-az="malus" data-chi="${r.tipo === 'pg' ? 'pg:' + r.pgId : 'riga:' + r.id}">Malus/Bonus</button>
      <button class="btn min" data-az="correggi" data-id="${r.id}">Correggi</button>
      <button class="btn min peric" data-az="togli" data-id="${r.id}">Togli</button></div></div>`;
}
function nuovoAvvio() {
  const av = { usaD20: false, pg: {}, nemici: [{ nome: '', bonus: 0, n: 1, modo: 'tipo', imp: false, nascosto: false, nomeTv: '' }] };
  for (const p of S.camp.pg) av.pg[p.id] = { incluso: true, valore: '', imp: false };
  return av;
}
function disegnaAvvio() {
  const c = S.camp;
  if (!S.ui.avvio || S.ui.avvio.campagna !== c.id) { S.ui.avvio = nuovoAvvio(); S.ui.avvio.campagna = c.id; }
  const av = S.ui.avvio;
  for (const p of c.pg) if (!av.pg[p.id]) av.pg[p.id] = { incluso: true, valore: '', imp: false };
  const pg = c.pg.map(p => { const x = av.pg[p.id]; return `<div class="pgini">
      <label class="spunta"><input type="checkbox" data-bind="pg.${p.id}.incluso" ${x.incluso ? 'checked' : ''}> ${esc(p.scheda.nome)} <span class="tenue piccolo num">${segno(p.scheda.iniziativa)}</span></label>
      <input type="number" inputmode="numeric" data-bind="pg.${p.id}.valore" value="${esc(x.valore)}" placeholder="${av.usaD20 ? 'd20' : 'totale'}" aria-label="${av.usaD20 ? 'd20' : 'Totale'} di ${esc(p.scheda.nome)}">
      <label class="spunta piccolo" title="Impreparato: −${p.scheda.imp_pen}"><input type="checkbox" data-bind="pg.${p.id}.imp" ${x.imp ? 'checked' : ''}> impr.</label></div>`; }).join('');
  const nem = av.nemici.map((x, i) => `<div class="nemico">
      <input type="text" data-bind="nemici.${i}.nome" value="${esc(x.nome)}" placeholder="Nome (es. Lupo)" aria-label="Nome">
      <input type="number" data-bind="nemici.${i}.bonus" value="${esc(x.bonus)}" aria-label="Bonus di iniziativa" title="Bonus di iniziativa">
      <input type="number" min="1" data-bind="nemici.${i}.n" value="${esc(x.n)}" aria-label="Quantità" title="Quantità">
      <select data-bind="nemici.${i}.modo" aria-label="Tiro"><option value="tipo" ${x.modo === 'tipo' ? 'selected' : ''}>per tipo</option><option value="singolo" ${x.modo === 'singolo' ? 'selected' : ''}>per singolo</option></select>
      <div class="fila"><label class="spunta piccolo"><input type="checkbox" data-bind="nemici.${i}.imp" ${x.imp ? 'checked' : ''}> impr.</label>
        <label class="spunta piccolo"><input type="checkbox" data-bind="nemici.${i}.nascosto" ${x.nascosto ? 'checked' : ''}> nascosto</label>
        <button class="btn min" data-az="togliNemico" data-i="${i}" aria-label="Togli">✕</button></div></div>`).join('');
  return `<div class="pannello"><h3>Avvio del combattimento</h3>
      <label class="spunta piccolo"><input type="checkbox" data-az-cambio="usaD20" ${av.usaD20 ? 'checked' : ''}> Inserisco il d20 dei PG (l'app aggiunge il bonus; 20 = 30, 1 = −10)</label>
      ${pg || '<span class="tenue piccolo">Nessun PG nella campagna.</span>'}
      <h3>Nemici</h3><div class="tab-nemici">${nem}</div>
      <div class="fila"><button class="btn min" data-az="aggNemico">+ Nemico</button><span class="spazio"></span>
        <span class="tenue piccolo">Per tipo: una riga «Lupo ×5»; per singolo: Lupo 1, 2…</span></div>
      <div class="fila"><button class="btn prim grande" data-az="avvia">Tira e avvia</button></div></div>`;
}

// ---------- terza colonna: viaggio e log
function disegnaTerza() {
  const sch = S.ui.scheda;
  return `<div class="schede" role="tablist"><button role="tab" class="${sch === 'viaggio' ? 'on' : ''}" data-az="scheda" data-s="viaggio">Viaggio</button>
      <button role="tab" class="${sch === 'log' ? 'on' : ''}" data-az="scheda" data-s="log">Log</button></div>
    ${sch === 'log' ? disegnaLog() : disegnaViaggio()}`;
}
function disegnaViaggio() {
  const c = S.camp, m = M.meteoCorrente(c, MET), sc = c.scorte, k = M.consumoGiornaliero(c);
  const staz = M.stagione(c, MET, c.tempo.R);
  const opz = m && m.opzioni.length > 1 ? `<div class="fila">${m.opzioni.map((o, i) => `<button class="btn min ${i === m.scelta ? 'oro' : ''}" data-az="opzMeteo" data-i="${i}">${esc(o.join(' + '))}</button>`).join('')}</div>` : '';
  const bast = chi => { const b = M.bastanoPer(c, chi); return b === Infinity ? '—' : `bastano per ${b} ${b === 1 ? 'giorno' : 'giorni'}`; };
  const stato = (nome, x) => x && x.penalita ? `<span class="chip sv">${nome} ${x.penalita}</span>${x.giorni_senza ? ` <span class="tenue piccolo">${x.giorni_senza} ${x.giorni_senza === 1 ? 'giorno' : 'giorni'} senza</span>` : ''}` : '';
  const perPG = c.pg.map(p => { const x = stato('Sete', p.stato.sete) + ' ' + stato('Fame', p.stato.fame); return x.trim() ? `<div class="fila"><span class="piccolo">${esc(p.scheda.nome)}</span> ${x}</div>` : ''; }).join('');
  const z = M.razionamentoAperto(c);
  return `<div class="pannello"><div class="fila"><h3>Meteo</h3><span class="tenue piccolo">${esc(M.nomeStagione(MET, c.zona, staz))}${m && m.tiro ? ` · d% ${m.tiro}` : m && m.manuale ? ' · a mano' : ''}</span></div>
      ${m ? `<div class="risultato" style="font-size:1.15rem">${esc(m.testo)}</div>${opz}${m.effetti.map(e => `<div class="effetto"><b>${esc(e.nome)}</b> ${coloraCondizioni(esc(e.testo))}</div>`).join('')}` : '<span class="tenue">Nessun meteo.</span>'}
      <div class="fila"><label class="campo" style="flex:1"><span>Zona climatica</span><select id="zona" data-az-cambio="zona">${MET.zone.map(z => `<option value="${z.id}" ${z.id === c.zona ? 'selected' : ''}>${z.nome}</option>`).join('')}</select></label>
        <button class="btn" data-az="ritira">Ritira</button><button class="btn" data-az="impostaMeteo">Imposta</button></div></div>
    <div class="pannello"><div class="fila"><h3>Scorte</h3><span class="tenue piccolo">consumo ${k} al giorno (${c.pg.length} PG + ${sc.accompagnatori} accompagnatori)</span></div>
      ${['cibo', 'acqua'].map(chi => `<div class="scorta"><span class="q">${sc[chi]}</span><span>${chi === 'cibo' ? 'Cibo' : 'Acqua'} <span class="tenue piccolo">razioni · ${bast(chi)}</span></span>
        <span class="fila"><button class="btn min" data-az="scorta" data-chi="${chi}" data-d="-1">−1</button><button class="btn min" data-az="scorta" data-chi="${chi}" data-d="1">+1</button><button class="btn min" data-az="scortaN" data-chi="${chi}">±…</button></span></div>`).join('')}
      ${z ? `<div class="fila"><span class="chip sv">${z.scorta === 'acqua' ? 'Acqua' : 'Cibo'} da razionare</span><button class="btn min prim" data-az="razionamento" data-id="${z.id}">Scegli chi</button></div>` : ''}${perPG}

function finestraDettaglioMalus(chi, id) {

  const leg = m.durata.tipo === 'curata' ? elencoChi(c, chi).find(x => x.id === m.durata.legata) : null;
  const legate = elencoChi(c, chi).filter(x => x.durata.tipo === 'curata' && x.durata.legata === m.id).map(x => x.nome).join(', ');
  const v = m.vel, pr = m.per;

  if (v) azioni.push({ testo: 'Dose aggiuntiva', fn: () => applicaS(M.doseAggiuntiva(S.camp, chi, id)) });
  azioni.push({ testo: 'Togli', classe: 'peric', fn: () => applicaS(M.togliMalus(S.camp, chi, id)) });
  apri({ titolo: esc(M.nomeEsteso(m)), corpo: `<p class="piccolo">${esc(nomeChi(c, chi))}${m.etichetta ? ' · ' + esc(m.etichetta) : ''}</p>

  el = apri({ titolo: 'Crea Schermo campagna', larga: true, corpo: corpo(), azioni: [{ testo: 'Annulla' },
    { testo: 'Indietro', fn: () => { W.passo = Math.max(0, W.passo - 1); ridisegna(); return false; } },
    { testo: 'Avanti', classe: 'prim', fn: async () => {
      leggi();
      if (W.passo < PASSI.length - 1) { W.passo++; ridisegna(); return false; }
      const [hh, mm] = W.ora.split(':').map(Number);
      const c = M.creaCampagna({ nome: W.nome, calendario: cal(), anno: { numero: W.anno, etichetta: W.etichetta }, partenza: { mese: W.mese, giorno: W.giorno, ore: hh, min: mm || 0, sett: W.sett },
        zona: W.zona, pg: W.pg, accompagnatori: W.accompagnatori, cibo: W.cibo, acqua: W.acqua, impostazioni: W.imp }, MET, rng, Date.now());
      scriviPref('tema', W.imp.tema);
      await Archivio.scrivi(c); S.camp = c; S.schermata = 'campagna'; S.ui.avvio = null; disegna(); avviso('Campagna creata');
    } }] });
  el.querySelector('[data-fazione="1"]').disabled = true;
  el.addEventListener('change', ev => { if (ev.target.name === 'w-tipo') { leggiParziale(); W.tipo = ev.target.value; ridisegna(); } });
  function leggiParziale() { if (W.passo === 1 && $('#w-sett')) { W.mesi = W.mesi.map((m, i) => ({ nome: $('#w-mn' + i).value, giorni: Number($('#w-mg' + i).value), stagione: $('#w-ms' + i).value })); W.settimana = $('#w-sett').value; } }
  el.addEventListener('click', ev => {
    const b = ev.target.closest('[data-w]'); if (!b) return;
    const a = b.dataset.w;
    if (a === 'aggMese') { leggiParziale(); W.mesi.push({ nome: '', giorni: 30, stagione: 'primavera' }); ridisegna(); }
    if (a === 'togliMese') { leggiParziale(); if (W.mesi.length > 1) W.mesi.splice(+b.dataset.i, 1); ridisegna(); }
    if (a === 'togliPG') { W.pg.splice(+b.dataset.i, 1); ridisegna(); }
    if (a === 'aggPG') { finestraPGprocedura(s => { const e = M.controllaScheda({ ...M.SCHEDA_VUOTA, ...s }); if (e.length) throw new Error(e.join('; ')); W.pg.push(s); ridisegna(); }); }
  });
}
function finestraPGprocedura(fatto) {
  apri({ titolo: 'Nuovo PG', larga: true, corpo: campiPGhtml(M.SCHEDA_VUOTA), azioni: [{ testo: 'Annulla' }, { testo: 'Aggiungi', classe: 'prim', fn: f => { fatto(leggiCampiPG(f)); } }] });
}
