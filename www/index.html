<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Schermo del Narratore</title>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="icon" href="icona.png">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Schermo da GM a tre colonne (Tavolo · Iniziativa · Viaggio/Log): pannelli di legno scuro,
   numeri in monospazio come su uno schermo cartaceo, oro e arancio della Collana per i titoli. */
:root{
  --bg:#15120E; --pannello:#1E1914; --pannello2:#28211A; --riga:#3A3127; --testo:#ECE3D1; --tenue:#A5977F;
  --arancio:#E07A35; --oro:#D4A84B; --oro-scuro:#8B6914; --rosso:#C00000; --rosso-chiaro:#F07A6E; --verde:#1E7A1E;
  --fatica:#C9A13F; --ferita:#B84A3A; --sel:#3B2E1E; --ombra:0 8px 30px rgb(0 0 0 / .45);
  --f-titolo:"Spectral SC", Georgia, serif; --f-testo:"IBM Plex Sans", system-ui, sans-serif; --f-num:"IBM Plex Mono", ui-monospace, monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#EFEAE0; --pannello:#FBF8F2; --pannello2:#F1EADC; --riga:#D6CBB6; --testo:#1E1A15; --tenue:#6B5F4D;
  --arancio:#C45911; --oro:#8B6914; --oro-scuro:#8B6914; --rosso:#C00000; --rosso-chiaro:#C00000; --verde:#1E7A1E;
  --fatica:#B48A1E; --ferita:#A8372A; --sel:#F3E2C4; --ombra:0 8px 30px rgb(60 40 10 / .18); color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--testo);font:15px/1.45 var(--f-testo)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px;max-width:1700px;margin:0 auto}
h1,h2,h3{font-family:var(--f-titolo);font-weight:700;letter-spacing:.02em;text-wrap:balance;margin:0}
h2{font-size:1.15rem;color:var(--arancio)}
h3{font-size:1rem;color:var(--oro)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tenue{color:var(--tenue)}
.piccolo{font-size:.82rem}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px}

/* pulsanti */
.btn{border:1px solid var(--riga);background:var(--pannello2);border-radius:6px;padding:6px 11px;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--oro-scuro)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.prim{background:var(--arancio);border-color:var(--arancio);color:#1A0F05;font-weight:600}
.btn.oro{border-color:var(--oro-scuro);color:var(--oro)}
.btn.peric{border-color:var(--rosso);color:var(--rosso-chiaro)}
.btn.min{padding:3px 8px;font-size:.85rem}
.btn.grande{padding:10px 18px;font-size:1.05rem}
.fila{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.spazio{flex:1}

/* testata con orologio */
header.testa{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--riga);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.testa-riga{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.marchio{font-family:var(--f-titolo);color:var(--oro);font-size:.95rem;letter-spacing:.06em}
.marchio b{color:var(--arancio)}
.orologio{display:flex;flex-direction:column;min-width:0}
.orologio .data{font-family:var(--f-titolo);font-size:1.2rem;color:var(--testo)}
.orologio .ora{font-family:var(--f-num);font-size:1.55rem;color:var(--oro);line-height:1}
.orologio .ora small{font-size:.8rem;color:var(--tenue);margin-left:6px}
.meteo-chip{border:1px solid var(--riga);border-radius:999px;padding:4px 12px;background:var(--pannello);cursor:pointer;display:flex;gap:8px;align-items:center}
.meteo-chip .z{color:var(--tenue);font-size:.8rem}
.tasti-tempo{display:flex;flex-wrap:wrap;gap:5px}
.coda{margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--oro-scuro);background:color-mix(in srgb,var(--oro-scuro) 18%,var(--pannello));border-radius:8px;padding:7px 10px}
.coda .t{flex:1;min-width:200px}

/* tre colonne */
.colonne{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,.9fr);gap:16px;margin-top:16px;align-items:start}
@media (max-width:899px){.colonne{grid-template-columns:minmax(0,1fr)}header.testa{position:static}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.col-testa{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--riga);padding-bottom:6px}
.vuoto{border:1px dashed var(--riga);border-radius:8px;padding:16px;color:var(--tenue)}

/* riquadro del PG */
.pg{background:var(--pannello);border:1px solid var(--riga);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pg.attivo{border-color:var(--arancio);box-shadow:0 0 0 1px var(--arancio)}
.pg-testa{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pg-nome{font-family:var(--f-titolo);font-size:1.15rem;color:var(--arancio)}
.pg-classe{color:var(--tenue);font-size:.88rem}
.eroe{cursor:pointer;border:0;background:none;padding:0 2px;color:var(--oro);font-size:.9rem}
.eroe.no{color:var(--tenue)}
.barre{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:.86rem}
.barra{height:9px;border-radius:5px;background:var(--pannello2);overflow:hidden;border:1px solid var(--riga)}
.barra i{display:block;height:100%}
.barra.fa i{background:var(--fatica)} .barra.fe i{background:var(--ferita)}
.barra.neg{border-color:var(--rosso);background:repeating-linear-gradient(45deg,var(--pannello2) 0 5px,color-mix(in srgb,var(--rosso) 35%,transparent) 5px 10px)}
.stat{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:.88rem}
.stat b{font-weight:500;color:var(--tenue);margin-right:3px}
.mod{color:var(--rosso-chiaro);font-weight:600;cursor:help}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:.78rem;border-radius:4px;padding:1px 7px;border:1px solid var(--riga);background:var(--pannello2)}
.chip.cond{background:var(--rosso);border-color:var(--rosso);color:#fff}
.chip.sv{background:var(--rosso);border-color:var(--rosso);color:#fff}
.chip.ok{background:var(--verde);border-color:var(--verde);color:#fff}
.cond-t{color:var(--rosso-chiaro);font-weight:600}
[hidden]{display:none!important}
button.chip{cursor:pointer;font:inherit;font-size:.78rem;color:inherit;text-align:left}
.chip.fer{border-color:var(--rosso);color:var(--rosso-chiaro);background:color-mix(in srgb,var(--rosso) 14%,var(--pannello2))}
.chip.vel{border-color:#5E8C3A;color:#9BC97A;background:color-mix(in srgb,#5E8C3A 16%,var(--pannello2))}
:root[data-theme="light"] .chip.vel{color:#3D6B1F}
.mod.su{color:#7FC86F}
:root[data-theme="light"] .mod.su{color:var(--verde)}
.btn.ok{border-color:var(--verde);color:#7FC86F}
:root[data-theme="light"] .btn.ok{color:var(--verde)}
.note-pg{font-size:.78rem;color:var(--tenue);display:flex;flex-direction:column;gap:1px}
.ordine .chips .chip{font-size:.72rem}
.pend{border-top:1px solid var(--riga);padding-top:6px;display:flex;flex-direction:column;gap:6px}

/* iniziativa */
.barra-turno{background:var(--pannello);border:1px solid var(--oro-scuro);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.barra-turno .chi{font-family:var(--f-titolo);font-size:1.35rem;color:var(--arancio)}
.timer{font-family:var(--f-num);font-size:1rem;color:var(--oro)}
.timer.allarme{color:var(--rosso-chiaro)}
.ordine{list-style:none;margin:0;padding:0;border:1px solid var(--riga);border-radius:8px;overflow:hidden;background:var(--pannello)}
.ordine li{display:grid;grid-template-columns:3.2em 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--riga);cursor:pointer}
.ordine li:first-child{border-top:0}
.ordine li.ora{background:var(--sel);box-shadow:inset 3px 0 0 var(--arancio)}
.ordine li.sel{outline:1px solid var(--oro);outline-offset:-1px}
.ordine li.fuori .nome{text-decoration:line-through;color:var(--tenue)}
.ordine .tot{font-family:var(--f-num);font-size:1.1rem;color:var(--oro);text-align:right}
.ordine .nome{min-width:0;overflow-wrap:anywhere}
.ordine .tipo-pg .nome{color:var(--arancio);font-weight:600}
.azioni-riga{background:var(--pannello2);border:1px solid var(--riga);border-radius:8px;padding:8px}
.comandi{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* moduli */
.campo{display:flex;flex-direction:column;gap:3px;min-width:0}
.campo>span{font-size:.78rem;color:var(--tenue);text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--riga);border-radius:5px;padding:6px 8px;width:100%;min-width:0}
input[type=number]{font-family:var(--f-num)}
textarea{min-height:90px;font-family:var(--f-num);font-size:.82rem}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.griglia.stretta{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}
fieldset{border:1px solid var(--riga);border-radius:8px;padding:8px 10px 10px;margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
legend{font-family:var(--f-titolo);color:var(--oro);padding:0 6px}
label.spunta.spento{opacity:.55}
label.spunta{display:flex;gap:6px;align-items:center;cursor:pointer}
.tab-nemici{display:flex;flex-direction:column;gap:6px}
.nemico{display:grid;grid-template-columns:minmax(0,2fr) 4.2em 3.6em minmax(0,1.3fr) auto;gap:5px;align-items:center}
@media (max-width:520px){.nemico{grid-template-columns:minmax(0,1fr) 4.2em 3.6em}}
.pgini{display:grid;grid-template-columns:minmax(0,1fr) 6em auto;gap:6px;align-items:center}

/* pannelli della terza colonna */
.pannello{background:var(--pannello);border:1px solid var(--riga);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.schede{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--riga)}
.chip.barrato{text-decoration:line-through;opacity:.6}
.log li.sessione{border-top:2px solid var(--oro);color:var(--oro)}
.filtri{gap:4px;margin:4px 0}
.cond-card summary .nome-n{font-weight:600}
.cond-t[data-az]{cursor:help}
p.voce{margin:2px 0 2px 12px}
.schede button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--tenue);border-bottom:2px solid transparent}
.schede button.on{color:var(--arancio);border-bottom-color:var(--arancio)}
.effetto{border-left:3px solid var(--oro-scuro);padding-left:8px;font-size:.88rem}
.effetto b{color:var(--oro);font-weight:600}
.scorta{display:grid;grid-template-columns:4.5em 1fr auto;gap:6px;align-items:center}
.scorta .q{font-family:var(--f-num);font-size:1.3rem;color:var(--oro)}
.membro{border-top:1px solid var(--riga);padding:5px 0}
.membro .fila{gap:6px}
.tabmeteo{overflow-x:auto;margin:4px 0}
.tabmeteo table{border-collapse:collapse;font-size:.82rem;width:100%}
.tabmeteo th{background:var(--oro-scuro);color:#fff;text-align:left;padding:3px 6px}
.tabmeteo td{border-bottom:1px solid var(--riga);padding:3px 6px;vertical-align:top}
.foragg{flex-wrap:wrap}
.foragg select{width:auto;max-width:100%}
.log{list-style:none;margin:0;padding:0;font-size:.85rem;max-height:60vh;overflow:auto}
.log li{padding:4px 0;border-top:1px solid var(--riga);display:grid;grid-template-columns:7.5em 1fr;gap:8px}
.log li .q{font-family:var(--f-num);color:var(--tenue);font-size:.76rem}

/* elenco campagne */
.lista-camp{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:18px}
.camp{background:var(--pannello);border:1px solid var(--riga);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.camp h2{font-size:1.3rem}
.titolo-app{padding-block:28px 6px;display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.titolo-app h1{font-size:clamp(1.8rem,4vw,2.6rem);color:var(--oro)}
.titolo-app h1 b{color:var(--arancio)}

/* finestre */
.velo{position:fixed;inset:0;background:rgb(0 0 0 / .55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.finestra{background:var(--pannello);border:1px solid var(--oro-scuro);border-radius:10px;box-shadow:var(--ombra);width:min(560px,100%);display:flex;flex-direction:column;max-height:calc(100dvh - 48px)}
.finestra.larga{width:min(900px,100%)}
.finestra>header{padding:12px 14px;border-bottom:1px solid var(--riga)}
.finestra>.corpo{padding:12px 14px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.finestra>footer{padding:10px 14px;border-top:1px solid var(--riga);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.passi{display:flex;gap:4px;flex-wrap:wrap;font-size:.75rem;color:var(--tenue)}
.passi span{padding:1px 6px;border-radius:4px;border:1px solid var(--riga)}
.passi span.on{border-color:var(--arancio);color:var(--arancio)}
.mesi{display:flex;flex-direction:column;gap:5px}
.mese{display:grid;grid-template-columns:minmax(0,1fr) 4.5em 8em auto;gap:5px}
.avviso{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--pannello2);border:1px solid var(--oro-scuro);border-radius:8px;padding:9px 14px;box-shadow:var(--ombra);max-width:min(92vw,560px)}
.avviso.err{border-color:var(--rosso);color:var(--rosso-chiaro)}
.banda{border:1px solid var(--rosso);border-radius:8px;padding:8px 10px;color:var(--rosso-chiaro);margin-top:10px}
.risultato{font-family:var(--f-num);font-size:1.4rem;color:var(--oro)}
/* Build 2b: bestiario, scheda, incontri */
.schede.piccole button{padding:4px 8px;font-size:.85rem}
.voci{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.voce{display:flex;gap:6px;align-items:center;border:1px solid var(--riga);border-radius:6px;background:var(--pannello2);padding:4px 6px;min-width:0}
.voce.sel{border-color:var(--oro)}
.voce-corpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;background:none;border:0;padding:2px;text-align:left;cursor:pointer;color:inherit;font:inherit}
span.voce-corpo{cursor:default}
.voce-nome{font-weight:600;color:var(--arancio);overflow-wrap:anywhere}
.stella{background:none;border:0;cursor:pointer;color:var(--tenue);font-size:1.05rem;padding:0 2px}
.stella.on{color:var(--oro)}
.chip.ver{background:color-mix(in srgb,var(--oro-scuro) 45%,var(--pannello2));border-color:var(--oro-scuro);color:var(--testo)}
.chip.promem{border-color:var(--oro);color:var(--oro);background:color-mix(in srgb,var(--oro-scuro) 22%,var(--pannello2))}
.sb{font-size:.86rem;line-height:1.4;border-left:3px solid var(--oro-scuro);padding-left:9px;overflow-wrap:anywhere}
.sb p{margin:0 0 2px}
.sb p.rientro{padding-left:1.2em}
.sb .sb-testa{font-family:var(--f-titolo);color:var(--arancio);font-size:.98rem;margin-bottom:4px}
.sb h4{font-family:var(--f-titolo);color:var(--oro);font-size:.82rem;letter-spacing:.08em;margin:8px 0 2px;font-weight:700}
.sb b{color:var(--tenue);font-weight:600}
.sb .sb-tesoro{margin-top:6px;color:var(--oro)}
h4.sotto{font-family:var(--f-titolo);color:var(--oro);font-size:.85rem;margin:4px 0 0}
.segn{margin:0;padding-left:1.1em;font-size:.85rem;display:flex;flex-direction:column;gap:3px}
.segn li.errore b{color:var(--rosso-chiaro)}
.segn li.verifica b{color:var(--oro)}
.riga-tab{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;align-items:end;border-bottom:1px dashed var(--riga);padding-bottom:6px;margin-bottom:4px}
.campo.calc input,.campo.calc textarea{border-style:dashed;color:var(--oro)}
details.cartella>summary{cursor:pointer;font-family:var(--f-titolo);color:var(--oro);padding:2px 0}
.capitolo{font-size:.8rem;color:var(--tenue);text-transform:uppercase;letter-spacing:.05em;margin:6px 0 3px}
.note-inc p{margin:0 0 4px}.note-inc ul.md{margin:0 0 4px;padding-left:1.2em}
.tattica{border-left:3px solid var(--arancio);padding-left:8px;font-size:.88rem}
.tattica b{color:var(--arancio);font-weight:600}
.tattica.fuga{border-left-color:var(--rosso)}
.voce-inc{border:1px solid var(--riga);border-radius:6px;padding:6px 8px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.voce-inc select{width:auto}
@media (prefers-reduced-motion:no-preference){.btn,.ordine li{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="finestre"></div>

e":"Crolli","testo":"Cadono detriti: Riflessi CD 15 per evitare 2d6 danni. Un passaggio a scelta del DM resta ostruito; liberarlo richiede 1d4 ore di lavoro."},{"da":100,"a":100,"nome":"Grotte gelate","testo":"Vale il Clima freddo e, nelle zone indicate dal DM, il Ghiaccio della Guida del DM."}],"nota":"Le condizioni del Sotterraneo (Aria ferma, Correnti d'aria, Stillicidio, Aria viziata, Allagamento, Crolli, Grotte gelate) sono descritte nella zona 16."},"voci":{"Acquazzone":"Acquazzone","Afa":"Afa","Arsura":"Arsura / Gelo","Gelo":"Arsura / Gelo","Bonaccia":"Bonaccia","Canicola":"Canicola","Clima caldo":"Clima caldo / Clima freddo","Clima freddo":"Clima caldo / Clima freddo","Clima mite":"Clima mite / Clima fresco","Clima fresco":"Clima mite / Clima fresco","Esalazioni":"Esalazioni","Foschia":"Foschia","Gelo polare":"Gelo polare","Grandine":"Grandine","Miraggi":"Miraggi","Monsone":"Monsone","Nebbia":"Nebbia","Neve":"Neve","Neve fitta":"Neve fitta","Pioggia battente":"Pioggia battente","Pioggia di cenere":"Pioggia di cenere","Pioggia gelata":"Pioggia gelata","Temporale":"Temporale","Tempesta di grandine":"Tempesta di grandine / polvere / sabbia / cenere","Tempesta di polvere":"Tempesta di grandine / polvere / sabbia / cenere","Tempesta di sabbia":"Tempesta di grandine / polvere / sabbia / cenere","Tempesta di cenere":"Tempesta di grandine / polvere / sabbia / cenere","Tempesta di vento":"Tempesta di vento","Tormenta":"Tormenta","Uragano":"Uragano","Vento forte":"Vento forte","Vento molto forte":"Vento molto forte","Aria ferma":"Aria ferma","Correnti d'aria":"Correnti d'aria","Stillicidio":"Stillicidio","Aria viziata":"Aria viziata","Allagamento":"Allagamento","Crolli":"Crolli","Grotte gelate":"Grotte gelate"},"alias":{"Tempesta di polvere/sabbia":"Tempesta di sabbia"},"effetti":{"Acquazzone":"Visibilità massima 15 caselle (22,5 m). Penalità −4 alle prove di Percezione e −2 ai tiri per colpire a distanza. Fiamme: vedi la tabella. Seguire tracce: +1 alla CD per ogni ora di pioggia. Chi resta all'aperto si bagna. Chi ha recipienti raccoglie la razione d'acqua del giorno.","Afa":"Caldo umido. Valgono gli effetti del Clima caldo, ma qualsiasi armatura, anche leggera, annulla gli abiti estivi e servono 2 razioni d'acqua al giorno.","Arsura / Gelo":"Giornata di caldo / freddo intenso. Una creatura senza abiti estivi / invernali è esausta dopo 1 ora. Anche con gli abiti adatti è affaticata dopo 4 ore di marcia o di attività faticosa. Si recupera un grado ogni ora passata all'ombra (o al caldo, vicino a un fuoco) o con gli abiti adatti: da esausta ad affaticata, da affaticata a normale.\nArsura: vale dalle 10 alle 18, nelle altre ore vale il Clima caldo. Servono 2 razioni d'acqua al giorno. Un'armatura media o pesante annulla gli abiti estivi.\nGelo: chi dorme senza riparo né fuoco non recupera Punti Fatica con il riposo.","Bonaccia":"Assenza totale di vento. Le navi a vela restano ferme e si avanza solo a remi. Se la stagione è calda vale anche l'Afa.","Canicola":"Caldo estremo. Valgono gli effetti dell'Arsura. Anche con gli abiti estivi, ogni ora all'aperto fra le 10 e le 18 serve un Tiro Salvezza su Tempra CD 15 (+1 per ogni prova precedente): ogni fallimento peggiora di un grado (affaticata, poi esausta); una creatura già esausta subisce invece 1d4 danni non letali. Senza abiti estivi si subiscono anche 1d4 danni non letali ogni ora. Servono 3 razioni d'acqua al giorno.","Clima caldo / Clima freddo":"Il tipico clima estivo / invernale. Una creatura senza abiti estivi / invernali è affaticata dopo 1 ora. La condizione termina dopo 1 ora all'ombra (o al caldo, vicino a un fuoco) o indossando gli abiti adatti. Con il Clima caldo un'armatura media o pesante annulla gli abiti estivi.","Clima mite / Clima fresco":"Il tipico clima primaverile / autunnale. Nessun effetto particolare.","Esalazioni":"Gas che ristagnano nelle zone basse (crateri, conche, gallerie); il DM sceglie la zona del percorso. Una prova di Percezione (olfatto) CD 15 li avverte prima di entrarci. Chi entra o resta nella zona effettua un Tiro Salvezza su Tempra CD 15 all'ingresso e poi ogni 10 minuti: se fallisce è infermo finché resta e per i 10 minuti successivi; con due fallimenti di fila è anche nauseato per 1d4 round e subisce 1d6 danni. È un effetto di [VELENO]. Le creature che non respirano sono immuni.","Foschia":"Visibilità massima 20 caselle (30 m). Le creature oltre 9 m godono di Occultamento 20%. Penalità −2 alle prove di Percezione (vista).","Gelo polare":"Freddo estremo. Valgono gli effetti del Gelo. Anche con gli abiti invernali, ogni ora all'aperto serve un Tiro Salvezza su Tempra CD 15 (+1 per ogni prova precedente), con gli stessi gradi della Canicola. Senza abiti invernali si subiscono 1d6 danni non letali da freddo ogni 10 minuti. Vicino a un fuoco o in un riparo riscaldato le prove si sospendono.","Grandine":"Visibilità massima 15 caselle (22,5 m). Penalità −4 alle prove di Percezione e −2 ai tiri per colpire a distanza. Chi resta senza riparo subisce 1 danno non letale ogni 10 minuti. Fiamme: come la Pioggia battente.","Miraggi":"Oltre 30 m le prove di Percezione (vista) subiscono penalità −4 e il DM può mostrare oasi, figure o carovane che non esistono; chi si avvicina entro 30 m riconosce il miraggio. Orientarsi: +5 alla CD.","Monsone":"Visibilità massima 15 caselle (22,5 m). Penalità −4 ai tiri per colpire a distanza e alle prove di Percezione. Fiamme: vedi la tabella. Fuori dalle strade il fango rende il terreno difficile per quel giorno e per il seguente. Fiumi e torrenti sono in piena: acque agitate (Nuotare CD 15), rapide tempestose (CD 20), guadi impraticabili. Bagnato e acqua: come l'Acquazzone.","Nebbia":"Le creature oltre 3 m godono di Occultamento 50%. Visibilità massima 6 caselle (9 m). Orientarsi: +5 alla CD.","Neve":"Visibilità massima 15 caselle (22,5 m). Penalità −4 alle prove di Percezione e −2 ai tiri per colpire a distanza. Fiamme: vedi la tabella. La neve si deposita dopo 1 ora e rende il terreno difficile (×2); si scioglie in 1d3 giorni se il clima non è freddo e resta con il Clima freddo e il Gelo. Le tracce lasciate prima della nevicata: +2 alla CD per ogni ora di neve. Sciogliendo la neve sul fuoco si ottiene 1 razione d'acqua all'ora.","Neve fitta":"Visibilità massima 10 caselle (15 m). Penalità −4 alle prove di Percezione e −2 ai tiri per colpire a distanza. Le creature oltre 3 m godono di Occultamento 50%. Orientarsi: +5 alla CD. Fiamme: vedi la tabella. Se la neve si è già depositata il terreno è difficile (×4). Per tracce e acqua vale la Neve.","Pioggia battente":"Penalità −2 alle prove di Percezione. Fiamme: vedi la tabella. Seguire tracce: +1 alla CD per ogni ora di pioggia. Chi resta all'aperto si bagna. Chi ha recipienti raccoglie la razione d'acqua del giorno.","Pioggia di cenere":"Visibilità massima 15 caselle (22,5 m). Penalità −4 alle prove di Percezione; le creature oltre 9 m godono di Occultamento 20%. Dopo 2 ore la cenere depositata rende il terreno difficile (×2). Chi non si copre naso e bocca con un panno bagnato subisce gli effetti del Fumo (Guida del DM), con una prova ogni ora invece che ogni round. Acqua e cibo lasciati all'aperto vanno purificati (bollitura, Tavoletta purificante o Purificare cibo e bevande). Fiamme: come la Neve.","Pioggia gelata":"Pioggia che gela al suolo. Penalità −2 alle prove di Percezione. Per tutto il giorno ogni superficie all'aperto è un terreno scivoloso (Terreni scivolosi, Guida del DM). Scalare su rocce, alberi e funi ghiacciate: +5 alla CD. Bagnato e fiamme: come la Pioggia battente.","Temporale":"Valgono gli effetti di Acquazzone e Vento forte. Ogni ora all'aperto il DM tira d%: con 01–03 un fulmine colpisce la creatura più esposta del gruppo (la più alta, chi impugna un'arma lunga di metallo o indossa un'armatura pesante) e le infligge 4d8 danni da elettricità (Riflessi CD 15 dimezza). Chi si ripara sotto un albero isolato rischia di più: 01–06.","Tempesta di grandine / polvere / sabbia / cenere":"Visibilità massima 5 caselle (7,5 m). I tiri per colpire a distanza falliscono automaticamente. Penalità −8 alle prove di Percezione. Orientarsi: +10 alla CD. Si spengono tutte le fiamme. Le tracce si cancellano. Chi si muove avanza a un quarto della velocità. Ogni minuto si subiscono 1d4 danni letali per escoriazioni, cadute e asfissia; un riparo solido (grotta, edificio, tenda piantata sottovento) li evita. Con polvere, sabbia e cenere, chi non si copre naso e bocca con un panno subisce anche gli effetti del Fumo (Guida del DM).","Tempesta di vento":"Gli attacchi a distanza sono impossibili, tranne con le armi d'assedio (−4). Penalità −8 alle prove di Percezione (udito). Le creature Medie o più piccole non possono volare. Le creature Piccole o più piccole effettuano ogni round una prova di Forza CD 15: se falliscono cadono prone e sono spinte di 1d4 × 3 m; le Medie dimezzano la velocità controvento. Tende e ripari leggeri crollano se non sono stati ancorati (Sopravvivenza CD 15). Si spengono tutte le fiamme.","Tormenta":"Neve fitta e vento molto forte insieme. Visibilità massima 2 caselle (3 m); le creature oltre 1,5 m godono di Occultamento 50%. Gli attacchi a distanza falliscono automaticamente. Penalità −8 alle prove di Percezione. Orientarsi: +10 alla CD. Chi si muove avanza a un quarto della velocità. Chi resta senza riparo subisce 1d4 danni non letali da freddo ogni 10 minuti, anche con gli abiti invernali. La neve si deposita come per la Neve fitta. Fiamme: come con il Vento molto forte.","Uragano":"Valgono gli effetti di Tempesta di vento e Monsone. Visibilità massima 5 caselle (7,5 m). Ogni round le creature Medie effettuano una prova di Forza CD 15, le Piccole o più piccole CD 20: se falliscono cadono prone e sono spinte di 1d4 × 3 m (le Piccole o più piccole subiscono anche 1d6 danni). Chi resta all'aperto subisce 1d6 danni letali ogni 10 minuti per i detriti. Tende e capanne vengono distrutte; riparano solo gli edifici in muratura e le grotte.","Vento forte":"Penalità −2 ai tiri per colpire a distanza, alle prove di Percezione (udito) e alle prove di Volare. Fiamme: vedi la tabella.","Vento molto forte":"Penalità −4 ai tiri per colpire a distanza, alle prove di Percezione (udito) e alle prove di Volare. Le creature Minuscole o più piccole dimezzano la velocità controvento. Fiamme: vedi la tabella.","Aria ferma":"Nessun effetto.","Correnti d'aria":"Fiamme come con il Vento forte; penalità −2 alle prove di Percezione (udito). Chi segue la corrente con una prova di Sopravvivenza CD 15 trova la direzione di un'uscita o di una caverna ampia.","Stillicidio":"Penalità −2 alle prove di Percezione (udito). L'acqua si trova senza prova. Nei passaggi in pendenza valgono i Terreni scivolosi della Guida del DM.","Aria viziata":"Le fiamme durano metà del tempo. Chi compie attività faticose effettua un TS su Tempra CD 15 ogni ora: se fallisce è affaticato finché non torna in aria buona.","Allagamento":"Le gallerie basse sono allagate: valgono lo Stagno da 30 cm o da 120 cm della Guida del DM, a scelta del DM; dove la volta tocca l'acqua serve Nuotare.","Crolli":"Cadono detriti: Riflessi CD 15 per evitare 2d6 danni. Un passaggio a scelta del DM resta ostruito; liberarlo richiede 1d4 ore di lavoro.","Grotte gelate":"Vale il Clima freddo e, nelle zone indicate dal DM, il Ghiaccio della Guida del DM."},"tiro":["All'alba il DM tira d% sulla tabella della zona e della stagione in cui si trova il gruppo. Quando il gruppo passa da una zona all'altra, si tira sulla zona in cui trascorre la maggior parte della giornata.","Ogni riga dice tutto quello che vale quel giorno. Se la riga non indica un clima (Clima caldo, Gelo e così via), la temperatura non ha effetti. Le righe con il segno «+» uniscono due effetti, che valgono entrambi."],"durate":{"frase":"Acquazzone, Monsone, Temporale, Grandine, Neve fitta, Tormenta, Tempesta di vento, Uragano e le tempeste di grandine, polvere, sabbia e cenere durano 2d4 ore; per il resto del giorno vale il clima base della stagione, cioè la prima riga della tabella. La Nebbia si dirada 1d4 ore dopo l'alba. Tutti gli altri effetti durano l'intera giornata.","lunghe":["Acquazzone","Monsone","Temporale","Grandine","Neve fitta","Tormenta","Tempesta di vento","Uragano","Tempesta di grandine","Tempesta di polvere","Tempesta di sabbia","Tempesta di cenere"],"dadi":"2d4","nebbia":{"voce":"Nebbia","dadi":"1d4"},"arsura":{"voce":"Arsura","da":10,"a":18,"altrimenti":"Clima caldo"}},"predire":{"frase":"Con Predire il tempo (Sopravvivenza CD 15, altre 24 ore ogni 5 punti oltre la CD) un personaggio conosce il tempo dei giorni seguenti: per rispondergli, il DM tira in anticipo i giorni previsti.","cd":15,"ogni":5},"mare":[{"stato":"Calmo","quando":[],"testo_quando":"In tutti gli altri casi","nuotare":10},{"stato":"Agitato","quando":["Vento forte","Acquazzone","Temporale"],"testo_quando":"Vento forte, Acquazzone, Temporale","nuotare":15},{"stato":"Tempestoso","quando":["Vento molto forte","Tempesta di vento","Uragano"],"testo_quando":"Vento molto forte, Tempesta di vento, Uragano","nuotare":20}],"notti_fredde":{"zone":["10","11"],"frase":"Notti fredde: dalle 22 alle 6 vale il Clima freddo; dalle 6 alle 10 e dalle 18 alle 22 vale il Clima caldo.","notte":[22,6],"tiepido":[[6,10],[18,22]]},"senza_legna":{"3":"Brughiere e lande","8":"Tundra","9":"Ghiacci artici","10":"deserti","11":"deserti","15":"Oceano"},"fiamme":{"frase":"Ogni effetto che spegne le fiamme rimanda a questa tabella, che vale per le fonti di luce della Guida del DM.","righe":[{"fonte":"Candela","spegne":"Qualsiasi pioggia, neve o vento"},{"fonte":"Torcia, falò all'aperto","spegne":"Pioggia battente, Neve, Vento forte e più forti"},{"fonte":"Lanterna","spegne":"Acquazzone, Monsone, Neve fitta, Vento molto forte e più forti"},{"fonte":"Lanterna impermeabile o deluxe","spegne":"Le tempeste (Tempesta di vento, Uragano, Tormenta, tempeste di grandine, polvere, sabbia e cenere); con il Vento molto forte, 50% di probabilità ogni 10 minuti"}]},"scala":{"frase":"Alcune regole fanno contare il clima di un grado più mite o più severo. I gradi sono questi:","righe":["Caldo: Clima mite → Clima caldo → Arsura (o Afa) → Canicola.","Freddo: Clima fresco → Clima freddo → Gelo → Gelo polare."]},"regole":[{"titolo":"Protezioni","parti":[{"elenco":["Resistenze. RE (fuoco) di qualsiasi valore vale come gli abiti estivi, anche con l'Afa; RE (freddo) come gli abiti invernali. Con RE 10 o più la creatura è esente anche dai Tiri Salvezza e dai danni di Canicola e Gelo polare. L'immunità protegge da tutti gli effetti di quel clima.","Contrastare elementi annulla Clima caldo e freddo, Arsura, Gelo e Afa; contro Canicola e Gelo polare vale come gli abiti adatti, quindi i Tiri Salvezza restano.","Le creature immuni agli effetti di [AFFATICAMENTO] ignorano gli effetti di questo manuale che le renderebbero affaticate o esauste, ma non i danni non letali.","Le creature che non respirano sono immuni a Fumo, Esalazioni, Aria viziata e alta quota.","Le razze che «non subiscono gli effetti del clima» (Vol. 1) ignorano gli effetti di temperatura; visibilità, vento e terreno valgono anche per loro.","Acclimatarsi. Dopo un mese in una zona calda (o fredda) il Clima caldo (o freddo) non ha effetti anche senza abiti adatti; Arsura e Gelo restano. Dopo due mesi lontano dalla zona l'acclimatazione si perde."]}]},{"titolo":"Bagnati","parti":[{"testo":"Chi si bagna (pioggia senza riparo, guado, caduta in acqua) con il Clima fresco o più freddo conta il clima di un grado più severo finché non si asciuga: 1 ora vicino a un fuoco, 4 ore all'aria asciutta. Il Mantello da viaggio (Vol. 3), impermeabile, protegge dalla pioggia ma non dall'acqua in cui si finisce dentro."}]},{"titolo":"Ripari e fuoco","parti":[{"elenco":["Fuoco. Chi sta entro 3 m da un fuoco conta il clima di un grado più mite. Nelle zone senza legna (Brughiere e lande, Tundra, Ghiacci artici, deserti, Oceano) il combustibile va portato con sé.","Tenda. Ripara da pioggia, neve e vento fino al Vento molto forte; con la Tempesta di vento crolla, se non è stata ancorata. Con un fuoco vicino, o con due o più occupanti, conta un grado più mite.","Riparo trovato (Sopravvivenza CD 15; CD 20 in Brughiere e lande e in Tundra): ripara come la tenda, ma senza il grado più mite.","Edifici in muratura. Il clima non ha effetti."]}]},{"titolo":"Viaggi","parti":[{"testo":"Questi moltiplicatori si aggiungono a quelli del terreno della Guida del DM."},{"tabella":[["Condizione","Velocità di viaggio"],["Neve depositata, Pioggia gelata, fango (Monsone, piene)","×½ fuori strada"],["Neve fitta depositata","×¼ (×½ con le racchette da neve)"],["Tempeste, Tormenta, Uragano","×¼"]]},{"testo":"Orientarsi (Sopravvivenza CD 15, Guida del DM): una prova al giorno fuori dalle strade; la Bussola dà +3. Con un fallimento il gruppo si perde e quel giorno percorre metà della strada; con un fallimento di 5 o più cammina tutto il giorno nella direzione sbagliata, scelta dal DM. La prova si ripete il giorno dopo. Modificatori: Foschia +2; Nebbia, Neve fitta e Miraggi +5; tempeste e Tormenta +10."}]}],"navigazione":[{"testo":"Le velocità delle imbarcazioni sono quelle usate dal DM. Il vento conta a favore, salvo con un 6 su 1d6: allora è contrario e le navi a vela bordeggiano a metà velocità."},{"tabella":[["Tempo","Navi a vela","Navi a remi","Pilotare imbarcazioni"],["Nessun vento nella riga","Normale","Normale","—"],["Bonaccia","Ferme","Normale","—"],["Vento forte","+50%","−25%","CD 15 ogni 4 ore"],["Vento molto forte","Normale (vele ridotte)","Metà","CD 20 ogni ora"],["Tempesta di vento","Si corre col vento, la direzione non si controlla","Impossibile","CD 25 ogni ora"],["Uragano","Come sopra","Impossibile","CD 30 ogni ora"]]},{"testo":"Se la prova fallisce con il Vento forte o molto forte, la nave va alla deriva e perde 1d4 ore di viaggio. Con la Tempesta di vento o l'Uragano lo scafo subisce invece 1 livello di danneggiamento, come gli oggetti della Guida del DM:"},{"elenco":["Scheggiato: velocità −25%.","Rotto: imbarca acqua e procede a metà velocità; serve una prova di Pilotare imbarcazioni CD 15 ogni 4 ore per restare a galla.","Distrutto: naufragio."]},{"testo":"Lo scafo si ripara come in «Riparare oggetti rotti» della Guida del DM, con Professione (falegname)."}],"foraggiare":{"frase":"Foraggiare è un uso di Sopravvivenza: una prova al giorno per personaggio, che richiede 2 ore fuori dalla marcia (nei giorni di marcia forzata non si può). Si può prendere 10 e ricevere aiuto. Superando la CD della zona si trova cibo per sé, e anche acqua dove la zona lo permette; ogni N punti oltre la CD si nutre un'altra persona. Dove si può pescare (coste, mare, oceano, laghi) Professione (pescatore) sostituisce Sopravvivenza per il solo cibo, con una lenza o una rete.","avariato_frase":"Cibo avariato (zone ☠). Chi fallisce la prova di 5 o più torna comunque con del cibo, ma avariato o velenoso: chi lo mangia effettua un Tiro Salvezza su Tempra CD 12; se fallisce è nauseato per 1d4 ore e per quel giorno conta come se non avesse mangiato.","avariato":{"cd":12,"ts":"Tempra","fallimento":5,"condizione":"Nauseato","durata":"1d4 ore"},"note_frase":"¹ Oltre i 4.500 m solo neve. ² In autunno-inverno si scioglie neve o ghiaccio sul fuoco: 1 razione all'ora. ³ CD 20 nella stagione secca. ⁴ Con lo Stillicidio si trova senza prova. ⁵ Sulfurea: va purificata con la Tavoletta purificante o con Purificare cibo e bevande; la bollitura non basta.","acqua_frase":"Acqua: inclusa vuol dire che la stessa prova procura anche l'acqua; CD X che serve una seconda prova con quella CD, con la stessa resa; No che l'acqua si ottiene solo dalla pioggia, dalla magia o dalle scorte.","modificatori":{"righe":[{"condizione":"Stagione povera: Inverno (zone a quattro stagioni), Autunno-inverno (Foreste boreali e Tundra), Stagione secca (Savana e steppa)","cd":"+5"},{"condizione":"Pioggia battente, Neve, Nebbia, Grandine, Pioggia gelata, Arsura, Canicola","cd":"+2"},{"condizione":"Acquazzone, Monsone, Neve fitta, Temporale, Vento molto forte","cd":"+5"},{"condizione":"Tempeste, Tormenta, Uragano","cd":"Impossibile"}],"povera":{"quattro_stagioni":"inverno","7":"autunno-inverno","8":"autunno-inverno","12":"secca"},"povera_cd":5,"piu2":["Pioggia battente","Neve","Nebbia","Grandine","Pioggia gelata","Arsura","Canicola"],"piu5":["Acquazzone","Monsone","Neve fitta","Temporale","Vento molto forte"],"impossibile":["Tempesta","Tormenta","Uragano"],"nota":"I bonus razziali del Vol. 1 (per esempio +2 Sopravvivenza negli ambienti boschivi o sotterranei) si applicano normalmente."},"pesca":{"zone":["5","14","15"],"abilita":"Professione (pescatore)"}},"acqua":{"righe":["Razione d'acqua: 4 litri al giorno. Ne servono 2 con Arsura o Afa, 3 con Canicola.","Pioggia: con Pioggia battente, Acquazzone, Monsone o Temporale chi ha recipienti raccoglie la razione del giorno senza prova.","Bollire: 10 minuti al fuoco per razione; rende potabile l'acqua delle paludi. La Tavoletta purificante (Vol. 3) purifica 12 litri, cioè 3 razioni.","L'acqua non purificata segue la regola del cibo avariato."],"litri":4,"moltiplicatori":{"Arsura":2,"Afa":2,"Canicola":3},"pioggia":["Pioggia battente","Acquazzone","Monsone","Temporale"],"bollire_min":10,"tavoletta":3,"sciogliere_ore":1},"fame_sete":{"sete":{"nome":"Sete","scorta":"acqua","giorno_prova":4,"cd":10,"testo":"Una creatura che non abbia bevuto nel giorno precedente subisce penalità −1 a tutti i tiri per colpire, Tiri Salvezza e prove (cumulativa per ogni giorno in cui non beve). La penalità diminuisce di 1 il giorno seguente a quello in cui si è bevuto. A partire dal quarto giorno, oltre alla penalità, la creatura deve superare una prova di Costituzione CD 10 all'inizio di ogni nuovo giorno: se fallisce, cade priva di sensi e muore nel giro di 1d12 ore.\nChi beve meno razioni di quelle richieste dal tempo del giorno conta come se non avesse bevuto. Chi riceve acqua prima di morire si riprende dopo 1d4 ore."},"fame":{"nome":"Fame","scorta":"cibo","giorno_prova":7,"cd":10,"testo":"Una creatura che non abbia mangiato nel giorno precedente subisce penalità −1 a tutti i tiri per colpire, Tiri Salvezza e prove (cumulativa per ogni giorno in cui non mangia). La penalità diminuisce di 1 il giorno seguente a quello in cui si è mangiato. A partire dal settimo giorno, oltre alla penalità, la creatura deve superare una prova di Costituzione CD 10 all'inizio di ogni nuovo giorno: se fallisce, cade priva di sensi e muore nel giro di 1d12 ore.\nChi riceve cibo prima di morire si riprende dopo 1d4 ore."},"nota_vol1":"Affaticato o esausto dovuti a fame o sete si tolgono solo rifocillandosi (Vol. 1)."},"riassunto":[["Effetto","Visibilità","Percezione","Distanza","Altro"],["Acquazzone","15 caselle","−4","−2","Fiamme fino alla lanterna; bagnati; acqua"],["Afa","—","—","—","Come Clima caldo; ogni armatura annulla gli abiti; 2 razioni"],["Arsura","—","—","—","Esausti dopo 1 h senza abiti; affaticati dopo 4 h; 2 razioni"],["Bonaccia","—","—","—","Navi a vela ferme"],["Canicola","—","—","—","Come Arsura; TS Tempra ogni ora; 3 razioni"],["Clima caldo / freddo","—","—","—","Affaticati dopo 1 h senza abiti"],["Esalazioni","—","—","—","TS Tempra ogni 10 min; infermi, nauseati"],["Foschia","20 caselle","−2 (vista)","—","Occultamento 20% oltre 9 m"],["Gelo","—","—","—","Esausti dopo 1 h senza abiti; affaticati dopo 4 h"],["Gelo polare","—","—","—","Come Gelo; TS Tempra ogni ora"],["Grandine","15 caselle","−4","−2","1 danno non letale / 10 min senza riparo"],["Miraggi","—","−4 (vista oltre 30 m)","—","Orientarsi +5"],["Monsone","15 caselle","−4","−4","Fango; fiumi in piena"],["Nebbia","6 caselle","—","—","Occultamento 50% oltre 3 m; orientarsi +5"],["Neve","15 caselle","−4","−2","Terreno ×2 dopo 1 h"],["Neve fitta","10 caselle","−4","−2","Occultamento 50% oltre 3 m; terreno ×4"],["Pioggia battente","—","−2","—","Torce spente; bagnati; acqua"],["Pioggia di cenere","15 caselle","−4","—","Occultamento 20% oltre 9 m; Fumo; terreno ×2"],["Pioggia gelata","—","−2","—","Terreno scivoloso"],["Temporale","15 caselle","−4","−4","Acquazzone + Vento forte; fulmini"],["Tempesta (grandine, polvere, sabbia, cenere)","5 caselle","−8","Impossibile","1d4 danni al minuto; velocità ¼"],["Tempesta di vento","—","−8 (udito)","Impossibile","Creature piccole spinte; tende crollano"],["Tormenta","2 caselle","−8","Impossibile","1d4 danni non letali / 10 min; velocità ¼"],["Uragano","5 caselle","−8","Impossibile","Creature spinte; 1d6 danni / 10 min"],["Vento forte","—","−2 (udito)","−2","Volare −2; torce spente"],["Vento molto forte","—","−4 (udito)","−4","Volare −4; lanterne spente"]],"migrazione":{"temperata":"1","desertica":"10","artica":"9"}},"ferite":{"fonte":"Vol. 3 - Miscellanea 2.5.8, Cap. 3 Imprevisti (estratto in sorgenti/guida/vol3_imprevisti.txt)","ferite_gravi":[{"id":"colpire","nome":"Armi e incantesimi con tiro per colpire","dado":"1d8","righe_per_locazione":{"testa":{"-1":"Sangue, polvere, detriti o scintille ti finiscono negli occhi: sei offuscato (20%) per 2 round.","-2":"Un colpo all’altezza dell’orecchio ti fa perdere l’equilibrio mandandoti prono.","-3":"Il colpo ti spacca il naso rendendoti infermo per 1 minuto.","-4":"Un colpo di rimbalzo, il manico dell’arma o un gesto involontario del nemico ti colpisce alla gola: sei nauseato per 1 round.","-5":"Il colpo è forte e la testa ti inizia a girare: sei barcollante per 2 round.","-6":"Il colpo ti lascia intontito e sei barcollante per 2 round. Inoltre, l’oggetto indossato si danneggia1 (1d3 = 1: slot volto, 2: slot gola, 3: slot testa).","-7":"Il colpo ti squarcia la fronte e il sangue ti gronda copioso sul volto: sei offuscato (33%) finché l’emorragia lieve (8 PF) non viene curata.","-8":"La violenza del colpo è tale da renderti frastornato per 1 round. Inoltre, l’oggetto indossato si danneggia1 (1d3 = 1: slot volto, 2: slot gola, 3: slot testa).","-9":"Il colpo giunge inaspettato e potente e per il trauma cranico sei stordito per 1 round e poi barcollante in quello seguente.","-10":"Il colpo ti recide una parte del volto (1d4 = 1: orecchio destro, 2: orecchio sinistro, 3: punta del mento, 4: naso). Inoltre, l’oggetto indossato si danneggia due volte1 (1d3 = 1: slot volto, 2: slot gola, 3: slot testa).Infine, sei barcollante finché la ferita di gravità 2 (20 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-11":"Il colpo ti cava un occhio (1d4 = 1-2: sinistro, 3-4: destro).Per l’improvviso cambio di prospettive e per il dolore, sei offuscato 50% finché la ferita di gravità 3 (30 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-12":"Il colpo è così potente che cadi privo di sensi per 1 ora. Inoltre, l’oggetto indossato al 50% si distrugge, altrimenti si danneggia due volte1 (1d3 = 1: slot volto, 2: slot gola, 3: slot testa).Infine, il cervello risulta danneggiato e un tuo punteggio mentale è ridotto di 2 punti in modo permanente (tira 1d3: 1: Intelligenza, 2: Saggezza, 3: Carisma).","-13":"Il colpo è così potente che cadi privo di sensi per 1 ora. Inoltre, il cervello risulta gravemente danneggiato e un tuo punteggio mentale è ridotto di 1d3+1 punti in modo permanente (tira 1d3: 1: Intelligenza, 2: Saggezza, 3: Carisma).","-14":"L’oggetto indossato è distrutto1 (1d3 = 1: slot volto, 2: slot gola, 3: slot testa).Inoltre, il colpo ti fracassa il cranio e cadi in un coma dal quale potrai uscire solo con l’1% di possibilità ogni 30 giorni.","-15":"Sei morto. A discrezione del DM, puoi invece restare morente per creare scene struggenti o permettere eventuali “ultime parole”."},"busto":{"-1":"Costretto ad una goffa manovra, incespichi e ti posizioni ultimo nell’ordine di Iniziativa (non agisci nuovamente se hai già agito durante questo turno).","-2":"Il colpo è potente e ti fa perdere l’equilibrio mandandoti prono.","-3":"Sei colpito duramente alle costole e diventi infermo per 1 minuto.","-4":"Il colpo è ben assestato e diretto allo stomaco: sei nauseato per 1 round.","-5":"Il colpo ti raggiunge all’inguine: sei barcollante per 2 round.","-6":"Il tremendo colpo ti lascia barcollante per 2 round. Inoltre, l’oggetto indossato si danneggia1 (1d8 = 1-4: slot corpo (armatura), 5-6: slot torso, 7: slot spalle, 8: slot vita).","-7":"Vieni colpito duramente al fianco e il dolore ti rende infermo finché la ferita di gravità 1 (10 PF) non viene curata.","-8":"Il colpo è potente e ti lascia frastornato per 1 round. Inoltre, l’oggetto indossato si danneggia1 (1d8 = 1-4: slot corpo (armatura), 5-6: slot torso, 7: slot spalle, 8: slot vita).","-9":"Il colpo ti incrina alcune costole e a causa del dolore intenso sei barcollante finché la ferita di gravità 2 (20 PF) non viene curata.","-10":"Un organo interno è compromesso dall’attacco: d’ora in poi, i Punti Fatica che recuperi tramite il Rifiatare e le notti di riposo sono dimezzati. Subire una seconda volta questa Ferita grave, riduce a un terzo i Punti Fatica recuperati. Inoltre, l’oggetto indossato si danneggia due volte1 (1d8 = 1-4: slot corpo (armatura), 5-6: slot torso, 7: slot spalle, 8: slot vita). Infine, il dolore ti rende barcollante finché la ferita di gravità 3 (30 PF) non viene curata.","-11":"Il colpo è così potente che cadi privo di sensi per 1 ora. Inoltre, alcuni muscoli del tronco vengono danneggiati seriamente e subisci una penalità permanente (tira 1d3: 1: -1 ai Tiri Salvezza su Riflessi, 2: -1 ai Tiri Salvezza su Tempra, 3: -2 Iniziativa). Queste penalità sono cumulabili con sé stesse. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-12":"Il colpo è così potente che cadi privo di sensi per 1 ora. Inoltre, alcuni muscoli del tronco vengono danneggiati seriamente e subisci una penalità permanente (tira 1d3: 1: -2 ai Tiri Salvezza su Riflessi, 2: -2 ai Tiri Salvezza su Tempra, 3: -4 Iniziativa). Queste penalità sono cumulabili con sé stesse. Infine, l’oggetto indossato si danneggia due volte1 (1d8 = 1-4: slot corpo (armatura), 5-6: slot torso, 7: slot spalle, 8: slot vita). Alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per emorragia grave (24 PF).","-13":"Il colpo è così potente che cadi privo di sensi per 1 ora. Inoltre, un organo interno viene irrimediabilmente compromesso e sia i tuoi Punti Ferita che i tuoi Punti Fatica sono ridotti in modo permanente di 1 punto per livello. Quando ottieni un nuovo livello, sottrai 2 punti dal totale guadagnato. Alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per emorragia grave (24 PF).","-14":"Il colpo è così potente che cadi privo di sensi per 1 ora. Inoltre, l’oggetto indossato si distrugge1 (1d8 = 1-4: slot corpo (armatura), 5-6: slot torso, 7: slot spalle, 8: slot vita).Infine, la tua colonna vertebrale si è lesionata in modo critico e i tuoi arti inferiori sono paralizzati per sempre. Se mai tu dovessi tornare a camminare per un qualsiasi motivo, non potrai comunque effettuare azioni di carica, corsa o ritirata, anche parziali.","-15":"Sei morto. A discrezione del DM, puoi invece restare morente per creare scene struggenti o permettere eventuali “ultime parole”."},"braccio":{"-1":"Vieni colpito alla mano. Se con quella mano impugni un oggetto, esso cade a terra ai tuoi piedi, altrimenti, se imbracci uno scudo, questo si slaccia non fornendo il bonus alla CA e imponendoti penalità di -1 ai tiri per colpire finché non usi un’azione di movimento per sistemarlo.","-2":"Il colpo è potente e ti fa perdere l’equilibrio mandandoti prono.","-3":"Il colpo ti schiaccia alcune nocche e il dolore ti rende infermo per 1 minuto.","-4":"L’oggetto che impugni ti scivola di mano e cade a terra a 1d3+1 caselle in una direzione casuale.","-5":"Il colpo ti intorpidisce il bicipite rendendo il braccio inutilizzabile per 2 round.","-6":"Il colpo è secco e preciso e rende il braccio inutilizzabile per 2 round. Inoltre, l’oggetto indossato si danneggia1 (1d6 = 1-3: oggetto impugnato, 4: slot braccia, 5: slot mani, 6: slot anello).","-7":"Sei ferito alla mano e il dolore ti rende infermo finché la ferita di gravità 1 (10 PF) non viene curata.","-8":"Il colpo ti ferisce gravemente e il braccio è inutilizzabile finché la ferita di gravità 1 (10 PF) non viene curata. Inoltre, l’oggetto indossato si danneggia1 (1d6 = 1-3: oggetto impugnato, 4: slot braccia, 5: slot mani, 6: slot anello).","-9":"Il colpo ti stacca 1 dito della mano. Inoltre, il dolore rende il braccio inutilizzabile finché la ferita di gravità 2 (20 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 2d4 minuti.","-10":"Il colpo ti stacca 1d2 dita della mano. Inoltre, l’oggetto indossato si danneggia due volte1 (1d6 = 1-3: oggetto impugnato, 4: slot braccia, 5: slot mani, 6: slot anello). Infine, il dolore rende il braccio inutilizzabile finché la ferita di gravità 2 (20 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-11":"Il colpo ti stacca 2 dita della mano. Inoltre, il dolore rende il braccio inutilizzabile finché la ferita di gravità 3 (30 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-12":"Il colpo ti stacca 2 dita della mano. Inoltre, l’oggetto indossato al 50% si distrugge, altrimenti si danneggia due volte1 (1d6 = 1-3: oggetto impugnato, 4: slot braccia, 5: slot mani, 6: slot anello). Infine, il dolore rende il braccio inutilizzabile finché la ferita di gravità 3 (30 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-13":"Il colpo ti stacca di netto la mano. L’oggetto impugnato e quelli negli slot mani e anelli devono essere recuperati da terra. Inoltre, per lo shock cadi privo di sensi per 1 ora. Alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per emorragia grave (24 PF).","-14":"Il colpo ti stacca il braccio all’altezza del gomito. L’oggetto impugnato e quelli negli slot braccia, mani e anelli devono essere recuperati da terra. Inoltre, per lo shock cadi privo di sensi per 1 ora. Alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per emorragia grave (24 PF).","-15":"Sei morto. A discrezione del DM, puoi invece restare morente per creare scene struggenti o permettere eventuali “ultime parole”."},"gamba":{"-1":"Costretto ad una goffa manovra, incespichi e ti posizioni ultimo nell’ordine di Iniziativa (non agisci nuovamente se hai già agito durante questo turno).","-2":"Il colpo è potente e ti fa perdere l’equilibrio mandandoti prono.","-3":"Il colpo ti schiaccia le dita dei piedi e il dolore ti rende infermo per 1 minuto.","-4":"Il colpo è ben assestato e diretto all’inguine: sei nauseato per 1 round.","-5":"Il colpo è ben diretto e ti lascia azzoppato per 2 round.","-6":"Il colpo è ben diretto e ti lascia azzoppato per 2 round. Inoltre, l’oggetto indossato si danneggia1 (1d4 = 1-2: slot cintura, 3-4: slot piedi).","-7":"Vieni ferito al piede e il dolore ti rende infermo finché la ferita di gravità 1 (10 PF) non viene curata.","-8":"Il colpo ti lussa l’anca o una caviglia e sei azzoppato finché la ferita di gravità 1 (10 PF) non viene curata. Inoltre, l’oggetto indossato si danneggia1 (1d4 = 1-2: slot cintura, 3-4: slot piedi).","-9":"Il colpo ti stacca 1 dito del piede. Inoltre, il dolore ti rende azzoppato finché la ferita di gravità 2 (20 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 2d4 minuti.","-10":"Il colpo ti stacca 1d2 dita del piede. Inoltre, l’oggetto indossato si danneggia due volte1 (1d4 = 1-2: slot cintura, 3-4: slot piedi). Infine, il dolore ti rende azzoppato finché la ferita di gravità 2 (20 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-11":"Il colpo ti stacca 2 dita del piede. Inoltre, il dolore ti rende azzoppato finché la ferita di gravità 3 (30 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-12":"Il colpo ti stacca 2 dita del piede. Inoltre, l’oggetto indossato al 50% si distrugge, altrimenti si danneggia due volte1 (1d4 = 1-2: slot cintura, 3-4: slot piedi). Infine, il dolore ti rende azzoppato finché la ferita di gravità 3 (30 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-13":"Il colpo ti stacca di netto il piede. L’oggetto nello slot piedi deve essere recuperato da terra. Inoltre, per lo shock cadi privo di sensi per 1 ora. Alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per emorragia grave (24 PF).","-14":"Il colpo ti stacca la gamba all’altezza del ginocchio. L’oggetto nello slot piedi deve essere recuperato da terra. Inoltre, per lo shock cadi privo di sensi per 1 ora. Alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per emorragia grave (24 PF).","-15":"Sei morto. A discrezione del DM, puoi invece restare morente per creare scene struggenti o permettere eventuali “ultime parole”."}},"locazioni":[{"da":1,"a":1,"nome":"Testa","righe":"testa","lato":""},{"da":2,"a":4,"nome":"Busto","righe":"busto","lato":""},{"da":5,"a":5,"nome":"Braccio sinistro","righe":"braccio","lato":"sinistro"},{"da":6,"a":6,"nome":"Braccio destro","righe":"braccio","lato":"destro"},{"da":7,"a":7,"nome":"Gamba sinistra","righe":"gamba","lato":"sinistro"},{"da":8,"a":8,"nome":"Gamba destra","righe":"gamba","lato":"destro"}]},{"id":"area","nome":"Attacchi con area di effetto o effetti senza tiro per colpire","righe":{"-1":"Costretto ad una goffa manovra, incespichi e ti posizioni ultimo nell’ordine di Iniziativa (non agisci nuovamente se hai già agito durante questo turno).","-2":"Il colpo è potente e ti fa perdere l’equilibrio mandandoti prono.","-3":"L’impatto ti rende infermo per 1 minuto.","-4":"Inali polvere o residui volatili o liquidi dovuti all’attacco e sei nauseato per 1 round.","-5":"Per evitare l’attacco sbatti la testa e sei barcollante per 2 round.","-6":"Per limitare i danni tenti di schermarti con un braccio (1d4 = 1-2: sinistro, 3-4: destro) e l’oggetto indossato si danneggia1 (1d6 = 1-3: oggetto impugnato, 4: slot braccia, 5: slot mani, 6: slot anello).Inoltre, a causa del colpo sbatti la testa e sei barcollante per 2 round.","-7":"Il tronco è maggiormente investito dall’attacco e il dolore ti rende infermo finché la ferita di gravità 1 (10 PF) non viene curata.","-8":"Il colpo ti investe alle gambe e sei azzoppato finché la ferita di gravità 1 (10 PF) non viene curata. Inoltre, l’oggetto indossato si danneggia1 (1d4 = 1-2: slot cintura, 3-4: slot piedi).","-9":"L’attacco ti rintrona, lasciandoti frastornato per 1 round.","-10":"Un organo interno è compromesso dall’attacco: d’ora in poi, i Punti Fatica che recuperi tramite il Rifiatare e le notti di riposo sono dimezzati. Subire una seconda volta questa Ferita grave, riduce a un terzo i Punti Fatica recuperati. Inoltre, l’oggetto indossato si danneggia1 (1d8 = 1-4: slot corpo (armatura), 5-6: slot torso, 7: slot spalle, 8: slot vita). Infine, il dolore ti rende barcollante finché la ferita di gravità 3 (30 PF) non viene curata.","-11":"Nel disperato tentativo di schermarti o parare il colpo con le mani, 2 dita della mano (1d4 = 1-2: sinistra, 3-4: destra) vengono mozzate, sciolte o spappolate. Inoltre, il dolore rende il braccio inutilizzabile finché la ferita di gravità 3 (30 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-12":"L’attacco ti investe in faccia ed è così potente da renderti privo di sensi per 1 ora. Inoltre, l’oggetto indossato al 50% si distrugge, altrimenti si danneggia1 (1d3 = 1: slot volto, 2: slot gola, 3: slot testa).Infine, il cervello risulta danneggiato e un tuo punteggio mentale è ridotto di 1 punto in modo permanente (tira 1d3: 1: Intelligenza, 2: Saggezza, 3: Carisma).","-13":"Ti fai scudo con la mano e l’attacco te la stacca di netto, scioglie o spappola (1d4 = 1-2: sinistra, 3-4: destra). L’oggetto impugnato e quelli negli slot mani e anelli devono essere recuperati da terra. Inoltre, per lo shock cadi privo di sensi per 1 ora. Alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per emorragia grave (24 PF).","-14":"Il colpo ti stacca di netto, scioglie o spappola la gamba all’altezza del ginocchio (1d4 = 1-2: sinistro, 3-4: destro). L’oggetto nello slot piedi deve essere recuperato da terra. Inoltre, per lo shock cadi privo di sensi per 1 ora. Alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per emorragia grave (24 PF).","-15":"Sei morto. A discrezione del DM, puoi invece restare morente per creare scene struggenti o permettere eventuali “ultime parole”."}},{"id":"costituzione","nome":"Danni a Costituzione, veleni, sanguinamento o livelli negativi","righe":{"-1":"Il dolore per la tua condizione è troppo e ti posizioni ultimo nell’ordine di Iniziativa (non agisci nuovamente se hai già agito durante questo turno).","-2":"Hai un mancamento e finisci prono.","-3":"Il dolore per la tua condizione ti rende infermo per 1 minuto.","-4":"Il dolore per la tua condizione ti rende nauseato per 1 round.","-5":"Il dolore per la tua condizione ti rende barcollante per 2 round.","-6":"Il dolore per la tua condizione ti rende nauseato per 2 round.","-7":"Hai un mancamento e finisci prono. Inoltre, il dolore per la tua condizione ti rende infermo per 1 minuto.","-8":"Il dolore per la tua condizione ti rende incapace di muoverti normalmente e sei azzoppato per 1d3+1 round.","-9":"Il dolore per la tua condizione ti rende frastornato per 1 round.","-10":"Un organo interno è compromesso dalla tua condizione: d’ora in poi, i Punti Fatica che recuperi tramite il Rifiatare e le notti di riposo sono dimezzati. Subire una seconda volta questa Ferita grave, riduce a un terzo i Punti Fatica recuperati.","-11":"Il dolore per la tua condizione è così potente da renderti privo di sensi per 1d3+1 minuti.","-12":"Il dolore per la tua condizione è così potente da renderti privo di sensi per 1 ora. Inoltre, il cervello risulta danneggiato e un tuo punteggio mentale è ridotto di 1 punto in modo permanente (tira 1d3: 1: Intelligenza, 2: Saggezza, 3: Carisma).","-13":"Hai un attacco di panico così terribile che alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per arresto cardiaco. Puoi mettere fine al panico spendendo un’azione di round completo.","-14":"Hai un attacco di panico così terribile che alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per arresto cardiaco. Puoi mettere fine al panico spendendo due azioni di round completo consecutive.","-15":"Sei morto. A discrezione del DM, puoi invece restare morente per creare scene struggenti o permettere eventuali “ultime parole”."}}],"nota_oggetti":"Tira 1d12: 1: volto, 2: gola, 3: testa, 4: torso, 5: armatura, 6: spalle, 7: vita, 8: braccia, 9: mani, 10: anello, 11: cintura, 12: piedi. Se lo slot è vuoto, l’oggetto è quello successivo, e così via.","regola_fermare":"Cure magiche: i punti curati vanno diretti alla ferita o all’emorragia, anche a più riprese. Professione (cerusico): unità di medicinali e prova come da tabella; se riesce, la ferita guarisce dopo il tempo indicato; se fallisce si ritenta dopo il tempo indicato con la CD che cambia. Senza medicinali: penalità −5.","senza_medicinali":-5,"fermare":[{"id":"emorragia_lieve","ferita":"Emorragia lieve","medicinali":1,"cd":15,"guarigione":null,"ritentare":{"espr":"1","unita":"round"},"variazione_cd":1,"testo":{"medicinali":"1","cd":"CD 15, cura immediata","ritentare":"dopo 1 round, la CD aumenta di 1 ad ogni nuovo tentativo"}},{"id":"emorragia_grave","ferita":"Emorragia grave","medicinali":2,"cd":25,"guarigione":null,"ritentare":{"espr":"1d4","unita":"round"},"variazione_cd":1,"testo":{"medicinali":"2","cd":"CD 25, cura immediata","ritentare":"dopo 1d4 round, la CD aumenta di 1 ad ogni nuovo tentativo"}},{"id":"gravita_1","ferita":"Gravità 1","medicinali":1,"cd":15,"guarigione":{"n":1,"unita":"giorni"},"ritentare":{"espr":"1","unita":"giorni"},"variazione_cd":-1,"testo":{"medicinali":"1","cd":"CD 15, cura dopo 1 giorno","ritentare":"dopo 1 giorno, la CD diminuisce di 1 ad ogni nuovo tentativo"}},{"id":"gravita_2","ferita":"Gravità 2","medicinali":2,"cd":20,"guarigione":{"n":3,"unita":"giorni"},"ritentare":{"espr":"2","unita":"giorni"},"variazione_cd":-1,"testo":{"medicinali":"2","cd":"CD 20, cura dopo 3 giorni","ritentare":"dopo 2 giorni, la CD diminuisce di 1 ad ogni nuovo tentativo"}},{"id":"gravita_3","ferita":"Gravità 3","medicinali":3,"cd":25,"guarigione":{"n":7,"unita":"giorni"},"ritentare":{"espr":"3","unita":"giorni"},"variazione_cd":-1,"testo":{"medicinali":"3","cd":"CD 25, cura dopo 7 giorni","ritentare":"dopo 3 giorni, la CD diminuisce di 1 ad ogni nuovo tentativo"}}],"regola_dita":"Se una mano o un piede non hanno almeno 3 dita contano come persi.","dita_perse":3,"amputazioni":[{"id":"mano","nome":"Mano","gruppo":"superiori","grado":1,"singolo":{"testo":"Nessun oggetto impugnabile con l’arto mancante.-5 Scalare, -5 Professione, -5 Disattivare congegni, -5 Rapidità di mano-5 DMC contro le manovre di Lottare.20% di fallire incantesimi con componente somatica.","mods":{"abilita_nome":{"Scalare":-5,"Professione":-5,"Disattivare congegni":-5,"Rapidità di mano":-5}}},"entrambi":{"testo":"Questa condizione si applica a qualsiasi combinazione di arti: mano-mano o mano-braccio, indifferentemente. Nessun oggetto impugnabile con gli arti mancante. Fallimento delle prove di Scalare, Professione, Disattivare congegni e Rapidità di mano.-20 DMC contro le manovre di Lottare. Fallimento degli incantesimi con componente somatica.","mods":{}}},{"id":"braccio","nome":"Braccio","gruppo":"superiori","grado":2,"singolo":{"testo":"Nessun oggetto impugnabile con l’arto mancante.-5 Scalare, -5 Professione, -5 Disattivare congegni, -5 Rapidità di mano e-10 DMC contro le manovre di Lottare.25% di fallire incantesimi con componente somatica.","mods":{"abilita_nome":{"Scalare":-5,"Professione":-5,"Disattivare congegni":-5,"Rapidità di mano":-5}}},"entrambi":null},{"id":"piede","nome":"Piede","gruppo":"inferiori","grado":1,"singolo":{"testo":"-5 Acrobazia, -5 Cavalcare, -5 Furtività, -5 Scalare. Nessuna azione di corsa o carica effettuabile.-4 DMC contro le manovre di Lottare. Velocità su terreno dimezzata.","mods":{"abilita_nome":{"Acrobazia":-5,"Cavalcare":-5,"Furtività":-5,"Scalare":-5}}},"entrambi":{"testo":"Questa condizione si applica a qualsiasi combinazione di arti: piede-piede o piede-gamba, indifferentemente. Fallimento delle prove di Acrobazia, Cavalcare, Furtività e Scalare. Permanentemente considerato privo del bonus di Destrezza alla CA.-20 DMC contro le manovre di Lottare. Conta permanentemente come prono.","mods":{"condizioni":["Colto alla sprovvista","Prono"]}}},{"id":"gamba","nome":"Gamba","gruppo":"inferiori","grado":2,"singolo":{"testo":"-10 Acrobazia, -10 Cavalcare, -10 Furtività, -10 Scalare. Nessuna azione di corsa o carica.-8 DMC contro le manovre di Lottare. Velocità su terreno ridotta a un quarto.","mods":{"abilita_nome":{"Acrobazia":-10,"Cavalcare":-10,"Furtività":-10,"Scalare":-10}}},"entrambi":null},{"id":"orecchio","nome":"Orecchio","gruppo":"orecchi","grado":1,"singolo":{"testo":"-2 alle prove di Iniziativa.-4 Percezione (udito).10% di fallire incantesimi con componente verbale.","mods":{"iniziativa":-2}},"entrambi":{"testo":"-4 alle prove di Iniziativa. Fallimento delle prove basate sull’udito.20% di fallire incantesimi con componente verbale.","mods":{"iniziativa":-4}}},{"id":"occhio","nome":"Occhio","gruppo":"occhi","grado":1,"singolo":{"testo":"* -1 CA.-4 alle prove basate sulla vista.-1 ai tiri per colpire a distanza e ancora -1 per ogni incremento di gittata.","mods":{"ca":-1}},"entrambi":{"testo":"* -2 CA.Permanentemente considerato privo del bonus di Destrezza alla CA.Fallimento delle prove basate sulla vista. Conta permanentemente come Offuscato 50%.","mods":{"ca":-2,"condizioni":["Colto alla sprovvista","Offuscato 50%"]}}},{"id":"mento","nome":"Mento","gruppo":"mento","grado":1,"singolo":{"testo":"-3 Diplomazia.10% di fallire incantesimi con componente verbale.-4 alle prove di sedurre.","mods":{"abilita_nome":{"Diplomazia":-3}}},"entrambi":null},{"id":"naso","nome":"Naso","gruppo":"naso","grado":1,"singolo":{"testo":"-4 Percezione (olfatto).-4 alle prove di sedurre.","mods":{}},"entrambi":null}],"fallimenti":{"regola":"Vol. 1: un risultato naturale di 1 in un tiro per colpire non equivale a −10 ma è un Fallimento critico.","note":{"1":"L’alleato è quello più vicino al bersaglio originale e deve essere uno entro portata o gittata.","2":"Tira 1d12: 1: volto, 2: gola, 3: testa, 4: torso, 5: armatura, 6: spalle, 7: vita, 8: braccia, 9: mani, 10: anello, 11: cintura, 12: piedi. Se lo slot è vuoto, l’oggetto è quello successivo, e così via."},"tabelle":[{"id":"mischia","nome":"Armi da mischia","dado":"d12","righe":[{"da":1,"a":1,"testo":"Giudichi male le distanze e ti esponi: il nemico che hai attaccato può effettuare un contrattacco con bonus +4 al tiro per colpire."},{"da":2,"a":2,"testo":"L’attacco viene deviato e ti colpisci da solo."},{"da":3,"a":3,"testo":"L’arma ti scivola di mano e cade a terra a 1d3+1 caselle in una direzione casuale. Se non impugni altre armi, l’eventuale serie di attacchi termina."},{"da":4,"a":4,"testo":"Il nemico approfitta del tuo errore per colpirti all’inguine o in un altro punto doloroso. Sei infermo per 5 round. L’eventuale serie di attacchi termina."},{"da":5,"a":5,"testo":"Uno spintone improvviso del nemico ti spedisce a terra prono. Il tuo turno termina."},{"da":6,"a":7,"testo":"Colpisci accidentalmente un alleato¹. Se non ci sono alleati presenti, ti colpisci da solo."},{"da":8,"a":8,"testo":"Uno spintone improvviso ti spedisce a terra prono danneggiando 1-2: lo scudo, 3-4: l’armatura, 5-6 un oggetto². Il tuo turno termina. Se sei già prono conta questo risultato come 9."},{"da":9,"a":9,"testo":"Il tuo attacco viene deviato e l’arma ti impatta in piena faccia rendendoti barcollante per 1 round. Inoltre, nell’urto l’arma si danneggia. Il tuo turno termina."},{"da":10,"a":10,"testo":"Colpisci accidentalmente un alleato¹. Se non ci sono alleati presenti, ti colpisci da solo. In qualunque caso, il colpo danneggia un oggetto² di chi viene colpito."},{"da":11,"a":11,"testo":"Colpisci accidentalmente un alleato¹. Se non ci sono alleati presenti, ti colpisci da solo. In qualunque caso, il colpo danneggia 1-2: lo scudo o 3-4: l’armatura di chi viene colpito."},{"da":12,"a":12,"testo":"Colpisci accidentalmente un alleato¹. Se non ci sono alleati presenti, ti colpisci da solo. In qualunque caso, il colpo è un critico x2 che danneggia la tua arma."}]},{"id":"contatto","nome":"Attacchi senz’armi o di contatto in mischia, compresi gli incantesimi","dado":"d12","righe":[{"da":1,"a":1,"testo":"Giudichi male le distanze e ti esponi: il nemico che hai attaccato può effettuare un contrattacco con bonus +4 al tiro per colpire."},{"da":2,"a":2,"testo":"L’attacco viene deviato e ti colpisci da solo."},{"da":3,"a":3,"testo":"Il tuo attacco viene deviato e impatta in piena faccia rendendoti barcollante per 1 round. L’eventuale serie di attacchi termina."},{"da":4,"a":4,"testo":"Il nemico approfitta del tuo errore per colpirti all’inguine o in un altro punto doloroso. Sei infermo per 5 round. L’eventuale serie di attacchi termina."},{"da":5,"a":5,"testo":"Uno spintone improvviso del nemico ti spedisce a terra prono. Il tuo turno termina."},{"da":6,"a":7,"testo":"Colpisci accidentalmente un alleato¹. Se non ci sono alleati presenti, ti colpisci da solo."},{"da":8,"a":8,"testo":"Uno spintone improvviso ti spedisce a terra prono danneggiando 1-2: lo scudo, 3-4: l’armatura, 5-6 un oggetto². Il tuo turno termina. Se sei già prono conta questo risultato come 9."},{"da":9,"a":9,"testo":"Il tuo attacco viene deviato e ti impatta in piena faccia rendendoti nauseato per 1 round. Il tuo turno termina."},{"da":10,"a":10,"testo":"Colpisci accidentalmente un alleato¹. Se non ci sono alleati presenti, ti colpisci da solo. In qualunque caso, il colpo danneggia un oggetto² di chi viene colpito."},{"da":11,"a":11,"testo":"Colpisci accidentalmente un alleato¹. Se non ci sono alleati presenti, ti colpisci da solo. In qualunque caso, il colpo danneggia 1-2: lo scudo o 3-4: l’armatura di chi viene colpito."},{"da":12,"a":12,"testo":"Colpisci accidentalmente un alleato¹. Se non ci sono alleati vicini, ti colpisci da solo. In qualunque caso, il colpo è un critico x2 che rende barcollante per 1 round chi viene colpito."}]},{"id":"tiro","nome":"Armi da tiro, da fuoco o da lancio","dado":"d12","righe":[{"da":1,"a":1,"testo":"Perdi il controllo dell’attacco e ti ferisci subendo un numero di danni pari al dado di danno dell’arma."},{"da":2,"a":2,"testo":"Qualcosa va storto e ti colpisci da solo."},{"da":3,"a":3,"testo":"L’arma ti scivola di mano e cade a terra a 1d3+1 caselle in una direzione casuale. Se non impugni altre armi, l’eventuale serie di attacchi termina."},{"da":4,"a":4,"testo":"Nel processo di caricare o preparare l’arma ti ferisci in un punto doloroso. Sei infermo per 5 round. L’eventuale serie di attacchi termina."},{"da":5,"a":5,"testo":"Incespichi nel tentativo di prendere la mira e finisci prono. L’eventuale serie di attacchi termina."},{"da":6,"a":7,"testo":"Colpisci accidentalmente un alleato¹. Se non ci sono alleati presenti, ti colpisci da solo."},{"da":8,"a":8,"testo":"Incespichi nel tentativo di prendere la mira e finisci prono danneggiando 1-2: lo scudo, 3-4: l’armatura, 5-6 un oggetto². Il tuo turno termina. Se sei già prono conta questo risultato come 9."},{"da":9,"a":9,"testo":"Qualcosa va storto e l’arma sobbalza impattando in piena faccia rendendoti barcollante per 1 round. Inoltre, l’arma si danneggia. Il tuo turno termina."},{"da":10,"a":10,"testo":"Colpisci accidentalmente un alleato¹. Se non ci sono alleati vicini, ti colpisci da solo. In qualunque caso, il colpo danneggia un oggetto² di chi viene colpito."},{"da":11,"a":11,"testo":"Colpisci accidentalmente un alleato¹. Se non ci sono alleati vicini, ti colpisci da solo. In qualunque caso, il colpo danneggia 1-2: lo scudo o 3-4: l’armatura di chi viene colpito."},{"da":12,"a":12,"testo":"Colpisci accidentalmente un alleato¹. Se non ci sono alleati presenti, ti colpisci da solo. In qualunque caso, il colpo è un critico x2 che danneggia la tua arma."}]},{"id":"spargimento","nome":"Armi a spargimento","dado":"d6","righe":[{"da":1,"a":1,"testo":"Incespichi nel tentativo di prendere la mira e finisci prono. L’eventuale serie di attacchi termina."},{"da":2,"a":2,"testo":"L’arma ti scivola di mano e cade a 1d4+1 caselle in una direzione casuale, attivandosi. Se non impugni altre armi, l’eventuale serie di attacchi termina."},{"da":3,"a":3,"testo":"Il tuo attacco è un disastro totale e colpisci la tua casella."},{"da":4,"a":4,"testo":"Qualcosa va storto e l’arma sobbalza impattando in piena faccia rendendoti barcollante per 1 round. Il tuo turno termina."},{"da":5,"a":5,"testo":"Incespichi nel tentativo di prendere la mira e finisci prono danneggiando 1-2: lo scudo, 3-4: l’armatura, 5-6 un oggetto². Il tuo turno termina. Se sei già prono conta questo risultato come 6."},{"da":6,"a":6,"testo":"Colpisci accidentalmente un alleato¹. Se non ci sono alleati vicini, ti colpisci da solo. In qualunque caso, il colpo danneggia due volte 1-2: lo scudo o 3-4: l’armatura di chi viene colpito."}]},{"id":"contatto_distanza","nome":"Incantesimi di contatto a distanza (comprese pergamene, bacchette, bastoni, etc.)","dado":"d6","righe":[{"da":1,"a":1,"testo":"Incespichi nel tentativo di prendere la mira e finisci prono. L’eventuale serie di attacchi termina."},{"da":2,"a":2,"testo":"Sei vittima di un sovraccarico dei venti della magia. L’incantesimo consuma il doppio degli slot necessari (solitamente 2 per quelli preparati e 4 per quelli non preparati). Se l’incantesimo proviene da un oggetto, questo consuma il doppio delle cariche necessarie per attivarsi e smette di funzionare per 1d4+1 giorni."},{"da":3,"a":3,"testo":"Qualcosa va storto e ti colpisci da solo."},{"da":4,"a":4,"testo":"Qualcosa va storto e ti colpisci da solo con una mano in piena faccia rendendoti barcollante per 1 round. Il tuo turno termina."},{"da":5,"a":5,"testo":"Incespichi nel tentativo di prendere la mira e finisci prono danneggiando 1-2: lo scudo, 3-4: l’armatura, 5-6 un oggetto². Il tuo turno termina. Se sei già prono conta questo risultato come 6."},{"da":6,"a":6,"testo":"Colpisci accidentalmente un alleato¹. Se non ci sono alleati vicini, ti colpisci da solo. In qualunque caso, il colpo è un critico x2 che danneggia 1-2: lo scudo o 3-4: l’armatura di chi viene colpito."}]}]},"note":["Le combinazioni «entrambi» dei gruppi superiori (mano-mano, mano-braccio) e inferiori (piede-piede, piede-gamba) usano la riga di Mano e di Piede; braccio-braccio e gamba-gamba non sono scritte e si contano allo stesso modo.","Occhio: l’asterisco «*» in entrambe le colonne non ha una nota nel volume.","Nel volume diverse voci della tabella hanno frasi attaccate senza spazio (es. «mancante.-5 Scalare», «mano-5 DMC»): i testi sono riportati come nel volume."]},"condizioni":{"fonte":"golarion.altervista.org (Condizioni, letta il 01/11/2026), Vol. 1 2.5.2, Vol. 3 2.5.8, Guida del DM","gruppi":["Paura","Fatica","Indifeso","Oggetti","Nuove","Altre","Regole"],"condizioni":[{"nome":"Azzoppato","gruppo":"Nuove","rossa":true,"effetto":"","sintesi":"Movimento dimezzato e non si può compiere passi di 1,5 m","sintesi_fonte":"Guida del DM","testo":["Azzoppato: la creatura vede il proprio movimento dimezzato (per eccesso) e non può compiere passi di 1,5 m."],"sezioni":[],"fonte":"Vol. 1 2.5.2, Nuove condizioni","adattato":""},{"nome":"Colto alla sprovvista","gruppo":"Nuove","rossa":true,"effetto":"la CA mostrata è quella colto alla sprovvista","sintesi":"Bonus di Destrezza negato alla CA","sintesi_fonte":"app","testo":["Colto alla sprovvista: avviene quando alla creatura viene negato il bonus di Destrezza alla CA."],"sezioni":[],"fonte":"Vol. 1 2.5.2, Nuove condizioni","adattato":""},{"nome":"Offuscato","gruppo":"Nuove","rossa":true,"effetto":"vale solo la % più alta","sintesi":"Probabilità di mancare con ogni singolo attacco, incantesimo, capacità o azione che richieda un bersaglio che sia diverso da sé stessa.","sintesi_fonte":"Guida del DM","testo":["Offuscato (%): la creatura ha una probabilità di mancare con ogni singolo attacco, incantesimo, capacità o azione che richieda un bersaglio diverso da sé stessa. Una creatura è sottoposta solo alla % più alta di offuscamento di cui è vittima. Le creature che non usano la vista per vedere non diventano offuscate."],"sezioni":[],"fonte":"Vol. 1 2.5.2, Nuove condizioni","adattato":""},{"nome":"Sempre pronto","gruppo":"Nuove","rossa":true,"effetto":"","sintesi":"non subisce la penalità di -6 alle prove di Iniziativa quando viene colta di sorpresa. Subisce comunque le altre consuete penalità nel primo round di combattimento (bonus di Destrezza negato alla CA, possibilità di subire attacchi furtivi, etc.).","sintesi_fonte":"Guida del DM","testo":["Sempre pronto: la creatura non subisce la penalità di −6 alle prove di Iniziativa quando è impreparata. La creatura è comunque considerata impreparata per qualsiasi altro fine e subisce le consuete penalità nel primo round di combattimento (bonus di Destrezza negato alla CA, possibilità di subire attacchi furtivi, etc.)."],"sezioni":[],"fonte":"Vol. 1 2.5.2, Nuove condizioni","adattato":""},{"nome":"Affaticato","gruppo":"Fatica","rossa":true,"effetto":"su chi è già affaticato diventa Esausto; il Riposo 8 ore lo toglie (non se viene da fame o sete)","sintesi":"Non può correre o caricare, -2 For e Des; diventa esausta se compie azione affaticante","sintesi_fonte":"Guida del DM","testo":["Un personaggio affaticato non può correre o Caricare e subisce una penalità –2 a Forza e Destrezza. Se compie qualsiasi cosa normalmente affaticante diventa Esausto. Ci vogliono 8 ore di riposo totale per rimuovere la condizione di affaticato.","Affaticato o esausto: una creatura affaticata o esausta a causa di fame o sete può rimuovere tali condizioni solamente rifocillandosi."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni + Vol. 1 2.5.2","adattato":"Aggiunta la regola del Vol. 1 su fame e sete."},{"nome":"Abbagliato","gruppo":"Altre","rossa":true,"effetto":"Percezione −1","sintesi":"-1 TpC e prove di Percezione","sintesi_fonte":"Guida del DM","testo":["La creatura è incapace di vedere bene a causa di un’eccessiva stimolazione degli occhi. Una creatura abbagliata subisce penalità –1 al Tiro per Colpire e alle prove di Percezione basate sulla vista."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni","adattato":""},{"nome":"Accecato","gruppo":"Altre","rossa":true,"effetto":"CA −2, Percezione −4","sintesi":"-2 CA, no Des, -4 prove su For, Des e Percezione, prova di Acrobazia CD 10 per andare a più di velocità dimezzata o cade prona, considera gli avversari occultati al 50%","sintesi_fonte":"Guida del DM","testo":["Il personaggio non riesce a vedere nulla. Subisce penalità –2 alla Classe Armatura, perde il suo bonus di Destrezza alla CA (se presente), subisce penalità –4 alla maggior parte delle Abilità basate su Forza e Destrezza e alle prove contrapposte di Percezione. Tutte le prove o le attività basate sulla visione (come ad esempio leggere, o eventuali prove di Percezione basate sulla vista) falliscono automaticamente. Tutti gli avversari vengono considerati dotati di Occultamento Totale (probabilità del 50% di essere mancati) nei confronti del personaggio accecato. I personaggi accecati devono effettuare una prova di Acrobazia con CD 10 per muoversi più veloci della propria velocità dimezzata. Le creature che falliscono questa prova cadono a terra Prone. I personaggi che rimangono per lungo tempo accecati possono abituarsi ad alcune di queste penalità e iniziare a superarne alcune, a discrezione del GM."],"sezioni":[],"fonte":"golarion.altervi
