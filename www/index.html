<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Schermo del Narratore</title>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="icon" href="icona.png">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Schermo da GM a tre colonne (Tavolo · Iniziativa · Viaggio/Log): pannelli di legno scuro,
   numeri in monospazio come su uno schermo cartaceo, oro e arancio della Collana per i titoli. */
:root{
  --bg:#15120E; --pannello:#1E1914; --pannello2:#28211A; --riga:#3A3127; --testo:#ECE3D1; --tenue:#A5977F;
  --arancio:#E07A35; --oro:#D4A84B; --oro-scuro:#8B6914; --rosso:#C00000; --rosso-chiaro:#F07A6E; --verde:#1E7A1E;
  --fatica:#C9A13F; --ferita:#B84A3A; --sel:#3B2E1E; --ombra:0 8px 30px rgb(0 0 0 / .45);
  --f-titolo:"Spectral SC", Georgia, serif; --f-testo:"IBM Plex Sans", system-ui, sans-serif; --f-num:"IBM Plex Mono", ui-monospace, monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#EFEAE0; --pannello:#FBF8F2; --pannello2:#F1EADC; --riga:#D6CBB6; --testo:#1E1A15; --tenue:#6B5F4D;
  --arancio:#C45911; --oro:#8B6914; --oro-scuro:#8B6914; --rosso:#C00000; --rosso-chiaro:#C00000; --verde:#1E7A1E;
  --fatica:#B48A1E; --ferita:#A8372A; --sel:#F3E2C4; --ombra:0 8px 30px rgb(60 40 10 / .18); color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--testo);font:15px/1.45 var(--f-testo)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px;max-width:1700px;margin:0 auto}
h1,h2,h3{font-family:var(--f-titolo);font-weight:700;letter-spacing:.02em;text-wrap:balance;margin:0}
h2{font-size:1.15rem;color:var(--arancio)}
h3{font-size:1rem;color:var(--oro)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tenue{color:var(--tenue)}
.piccolo{font-size:.82rem}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px}

/* pulsanti */
.btn{border:1px solid var(--riga);background:var(--pannello2);border-radius:6px;padding:6px 11px;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--oro-scuro)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.prim{background:var(--arancio);border-color:var(--arancio);color:#1A0F05;font-weight:600}
.btn.oro{border-color:var(--oro-scuro);color:var(--oro)}
.btn.peric{border-color:var(--rosso);color:var(--rosso-chiaro)}
.btn.min{padding:3px 8px;font-size:.85rem}
.btn.grande{padding:10px 18px;font-size:1.05rem}
.fila{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.spazio{flex:1}

/* testata con orologio */
header.testa{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--riga);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.testa-riga{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.marchio{font-family:var(--f-titolo);color:var(--oro);font-size:.95rem;letter-spacing:.06em}
.marchio b{color:var(--arancio)}
.orologio{display:flex;flex-direction:column;min-width:0}
.orologio .data{font-family:var(--f-titolo);font-size:1.2rem;color:var(--testo)}
.orologio .ora{font-family:var(--f-num);font-size:1.55rem;color:var(--oro);line-height:1}
.orologio .ora small{font-size:.8rem;color:var(--tenue);margin-left:6px}
.meteo-chip{border:1px solid var(--riga);border-radius:999px;padding:4px 12px;background:var(--pannello);cursor:pointer;display:flex;gap:8px;align-items:center}
.meteo-chip .z{color:var(--tenue);font-size:.8rem}
.tasti-tempo{display:flex;flex-wrap:wrap;gap:5px}
.coda{margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--oro-scuro);background:color-mix(in srgb,var(--oro-scuro) 18%,var(--pannello));border-radius:8px;padding:7px 10px}
.coda .t{flex:1;min-width:200px}

/* tre colonne */
.colonne{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,.9fr);gap:16px;margin-top:16px;align-items:start}
@media (max-width:899px){.colonne{grid-template-columns:minmax(0,1fr)}header.testa{position:static}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.col-testa{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--riga);padding-bottom:6px}
.vuoto{border:1px dashed var(--riga);border-radius:8px;padding:16px;color:var(--tenue)}

/* riquadro del PG */
.pg{background:var(--pannello);border:1px solid var(--riga);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pg.attivo{border-color:var(--arancio);box-shadow:0 0 0 1px var(--arancio)}
.pg-testa{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pg-nome{font-family:var(--f-titolo);font-size:1.15rem;color:var(--arancio)}
.pg-classe{color:var(--tenue);font-size:.88rem}
.eroe{cursor:pointer;border:0;background:none;padding:0 2px;color:var(--oro);font-size:.9rem}
.eroe.no{color:var(--tenue)}
.barre{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:.86rem}
.barra{height:9px;border-radius:5px;background:var(--pannello2);overflow:hidden;border:1px solid var(--riga)}
.barra i{display:block;height:100%}
.barra.fa i{background:var(--fatica)} .barra.fe i{background:var(--ferita)}
.barra.neg{border-color:var(--rosso);background:repeating-linear-gradient(45deg,var(--pannello2) 0 5px,color-mix(in srgb,var(--rosso) 35%,transparent) 5px 10px)}
.stat{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:.88rem}
.stat b{font-weight:500;color:var(--tenue);margin-right:3px}
.mod{color:var(--rosso-chiaro);font-weight:600;cursor:help}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:.78rem;border-radius:4px;padding:1px 7px;border:1px solid var(--riga);background:var(--pannello2)}
.chip.cond{background:var(--rosso);border-color:var(--rosso);color:#fff}
.chip.sv{background:var(--rosso);border-color:var(--rosso);color:#fff}
.chip.ok{background:var(--verde);border-color:var(--verde);color:#fff}
.cond-t{color:var(--rosso-chiaro);font-weight:600}
[hidden]{display:none!important}
button.chip{cursor:pointer;font:inherit;font-size:.78rem;color:inherit;text-align:left}
.chip.fer{border-color:var(--rosso);color:var(--rosso-chiaro);background:color-mix(in srgb,var(--rosso) 14%,var(--pannello2))}
.chip.vel{border-color:#5E8C3A;color:#9BC97A;background:color-mix(in srgb,#5E8C3A 16%,var(--pannello2))}
:root[data-theme="light"] .chip.vel{color:#3D6B1F}
.mod.su{color:#7FC86F}
:root[data-theme="light"] .mod.su{color:var(--verde)}
.btn.ok{border-color:var(--verde);color:#7FC86F}
:root[data-theme="light"] .btn.ok{color:var(--verde)}
.note-pg{font-size:.78rem;color:var(--tenue);display:flex;flex-direction:column;gap:1px}
.ordine .chips .chip{font-size:.72rem}
.pend{border-top:1px solid var(--riga);padding-top:6px;display:flex;flex-direction:column;gap:6px}

/* iniziativa */
.barra-turno{background:var(--pannello);border:1px solid var(--oro-scuro);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.barra-turno .chi{font-family:var(--f-titolo);font-size:1.35rem;color:var(--arancio)}
.timer{font-family:var(--f-num);font-size:1rem;color:var(--oro)}
.timer.allarme{color:var(--rosso-chiaro)}
.ordine{list-style:none;margin:0;padding:0;border:1px solid var(--riga);border-radius:8px;overflow:hidden;background:var(--pannello)}
.ordine li{display:grid;grid-template-columns:3.2em 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--riga);cursor:pointer}
.ordine li:first-child{border-top:0}
.ordine li.ora{background:var(--sel);box-shadow:inset 3px 0 0 var(--arancio)}
.ordine li.sel{outline:1px solid var(--oro);outline-offset:-1px}
.ordine li.fuori .nome{text-decoration:line-through;color:var(--tenue)}
.ordine .tot{font-family:var(--f-num);font-size:1.1rem;color:var(--oro);text-align:right}
.ordine .nome{min-width:0;overflow-wrap:anywhere}
.ordine .tipo-pg .nome{color:var(--arancio);font-weight:600}
.azioni-riga{background:var(--pannello2);border:1px solid var(--riga);border-radius:8px;padding:8px}
.comandi{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* moduli */
.campo{display:flex;flex-direction:column;gap:3px;min-width:0}
.campo>span{font-size:.78rem;color:var(--tenue);text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--riga);border-radius:5px;padding:6px 8px;width:100%;min-width:0}
input[type=number]{font-family:var(--f-num)}
textarea{min-height:90px;font-family:var(--f-num);font-size:.82rem}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.griglia.stretta{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}
fieldset{border:1px solid var(--riga);border-radius:8px;padding:8px 10px 10px;margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
legend{font-family:var(--f-titolo);color:var(--oro);padding:0 6px}
label.spunta.spento{opacity:.55}
label.spunta{display:flex;gap:6px;align-items:center;cursor:pointer}
.tab-nemici{display:flex;flex-direction:column;gap:6px}
.nemico{display:grid;grid-template-columns:minmax(0,2fr) 4.2em 3.6em minmax(0,1.3fr) auto;gap:5px;align-items:center}
@media (max-width:520px){.nemico{grid-template-columns:minmax(0,1fr) 4.2em 3.6em}}
.pgini{display:grid;grid-template-columns:minmax(0,1fr) 6em auto;gap:6px;align-items:center}

/* pannelli della terza colonna */
.pannello{background:var(--pannello);border:1px solid var(--riga);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.schede{display:flex;gap:2px;border-bottom:1px solid var(--riga)}
.schede button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--tenue);border-bottom:2px solid transparent}
.schede button.on{color:var(--arancio);border-bottom-color:var(--arancio)}
.effetto{border-left:3px solid var(--oro-scuro);padding-left:8px;font-size:.88rem}
.effetto b{color:var(--oro);font-weight:600}
.scorta{display:grid;grid-template-columns:4.5em 1fr auto;gap:6px;align-items:center}
.scorta .q{font-family:var(--f-num);font-size:1.3rem;color:var(--oro)}
.log{list-style:none;margin:0;padding:0;font-size:.85rem;max-height:60vh;overflow:auto}
.log li{padding:4px 0;border-top:1px solid var(--riga);display:grid;grid-template-columns:7.5em 1fr;gap:8px}
.log li .q{font-family:var(--f-num);color:var(--tenue);font-size:.76rem}

/* elenco campagne */
.lista-camp{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:18px}
.camp{background:var(--pannello);border:1px solid var(--riga);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.camp h2{font-size:1.3rem}
.titolo-app{padding-block:28px 6px;display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.titolo-app h1{font-size:clamp(1.8rem,4vw,2.6rem);color:var(--oro)}
.titolo-app h1 b{color:var(--arancio)}

/* finestre */
.velo{position:fixed;inset:0;background:rgb(0 0 0 / .55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.finestra{background:var(--pannello);border:1px solid var(--oro-scuro);border-radius:10px;box-shadow:var(--ombra);width:min(560px,100%);display:flex;flex-direction:column;max-height:calc(100dvh - 48px)}
.finestra.larga{width:min(900px,100%)}
.finestra>header{padding:12px 14px;border-bottom:1px solid var(--riga)}
.finestra>.corpo{padding:12px 14px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.finestra>footer{padding:10px 14px;border-top:1px solid var(--riga);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.passi{display:flex;gap:4px;flex-wrap:wrap;font-size:.75rem;color:var(--tenue)}
.passi span{padding:1px 6px;border-radius:4px;border:1px solid var(--riga)}
.passi span.on{border-color:var(--arancio);color:var(--arancio)}
.mesi{display:flex;flex-direction:column;gap:5px}
.mese{display:grid;grid-template-columns:minmax(0,1fr) 4.5em 8em auto;gap:5px}
.avviso{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--pannello2);border:1px solid var(--oro-scuro);border-radius:8px;padding:9px 14px;box-shadow:var(--ombra);max-width:min(92vw,560px)}
.avviso.err{border-color:var(--rosso);color:var(--rosso-chiaro)}
.banda{border:1px solid var(--rosso);border-radius:8px;padding:8px 10px;color:var(--rosso-chiaro);margin-top:10px}
.risultato{font-family:var(--f-num);font-size:1.4rem;color:var(--oro)}
/* Build 2b: bestiario, scheda, incontri */
.schede.piccole button{padding:4px 8px;font-size:.85rem}
.voci{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.voce{display:flex;gap:6px;align-items:center;border:1px solid var(--riga);border-radius:6px;background:var(--pannello2);padding:4px 6px;min-width:0}
.voce.sel{border-color:var(--oro)}
.voce-corpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;background:none;border:0;padding:2px;text-align:left;cursor:pointer;color:inherit;font:inherit}
span.voce-corpo{cursor:default}
.voce-nome{font-weight:600;color:var(--arancio);overflow-wrap:anywhere}
.stella{background:none;border:0;cursor:pointer;color:var(--tenue);font-size:1.05rem;padding:0 2px}
.stella.on{color:var(--oro)}
.chip.ver{background:color-mix(in srgb,var(--oro-scuro) 45%,var(--pannello2));border-color:var(--oro-scuro);color:var(--testo)}
.chip.promem{border-color:var(--oro);color:var(--oro);background:color-mix(in srgb,var(--oro-scuro) 22%,var(--pannello2))}
.sb{font-size:.86rem;line-height:1.4;border-left:3px solid var(--oro-scuro);padding-left:9px;overflow-wrap:anywhere}
.sb p{margin:0 0 2px}
.sb p.rientro{padding-left:1.2em}
.sb .sb-testa{font-family:var(--f-titolo);color:var(--arancio);font-size:.98rem;margin-bottom:4px}
.sb h4{font-family:var(--f-titolo);color:var(--oro);font-size:.82rem;letter-spacing:.08em;margin:8px 0 2px;font-weight:700}
.sb b{color:var(--tenue);font-weight:600}
.sb .sb-tesoro{margin-top:6px;color:var(--oro)}
h4.sotto{font-family:var(--f-titolo);color:var(--oro);font-size:.85rem;margin:4px 0 0}
.segn{margin:0;padding-left:1.1em;font-size:.85rem;display:flex;flex-direction:column;gap:3px}
.segn li.errore b{color:var(--rosso-chiaro)}
.segn li.verifica b{color:var(--oro)}
.riga-tab{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;align-items:end;border-bottom:1px dashed var(--riga);padding-bottom:6px;margin-bottom:4px}
.campo.calc input,.campo.calc textarea{border-style:dashed;color:var(--oro)}
details.cartella>summary{cursor:pointer;font-family:var(--f-titolo);color:var(--oro);padding:2px 0}
.capitolo{font-size:.8rem;color:var(--tenue);text-transform:uppercase;letter-spacing:.05em;margin:6px 0 3px}
.note-inc p{margin:0 0 4px}.note-inc ul.md{margin:0 0 4px;padding-left:1.2em}
.tattica{border-left:3px solid var(--arancio);padding-left:8px;font-size:.88rem}
.tattica b{color:var(--arancio);font-weight:600}
.tattica.fuga{border-left-color:var(--rosso)}
.voce-inc{border:1px solid var(--riga);border-radius:6px;padding:6px 8px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.voce-inc select{width:auto}
@media (prefers-reduced-motion:no-preference){.btn,.ordine li{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="finestre"></div>

sco"},{"da":81,"a":89,"testo":"Pioggia battente"},{"da":90,"a":94,"testo":"Acquazzone"},{"da":95,"a":96,"testo":"Vento forte"},{"da":97,"a":98,"testo":"Vento molto forte"},{"da":99,"a":100,"testo":"Nebbia"}],"inverno":[{"da":1,"a":75,"testo":"Clima freddo"},{"da":76,"a":90,"testo":"Pioggia battente / Neve"},{"da":91,"a":94,"testo":"Gelo"},{"da":95,"a":96,"testo":"Acquazzone / Neve fitta"},{"da":97,"a":98,"testo":"Vento forte"},{"da":99,"a":100,"testo":"Vento molto forte"}]},"desertica":{"primavera-estate":[{"da":1,"a":85,"testo":"Arsura"},{"da":86,"a":90,"testo":"Clima caldo"},{"da":91,"a":94,"testo":"Clima caldo + Vento forte"},{"da":95,"a":97,"testo":"Clima caldo + Vento molto forte"},{"da":98,"a":99,"testo":"Monsone"},{"da":100,"a":100,"testo":"Clima caldo + Tempesta di polvere/sabbia"}],"autunno-inverno":[{"da":1,"a":75,"testo":"Clima caldo"},{"da":76,"a":90,"testo":"Arsura"},{"da":91,"a":94,"testo":"Clima caldo + Vento forte"},{"da":95,"a":96,"testo":"Clima caldo + Vento molto forte"},{"da":97,"a":98,"testo":"Acquazzone"},{"da":99,"a":100,"testo":"Monsone"}]},"artica":{"primavera-estate":[{"da":1,"a":75,"testo":"Clima freddo"},{"da":76,"a":90,"testo":"Gelo"},{"da":91,"a":94,"testo":"Clima freddo + Vento forte"},{"da":95,"a":96,"testo":"Clima freddo + Vento molto forte"},{"da":97,"a":98,"testo":"Clima freddo + Neve"},{"da":99,"a":100,"testo":"Clima freddo + Neve fitta"}],"autunno-inverno":[{"da":1,"a":85,"testo":"Gelo"},{"da":86,"a":90,"testo":"Gelo + Vento forte"},{"da":91,"a":94,"testo":"Gelo + Vento molto forte"},{"da":95,"a":97,"testo":"Gelo + Neve"},{"da":98,"a":99,"testo":"Gelo + Neve fitta"},{"da":100,"a":100,"testo":"Gelo + Tempesta di grandine"}]}},"voci":{"Clima mite":"Clima mite/fresco","Clima fresco":"Clima mite/fresco","Clima caldo":"Clima caldo/freddo","Clima freddo":"Clima caldo/freddo","Arsura":"Arsura/gelo","Gelo":"Arsura/gelo","Pioggia battente":"Pioggia battente","Acquazzone":"Acquazzone","Monsone":"Monsone","Nebbia":"Nebbia","Neve":"Neve e nevischio","Neve fitta":"Neve fitta","Vento forte":"Vento forte","Vento molto forte":"Vento molto forte","Tempesta di polvere/sabbia":"Tempesta di grandine/polvere/sabbia","Tempesta di grandine":"Tempesta di grandine/polvere/sabbia"},"effetti":{"Acquazzone":"Visibilità massima 15 caselle. Penalità -4 alle prove di Percezione. Si spengono automaticamente le fiamme non protette.","Arsura/gelo":"Giornata di caldo/freddo intenso. Una creatura senza abiti estivi/invernali, dopo 1 ora è esausta.","Clima caldo/freddo":"Il tipico clima estivo/invernale. Una creatura senza abiti estivi/invernali, dopo 1 ora è affaticata.","Clima mite/fresco":"Il tipico clima primaverile/autunnale. Nessun effetto particolare.","Monsone":"Visibilità massima 15 caselle. Penalità -4 ai tiri per colpire a distanza e alle prove di Percezione. Si spengono automaticamente le fiamme non protette.","Nebbia":"Le creature oltre 3 metri godono di Occultamento 50%.","Neve e nevischio":"Visibilità massima 15 caselle. Penalità -4 alle prove di Percezione e -2 ai tiri per colpire a distanza. Se la neve si è già depositata il terreno è difficile (x2).","Neve fitta":"(solo in luoghi plausibili). Visibilità massima 10 caselle. Penalità -4 alle prove di Percezione e -2 ai Tiri per Colpire a distanza. Le creature oltre 3 metri godono di Occultamento 50%. Se la neve si è già depositata il terreno è difficile (x4).","Pioggia battente":"Penalità -2 alle prove di Percezione. Si spengono automaticamente le fiamme non protette.","Tempesta di grandine/polvere/sabbia":"Visibilità massima 5 caselle. I tiri per colpire a distanza falliscono automaticamente. Si spengono automaticamente le fiamme protette e non. Ogni minuto si subiscono 1d4 danni letali a causa delle escoriazioni, cadute, asfissia, etc.","Vento forte":"Penalità -2 ai Tiri per Colpire a distanza. Si spengono automaticamente le fiamme non protette.","Vento molto forte":"Penalità -4 ai Tiri per Colpire a distanza. Si spengono automaticamente le fiamme non protette e quelle protette hanno una probabilità del 50% di spegnersi ogni 10 minuti."},"fame_sete":{"sete":{"nome":"Sete","scorta":"acqua","giorno_prova":4,"cd":10,"testo":"1) Una creatura che non abbia bevuto nel giorno precedente subisce penalità di -1 a tutti i tiri per colpire, Tiri Salvezza e prove (cumulativa per ogni giorno in cui non beve). La penalità diminuisce di 1 il giorno seguente a quello in cui si è bevuto. 2) A partire dal quarto, oltre alla penalità ai tiri di dado, la creatura deve superare una prova di Costituzione all’inizio di ogni nuovo giorno con CD pari a 10. Se fallisce il tiro, cade priva di sensi e muore nel giro di 1d12 ore."},"fame":{"nome":"Fame","scorta":"cibo","giorno_prova":7,"cd":10,"testo":"1) Una creatura che non abbia mangiato nel giorno precedente subisce penalità di -1 a tutti i tiri per colpire, Tiri Salvezza e prove (cumulativa per ogni giorno in cui non mangia). La penalità diminuisce di 1 il giorno seguente a quello in cui si è mangiato. 2) A partire dal settimo, oltre alla penalità ai tiri di dado, la creatura deve superare una prova di Costituzione all’inizio di ogni nuovo giorno con CD pari a 10. Se fallisce il tiro, cade priva di sensi e muore nel giro di 1d12 ore."},"nota_vol1":"Affaticato o esausto dovuti a fame o sete si tolgono solo rifocillandosi (Vol. 1)."}},"ferite":{"fonte":"Vol. 3 - Miscellanea 2.5.8, Cap. 3 Imprevisti (estratto in sorgenti/guida/vol3_imprevisti.txt)","ferite_gravi":[{"id":"colpire","nome":"Armi e incantesimi con tiro per colpire","dado":"1d8","righe_per_locazione":{"testa":{"-1":"Sangue, polvere, detriti o scintille ti finiscono negli occhi: sei offuscato (20%) per 2 round.","-2":"Un colpo all’altezza dell’orecchio ti fa perdere l’equilibrio mandandoti prono.","-3":"Il colpo ti spacca il naso rendendoti infermo per 1 minuto.","-4":"Un colpo di rimbalzo, il manico dell’arma o un gesto involontario del nemico ti colpisce alla gola: sei nauseato per 1 round.","-5":"Il colpo è forte e la testa ti inizia a girare: sei barcollante per 2 round.","-6":"Il colpo ti lascia intontito e sei barcollante per 2 round. Inoltre, l’oggetto indossato si danneggia1 (1d3 = 1: slot volto, 2: slot gola, 3: slot testa).","-7":"Il colpo ti squarcia la fronte e il sangue ti gronda copioso sul volto: sei offuscato (33%) finché l’emorragia lieve (8 PF) non viene curata.","-8":"La violenza del colpo è tale da renderti frastornato per 1 round. Inoltre, l’oggetto indossato si danneggia1 (1d3 = 1: slot volto, 2: slot gola, 3: slot testa).","-9":"Il colpo giunge inaspettato e potente e per il trauma cranico sei stordito per 1 round e poi barcollante in quello seguente.","-10":"Il colpo ti recide una parte del volto (1d4 = 1: orecchio destro, 2: orecchio sinistro, 3: punta del mento, 4: naso). Inoltre, l’oggetto indossato si danneggia due volte1 (1d3 = 1: slot volto, 2: slot gola, 3: slot testa).Infine, sei barcollante finché la ferita di gravità 2 (20 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-11":"Il colpo ti cava un occhio (1d4 = 1-2: sinistro, 3-4: destro).Per l’improvviso cambio di prospettive e per il dolore, sei offuscato 50% finché la ferita di gravità 3 (30 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-12":"Il colpo è così potente che cadi privo di sensi per 1 ora. Inoltre, l’oggetto indossato al 50% si distrugge, altrimenti si danneggia due volte1 (1d3 = 1: slot volto, 2: slot gola, 3: slot testa).Infine, il cervello risulta danneggiato e un tuo punteggio mentale è ridotto di 2 punti in modo permanente (tira 1d3: 1: Intelligenza, 2: Saggezza, 3: Carisma).","-13":"Il colpo è così potente che cadi privo di sensi per 1 ora. Inoltre, il cervello risulta gravemente danneggiato e un tuo punteggio mentale è ridotto di 1d3+1 punti in modo permanente (tira 1d3: 1: Intelligenza, 2: Saggezza, 3: Carisma).","-14":"L’oggetto indossato è distrutto1 (1d3 = 1: slot volto, 2: slot gola, 3: slot testa).Inoltre, il colpo ti fracassa il cranio e cadi in un coma dal quale potrai uscire solo con l’1% di possibilità ogni 30 giorni.","-15":"Sei morto. A discrezione del DM, puoi invece restare morente per creare scene struggenti o permettere eventuali “ultime parole”."},"busto":{"-1":"Costretto ad una goffa manovra, incespichi e ti posizioni ultimo nell’ordine di Iniziativa (non agisci nuovamente se hai già agito durante questo turno).","-2":"Il colpo è potente e ti fa perdere l’equilibrio mandandoti prono.","-3":"Sei colpito duramente alle costole e diventi infermo per 1 minuto.","-4":"Il colpo è ben assestato e diretto allo stomaco: sei nauseato per 1 round.","-5":"Il colpo ti raggiunge all’inguine: sei barcollante per 2 round.","-6":"Il tremendo colpo ti lascia barcollante per 2 round. Inoltre, l’oggetto indossato si danneggia1 (1d8 = 1-4: slot corpo (armatura), 5-6: slot torso, 7: slot spalle, 8: slot vita).","-7":"Vieni colpito duramente al fianco e il dolore ti rende infermo finché la ferita di gravità 1 (10 PF) non viene curata.","-8":"Il colpo è potente e ti lascia frastornato per 1 round. Inoltre, l’oggetto indossato si danneggia1 (1d8 = 1-4: slot corpo (armatura), 5-6: slot torso, 7: slot spalle, 8: slot vita).","-9":"Il colpo ti incrina alcune costole e a causa del dolore intenso sei barcollante finché la ferita di gravità 2 (20 PF) non viene curata.","-10":"Un organo interno è compromesso dall’attacco: d’ora in poi, i Punti Fatica che recuperi tramite il Rifiatare e le notti di riposo sono dimezzati. Subire una seconda volta questa Ferita grave, riduce a un terzo i Punti Fatica recuperati. Inoltre, l’oggetto indossato si danneggia due volte1 (1d8 = 1-4: slot corpo (armatura), 5-6: slot torso, 7: slot spalle, 8: slot vita). Infine, il dolore ti rende barcollante finché la ferita di gravità 3 (30 PF) non viene curata.","-11":"Il colpo è così potente che cadi privo di sensi per 1 ora. Inoltre, alcuni muscoli del tronco vengono danneggiati seriamente e subisci una penalità permanente (tira 1d3: 1: -1 ai Tiri Salvezza su Riflessi, 2: -1 ai Tiri Salvezza su Tempra, 3: -2 Iniziativa). Queste penalità sono cumulabili con sé stesse. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-12":"Il colpo è così potente che cadi privo di sensi per 1 ora. Inoltre, alcuni muscoli del tronco vengono danneggiati seriamente e subisci una penalità permanente (tira 1d3: 1: -2 ai Tiri Salvezza su Riflessi, 2: -2 ai Tiri Salvezza su Tempra, 3: -4 Iniziativa). Queste penalità sono cumulabili con sé stesse. Infine, l’oggetto indossato si danneggia due volte1 (1d8 = 1-4: slot corpo (armatura), 5-6: slot torso, 7: slot spalle, 8: slot vita). Alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per emorragia grave (24 PF).","-13":"Il colpo è così potente che cadi privo di sensi per 1 ora. Inoltre, un organo interno viene irrimediabilmente compromesso e sia i tuoi Punti Ferita che i tuoi Punti Fatica sono ridotti in modo permanente di 1 punto per livello. Quando ottieni un nuovo livello, sottrai 2 punti dal totale guadagnato. Alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per emorragia grave (24 PF).","-14":"Il colpo è così potente che cadi privo di sensi per 1 ora. Inoltre, l’oggetto indossato si distrugge1 (1d8 = 1-4: slot corpo (armatura), 5-6: slot torso, 7: slot spalle, 8: slot vita).Infine, la tua colonna vertebrale si è lesionata in modo critico e i tuoi arti inferiori sono paralizzati per sempre. Se mai tu dovessi tornare a camminare per un qualsiasi motivo, non potrai comunque effettuare azioni di carica, corsa o ritirata, anche parziali.","-15":"Sei morto. A discrezione del DM, puoi invece restare morente per creare scene struggenti o permettere eventuali “ultime parole”."},"braccio":{"-1":"Vieni colpito alla mano. Se con quella mano impugni un oggetto, esso cade a terra ai tuoi piedi, altrimenti, se imbracci uno scudo, questo si slaccia non fornendo il bonus alla CA e imponendoti penalità di -1 ai tiri per colpire finché non usi un’azione di movimento per sistemarlo.","-2":"Il colpo è potente e ti fa perdere l’equilibrio mandandoti prono.","-3":"Il colpo ti schiaccia alcune nocche e il dolore ti rende infermo per 1 minuto.","-4":"L’oggetto che impugni ti scivola di mano e cade a terra a 1d3+1 caselle in una direzione casuale.","-5":"Il colpo ti intorpidisce il bicipite rendendo il braccio inutilizzabile per 2 round.","-6":"Il colpo è secco e preciso e rende il braccio inutilizzabile per 2 round. Inoltre, l’oggetto indossato si danneggia1 (1d6 = 1-3: oggetto impugnato, 4: slot braccia, 5: slot mani, 6: slot anello).","-7":"Sei ferito alla mano e il dolore ti rende infermo finché la ferita di gravità 1 (10 PF) non viene curata.","-8":"Il colpo ti ferisce gravemente e il braccio è inutilizzabile finché la ferita di gravità 1 (10 PF) non viene curata. Inoltre, l’oggetto indossato si danneggia1 (1d6 = 1-3: oggetto impugnato, 4: slot braccia, 5: slot mani, 6: slot anello).","-9":"Il colpo ti stacca 1 dito della mano. Inoltre, il dolore rende il braccio inutilizzabile finché la ferita di gravità 2 (20 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 2d4 minuti.","-10":"Il colpo ti stacca 1d2 dita della mano. Inoltre, l’oggetto indossato si danneggia due volte1 (1d6 = 1-3: oggetto impugnato, 4: slot braccia, 5: slot mani, 6: slot anello). Infine, il dolore rende il braccio inutilizzabile finché la ferita di gravità 2 (20 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-11":"Il colpo ti stacca 2 dita della mano. Inoltre, il dolore rende il braccio inutilizzabile finché la ferita di gravità 3 (30 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-12":"Il colpo ti stacca 2 dita della mano. Inoltre, l’oggetto indossato al 50% si distrugge, altrimenti si danneggia due volte1 (1d6 = 1-3: oggetto impugnato, 4: slot braccia, 5: slot mani, 6: slot anello). Infine, il dolore rende il braccio inutilizzabile finché la ferita di gravità 3 (30 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-13":"Il colpo ti stacca di netto la mano. L’oggetto impugnato e quelli negli slot mani e anelli devono essere recuperati da terra. Inoltre, per lo shock cadi privo di sensi per 1 ora. Alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per emorragia grave (24 PF).","-14":"Il colpo ti stacca il braccio all’altezza del gomito. L’oggetto impugnato e quelli negli slot braccia, mani e anelli devono essere recuperati da terra. Inoltre, per lo shock cadi privo di sensi per 1 ora. Alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per emorragia grave (24 PF).","-15":"Sei morto. A discrezione del DM, puoi invece restare morente per creare scene struggenti o permettere eventuali “ultime parole”."},"gamba":{"-1":"Costretto ad una goffa manovra, incespichi e ti posizioni ultimo nell’ordine di Iniziativa (non agisci nuovamente se hai già agito durante questo turno).","-2":"Il colpo è potente e ti fa perdere l’equilibrio mandandoti prono.","-3":"Il colpo ti schiaccia le dita dei piedi e il dolore ti rende infermo per 1 minuto.","-4":"Il colpo è ben assestato e diretto all’inguine: sei nauseato per 1 round.","-5":"Il colpo è ben diretto e ti lascia azzoppato per 2 round.","-6":"Il colpo è ben diretto e ti lascia azzoppato per 2 round. Inoltre, l’oggetto indossato si danneggia1 (1d4 = 1-2: slot cintura, 3-4: slot piedi).","-7":"Vieni ferito al piede e il dolore ti rende infermo finché la ferita di gravità 1 (10 PF) non viene curata.","-8":"Il colpo ti lussa l’anca o una caviglia e sei azzoppato finché la ferita di gravità 1 (10 PF) non viene curata. Inoltre, l’oggetto indossato si danneggia1 (1d4 = 1-2: slot cintura, 3-4: slot piedi).","-9":"Il colpo ti stacca 1 dito del piede. Inoltre, il dolore ti rende azzoppato finché la ferita di gravità 2 (20 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 2d4 minuti.","-10":"Il colpo ti stacca 1d2 dita del piede. Inoltre, l’oggetto indossato si danneggia due volte1 (1d4 = 1-2: slot cintura, 3-4: slot piedi). Infine, il dolore ti rende azzoppato finché la ferita di gravità 2 (20 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-11":"Il colpo ti stacca 2 dita del piede. Inoltre, il dolore ti rende azzoppato finché la ferita di gravità 3 (30 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-12":"Il colpo ti stacca 2 dita del piede. Inoltre, l’oggetto indossato al 50% si distrugge, altrimenti si danneggia due volte1 (1d4 = 1-2: slot cintura, 3-4: slot piedi). Infine, il dolore ti rende azzoppato finché la ferita di gravità 3 (30 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-13":"Il colpo ti stacca di netto il piede. L’oggetto nello slot piedi deve essere recuperato da terra. Inoltre, per lo shock cadi privo di sensi per 1 ora. Alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per emorragia grave (24 PF).","-14":"Il colpo ti stacca la gamba all’altezza del ginocchio. L’oggetto nello slot piedi deve essere recuperato da terra. Inoltre, per lo shock cadi privo di sensi per 1 ora. Alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per emorragia grave (24 PF).","-15":"Sei morto. A discrezione del DM, puoi invece restare morente per creare scene struggenti o permettere eventuali “ultime parole”."}},"locazioni":[{"da":1,"a":1,"nome":"Testa","righe":"testa","lato":""},{"da":2,"a":4,"nome":"Busto","righe":"busto","lato":""},{"da":5,"a":5,"nome":"Braccio sinistro","righe":"braccio","lato":"sinistro"},{"da":6,"a":6,"nome":"Braccio destro","righe":"braccio","lato":"destro"},{"da":7,"a":7,"nome":"Gamba sinistra","righe":"gamba","lato":"sinistro"},{"da":8,"a":8,"nome":"Gamba destra","righe":"gamba","lato":"destro"}]},{"id":"area","nome":"Attacchi con area di effetto o effetti senza tiro per colpire","righe":{"-1":"Costretto ad una goffa manovra, incespichi e ti posizioni ultimo nell’ordine di Iniziativa (non agisci nuovamente se hai già agito durante questo turno).","-2":"Il colpo è potente e ti fa perdere l’equilibrio mandandoti prono.","-3":"L’impatto ti rende infermo per 1 minuto.","-4":"Inali polvere o residui volatili o liquidi dovuti all’attacco e sei nauseato per 1 round.","-5":"Per evitare l’attacco sbatti la testa e sei barcollante per 2 round.","-6":"Per limitare i danni tenti di schermarti con un braccio (1d4 = 1-2: sinistro, 3-4: destro) e l’oggetto indossato si danneggia1 (1d6 = 1-3: oggetto impugnato, 4: slot braccia, 5: slot mani, 6: slot anello).Inoltre, a causa del colpo sbatti la testa e sei barcollante per 2 round.","-7":"Il tronco è maggiormente investito dall’attacco e il dolore ti rende infermo finché la ferita di gravità 1 (10 PF) non viene curata.","-8":"Il colpo ti investe alle gambe e sei azzoppato finché la ferita di gravità 1 (10 PF) non viene curata. Inoltre, l’oggetto indossato si danneggia1 (1d4 = 1-2: slot cintura, 3-4: slot piedi).","-9":"L’attacco ti rintrona, lasciandoti frastornato per 1 round.","-10":"Un organo interno è compromesso dall’attacco: d’ora in poi, i Punti Fatica che recuperi tramite il Rifiatare e le notti di riposo sono dimezzati. Subire una seconda volta questa Ferita grave, riduce a un terzo i Punti Fatica recuperati. Inoltre, l’oggetto indossato si danneggia1 (1d8 = 1-4: slot corpo (armatura), 5-6: slot torso, 7: slot spalle, 8: slot vita). Infine, il dolore ti rende barcollante finché la ferita di gravità 3 (30 PF) non viene curata.","-11":"Nel disperato tentativo di schermarti o parare il colpo con le mani, 2 dita della mano (1d4 = 1-2: sinistra, 3-4: destra) vengono mozzate, sciolte o spappolate. Inoltre, il dolore rende il braccio inutilizzabile finché la ferita di gravità 3 (30 PF) non viene curata. Morirai per emorragia lieve (8 PF) entro 1d3+1 minuti.","-12":"L’attacco ti investe in faccia ed è così potente da renderti privo di sensi per 1 ora. Inoltre, l’oggetto indossato al 50% si distrugge, altrimenti si danneggia1 (1d3 = 1: slot volto, 2: slot gola, 3: slot testa).Infine, il cervello risulta danneggiato e un tuo punteggio mentale è ridotto di 1 punto in modo permanente (tira 1d3: 1: Intelligenza, 2: Saggezza, 3: Carisma).","-13":"Ti fai scudo con la mano e l’attacco te la stacca di netto, scioglie o spappola (1d4 = 1-2: sinistra, 3-4: destra). L’oggetto impugnato e quelli negli slot mani e anelli devono essere recuperati da terra. Inoltre, per lo shock cadi privo di sensi per 1 ora. Alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per emorragia grave (24 PF).","-14":"Il colpo ti stacca di netto, scioglie o spappola la gamba all’altezza del ginocchio (1d4 = 1-2: sinistro, 3-4: destro). L’oggetto nello slot piedi deve essere recuperato da terra. Inoltre, per lo shock cadi privo di sensi per 1 ora. Alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per emorragia grave (24 PF).","-15":"Sei morto. A discrezione del DM, puoi invece restare morente per creare scene struggenti o permettere eventuali “ultime parole”."}},{"id":"costituzione","nome":"Danni a Costituzione, veleni, sanguinamento o livelli negativi","righe":{"-1":"Il dolore per la tua condizione è troppo e ti posizioni ultimo nell’ordine di Iniziativa (non agisci nuovamente se hai già agito durante questo turno).","-2":"Hai un mancamento e finisci prono.","-3":"Il dolore per la tua condizione ti rende infermo per 1 minuto.","-4":"Il dolore per la tua condizione ti rende nauseato per 1 round.","-5":"Il dolore per la tua condizione ti rende barcollante per 2 round.","-6":"Il dolore per la tua condizione ti rende nauseato per 2 round.","-7":"Hai un mancamento e finisci prono. Inoltre, il dolore per la tua condizione ti rende infermo per 1 minuto.","-8":"Il dolore per la tua condizione ti rende incapace di muoverti normalmente e sei azzoppato per 1d3+1 round.","-9":"Il dolore per la tua condizione ti rende frastornato per 1 round.","-10":"Un organo interno è compromesso dalla tua condizione: d’ora in poi, i Punti Fatica che recuperi tramite il Rifiatare e le notti di riposo sono dimezzati. Subire una seconda volta questa Ferita grave, riduce a un terzo i Punti Fatica recuperati.","-11":"Il dolore per la tua condizione è così potente da renderti privo di sensi per 1d3+1 minuti.","-12":"Il dolore per la tua condizione è così potente da renderti privo di sensi per 1 ora. Inoltre, il cervello risulta danneggiato e un tuo punteggio mentale è ridotto di 1 punto in modo permanente (tira 1d3: 1: Intelligenza, 2: Saggezza, 3: Carisma).","-13":"Hai un attacco di panico così terribile che alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per arresto cardiaco. Puoi mettere fine al panico spendendo un’azione di round completo.","-14":"Hai un attacco di panico così terribile che alla fine di ogni tuo turno hai il 5% cumulabile di probabilità di morire per arresto cardiaco. Puoi mettere fine al panico spendendo due azioni di round completo consecutive.","-15":"Sei morto. A discrezione del DM, puoi invece restare morente per creare scene struggenti o permettere eventuali “ultime parole”."}}],"nota_oggetti":"Tira 1d12: 1: volto, 2: gola, 3: testa, 4: torso, 5: armatura, 6: spalle, 7: vita, 8: braccia, 9: mani, 10: anello, 11: cintura, 12: piedi. Se lo slot è vuoto, l’oggetto è quello successivo, e così via.","regola_fermare":"Cure magiche: i punti curati vanno diretti alla ferita o all’emorragia, anche a più riprese. Professione (cerusico): unità di medicinali e prova come da tabella; se riesce, la ferita guarisce dopo il tempo indicato; se fallisce si ritenta dopo il tempo indicato con la CD che cambia. Senza medicinali: penalità −5.","senza_medicinali":-5,"fermare":[{"id":"emorragia_lieve","ferita":"Emorragia lieve","medicinali":1,"cd":15,"guarigione":null,"ritentare":{"espr":"1","unita":"round"},"variazione_cd":1,"testo":{"medicinali":"1","cd":"CD 15, cura immediata","ritentare":"dopo 1 round, la CD aumenta di 1 ad ogni nuovo tentativo"}},{"id":"emorragia_grave","ferita":"Emorragia grave","medicinali":2,"cd":25,"guarigione":null,"ritentare":{"espr":"1d4","unita":"round"},"variazione_cd":1,"testo":{"medicinali":"2","cd":"CD 25, cura immediata","ritentare":"dopo 1d4 round, la CD aumenta di 1 ad ogni nuovo tentativo"}},{"id":"gravita_1","ferita":"Gravità 1","medicinali":1,"cd":15,"guarigione":{"n":1,"unita":"giorni"},"ritentare":{"espr":"1","unita":"giorni"},"variazione_cd":-1,"testo":{"medicinali":"1","cd":"CD 15, cura dopo 1 giorno","ritentare":"dopo 1 giorno, la CD diminuisce di 1 ad ogni nuovo tentativo"}},{"id":"gravita_2","ferita":"Gravità 2","medicinali":2,"cd":20,"guarigione":{"n":3,"unita":"giorni"},"ritentare":{"espr":"2","unita":"giorni"},"variazione_cd":-1,"testo":{"medicinali":"2","cd":"CD 20, cura dopo 3 giorni","ritentare":"dopo 2 giorni, la CD diminuisce di 1 ad ogni nuovo tentativo"}},{"id":"gravita_3","ferita":"Gravità 3","medicinali":3,"cd":25,"guarigione":{"n":7,"unita":"giorni"},"ritentare":{"espr":"3","unita":"giorni"},"variazione_cd":-1,"testo":{"medicinali":"3","cd":"CD 25, cura dopo 7 giorni","ritentare":"dopo 3 giorni, la CD diminuisce di 1 ad ogni nuovo tentativo"}}],"regola_dita":"Se una mano o un piede non hanno almeno 3 dita contano come persi.","dita_perse":3,"amputazioni":[{"id":"mano","nome":"Mano","gruppo":"superiori","grado":1,"singolo":{"testo":"Nessun oggetto impugnabile con l’arto mancante.-5 Scalare, -5 Professione, -5 Disattivare congegni, -5 Rapidità di mano-5 DMC contro le manovre di Lottare.20% di fallire incantesimi con componente somatica.","mods":{"abilita_nome":{"Scalare":-5,"Professione":-5,"Disattivare congegni":-5,"Rapidità di mano":-5}}},"entrambi":{"testo":"Questa condizione si applica a qualsiasi combinazione di arti: mano-mano o mano-braccio, indifferentemente. Nessun oggetto impugnabile con gli arti mancante. Fallimento delle prove di Scalare, Professione, Disattivare congegni e Rapidità di mano.-20 DMC contro le manovre di Lottare. Fallimento degli incantesimi con componente somatica.","mods":{}}},{"id":"braccio","nome":"Braccio","gruppo":"superiori","grado":2,"singolo":{"testo":"Nessun oggetto impugnabile con l’arto mancante.-5 Scalare, -5 Professione, -5 Disattivare congegni, -5 Rapidità di mano e-10 DMC contro le manovre di Lottare.25% di fallire incantesimi con componente somatica.","mods":{"abilita_nome":{"Scalare":-5,"Professione":-5,"Disattivare congegni":-5,"Rapidità di mano":-5}}},"entrambi":null},{"id":"piede","nome":"Piede","gruppo":"inferiori","grado":1,"singolo":{"testo":"-5 Acrobazia, -5 Cavalcare, -5 Furtività, -5 Scalare. Nessuna azione di corsa o carica effettuabile.-4 DMC contro le manovre di Lottare. Velocità su terreno dimezzata.","mods":{"abilita_nome":{"Acrobazia":-5,"Cavalcare":-5,"Furtività":-5,"Scalare":-5}}},"entrambi":{"testo":"Questa condizione si applica a qualsiasi combinazione di arti: piede-piede o piede-gamba, indifferentemente. Fallimento delle prove di Acrobazia, Cavalcare, Furtività e Scalare. Permanentemente considerato privo del bonus di Destrezza alla CA.-20 DMC contro le manovre di Lottare. Conta permanentemente come prono.","mods":{"condizioni":["Colto alla sprovvista","Prono"]}}},{"id":"gamba","nome":"Gamba","gruppo":"inferiori","grado":2,"singolo":{"testo":"-10 Acrobazia, -10 Cavalcare, -10 Furtività, -10 Scalare. Nessuna azione di corsa o carica.-8 DMC contro le manovre di Lottare. Velocità su terreno ridotta a un quarto.","mods":{"abilita_nome":{"Acrobazia":-10,"Cavalcare":-10,"Furtività":-10,"Scalare":-10}}},"entrambi":null},{"id":"orecchio","nome":"Orecchio","gruppo":"orecchi","grado":1,"singolo":{"testo":"-2 alle prove di Iniziativa.-4 Percezione (udito).10% di fallire incantesimi con componente verbale.","mods":{"iniziativa":-2}},"entrambi":{"testo":"-4 alle prove di Iniziativa. Fallimento delle prove basate sull’udito.20% di fallire incantesimi con componente verbale.","mods":{"iniziativa":-4}}},{"id":"occhio","nome":"Occhio","gruppo":"occhi","grado":1,"singolo":{"testo":"* -1 CA.-4 alle prove basate sulla vista.-1 ai tiri per colpire a distanza e ancora -1 per ogni incremento di gittata.","mods":{"ca":-1}},"entrambi":{"testo":"* -2 CA.Permanentemente considerato privo del bonus di Destrezza alla CA.Fallimento delle prove basate sulla vista. Conta permanentemente come Offuscato 50%.","mods":{"ca":-2,"condizioni":["Colto alla sprovvista","Offuscato 50%"]}}},{"id":"mento","nome":"Mento","gruppo":"mento","grado":1,"singolo":{"testo":"-3 Diplomazia.10% di fallire incantesimi con componente verbale.-4 alle prove di sedurre.","mods":{"abilita_nome":{"Diplomazia":-3}}},"entrambi":null},{"id":"naso","nome":"Naso","gruppo":"naso","grado":1,"singolo":{"testo":"-4 Percezione (olfatto).-4 alle prove di sedurre.","mods":{}},"entrambi":null}],"note":["Le combinazioni «entrambi» dei gruppi superiori (mano-mano, mano-braccio) e inferiori (piede-piede, piede-gamba) usano la riga di Mano e di Piede; braccio-braccio e gamba-gamba non sono scritte e si contano allo stesso modo.","Occhio: l’asterisco «*» in entrambe le colonne non ha una nota nel volume.","Nel volume diverse voci della tabella hanno frasi attaccate senza spazio (es. «mancante.-5 Scalare», «mano-5 DMC»): i testi sono riportati come nel volume."]},"condizioni":{"fonte":"Elenco del progetto (37 condizioni in rosso) + Morente, stati di Indifeso, livelli negativi. Testi: Vol. 1 2.5.2 senza immagini, «Nuove condizioni» (estratto in sorgenti/guida/vol1_condizioni.txt); i testi delle altre condizioni (golarion.altervista.org) arrivano con la sezione P (Build 3). «effetto» = ciò che l'app applica ai valori del riquadro (design doc, G2).","condizioni":[{"nome":"Azzoppato","gruppo":"","rossa":true,"effetto":"","testo_vol1":"Azzoppato: la creatura vede il proprio movimento dimezzato (per eccesso) e non può compiere passi di 1,5 m."},{"nome":"Colto alla sprovvista","gruppo":"","rossa":true,"effetto":"la CA mostrata è quella colto alla sprovvista","testo_vol1":"Colto alla sprovvista: avviene quando alla creatura viene negato il bonus di Destrezza alla CA."},{"nome":"Offuscato","gruppo":"","rossa":true,"effetto":"vale solo la % più alta","testo_vol1":"Offuscato (%): la creatura ha una probabilità di mancare con ogni singolo attacco, incantesimo, capacità o azione che richieda un bersaglio diverso da sé stessa. Una creatura è sottoposta solo alla % più alta di offuscamento di cui è vittima. Le creature che non usano la vista per vedere non diventano offuscate."},{"nome":"Sempre pronto","gruppo":"","rossa":true,"effetto":"","testo_vol1":"Sempre pronto: la creatura non subisce la penalità di −6 alle prove di Iniziativa quando è impreparata. La creatura è comunque considerata impreparata per qualsiasi altro fine e subisce le consuete penalità nel primo round di combattimento (bonus di Destrezza negato alla CA, possibilità di subire attacchi furtivi, etc.)."},{"nome":"Affaticato","gruppo":"Fatica","rossa":true,"effetto":"","testo_vol1":""},{"nome":"Abbagliato","gruppo":"","rossa":true,"effetto":"Percezione −1","testo_vol1":""},{"nome":"Accecato","gruppo":"","rossa":true,"effetto":"CA −2, Percezione −4","testo_vol1":""},{"nome":"Accovacciato","gruppo":"Paura","rossa":true,"effetto":"","testo_vol1":""},{"nome":"Affascinato","gruppo":"","rossa":true,"effetto":"","testo_vol1":""},{"nome":"Assordato","gruppo":"","rossa":true,"effetto":"Iniziativa −4","testo_vol1":""},{"nome":"Barcollante","gruppo":"","rossa":true,"effetto":"","testo_vol1":""},{"nome":"Confuso","gruppo":"","rossa":true,"effetto":"","testo_vol1":""},{"nome":"Esausto","gruppo":"Fatica","rossa":true,"effetto":"","testo_vol1":""},{"nome":"Frastornato","gruppo":"","rossa":true,"effetto":"","testo_vol1":""},{"nome":"Immobilizzato","gruppo":"","rossa":true,"effetto":"","testo_vol1":""},{"nome":"Impreparato","gruppo":"","rossa":true,"effetto":"la CA mostrata è quella colto alla sprovvista","testo_vol1":""},{"nome":"In Lotta","gruppo":"","rossa":true,"effetto":"","testo_vol1":""},{"nome":"Inabile","gruppo":"","rossa":true,"effetto":"","testo_vol1":""},{"nome":"Incorporeo","gruppo":"","rossa":true,"effetto":"","testo_vol1":""},{"nome":"Indifeso","gruppo":"","rossa":true,"effetto":"","testo_vol1":""},{"nome":"Infermo","gruppo":"","rossa":true,"effetto":"TS e abilità −2","testo_vol1":""},{"nome":"Intralciato","gruppo":"","rossa":true,"effetto":"","testo_vol1":""},{"nome":"Invisibile","gruppo":"","rossa":true,"effetto":"","testo_vol1":""},{"nome":"Morto","gruppo":"","rossa":true,"effetto":"","testo_vol1":""},{"nome":"Nauseato","gruppo":"","rossa":true,"effetto":"","testo_vol1":""},{"nome":"Paralizzato","gruppo":"","rossa":true,"effetto":"","testo_vol1":""},{"nome":"Scosso","gruppo":"Paura","rossa":true,"effetto":"TS e abilità −2","testo_vol1":""},{"nome":"Spaventato","gruppo":"Paura","rossa":true,"effetto":"TS e abilità −2","testo_vol1":""},{"nome":"In Preda al Panico","gruppo":"Paura","rossa":true,"effetto":"TS e abilità −2","testo_vol1":""},{"nome":"Pietrificato","gruppo":"","rossa":true,"effetto":"","testo_vol1":""},{"nome":"Privo di Sensi","gruppo":"","rossa":true,"effetto":"","testo_vol1":""},{"nome":"Prono","gruppo":"","rossa":true,"effetto":"−4 CA in mischia / +4 a distanza","testo_vol1":""},{"nome":"Rotto","gruppo":"Oggetti","rossa":true,"effetto":"","testo_vol1":""},{"nome":"Sanguinante","gruppo":"","rossa":true,"effetto":"","testo_vol1":""},{"nome":"Scheggiato","gruppo":"Oggetti","rossa":true,"effetto":"","testo_vol1":""},{"nome":"Stabilizzato","gruppo":"","rossa":true,"effetto":"","testo_vol1":""},{"nome":"Stordito","gruppo":"","rossa":true,"effetto":"","testo_vol1":""},{"nome":"Morente","gruppo":"","rossa":false,"effetto":"condizione narrativa degli ultimi istanti","testo_vol1":"Morente: la creatura sta vivendo gli ultimi istanti di vita e non può essere salvata in alcun modo, né con cure né con la magia. Non può compiere azioni, ma può parlare con un filo di voce per pronunciare le ultime parole, una confessione o un indizio. Al termine della condizione muore. Una creatura vivente che muore in combattimento ha il 20% di probabilità di restare invece morente per 1 minuto; il DM può anche deciderlo a sua discrezione."},{"nome":"Addormentato","gruppo":"Indifeso","rossa":false,"effetto":"stato di Indifeso","testo_vol1":""},{"nome":"Bloccato","gruppo":"Indifeso","rossa":false,"effetto":"stato di Indifeso","testo_vol1":""},{"nome":"Legato","gruppo":"Indifeso","rossa":false,"effetto":"stato di Indifeso","testo_vol1":""},{"nome":"Livelli negativi","gruppo":"","rossa":false,"effetto":"TS, abilità e DMC −N; Punti Fatica max −5 per livello negativo","testo_vol1":"","n":true}]},"razze":{"fonte":"Razze.md (Vol. 1 «Regole e Razze» v2.5.1, Capitolo 2), copia in sorgenti/guida/razze.md","razze":[{"nome":"Umani","descrizione":"Gli umani sono la razza più numerosa al mondo. I loro imperi e nazioni sono ampi e in espansione e i cittadini di queste società scolpiscono i loro nomi con la forza delle armi e il potere dei loro incantesimi. L'umanità è meglio caratterizzata dalla sua turbolenza e diversità e le culture umane spaziano dalle tribù selvagge alle metropoli affollate. La curiosità e l'ambizione umane trionfano spesso sulla predilezione per uno stile di vita sedentario e molti lasciano le loro case per esplorare i numerosi angoli dimenticati del mondo o per condurre potenti eserciti in nome della propria nazione.","dati":{"Tipo":"umanoide con sottotipo umano.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 a una caratteristica a scelta e +1 a una seconda ma diversa caratteristica a scelta. Gli umani sono versatili, adattabili e dalle mille sfaccettature.","Linguaggi iniziali":"quello di residenza. Inoltre, possono scegliere qualsiasi linguaggio (non segreto) come linguaggio bonus dovuto all'Intelligenza.","Altezza, peso ed età":"1,50-1,95 m, 65-110 kg, aspettativa di vita massima di 100 anni circa."},"tratti":[{"nome":"Esperti","testo":"ottengono 1 punto abilità aggiuntivo per livello di personaggio."},{"nome":"Talentuosi","testo":"ottengono un talento bonus a scelta (devono soddisfarne i requisiti)."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Adattabilità marziale","descrizione":"Molti umani imparano sin da piccoli l'uso delle armi, alcuni per mera necessità, altri perché intraprendono una più o meno lunga carriera militare.","testo":"Il personaggio ottiene la competenza con tre armi da guerra a scelta. Quando il personaggio ottiene un nuovo livello, se lo desidera può cambiare una o più di queste armi così scelte."},{"nome":"Eclettico","descrizione":"Sovente umani di etnie diverse si uniscono, dando alla luce figli che si adattano con facilità agli usi e ai costumi di entrambi i genitori.","testo":"Alla creazione il personaggio non ottiene il tratto razziale Esperti. Di contro, seleziona due tratti razziali generici."},{"nome":"Eroico","descrizione":"Alcuni umani nascono per superare le avversità, proprio come gli eroi delle leggende.","testo":"Alla creazione il personaggio non ottiene il tratto razziale Talentuosi. Di contro, ottiene bonus +1 ai Tiri Salvezza."},{"nome":"Lavoro giovanile","descrizione":"Data la breve durata delle loro vite e la difficoltà a tirare avanti, molte famiglie umili devono avviare i giovani figli al duro lavoro. Questi fanciulli però, si portano dietro una grande resistenza alla fatica e la conoscenza degli strumenti tipici delle attività svolte in gioventù.","testo":"La prima volta della giornata in cui il personaggio dovrebbe diventare affaticato, può invece ignorare tale condizione. Inoltre, ottiene la competenza con accetta, martello leggero, piccone e falce."},{"nome":"Lingua d'argento","descrizione":"Gli umani sono spesso abili a manipolare il prossimo, risultando così capaci di ottenere vantaggi personali.","testo":"Una volta al giorno, il personaggio può ottenere **vantaggio** in una prova di Diplomazia o Raggirare (mentire)."},{"nome":"Mente focalizzata","descrizione":"Tutti gli umani sono molto versatili, ma alcuni, anziché esserlo in senso generale, tendono a specializzarsi in un ristretto numero di campi.","testo":"Alla creazione il personaggio non ottiene il tratto razziale Talentuosi. Di contro, al 1°, all'8° e al 16° livello ottiene il talento Abilità focalizzata."},{"nome":"Razionale","descrizione":"Nessuno più degli umani è caratterizzato da uno spirito concreto e capace di restare saldo alla realtà dei fatti.","testo":"Il personaggio ottiene bonus razziale +2 ai Tiri Salvezza contro effetti di \\[ILLUSIONE: ALLUCINAZIONE, FINZIONE, MASCHERAMENTO, OMBRA E TRAMA\\]."},{"nome":"Sfuggevole","descrizione":"Molti umani vivono sul filo del rasoio, ritrovandosi spesso in situazioni da cui è meglio tagliare la corda.","testo":"Una volta al giorno, il personaggio può ottenere **vantaggio** con +2 in una prova di Artista della fuga."}]},"tipo":"umanoide con sottotipo umano","taglia":"media","tipo_scheda":"Umanoide Medio (umano)","movimento":"9 m","sensi":[]},{"nome":"Halfling","descrizione":"All'aspetto, gli halfling sono umani in miniatura e compensano la loro piccola stazza con abbondanti spavalderia e curiosità. I loro piedi sono coperti da una soffice peluria e presentano piante spesse come suole di cuoio, motivo per cui non indossano quasi mai calzature. Agili, attenti e ottimisti per natura, gli halfling sembrano benedetti da una fortuna sfacciata. Anche nei momenti più catastrofici, gli halfling non perdono quasi mai il senso dell'umorismo e questo prendere tutto un po' alla leggera, li aiuta a proteggersi dagli orrori che solitamente atterriscono anche i combattenti più tenaci.","dati":{"Tipo":"umanoide con sottotipo halfling.","Taglia":"piccola (+1 CA, +1 ai tiri per colpire, −2 BMC, −2 DMC, +2 Furtività).","Movimento":"6 m (4 caselle).","Caratteristiche":"−2 Forza, +2 Destrezza, +2 Carisma. Gli halfling sono agili e caparbi ma deboli a causa della loro stazza.","Linguaggi iniziali":"quello di residenza e l'halfling. Inoltre, possono scegliere tra elfico, gigante, halfling e nanico come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"85 cm – 1 m, 20-35 kg, aspettativa di vita massima di 100 anni circa."},"tratti":[{"nome":"Familiarità con le armi","testo":"ottengono la competenza con la fionda e con le armi con la qualità Halfling."},{"nome":"Fortuna degli halfling","testo":"ottengono bonus razziale +1 ai Tiri Salvezza."},{"nome":"Temerarietà","testo":"ottengono bonus razziale +2 ai Tiri Salvezza contro effetti di \\[PAURA\\]. Inoltre, la CD delle prove per Intimidirli aumenta di 2."},{"nome":"Piedi saldi","testo":"ottengono bonus razziale +2 Acrobazia e +2 Scalare."},{"nome":"Sensi acuti","testo":"ottengono bonus razziale +2 Percezione."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Bambola inquietante","descrizione":"Occhi vitrei e pelle di porcellana rendono certi halfling più simili a bambole che a esseri viventi.","testo":"Se non è osservato, il personaggio può effettuare una prova di Furtività per far sì che le altre creature lo scambino per un fantoccio, come per la capacità universale dei mostri Immobilità (ma senza poter prendere 20). Questo tratto non ha effetto se gli osservatori hanno visto il personaggio muoversi di recente."},{"nome":"Colpi bassi","descrizione":"Data la stazza ridotta, per avere la meglio molti halfling si addestrano a combattere utilizzando trucchi non propriamente leali.","testo":"Il personaggio ottiene bonus razziale +2 ai tiri per confermare le minacce di critico contro gli avversari di taglia media o superiore."},{"nome":"Fanatico delle fionde","descrizione":"Gli halfling sono famosi per la loro dedizione nel tiro con la fionda, arte che praticano sin dai primi anni di vita.","testo":"Il personaggio ottiene il talento Ricarica rapida (fionde e bastoni-fionda). Se il personaggio ottiene nuovamente tale talento, una volta al giorno, quando ottiene un 1 naturale in un tiro per colpire con una fionda o un bastone-fionda, può ripetere tale tiro."},{"nome":"Fugace","descrizione":"Grazie alla loro fisionomia, gli halfling sono abilissimi a disimpegnarsi da interi gruppi di nemici sgattaiolando tra le loro gambe, facendo capriole o ardite scivolate.","testo":"Quando il personaggio effettua un'azione di ritirata, non provoca attacchi di opportunità da parte di nessun nemico durante tutto il movimento di tale azione."},{"nome":"Impercettibile","descrizione":"Gli halfling sono famosi per essere molto abili ad agire senza far rumore.","testo":"Il personaggio non subisce la penalità di −5 alle prove di Furtività mentre si muove silenziosamente a velocità normale."},{"nome":"Ingegnoso","descrizione":"Gli halfling hanno la fama di sapersela cavare con poco o nulla nelle situazioni di bisogno.","testo":"Il personaggio ottiene bonus razziale +2 Sopravvivenza e, salvo indicato dal DM, conta sempre come possedere un kit per i trucchi e degli arnesi da scasso. Inoltre, può usare metà del valore totale di Sopravvivenza al posto di Camuffare e di Disattivare congegni."},{"nome":"Schiena forte","descrizione":"Si narra che una linea di sangue degli halfling sia mischiata con sangue nanico. Vero o no, alcuni halfling hanno davvero un talento speciale per sopportare i carichi pesanti.","testo":"Il personaggio ignora la penalità al movimento imposta dalle armature medie."},{"nome":"Spirito contagioso","descrizione":"Alcuni halfling sono così temerari da essere un vero e proprio esempio di coraggio e forza d'animo.","testo":"Il bonus derivante dal tratto razziale Temerarietà diventa +4. Inoltre, se il personaggio supera un Tiro Salvezza contro un effetto di \\[PAURA\\], tutti gli alleati entro 15 m che falliscono il tiro per il medesimo effetto possono ripeterlo."}]},"tipo":"umanoide con sottotipo halfling","taglia":"piccola","tipo_scheda":"Umanoide Piccolo (halfling)","movimento":"6 m","sensi":[]},{"nome":"Nani","descrizione":"Stoici, leali, severi e coraggiosi, i nani sono tra i compagni d'avventura migliori che si possano desiderare. Si dice che al mondo nessuno possa eguagliarli come fabbri e nell'avidità con cui accumulano i tesori. Sebbene ne facciano normalmente uso, i nani sono dotati di una certa repellenza alla magia. Data la loro abitudine a vivere su picchi montani quasi inaccessibili, in costante guerra con giganti, pelleverde ed altri orrori simili, i nani sono una razza solitaria e diffidente. Coloro che nascono o che vivono a lungo in città multietniche però, sviluppano una parvenza di giovialità e finiscono quasi sempre per occupare riverite posizioni di prestigio all'interno della società.","dati":{"Tipo":"umanoide con sottotipo nano.","Taglia":"media.","Movimento":"6 m (4 caselle).","Caratteristiche":"+2 Costituzione, +2 Saggezza, −2 Carisma. I nani sono robusti e saggi ma anche molto burberi.","Linguaggi iniziali":"quello di residenza e il nanico. Inoltre, possono scegliere tra gigante e pelleverde come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"1,18-1,33 m, 72-95 kg, aspettativa di vita massima di 450 anni circa."},"tratti":[{"nome":"Scurovisione","testo":"in zone di oscurità vedono in bianco e nero entro 18 m."},{"nome":"Lenti ma determinati","testo":"ignorano la penalità al movimento imposta dalle armature."},{"nome":"Nemici giurati","testo":"ottengono +1 ai tiri per colpire contro le creature con il sottotipo pelleverde."},{"nome":"Familiarità con le armi","testo":"ottengono la competenza con l'ascia, il martello da guerra, il piccone e con le armi con la qualità Nanica."},{"nome":"Addestramento specifico","testo":"ottengono bonus di schivare +2 alla CA contro le creature con sottotipo gigante."},{"nome":"Resistenza nanica","testo":"ottengono bonus razziale +2 ai Tiri Salvezza contro gli effetti di incantesimi e capacità magiche."},{"nome":"Stabilità","testo":"ottengono bonus razziale +4 DMC per resistere alle manovre di Sbilanciare e Spingere quando si trovano sui terreni solidi."},{"nome":"Cupidigia","testo":"ottengono bonus razziale +2 Valutare (oggetti preziosi non magici e gemme)."},{"nome":"Esperti minatori","testo":"ottengono bonus razziale +2 Percezione (pericoli ambientali sotterranei; trappole e porte segrete situate su muri o pavimenti di pietra)."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Custode dei sepolcri","descrizione":"Certi nani trascorrono la gioventù sorvegliando le camere funerarie del proprio clan, spesso proteggendo gli antenati dai tombaroli, e a volte proteggendo i viventi dagli antenati stessi.","testo":"Il personaggio ottiene contro i non morti +1 ai tiri per colpire, bonus di schivare +1 alla CA, +2 ai Tiri Salvezza, +2 Intuizione e +2 Percezione."},{"nome":"Errante del sottosuolo","descrizione":"Alcuni nani sanno come muoversi all'interno di dungeon, grotte e caverne come pochi altri.","testo":"Il personaggio ottiene bonus razziale +2 Sopravvivenza (ambienti sotterranei). Inoltre, può effettuare i passi di 1,5 m all'interno dei terreni difficili sotterranei, eccetto quelli manipolati magicamente."},{"nome":"Fanatico delle armi da fuoco","descrizione":"Poche razze sono così ossessionate dalle armi da fuoco quanto i nani, tanto che alcuni le padroneggiano con un'abilità unica.","testo":"Una volta al giorno, il personaggio può disinceppare un'arma da fuoco come azione di movimento, anziché come azione di round completo."},{"nome":"Grande destino","descrizione":"Una profezia, il peso della propria genealogia o un compito di vitale importanza spinge alcuni nani a compiere gesta incredibili nel momento del più cupo bisogno.","testo":"Una volta al giorno, quando il personaggio ottiene un 1 naturale in un Tiro Salvezza o prova di abilità, può ripetere tale tiro."},{"nome":"Guardia dei picchi","descrizione":"Certi nani, per punizione o perché compito di famiglia, trascorrono la gioventù sulle vette dei monti, fungendo da vedette e difendendo le fortezze dagli attacchi nemici.","testo":"Il personaggio ottiene bonus razziale +1 ai tiri per colpire e +2 di schivare alla CA contro le creature volanti o in posizione sopraelevata. Inoltre, ottiene bonus razziale +2 Scalare e non perde mai il bonus di Destrezza quando scala o è appeso. Infine, conta sempre come indossare abiti invernali (vedi Volume 3 – Equipaggiamento: Sarti e mercerie)."},{"nome":"Nano di collina","descrizione":"Alcuni clan nanici creano da tempo immemore le loro comunità all'interno delle colline. Più svegli ma meno giudiziosi dei loro cugini, questi nani sono grandi custodi del sapere.","testo":"Il personaggio ottiene +2 Intelligenza al posto di +2 Saggezza come caratteristica razziale. Inoltre, ottiene i tratti razziali generici Studi approfonditi e Studi personali."},{"nome":"Negoziatore","descrizione":"I nani sono famosi per la loro cocciutaggine nel commercio, nelle trattative e nell'ottenere quello che vogliono in generale.","testo":"Il personaggio ottiene bonus razziale +2 Diplomazia, +2 Intuizione e +2 Valutare."},{"nome":"Oltremodo rancoroso","descrizione":"I nani sono famosi per la loro capacità nel serbare rancore. Alcuni più di altri.","testo":"Una volta al giorno, il personaggio può ottenere **vantaggio** nei tiri per colpire con armi o con colpi senz'armi del turno effettuati contro un nemico che lo abbia ferito nel round precedente."}]},"tipo":"umanoide con sottotipo nano","taglia":"media","tipo_scheda":"Umanoide Medio (nano)","movimento":"6 m","sensi":["scurovisione 18 m"]},{"nome":"Gnomi","descrizione":"Gli gnomi sono simili a nani con orecchie leggermente a punta. Sono infatti loro cugini, ne parlano la lingua e ne condividono fedi e tradizioni e, sebbene siano più minuti di loro, ne condividono inspiegabilmente la robustezza fisica. La maggior parte dei clan gnomici coesiste con quelli nanici nelle montagne, occupando di solito le zone più calde e ricche di sorgenti naturali sotterranee, zone che ospitano una grande quantità di melme attirate dai tiepidi vapori. Gli gnomi che vivono in città multietniche invece, spesso rivestono ruoli di prestigio come inventori e all'interno delle accademie scientifiche in generale. Gli gnomi hanno sensi molto sviluppati e sono dotati di una mente molto pratica, cose che li rendono meno suscettibili alle illusioni. Sono inoltre ossessionati dal proprio lavoro e dotati di un'attitudine naturale per la magia: quasi sempre le due cose si fondono garantendo risultati ottimali.","dati":{"Tipo":"umanoide con sottotipo gnomo.","Taglia":"piccola (+1 CA, +1 ai tiri per colpire, −2 BMC, −2 DMC, +2 Furtività).","Movimento":"6 m (4 caselle).","Caratteristiche":"−2 Forza, +2 Costituzione, +2 Carisma. Gli gnomi sono simpatici per natura e per quanto deboli, risultano inaspettatamente robusti.","Linguaggi iniziali":"quello di residenza e il nanico. Inoltre, possono scegliere tra gigante e pelleverde come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"95 cm – 1,10 m, 19-22 kg, aspettativa di vita massima di 300 anni circa."},"tratti":[{"nome":"Visione crepuscolare","testo":"ignorano l'occultamento dovuto alla luce fioca."},{"nome":"Nemici giurati","testo":"ottengono +1 ai tiri per colpire contro melme e le creature con il sottotipo pelleverde."},{"nome":"Familiarità con le armi","testo":"ottengono la competenza con la piccozza e con le armi con la qualità Gnomesca."},{"nome":"Addestramento specifico","testo":"ottengono bonus di schivare +2 alla CA contro le creature con sottotipo gigante."},{"nome":"Resistenza gnomesca","testo":"ottengono bonus razziale +2 ai Tiri Salvezza contro effetti di \\[ILLUSIONE: ALLUCINAZIONE, FINZIONE, MASCHERAMENTO, OMBRA E TRAMA\\]."},{"nome":"Magia pratica (Mag)","testo":"quando lanciano un incantesimo della scuola di Trasmutazione, possono aumentare di 1 il proprio livello di incantatore. Inoltre, possono lanciare una volta al giorno ciascuno gli incantesimi Aprire/Chiudere, Mano magica, Raffinare arma improvvisata e Vista dell'artigiano."},{"nome":"Sensi acuti","testo":"ottengono bonus razziale +2 Percezione."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Aggeggione","descrizione":"Gli gnomi amano toccare e provare qualsiasi cosa susciti la loro curiosità e alcuni sono ossessionati dagli oggetti magici.","testo":"Il personaggio ottiene il talento Abilità focalizzata (Utilizzare congegni magici). Inoltre, ottiene +2 Valutare (determinare se un oggetto è magico)."},{"nome":"Distratto","descrizione":"Alcuni gnomi sono sempre con la testa tra le nuvole: può capitare infatti che si ritrovino a schivare un'ascia abbassandosi per ispezionare un luccichio sospetto, o che evitino una freccia in testa chinandosi per ispezionare uno strano fungo, il tutto lasciando alleati e nemici sbigottiti e increduli.","testo":"Una volta al giorno, come azione immediata il personaggio può dichiararsi “momentaneamente distratto” per ottenere per quel turno bonus di schivare +2 alla CA contro gli attacchi non di opportunità di una singola creatura. L'uso di questo tratto razziale deve essere dichiarato prima che i tiri per colpire vengano effettuati."},{"nome":"Errante del sottosuolo","descrizione":"Alcuni gnomi sanno come muoversi all'interno di dungeon, grotte e caverne come pochi altri.","testo":"Il personaggio ottiene bonus razziale +2 Sopravvivenza (ambienti sotterranei). Inoltre, può effettuare i passi di 1,5 m all'interno dei terreni difficili sotterranei, eccetto quelli manipolati magicamente."},{"nome":"Parlantina sciolta","descrizione":"Agli gnomi piace parlare, ma alcuni sono dei veri e propri fiumi in piena in grado di confondere il prossimo.","testo":"Due volte al giorno, il personaggio può scegliere un umanoide pacifico a cui parlare per 1 minuto consecutivo. Se il personaggio vince una prova di Raggirare contrapposta a Intuizione +2 dell'umanoide, la vittima subisce gli effetti dell'incantesimo Charme su persone per 10 minuti. Questo è un effetto \\[UDITIVO\\] e \\[DIPENDENTE DAL LINGUAGGIO\\]."},{"nome":"Persecutore","descrizione":"Alcuni gnomi sono in grado di combattere con spietata efficienza e dedizione, focalizzandosi su specifici nemici.","testo":"Una volta al giorno, come azione standard il personaggio può osservare una specifica creatura, ottenendo contro di essa per 1 minuto bonus di circostanza +1 ai tiri per colpire, +2 ai danni, +2 Intuizione, +2 Percezione, +2 Raggirare (fintare) e +2 Rapidità di mano (rubare)."},{"nome":"Scienza pura","descrizione":"Tutti gli gnomi amano armeggiare, costruire e smontare. Alcuni, meno portati per la magia, senza troppi rimorsi compensano dedicandosi anima e corpo alla scienza.","testo":"Il personaggio ottiene +2 Intelligenza al posto di +2 Carisma come caratteristica razziale. Inoltre, non ottiene il tratto razziale Magia pratica e deve scegliere Professione (fabbro) come abilità di classe. Infine, ottiene la dote da inventore Mechanus potenziati."},{"nome":"Sfuggevole","descrizione":"Gli gnomi sono per natura bravissimi a ficcare il naso e a fuggire inspiegabilmente una volta colti sul fatto.","testo":"Una volta al giorno, il personaggio può ottenere **vantaggio** con +2 in una prova di Artista della fuga."},{"nome":"Vitalità gnomesca","descrizione":"Molti gnomi sono caratterizzati da una capacità di recupero sorprendente e sono in grado di recuperare dalle ferite più velocemente delle altre creature.","testo":"Il personaggio raddoppia il numero di Punti Ferita recuperati con 8 ore di riposo e viene curato di un ammontare di danni extra pari al livello di incantatore di chi lo cura dagli incantesimi che curano tramite l'energia positiva."}]},"tipo":"umanoide con sottotipo gnomo","taglia":"piccola","tipo_scheda":"Umanoide Piccolo (gnomo)","movimento":"6 m","sensi":["visione crepuscolare"]},{"nome":"Elfi","descrizione":"Gli elfi cercano di vivere in equilibrio con la natura, comprendendola meglio della maggior parte delle altre razze mortali. Parte di tale comprensione è mistica, ma altrettanta deriva dall'immortalità della razza elfica. Queste creature fatate danno valore alla riservatezza e alle tradizioni e, sebbene sia per loro piuttosto difficile instaurare nuove amicizie, una volta che uno straniero è accettato come compagno, tale alleanza può durare a lungo, talvolta estendendosi per generazioni ai figli dei figli dei figli. Gli elfi che passano le loro vite mischiati ad altre razze, spesso sviluppano una percezione distorta della mortalità, poiché il veder invecchiare e morire un infinito numero di compagni, rende queste creature cupe e silenziose.","dati":{"Tipo":"umanoide con sottotipo elfo.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Destrezza, −2 Costituzione, +2 Intelligenza. Gli elfi sono agili e dotati di grande acume, ma anche molto delicati.","Linguaggi iniziali":"quello di residenza e l'elfico. Inoltre, possono scegliere tra draconico, gnoll, pelleverde e silvano come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"1,75-2 m, 50-80 kg, una volta maturi mantengono per sempre un aspetto giovanile."},"tratti":[{"nome":"Visione crepuscolare","testo":"ignorano l'occultamento dovuto alla luce fioca."},{"nome":"Immortali","testo":"ottengono immunità agli effetti di \\[INVECCHIAMENTO\\]."},{"nome":"Sonno degli elfi","testo":"ottengono immunità agli effetti di \\[SONNO\\]. Inoltre, non necessitano di dormire per riposarsi: entrano invece in una trance vigile di quattro ore, che conta come otto ore di riposo a tutti gli effetti (subiscono comunque le penalità dovute al riposare in armatura)."},{"nome":"Familiarità con le armi","testo":"ottengono la competenza con l'arco corto, l'arco lungo, la spada lunga, lo stocco e con le armi con la qualità Elfica."},{"nome":"Resistenza elfica","testo":"ottengono bonus razziale +2 ai Tiri Salvezza contro effetti di \\[AMMALIAMENTO: CHARME E COMPULSIONE\\]."},{"nome":"Magia elfica","testo":"ottengono bonus razziale +2 alle prove di livello di incantatore effettuate per superare la RI."},{"nome":"Sensi acuti","testo":"ottengono bonus razziale +2 Percezione."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Accuratezza degli elfi","descrizione":"Molti elfi sviluppano una precisione sorprendente, anche per un popolo rinomato per tale caratteristica.","testo":"Il personaggio riduce di 10 punti percentuali la probabilità di essere mancato dovuta a occultamento e occultamento totale dei bersagli attaccati a distanza (dal 20% al 10%, dal 50% al 40%, dal 33% al 23%). Questa riduzione si applica anche agli incantesimi che forniscono probabilità di essere mancati."},{"nome":"Arroganza elfica","descrizione":"Non pochi elfi sono convinti della superiorità della razza elfica rispetto alle altre, risultando xenofobi ed avendo difficoltà nel rapportarsi col prossimo.","testo":"Il bonus del tratto razziale Resistenza elfica diventa +3 nei confronti degli effetti di \\[AMMALIAMENTO: CHARME E COMPULSIONE\\] provocati dalle creature senza il sottotipo elfo. Di contro, il personaggio subisce penalità −2 Diplomazia nei confronti delle creature senza il sottotipo elfo."},{"nome":"Attitudine magica","descrizione":"Gli elfi sono abilissimi nello sfruttare al massimo gli oggetti magici più disparati.","testo":"Il personaggio ottiene il talento Abilità focalizzata (Utilizzare congegni magici). Inoltre, ottiene +2 Valutare (determinare se un oggetto è magico)."},{"nome":"Bellezza disarmante","descrizione":"Gli elfi in generale hanno tratti particolarmente delicati e attraenti. Alcuni però, sono talmente belli che è quasi impossibile non notarli e rimanerne affascinati.","testo":"Il personaggio ottiene bonus razziale +2 Diplomazia, +2 Intrattenere e +2 Raggirare nei confronti di coloro che già sono o che potrebbero essere attratti sessualmente da lui."},{"nome":"Elfo alto","descrizione":"Quelli alti sono l'etnia di elfi più antica e nel loro sangue scorre potente la magia.","testo":"Il personaggio ottiene +2 Sapienza magica. Inoltre, ottiene +2 alle prove di Concentrazione."},{"nome":"Errante dei boschi","descrizione":"Gli elfi sono una razza con un'affinità naturale per le foreste e molti di loro sono in grado di muoversi tra alberi e cespugli con consumata abilità.","testo":"Il personaggio ottiene bonus razziale +2 Sopravvivenza (ambienti boschivi). Inoltre, può effettuare i passi di 1,5 m all'interno dei terreni difficili boschivi, eccetto quelli manipolati magicamente."},{"nome":"Impercettibile","descrizione":"Alcuni elfi sono particolarmente abili nello spostarsi senza fare rumore.","testo":"Il personaggio non subisce la penalità di −5 alle prove di Furtività mentre si muove silenziosamente a velocità normale."},{"nome":"Rapidità degli elfi","descrizione":"Alcuni elfi sviluppano una velocità a dir poco impressionante.","testo":"Il personaggio ottiene bonus di potenziamento +1,5 m alla velocità base su terreno quando non indossa armature medie o pesanti."}]},"tipo":"umanoide con sottotipo elfo","taglia":"media","tipo_scheda":"Umanoide Medio (elfo)","movimento":"9 m","sensi":["visione crepuscolare"]},{"nome":"Mezzelfi","descrizione":"Da sempre, l'immortalità, l'affinità magica e l'innata grazia degli elfi hanno contribuito a suscitare ammirazione (e spesso invidia) nel prossimo. Di tutte queste caratteristiche però, nessuna è più attraente per gli umani della loro bellezza e da sempre questi vedono gli elfi come modelli di perfezione fisica e versioni idealizzate di sé stessi. Da parte loro, molti elfi trovano gli umani grezzi ma attraenti, ammaliati dalla passione e dall'impeto con cui i membri di questa giovane razza vivono la propria breve esistenza. Benché solitamente di breve durata, queste unioni possono portare alla nascita di una razza che discende da due culture, ma che non è erede di nessuna. Presi tra il destino e la derisione, i mezzelfi sono al contempo odiati e desiderati per il loro fascino esotico. Ciò li porta a essere creature molto sole e sempre sul chi va là.","dati":{"Tipo":"umanoide con sottotipo umano e sottotipo elfo.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 ad una caratteristica a scelta. I mezzelfi ereditano l'ecletticità del sangue umano, risultando creature altamente adattabili.","Linguaggi iniziali":"quello di residenza. Inoltre, possono scegliere qualsiasi linguaggio (non segreto) come linguaggio bonus dovuto all'Intelligenza.","Altezza, peso ed età":"1,50-1,95 m, 65-110 kg, aspettativa di vita massima di 185 anni circa."},"tratti":[{"nome":"Mezzosangue","testo":"contano sia come umani che elfi al fine di qualsiasi requisito, ad eccezione di quelli degli archetipi."},{"nome":"Visione crepuscolare","testo":"ignorano l'occultamento dovuto alla luce fioca."},{"nome":"Sonno degli elfi","testo":"ottengono immunità agli effetti di \\[SONNO\\]."},{"nome":"Resistenza elfica","testo":"ottengono bonus razziale +2 ai Tiri Salvezza contro effetti di \\[AMMALIAMENTO: CHARME E COMPULSIONE\\]."},{"nome":"Vigili","testo":"quando sono impreparati, subiscono penalità di −3 alla prova di Iniziativa, anziché di −6."},{"nome":"Scaltri","testo":"ottengono bonus razziale +2 Diplomazia e +2 Intuizione. Inoltre, una volta al giorno possono ripetere una prova di Diplomazia fallita."},{"nome":"Sensi acuti","testo":"ottengono bonus razziale +2 Percezione."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Ammaliatore","descrizione":"Grazie al loro bell'aspetto e ai modi cordiali, alcuni mezzelfi diventano degli ammaliatori senza pari.","testo":"Quando il personaggio lancia un incantesimo della scuola di Ammaliamento, può aumentare di 1 il proprio livello di incantatore o la CD dell'incantesimo."},{"nome":"Familiarità con le armi elfiche","descrizione":"Certi mezzelfi ricevono un addestramento marziale dai genitori, al fine di esser meglio preparati ad affrontare l'incerto futuro.","testo":"Il personaggio ottiene la competenza con l'arco corto, l'arco lungo, la spada lung
