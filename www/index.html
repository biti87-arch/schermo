o nelle lame orientali","descrizione":"I tengu sono spadaccini naturali e alcuni apprendono l'utilizzo di armi ben più insolite.","testo":"Il personaggio ottiene la competenza con tre delle seguenti armi a scelta: kama, katana, sai, sciabola dentata, spada dentata, spada farfalla, ventaglio da guerra e wakizashi."},{"nome":"Corvo ciarliero","descrizione":"La voce di alcuni tengu non si limita a imitare: si moltiplica, si sposta, arriva da dove non dovrebbe.","testo":"Il tratto razziale Imitatori permette di memorizzare fino a tre voci contemporaneamente. Inoltre, il personaggio può lanciare a volontà l'incantesimo Ventriloquio."},{"nome":"Malaugurio","descrizione":"Dare fastidio a un tengu porta sfortuna. Dare fastidio ad alcuni tengu in particolare può risultare in una vera tragedia.","testo":"Una volta al giorno, come azione immediata, quando un nemico entro 9 m effettua un tiro per colpire, un Tiro Salvezza o una prova di abilità, il personaggio può imporgli **svantaggio** in quel tiro."},{"nome":"Percepire carcasse","descrizione":"Molti tengu possiedono un olfatto specificamente sintonizzato sul fetore emesso dalle creature ferite o morte.","testo":"Il personaggio ottiene la regola Fiuto, ma solo per percepire cadaveri e creature ridotte a metà o meno Punti Ferita."},{"nome":"Piumaggio invernale","descrizione":"Alcuni tengu secernono una sostanza oleosa e isolante che li protegge dal freddo. Inoltre, possono mutare il colore delle proprie piume in breve tempo.","testo":"Il personaggio non subisce mai gli effetti del clima freddo, come per l'incantesimo Contrastare elementi. Inoltre, nel giro di 1 ora può far diventare bianche le proprie piume, ottenendo bonus di circostanza +2 Furtività per nascondersi nel ghiaccio e nella neve."},{"nome":"Richiamo aviario","descrizione":"Alcuni tengu riescono ad attrarre gli uccelli, sfruttando il loro linguaggio similare.","testo":"Una volta al giorno, come azione di round completo, il personaggio richiama un uccello. L'animale deve essere presente nel raggio di 5 km e si muoverà al massimo delle proprie possibilità per rispondere alla chiamata. L'animale risponderà automaticamente alle domande postegli come per l'incantesimo Parlare con gli animali."},{"nome":"Uccello rapace","descrizione":"I tengu hanno uno spiccato istinto per le imboscate. Alcuni, semplicemente, più degli altri.","testo":"Il personaggio ottiene bonus razziale +1 ai tiri per colpire e ai danni contro gli avversari impreparati. Inoltre, una volta al giorno può ottenere **vantaggio** in un tiro per colpire nel primo round di un combattimento."},{"nome":"Volo controllato","descrizione":"Certi tengu hanno ali sufficientemente forti da trasformare una caduta in qualcosa che assomiglia molto al volo.","testo":"Le prove di Volare del tratto razziale Planare riescono automaticamente. Inoltre, il personaggio si sposta lateralmente di 3 m per ogni 6 m di caduta, anziché 1,5 m, e può trasportare una creatura di taglia media o inferiore mentre plana."}]},"tipo":"umanoide con sottotipo tengu","taglia":"media","tipo_scheda":"Umanoide Medio (tengu)","movimento":"9 m","sensi":["visione crepuscolare"]},{"nome":"Vanara","descrizione":"I vanara sono un popolo di scimmie antropomorfe dal pelo folto e dagli occhi vividi, che vivono tra le chiome delle foreste tropicali e nelle città costruite sui pendii dove nessun altro si prenderebbe la briga di salire. Sono creature esuberanti, chiassose e incurabilmente curiose, convinte che qualunque cosa valga la pena di essere fatta valga anche la pena di essere fatta subito. Questa impulsività li mette regolarmente nei guai e altrettanto regolarmente li tira fuori, perché è difficile inseguire un vanara che ha deciso di andarsene: passa dove non c'è appiglio, afferra ciò che nessuno pensava fosse afferrabile e ride mentre lo fa. Chi li giudica frivoli di solito cambia idea la prima volta che uno di loro affronta un pericolo vero: sotto la baldoria c'è un popolo di antica saggezza e di lealtà assoluta.","dati":{"Tipo":"umanoide con sottotipo vanara.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Destrezza, +2 Saggezza, −2 Carisma. I vanara sono agili e assennati, ma chiassosi e impulsivi.","Linguaggi iniziali":"quello di residenza e il vanara. Inoltre, possono scegliere tra felino, gripli, silvano e tengu come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"1,50-1,80 m, 50-85 kg, aspettativa di vita massima di 100 anni circa."},"tratti":[{"nome":"Visione crepuscolare","testo":"ignorano l'occultamento dovuto alla luce fioca."},{"nome":"Arrampicatori","testo":"ottengono bonus razziale +4 Scalare e non perdono mai il bonus di Destrezza alla CA quando scalano o sono appesi."},{"nome":"Coda prensile","testo":"possono usare la coda per recuperare gli oggetti dallo zaino come azione di movimento, anziché come azione di round completo e senza necessariamente togliersi lo zaino dalle spalle. Non si può usare la coda in questo modo se è munita di un'estensione per coda."},{"nome":"Agilità arborea","testo":"ottengono bonus razziale +2 Acrobazia. Inoltre, possono effettuare i passi di 1,5 m all'interno dei terreni difficili boschivi, eccetto quelli manipolati magicamente."},{"nome":"Sensi acuti","testo":"ottengono bonus razziale +2 Percezione."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Baldoria contagiosa","descrizione":"L'allegria di certi vanara è tanto sfacciata da rendere ridicola qualunque minaccia.","testo":"Una volta al giorno, come azione veloce, il personaggio e tutti gli alleati entro 9 m che possano udirlo ottengono **vantaggio** al prossimo Tiro Salvezza contro effetti di \\[PAURA\\] effettuato entro 1 minuto."},{"nome":"Coda forte","descrizione":"La coda di alcuni vanara è tanto robusta da reggerne il peso senza il minimo sforzo.","testo":"Il personaggio può appendersi per la coda mantenendo entrambe le mani libere e non è considerato in posizione precaria mentre lo fa. Inoltre, ottiene bonus razziale +2 alla DMC contro i tentativi di Sbilanciare e Spingere e non finisce prono quando subisce danni in seguito a una caduta."},{"nome":"Errante dei boschi","descrizione":"I vanara conoscono le foreste come nessun altro, avendovi trascorso intere generazioni tra un ramo e l'altro.","testo":"Il personaggio ottiene bonus razziale +2 Sopravvivenza (ambienti boschivi) e +2 Furtività all'interno di boschi e foreste."},{"nome":"Ladro di frutti","descrizione":"Rubare, per un vanara, non è un mestiere: è una forma di conversazione.","testo":"Il personaggio ottiene bonus razziale +2 Rapidità di mano e può effettuare le prove in tale abilità anche senza addestramento. Inoltre, può effettuare le manovre di Rubare usando la coda contro bersagli entro 3 m, anziché solo adiacenti."},{"nome":"Mente scimmiesca","descrizione":"Sotto la baldoria, alcuni vanara nascondono una lucidità che nessuno si aspetta.","testo":"Il personaggio ottiene bonus razziale +2 ai Tiri Salvezza contro effetti di \\[AMMALIAMENTO: CHARME E COMPULSIONE\\] e la CD delle prove per Intimidirlo aumenta di 2."},{"nome":"Passo tra i rami","descrizione":"Certi vanara si spostano di ramo in ramo tanto in fretta che seguirli a terra è impossibile.","testo":"Quando il personaggio effettua un'azione di ritirata all'interno di boschi, foreste o di qualsiasi ambiente che offra appigli sopraelevati, non provoca attacchi di opportunità da parte di nessun nemico durante tutto il movimento di tale azione."},{"nome":"Saggio della montagna","descrizione":"Alcuni vanara trascorrono decenni nei monasteri d'alta quota, e ne escono cambiati.","testo":"Il personaggio ottiene bonus razziale +2 Conoscenze (religioni) e può effettuare le prove in tale abilità anche senza addestramento. Inoltre, ottiene bonus razziale +2 alle prove di Concentrazione."},{"nome":"Spericolato","descrizione":"L'impulsività di alcuni vanara sfiora l'incoscienza, e stranamente sembra premiarli.","testo":"Una volta al giorno, il personaggio può ottenere **vantaggio** in una prova di Acrobazia o di Scalare. Inoltre, riduce di 3 m l'altezza considerata per calcolare i danni da caduta."}]},"tipo":"umanoide con sottotipo vanara","taglia":"media","tipo_scheda":"Umanoide Medio (vanara)","movimento":"9 m","sensi":["visione crepuscolare"]},{"nome":"Gathlain","descrizione":"I gathlain sono minuscoli esseri nati dall'incontro tra il sangue dei folletti e la linfa delle piante: hanno corpi sottili percorsi da venature verdi, capelli di foglie o petali che cambiano con le stagioni, e un paio di ali iridescenti da libellula che tengono ripiegate sulla schiena. Vivono in comunità disordinate e allegrissime nel folto delle foreste antiche, dove passano le giornate a inventare scherzi elaborati, a discutere di questioni astrusissime e a dimenticarsi di ciò che stavano facendo. Non hanno alcun senso della proprietà — considerano loro qualunque cosa nessuno stia guardando in quel momento — e altrettanto poco senso del pericolo. Le loro ali, purtroppo, non li sostengono davvero: servono a planare, a rallentare una caduta, a compiere balzi che sfidano il buonsenso, e i gathlain adulti passano l'esistenza a lamentarsi di quanto sarebbe bello volare per davvero. Quelli che vivono abbastanza a lungo, prima o poi, ci riescono.","dati":{"Tipo":"umanoide con sottotipo folletto e sottotipo vegetale.","Taglia":"piccola (+1 CA, +1 ai tiri per colpire, −2 BMC, −2 DMC, +2 Furtività).","Movimento":"6 m (4 caselle).","Caratteristiche":"+2 Destrezza, +2 Intelligenza, −2 Costituzione. I gathlain sono agili e di ingegno vivace, ma minuscoli e fragili.","Linguaggi iniziali":"quello di residenza e il silvano. Inoltre, possono scegliere tra elfico, gnomesco, gripli e vanara come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"90 cm – 1,10 m, 12-18 kg, aspettativa di vita massima di 300 anni circa."},"tratti":[{"nome":"Visione crepuscolare","testo":"ignorano l'occultamento dovuto alla luce fioca."},{"nome":"Ali fatate","testo":"ottengono bonus razziale +2 Acrobazia (saltare) e non hanno mai bisogno di prendere la rincorsa per effettuare un salto."},{"nome":"Planare","testo":"quando cadono, possono effettuare una prova di Volare con CD 15 per non subire danni da caduta. Se la prova riesce, possono effettuare un'ulteriore prova di Volare con CD 15 per planare, spostandosi lateralmente di 1,5 m per ogni 6 m di caduta. Non possono trasportare altre creature mentre planano."},{"nome":"Natura vegetale","testo":"ottengono bonus razziale +2 ai Tiri Salvezza contro effetti di \\[INFLUENZA MENTALE\\] e \\[VELENO\\]. Di contro, subiscono +25% ai danni da fuoco."},{"nome":"Vulnerabilità al ferro freddo","testo":"subiscono +25% ai danni inflitti dalle armi in ferro freddo."},{"nome":"Innesto simbiotico","testo":"alla creazione il personaggio sceglie una pianta che vive innestata nel proprio corpo. Ottiene bonus razziale +2 Conoscenze (natura) e può effettuare le prove in tale abilità anche senza addestramento. Inoltre, una volta al giorno può lanciare l'incantesimo Amicizia con le piante."},{"nome":"Magia silvana (Mag)","testo":"quando lanciano un incantesimo della scuola di Trasmutazione, possono aumentare di 1 la CD dell'incantesimo."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Corteccia","descrizione":"La pelle di alcuni gathlain si indurisce in una scorza sottile ma sorprendentemente resistente.","testo":"Il personaggio ottiene bonus +1 alla CA Naturale. Inoltre, il malus ai danni da fuoco di Natura vegetale scende dal 25% al 10%."},{"nome":"Fiore di stagione (Mag)","descrizione":"L'innesto di questi gathlain sboccia una volta al giorno, e ciò che sboccia dipende dalla stagione.","testo":"Una volta al giorno, il personaggio può lanciare come capacità magica uno tra Cura ferite leggere, Intralciare, Luminescenza e Ritirata rapida. La scelta va fatta all'alba di ogni giorno."},{"nome":"Fusto flessibile","descrizione":"Il corpo di questi gathlain è più stelo che carne, e si piega dove chiunque altro si spezzerebbe.","testo":"Il personaggio ottiene bonus razziale +2 Artista della fuga e +2 alla DMC contro i tentativi di Lottare. Inoltre, può stringersi come una creatura di una taglia più piccola."},{"nome":"Linfa curativa","descrizione":"La linfa che scorre nelle vene di alcuni gathlain rimargina ciò che il sangue non saprebbe rimarginare.","testo":"Durante il Rifiatare, il personaggio può ripetere i risultati di dado pari a 1 e 2. Questi tiri possono essere ripetuti un qualsiasi numero di volte."},{"nome":"Radici profonde","descrizione":"Certi gathlain sanno affondare i piedi nel terreno e diventare, per qualche istante, un albero vero.","testo":"Come azione veloce, il personaggio può radicarsi: fino alla fine del turno successivo ottiene bonus razziale +4 alla DMC contro le manovre di Sbilanciare e Spingere e non può essere mosso contro la propria volontà da alcun effetto che non sia magico. Mentre è radicato la sua velocità è 0."},{"nome":"Scherzo di bosco","descrizione":"I gathlain considerano lo scherzo una forma d'arte e alcuni hanno raggiunto vette che i loro pari giudicano insuperabili.","testo":"Il personaggio ottiene bonus razziale +2 Raggirare. Inoltre, una volta al giorno può ottenere **vantaggio** in una prova di Raggirare o di Rapidità di mano."},{"nome":"Testa fra le nuvole","descrizione":"Alcuni gathlain sono così assorti nei propri pensieri da risultare imprevedibili anche per chi li sta attaccando.","testo":"Una volta al giorno, come azione immediata, il personaggio può imporre **svantaggio** a un singolo tiro per colpire effettuato contro di lui."},{"nome":"Volo delle libellule","descrizione":"Le ali di questi gathlain sono più larghe, più forti e più rumorose della norma. Un giorno basteranno.","testo":"Le prove di Volare del tratto razziale Planare riescono automaticamente e il personaggio si sposta lateralmente di 3 m per ogni 6 m di caduta, anziché 1,5 m. Inoltre, al 17° livello di personaggio ottiene una velocità di Volare di 12 m (scarsa)."}]},"tipo":"umanoide con sottotipo folletto e sottotipo vegetale","taglia":"piccola","tipo_scheda":"Umanoide Piccolo (folletto, vegetale)","movimento":"6 m","sensi":["visione crepuscolare"]},{"nome":"Fauno","descrizione":"I fauni sono folletti dal busto umano e dalle gambe caprine, con corna ricurve, occhi dalla pupilla orizzontale e un'allegria che nessuna disgrazia sembra scalfire. Vivono ai margini dei boschi antichi, in radure che nessuna mappa registra, dove suonano, bevono, discutono di filosofia con estrema serietà e poi si dimenticano di ciò che hanno concluso. Considerano il lavoro una forma di malattia e la fretta una volgarità, ma sanno essere alleati di rara lealtà con chi li tratta da pari. Ogni fauno impara da bambino a suonare qualcosa, e ogni fauno è convinto di suonarlo meglio di chiunque altro. La cosa notevole è che, quando suonano davvero, le creature del bosco smettono di fare quello che stavano facendo e si voltano ad ascoltare.","dati":{"Tipo":"umanoide con sottotipo folletto.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Destrezza, +2 Carisma, −2 Costituzione. I fauni sono agili e magnetici, ma di fibra sorprendentemente delicata.","Linguaggi iniziali":"quello di residenza e il silvano. Inoltre, possono scegliere tra elfico, gnomesco, gripli e vanara come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"1,60-1,90 m, 60-100 kg, aspettativa di vita massima di 200 anni circa."},"tratti":[{"nome":"Visione crepuscolare","testo":"ignorano l'occultamento dovuto alla luce fioca."},{"nome":"Zoccoli","testo":"ottengono un attacco di supporto di Zoccoli che infligge 1d4 danni."},{"nome":"Passo silvano","testo":"ottengono bonus razziale +2 Sopravvivenza (ambienti boschivi). Inoltre, possono effettuare i passi di 1,5 m all'interno dei terreni difficili boschivi, eccetto quelli manipolati magicamente."},{"nome":"Incanto silvano (Mag)","testo":"quando lanciano un incantesimo della scuola di Ammaliamento, possono aumentare di 1 la CD dell'incantesimo. Inoltre, possono lanciare una volta al giorno l'incantesimo Charme su animali."},{"nome":"Resistenza dei folletti","testo":"ottengono bonus razziale +2 ai Tiri Salvezza contro effetti di \\[AMMALIAMENTO\\] e \\[ILLUSIONE: ALLUCINAZIONE, FINZIONE, MASCHERAMENTO, OMBRA E TRAMA\\]."},{"nome":"Sensi acuti","testo":"ottengono bonus razziale +2 Percezione."},{"nome":"Vulnerabilità al ferro freddo","testo":"subiscono +25% ai danni inflitti dalle armi in ferro freddo."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Balzo caprino","descrizione":"Le zampe di alcuni fauni sono molle che li scagliano dove nessuno si aspetta di trovarli.","testo":"Il personaggio ottiene bonus razziale +4 Acrobazia (saltare) e non ha mai bisogno di prendere la rincorsa per effettuare un salto."},{"nome":"Corna ricurve","descrizione":"Certi fauni portano corna talmente possenti da poterle usare come un ariete.","testo":"Il personaggio sostituisce l'attacco di supporto di Zoccoli con un attacco di supporto di Corna che infligge 1d6 danni. Quando effettua una carica, l'attacco di Corna conta come attacco primario."},{"nome":"Danza del bosco","descrizione":"Quando certi fauni cominciano a danzare, fermarsi a guardarli è più forte della prudenza.","testo":"Il personaggio ottiene bonus razziale +2 Intrattenere (danzare) e può utilizzare tale abilità al posto di Diplomazia per migliorare l'atteggiamento altrui. Inoltre, una volta al giorno può ottenere **vantaggio** in una prova di Intrattenere o di Diplomazia."},{"nome":"Flauto di Pan (Mag)","descrizione":"Il flauto di alcuni fauni non si limita a fare musica: fa addormentare, incanta, chiama.","testo":"Una volta al giorno, il personaggio può lanciare come capacità magica uno tra Sonno, Ipnosi e Charme su persone, con CD 10 + metà livello di personaggio + bonus di Carisma. Questo è un effetto \\[UDITIVO\\] e richiede uno strumento a fiato."},{"nome":"Passo del capro","descrizione":"I fauni delle alture si muovono su pareti verticali con la stessa noncuranza con cui gli altri camminano in pianura.","testo":"Il personaggio ottiene bonus razziale +4 Scalare e non perde mai il bonus di Destrezza alla CA quando scala o è appeso. Inoltre, ottiene bonus razziale +2 Acrobazia (mantenere l'equilibrio)."},{"nome":"Riso contagioso","descrizione":"La risata di certi fauni è tanto sfacciata e fuori luogo da spezzare la concentrazione di chiunque.","testo":"Una volta al giorno, come azione immediata, quando un nemico entro 9 m che possa udirlo effettua una prova di Concentrazione o un tiro per colpire, il personaggio può imporgli **svantaggio** in quel tiro."},{"nome":"Sangue antico dei folletti","descrizione":"In alcuni fauni l'eredità fatata scorre più densa che negli altri, e la magia altrui fatica a trovarli.","testo":"Il personaggio ottiene RI 6 + livello di personaggio. Si può sopprimere o riattivare questa RI come azione veloce."},{"nome":"Temperanza allegra","descrizione":"Un fauno beve tutto ciò che gli viene offerto, e i fauni si offrono molte cose a vicenda. Alcuni ne escono con uno stomaco indistruttibile.","testo":"Il personaggio ottiene bonus razziale +4 ai Tiri Salvezza contro effetti di \\[VELENO DA INGESTIONE\\] e contro gli effetti dell'alcol. Inoltre, ottiene bonus razziale +2 ai Tiri Salvezza contro effetti di \\[MALATTIA\\]."}]},"tipo":"umanoide con sottotipo folletto","taglia":"media","tipo_scheda":"Umanoide Medio (folletto)","movimento":"9 m","sensi":["visione crepuscolare"]},{"nome":"Ghoran","descrizione":"I ghoran non sono nati: sono stati coltivati. Millenni fa un botanico di cui nessuno ricorda più il nome creò una pianta capace di pensare, e da quella pianta discendono tutti loro. Hanno corpi di fibra vegetale e corteccia levigata, capelli di foglie e petali che cambiano colore con l'umore, e un profumo dolce che chi sta loro vicino fatica a dimenticare. Sono creature vanitose, teatrali e profondamente convinte di essere migliori di chi le circonda — convinzione che, va detto, hanno il talento di rendere quasi condivisibile. Vivono a lungo e ricordano molto, e ogni ghoran porta con sé un seme che contiene tutto ciò che è: quando il corpo cede, il seme può essere piantato, e da esso germoglia di nuovo lo stesso individuo, con gli stessi ricordi e la stessa insopportabile sicurezza di sé. Ma il seme è uno solo, e nessun ghoran lo dimentica mai.","dati":{"Tipo":"umanoide con sottotipo vegetale.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Costituzione, +2 Carisma, −2 Destrezza. I ghoran sono resistenti e magnetici, ma i loro corpi legnosi sono tutt'altro che agili.","Linguaggi iniziali":"quello di residenza e il silvano. Inoltre, possono scegliere tra elfico, gripli, gnomesco e qualsiasi linguaggio (non segreto) come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"1,70-2 m, 45-70 kg, aspettativa di vita massima di 700 anni circa."},"tratti":[{"nome":"Visione crepuscolare","testo":"ignorano l'occultamento dovuto alla luce fioca."},{"nome":"Natura vegetale","testo":"ottengono bonus razziale +4 ai Tiri Salvezza contro effetti di \\[INFLUENZA MENTALE\\], \\[PARALISI\\], \\[SONNO\\], \\[STORDIMENTO\\] e \\[VELENO\\]."},{"nome":"Vulnerabilità al fuoco","testo":"subiscono +25% ai danni da fuoco."},{"nome":"Fotosintesi","testo":"non necessitano di nutrirsi, a patto di esporsi alla luce solare per almeno 2 ore al giorno. Un ghoran che non vi riesca è soggetto alle normali regole della fame a partire dal giorno successivo."},{"nome":"Corteccia","testo":"ottengono bonus +1 alla CA Naturale."},{"nome":"Profumo inebriante","testo":"ottengono bonus razziale +2 Diplomazia e +2 Intrattenere nei confronti delle creature in grado di percepire odori."},{"nome":"Memoria del seme","testo":"alla creazione il personaggio sceglie due abilità di Conoscenze: le considera abilità di classe e ottiene bonus razziale +2 in ciascuna di esse."},{"nome":"Seme di rinascita","testo":"ogni ghoran porta in sé un unico seme, che alla propria morte può essere estratto dal corpo entro 24 ore e piantato in terra fertile. Dopo 1d4 mesi, dal seme germoglia lo stesso individuo, con i propri ricordi, il proprio livello e le proprie capacità, ma privo di ogni oggetto posseduto. Un ghoran può rinascere una sola volta nell'arco della propria esistenza: un ghoran già rigenerato non possiede più alcun seme e la sua morte è definitiva. Un ghoran privo di seme non può essere riportato in vita da alcun incantesimo di resurrezione, poiché non ha un'anima nel senso in cui la intendono gli altri popoli."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Corteccia spessa","descrizione":"La scorza di alcuni ghoran è tanto densa da respingere le lame e da resistere alle fiamme.","testo":"Il personaggio ottiene bonus +1 alla CA Naturale, cumulativo con quello del tratto razziale Corteccia. Inoltre, il malus da Vulnerabilità al fuoco scende dal 25% al 10%."},{"nome":"Fiore velenoso","descrizione":"I petali di questi ghoran secernono un nettare che seduce e poi tramortisce.","testo":"Una volta al giorno, come azione standard, il personaggio può emettere una nube di polline in un'emanazione di 4,5 m centrata su di sé. Tutte le creature nell'area che respirano devono superare un Tiro Salvezza su Tempra con CD 10 + metà livello di personaggio + bonus di Costituzione o diventare nauseate per 1 minuto."},{"nome":"Linfa rigenerante","descrizione":"La linfa di alcuni ghoran richiude le ferite mentre ancora si aprono.","testo":"Durante il Rifiatare, il personaggio può ripetere i risultati di dado pari a 1 e 2. Questi tiri possono essere ripetuti un qualsiasi numero di volte."},{"nome":"Portamento regale","descrizione":"Certi ghoran hanno una presenza tanto studiata da mettere in soggezione chiunque, che lo vogliano o no.","testo":"Il personaggio ottiene bonus razziale +2 Intimidire e +2 Raggirare. Inoltre, una volta al giorno può ottenere **vantaggio** in una prova di abilità basata su Carisma."},{"nome":"Radici profonde","descrizione":"Certi ghoran sanno affondare i piedi nel terreno e diventare, per qualche istante, un albero vero.","testo":"Come azione veloce, il personaggio può radicarsi: fino alla fine del turno successivo ottiene bonus razziale +4 alla DMC contro le manovre di Sbilanciare e Spingere e non può essere mosso contro la propria volontà da alcun effetto che non sia magico. Mentre è radicato la sua velocità è 0."},{"nome":"Rigermogliare","descrizione":"Il corpo di alcuni ghoran ricostruisce ciò che perde, dato tempo a sufficienza.","testo":"Il personaggio non subisce le penalità permanenti derivanti dalla perdita di arti e organi dovuta alle Ferite gravi: l'arto o l'organo rigermoglia nell'arco di 1 settimana, durante la quale le penalità si applicano normalmente. Questo tratto non ha effetto sulla morte."},{"nome":"Sapere delle radici","descrizione":"Le radici dei ghoran affondano nella terra e nella memoria di chi vi è sepolto.","testo":"Il personaggio ottiene bonus razziale +2 a tutte le abilità di Conoscenze e può effettuare le prove in tali abilità anche senza addestramento. Questo bonus si cumula con quello del tratto razziale Memoria del seme sulle due Conoscenze scelte."},{"nome":"Spine","descrizione":"Il fusto di questi ghoran è irto di spine acuminate che rendono spiacevole afferrarli.","testo":"Il personaggio ottiene un attacco di supporto di Spine che infligge 1d4 danni. Inoltre, ogni turno in cui viene tenuto in lotta o fallisce nel liberarsi da essa, infligge automaticamente 1d4 danni a un singolo avversario che lo sta trattenendo."}]},"tipo":"umanoide con sottotipo vegetale","taglia":"media","tipo_scheda":"Umanoide Medio (vegetale)","movimento":"9 m","sensi":["visione crepuscolare"]}],"generici":{"intro":"Si sceglie un tratto tra quelli sotto elencati al posto del tratto razziale bonus previsto dalla propria razza (o dall'opzione equivalente: poteri vampirici, retaggi oscuri, retaggi planari, retaggi bestiali, discendenze draconiche, upgrade di sistema).","voci":[{"nome":"Addestramento marziale","descrizione":"Alcuni imparano l'uso delle armi per necessità, altri perché intraprendono una carriera militare più o meno lunga.","testo":"Il personaggio ottiene la competenza con tre armi da guerra a scelta."},{"nome":"Artigiano eccelso","descrizione":"Molti artigiani sono famosi per le loro opere, ma alcuni hanno una vera e propria dote naturale per il mestiere.","testo":"Il personaggio sceglie una categoria tra metalli, legno, gioielleria, armi da fuoco e pellami e tessuti. Ottiene bonus razziale +3 Valutare relativamente a quella categoria e può riparare gli oggetti rotti che vi appartengono anche in viaggio, come se avesse sempre con sé un'officina."},{"nome":"Canaglia","descrizione":"Sono molti coloro che trascorrono l'infanzia cercando di barcamenarsi in situazioni difficili. Questi derelitti imparano mezzi poco ortodossi per sopravvivere, mezzi che devono quasi sempre usare a discapito del prossimo.","testo":"Il personaggio ottiene bonus razziale +2 Raggirare. Inoltre, ottiene bonus razziale +2 Rapidità di mano e può effettuare le prove in tale abilità anche senza addestramento."},{"nome":"Cerusico eccelso","descrizione":"Non pochi individui tendono a prendersi cura con grande dedizione della propria salute e di quella degli altri.","testo":"Tramite Professione (cerusico) il personaggio può fornire Assistenza continua anche a sé stesso (sempre massimo di 5 pazienti). Inoltre, se dispone di una borsa medica, inizia ogni giornata con 1 unità di medicinali che può essere utilizzata solamente da lui. Questa unità extra non conta nel limite di quelle trasportabili dal party e non può essere conservata per il giorno seguente."},{"nome":"Chimico eccelso","descrizione":"Certi individui imparano l'utilità di preparare e somministrare sostanze, consentendogli di porre fine o di allungare la vita altrui.","testo":"Il personaggio ottiene un talento a scelta tra Uso dei veleni e Abilità focalizzata (Professione: alchimista) (non deve soddisfarne i requisiti)."},{"nome":"Contrabbandiere","descrizione":"Nascondere le cose è un'arte, e nasconderle addosso a sé stessi è la sua forma più alta.","testo":"Il personaggio ottiene bonus razziale +2 Furtività. Inoltre, ottiene bonus razziale +4 Rapidità di mano quando si tratta di occultare oggetti sulla propria persona e considera occultabile come un'arma leggera qualsiasi arma a una mano."},{"nome":"Devoto fervente","descrizione":"Razza, luogo di origine, ceto sociale. Tutto ciò passa in secondo piano quando si parla di fede e devozione.","testo":"Il personaggio ottiene bonus razziale +2 Conoscenze (religioni) e può effettuare le prove in tale abilità anche senza addestramento. Inoltre, può invocare il favore della propria divinità due volte al giorno, anziché una."},{"nome":"Erborista eccelso","descrizione":"Molti hanno il proverbiale “pollice verde”, ma pochi hanno un amore e una conoscenza delle piante tale da essere quasi in grado di parlargli.","testo":"Il personaggio necessita sempre di 1 solo minuto per la preparazione delle misture. Inoltre, se ottiene un risultato pari o inferiore alla metà della propria percentuale di ritrovamento, rinviene 1d2 unità di erbe miste aggiuntive, anziché una."},{"nome":"Figlio della terra natia","descrizione":"Il luogo in cui si cresce lascia un segno che nessun viaggio cancella del tutto.","testo":"Il personaggio sceglie un ambiente tra boschi e foreste, montagne, paludi e giungle, deserti e malaterre, ghiacci e tundre, coste e mari, sotterraneo e città. Ottiene bonus razziale +2 Sopravvivenza in quell'ambiente e può effettuare i passi di 1,5 m all'interno dei relativi terreni difficili, eccetto quelli manipolati magicamente. Inoltre, ottiene bonus razziale +2 ai Tiri Salvezza contro i pericoli ambientali tipici di quell'ambiente."},{"nome":"Fortuna sfacciata","descrizione":"Certe persone se la cavano sempre, e nessuno riesce a spiegarsi come.","testo":"Una volta al giorno, il personaggio può ottenere **vantaggio** in una prova di abilità."},{"nome":"Musico girovago","descrizione":"Una taverna, uno strumento e una storia da raccontare: per alcuni non serve altro per farsi strada nel mondo.","testo":"Il personaggio ottiene bonus razziale +2 Intrattenere (una disciplina a scelta) e può utilizzare tale abilità al posto di Diplomazia per migliorare l'atteggiamento altrui. Inoltre, conta sempre come possedere lo strumento necessario a quella disciplina."},{"nome":"Nato in sella","descrizione":"Tutte le razze fanno grande uso degli animali: alcuni li considerano bestie utili nei lavori pesanti, altri li vedono come amici fedeli e insostituibili compagni.","testo":"Il personaggio ottiene il talento Abilità focalizzata (Cavalcare)."},{"nome":"Nobili natali","descrizione":"Coloro che sono così fortunati da crescere in un ambiente privilegiato imparano a riconoscere tanto il valore del lusso, quanto quello degli alleati più preparati.","testo":"Il personaggio ottiene bonus razziale +2 Valutare. Inoltre, ogni volta che acquisisce una guardia del corpo (vedi privilegi di classe del nobile), essa ottiene bonus +2 a una caratteristica a scelta."},{"nome":"Pilota provetto","descrizione":"Sebbene tutti possano imparare a guidare un mezzo, pochi hanno un talento innato nel farlo… e bene.","testo":"Il personaggio ottiene la competenza con la frusta e il talento Abilità focalizzata (Pilotare mezzi terrestri). Inoltre, quando si trova su un mezzo terrestre in movimento (alla guida o meno), ottiene bonus di competenza +4 alle prove di Iniziativa, +2 alla CA e +1 ai tiri per colpire e ai danni."},{"nome":"Poliglotta","descrizione":"C'è chi cambia lingua come cambia stanza, senza accorgersene.","testo":"Il personaggio ottiene tre linguaggi bonus a scelta tra quelli non segreti, indipendentemente dalla propria razza. Inoltre, può effettuare una prova di Intelligenza con CD 20 per cogliere il sen 'use strict';
const Motore = (() => {
const FORMATO = 'schermo-v1';

const clona = o => JSON.parse(JSON.stringify(o));
const nuovoId = rng => Math.floor(rng() * 36 ** 8).toString(36).padStart(8, '0');
// id interni (PG, righe dell'iniziativa): contatore della campagna, sempre univoci
const prossimoId = (c, pre) => { c.contatore = (c.contatore || 0) + 1; return pre + c.contatore; };

// ------------------------------------------------------------------ dadi
function d(n, rng) { return 1 + Math.floor(rng() * n); }
// d20 della Collana: 20 naturale = 30, 1 naturale = −10 (Vol. 1)
function valoreD20(nat) { return nat === 20 ? 30 : nat === 1 ? -10 : nat; }
// Espressioni semplici: "2d6+3", "1d20-1", "4d6kh3", "d100", "5". Restituisce {totale, dadi, testo}
function tira(espr, rng) {
  const s = String(espr).replace(/\s+/g, '').toLowerCase();
  if (!/^[+-]?(\d*d\d+(k[hl]\d+)?|\d+)([+-](\d*d\d+(k[hl]\d+)?|\d+))*$/.test(s)) throw new Error('Espressione non valida: ' + espr);
  let totale = 0; const dadi = [];
  for (const m of s.matchAll(/([+-]?)(?:(\d*)d(\d+)(?:k([hl])(\d+))?|(\d+))/g)) {
    const segno = m[1] === '-' ? -1 : 1;
    if (m[6] !== undefined) { totale += segno * +m[6]; continue; }
    const n = m[2] ? +m[2] : 1, f = +m[3];
    let r = Array.from({ length: n }, () => d(f, rng));
    let tenuti = r;
    if (m[4]) { const k = +m[5]; tenuti = [...r].sort((a, b) => m[4] === 'h' ? b - a : a - b).slice(0, k); }
    dadi.push({ facce: f, risultati: r, tenuti });
    totale += segno * tenuti.reduce((a, b) => a + b, 0);
  }
  return { totale, dadi, testo: espr };
}

// ------------------------------------------------------------------ calendario
const MESI_REALI = [['gennaio', 31], ['febbraio', 28], ['marzo', 31], ['aprile', 30], ['maggio', 31], ['giugno', 30],
  ['luglio', 31], ['agosto', 31], ['settembre', 30], ['ottobre', 31], ['novembre', 30], ['dicembre', 31]];
const SETTIMANA_REALE = ['lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato', 'domenica'];
function calendarioReale() {

}
function lunghezzaAnno(cal) { return cal.mesi.reduce((a, m) => a + m.giorni, 0); }

    if (!m.nome || !String(m.nome).trim()) err.push(`mese ${i + 1} senza nome`);
    if (!Number.isInteger(m.giorni) || m.giorni < 1 || m.giorni > 400) err.push(`mese ${m.nome || i + 1}: giorni non validi`);
    if (cal.tipo === 'personalizzato' && !['primavera', 'estate', 'autunno', 'inverno'].includes(m.stagione)) err.push(`mese ${m.nome || i + 1}: stagione mancante`);
  });

// giorno dell'anno (0-based) → {mese (0-based), giorno (1-based)}
function dataDaGiornoAnno(cal, doy) {

function giornoAnnoDaData(cal, mese, giorno) {

// scompone il tempo assoluto (round) della campagna
function scomponi(camp, R) {

  const cal = camp.calendario, Y = lunghezzaAnno(cal);

  const { mese, giorno } = dataDaGiornoAnno(cal, doy);
  const minuti = Math.floor(resto / ROUND_MIN);

const due = n => String(n).padStart(2, '0');
function formatoData(camp, R, conOra = true) {
  const t = scomponi(camp, R), cal = camp.calendario;
  const g = t.sett !== null ? cal.settimana[t.sett] + ' ' : '';
  const anno = t.anno + (camp.anno.etichetta ? ' ' + camp.anno.etichetta : '');
  return `${g}${t.giorno} ${cal.mesi[t.mese].nome} ${anno}` + (conOra ? `, ${due(t.ore)}:${due(t.min)}` : '');
}
function formatoDurata(round) {
  if (round < ROUND_MIN) return `${round} round`;
  if (round < ROUND_ORA) return `${Math.floor(round / ROUND_MIN)} min` + (round % ROUND_MIN ? ` ${round % ROUND_MIN} r` : '');
  if (round < ROUND_GIORNO) { const m = Math.floor(round / ROUND_MIN); return `${Math.floor(m / 60)} h` + (m % 60 ? ` ${m % 60} min` : ''); }
  const g = Math.floor(round / ROUND_GIORNO), h = Math.floor((round % ROUND_GIORNO) / ROUND_ORA);

// ------------------------------------------------------------------ stagioni e meteo
function cadeIn(g, m, da, a) { // date [giorno, mese]; l'intervallo può scavalcare l'anno
  const v = m * 100 + g, vda = da[1] * 100 + da[0], va = a[1] * 100 + a[0];
  return vda <= va ? v >= vda && v <= va : v >= vda || v <= va;
}
function stagione(camp, meteo, R, zona) {

function tiraMeteo(camp, meteo, rng, tiro) {

  log(c, `Meteo: ${e.testo} (d% ${tiro}, ${nomeZona(meteo, c.zona)}, ${nomeStagione(meteo, c.zona, staz)})`);

    else if (!s.solo_ferita && ![0, 1].includes(s.ferita - s.fatica)) add('errore', `divisione dei PF ${s.fatica}/${s.ferita}: metà e metà, il dispari ai Ferita (${Math.floor(s.pf / 2)}/${Math.ceil(s.pf / 2)})`);
  }

// ---------- «Copia come testo»: lo stat block nell'ordine del §10
function testoStatBlock(s, opz = {}) {

  const xv = XP_GS[String(s.gs).trim()] || s.xp; // anche per gli alleati, come nei documenti: «XP 2.400 (alleato: non si assegna)»

  if (s.note_testata && /\n/.test(s.note_testata)) L.push(...s.note_testata.split('\n'));

  if (s.aura) L.push('Aura: ' + s.aura);

  extra('testa');

  if (s.ca_scomp) L.push(s.ca_scomp);

  const vel = [s.velocita ? `Velocità ${s.velocita}` : '', s.bab ? `BaB ${s.bab}` : '', s.bmc ? `BMC ${s.bmc}` : '', s.dmc ? `DMC ${s.dmc}` : ''].filter(Boolean).join(' | ');

  if (s.talenti) L.push('Talenti: ' + s.talenti);

// ---------- elenchi di schede (bestiario condiviso e PNG della campagna)
function nuovaScheda(dati, rng, ora, pref) { const s = { ...schedaVuota(dati && dati.tipo_scheda), ...clona(dati || {}) }; s.id = (pref || 's') + (ora || 0).toString(36) + nuovoId(rng); s.creata = s.modificata = ora || 0; return s; }
function salvaScheda(lista, s, ora) {

  const x = clona(s); x.modificata = ora || 0; const out = lista.filter(y => y.id !== x.id); const i = lista.findIndex(y => y.id === x.id);
  if (i < 0) out.push(x); else out.splice(i, 0, x); return out;
}
function cercaSchede(lista, f = {}) {
  const q = String(f.testo || '').trim().toLowerCase(), tipo = String(f.tipo || '').trim().toLowerCase(), et = String(f.etichetta || '').trim().toLowerCase();
  const gsv = s => { const g = String(s.gs || ''); return /\//.test(g) ? 1 / +g.split('/')[1] : g === '' ? null : +g; };
  return lista.filter(s => (!q || [s.nome, s.epiteto, s.classi_testo].join(' ').toLowerCase().includes(q))
    && (!tipo || [s.razza_riga, s.epiteto, s.classi_testo].join(' ').toLowerCase().includes(tipo))
    && (!et || (s.etichette || []).some(e => e.toLowerCase().includes(et)))
    && (!f.preferiti || s.preferito)
    && (f.gs_min === undefined || f.gs_min === null || f.gs_min === '' || (gsv(s) !== null && gsv(s) >= +f.gs_min))
    && (f.gs_max === undefined || f.gs_max === null || f.gs_max === '' || (gsv(s) !== null && gsv(s) <= +f.gs_max)))
    .sort((a, b) => (b.preferito ? 1 : 0) - (a.preferito ? 1 : 0) || a.nome.localeCompare(b.nome, 'it'));
}
function salvaPNG(camp, s, ora) { const c = clona(camp); c.png = salvaScheda(c.png || [], s, ora); return c; }
function eliminaPNG(camp, id) { const c = clona(camp); c.png = (c.png || []).filter(s => s.id !== id); return c; }

function unisciMostri(lista, nuovi, rng, ora, soloMancanti) {
  const out = clona(lista); let aggiunti = 0, copie = 0;
  for (const m of nuovi || []) {
    const es = out.find(x => x.id === m.id);
    if (!es) { out.push(clona(m)); aggiunti++; continue; }
    if (soloMancanti) continue;
    const a = { ...es, modificata: 0 }, b = { ...m, modificata: 0 };
    if (JSON.stringify(a) === JSON.stringify(b)) continue;
    out.push(nuovaScheda({ ...m, nome: m.nome + ' (importato)' }, rng, ora, 'm')); copie++;

// ---------- incontri (N)
function incontroVuoto() { return { id: '', titolo: '', atto: '', capitolo: '', luogo: '', stato: 'da giocare', giocato_R: null, note: '', tesoro: '', partecipanti: [], promemoria: [] }; }
function salvaIncontro(camp, inc, rng) {
  if (!String(inc.titolo || '').trim()) throw new Error('l\'incontro non ha un titolo');
  const c = clona(camp), x = { ...incontroVuoto(), ...clona(inc) };

  return c;
}

  const x = { ...clona(o), id: prossimoId(c, 'i'), titolo: o.titolo + ' (copia)', stato: 'da giocare', giocato_R: null };
  c.incontri.splice(c.incontri.indexOf(o) + 1, 0, x); return { camp: c, id: x.id };
}
function eliminaIncontro(camp, id) { const c = clona(camp); c.incontri = c.incontri.filter(x => x.id !== id); return c; }
const ordineNat = (a, b) => String(a).localeCompare(String(b), 'it', { numeric: true, sensitivity: 'base' });
function cartelle(camp) {
  const atti = [];

    const an = inc.atto || '(senza atto)', cn = inc.capitolo || '';
    let a = atti.find(x => x.atto === an); if (!a) atti.push(a = { atto: an, capitoli: [] });
    let k = a.capitoli.find(x => x.capitolo === cn); if (!k) a.capitoli.push(k = { capitolo: cn, incontri: [] });

  const fmx = v.fatica_max, femx = v.ferita_max;
  const temp = st.temp.length ? st.temp.map(t => `${t.fonte} ${t.valore}${t.scade !== null ? ' (fino a ' + M.formatoData(S.camp, t.scade) + ')' : ''}`).join('; ') : '';
  const chips = [...v.malus.map(m => `<span class="chip ${m.condizione ? 'cond' : 'sv'}">${esc(m.nome)}</span>`), ...st.malus.map(m => chipMalus({ pg: p.id }, m))];
  const note = v.note.filter(x => x.length < 90);
  return `<article class="pg${attivo ? ' attivo' : ''}" data-pg="${p.id}">
    <div class="pg-testa"><span class="pg-nome">${esc(s.nome)}</span><span class="pg-classe">${esc([s.classe || `Livello ${s.livello}`, s.razza].filter(Boolean).join(' · '))}</span>
      <span class="spazio"></span><span class="num piccolo">Init ${n(v.iniziativa)}</span>
      <button class="eroe${st.eroe ? '' : ' no'}" data-az="eroe" data-id="${p.id}" title="Punto eroe (clic per dare o togliere)">Eroe ${st.eroe ? '●' : '○'}</button></div>
    <div class="barre num">
      <span>Fatica</span><div class="barra fa"><i style="width:${pct(st.fatica, fmx.valore)}%"></i></div><span>${st.fatica}/${n(fmx, true)}</span>
      <span>Ferita</span><div class="barra fe${st.ferita < 0 ? ' neg' : ''}"><i style="width:${pct(st.ferita, femx.valore)}%"></i></div><span><span class="${st.ferita < 0 ? 'mod' : ''}">${st.ferita}</span>/${n(femx, true)}</span></div>
    <div class="stat num"><span title="${esc(temp)}"><b>Temp</b>${v.temp}</span><span><b>Non letali</b>${st.nonletali}</span><span><b>Rifiatare</b>${st.rif_riserva}/${s.rif_dadi} d${s.rif_tipo}${s.rif_ripete ? '↻' : ''}</span></div>
    <div class="stat num"><span><b>CA</b>${n(v.ca, true)}</span><span><b>Ctt</b>${n(v.ca_contatto, true)}</span><span><b>Spr</b>${n(v.ca_sprovvista, true)}</span><span><b>DMC</b>${n(v.dmc, true)}</span>${s.rd ? `<span><b>RD</b>${esc(s.rd)}</span>` : ''}${v.offuscato ? `<span class="cond-t">Offuscato ${v.offuscato}%</span>` : ''}</div>
    <div class="stat num"><span><b>Tem</b>${n(v.tempra)}</span><span><b>Rif</b>${n(v.riflessi)}</span><span><b>Vol</b>${n(v.volonta)}</span>${s.ts_note ? `<span class="tenue">${esc(s.ts_note)}</span>` : ''}</div>
    <div class="stat num"><span><b>Perc</b>${n(v.percezione)}</span><span><b>Intu</b>${n(v.intuizione)}</span><span><b>Furt</b>${n(v.furtivita)}</span>${v.libere.map(a => `<span><b>${esc(a.nome)}</b>${n(a)}</span>`).join('')}</div>
    ${st.morte && S.camp.coda.some(q => q.tipo === 'morte' && q.chi && q.chi.pg === p.id) ? `<div class="banda">Morte in sospeso: ${esc(st.morte.causa)}</div>` : ''}
    ${chips.length ? `<div class="chips">${chips.join('')}</div>` : ''}${note.length ? `<div class="note-pg">${note.map(x => `<span>${esc(x)}</span>`).join('')}</div>` : ''}
    <div class="fila"><button class="btn min" data-az="danno" data-id="${p.id}">Danno</button><button class="btn min" data-az="cura" data-id="${p.id}">Cura</button>
      <button class="btn min" data-az="temp" data-id="${p.id}">PF temp</button><button class="btn min" data-az="rifiata" data-id="${p.id}">Rifiata</button>
      <button class="btn min oro" data-az="malus" data-chi="pg:${p.id}">Malus/Bonus</button><button class="btn min" data-az="feritaGrave" data-id="${p.id}">Ferita grave</button>
      <span class="spazio"></span><button class="btn min" data-az="modificaPG" data-id="${p.id}" title="Scheda">Scheda</button></div></article>`;
}

// ---------- seconda colonna: iniziativa
function disegnaIniziativa() {
  const c = S.camp, cb = c.combattimento;
  if (!cb) return `<div class="col-testa"><h2>Iniziativa</h2></div>${disegnaAvvio()}`;
  const a = M.attuale(cb);
  const pros = cb.ordine.slice(cb.turno + 1).map(id => cb.righe[id]).filter(r => r.stato !== 'fuori').slice(0, 2).map(M.etichetta);
  const timer = cb.timer ? `<span class="timer" id="timer"></span>` : '';
  const righe = cb.ordine.map((id, i) => {
    const r = cb.righe[id];
    const badge = [r.rif ? `<span class="chip" title="Con la scheda: tocca la riga per lo stat block">📜</span>` : '', pfRiga(r), r.faticaFinita ? '<span class="chip ver">Fatica finita</span>' : '',
      r.prepara ? `<span class="chip">Prepara: ${esc(r.prepara.azione)}</span>` : '', r.nascosta ? '<span class="chip">Nascosta</span>' : '', r.nat === 20 ? '<span class="chip ok">20</span>' : r.nat === 1 ? '<span class="chip sv">1</span>' : '', r.stato === 'fuori' ? '<span class="chip">Fuori</span>' : '', ...(r.tipo !== 'pg' ? (r.malus || []).map(m => chipMalus({ riga: r.id }, m)) : [])].join('');
    return `<li class="tipo-${r.tipo}${i === cb.turno ? ' ora' : ''}${S.ui.sel === id ? ' sel' : ''}${r.stato === 'fuori' ? ' fuori' : ''}" data-az="selRiga" data-id="${id}" tabindex="0">
      <span class="tot">${r.totale}</span><span class="nome">${esc(M.etichetta(r))}${r.nomeTv ? ` <span class="tenue piccolo">(TV: ${esc(r.nomeTv)})</span>` : ''}</span><span class="chips">${badge}</span></li>`;
  }).join('');
  const attesa = cb.attesa.map(id => `<div class="fila"><span class="spazio">${esc(M.etichetta(cb.righe[id]))} <span class="tenue piccolo">in attesa</span></span>
      <button class="btn min oro" data-az="entraOra" data-id="${id}">Entra ora</button></div>`).join('');
  return `<div class="col-testa"><h2>Iniziativa</h2><span class="num tenue">Round ${cb.round}</span><span class="spazio"></span>${timer}</div>
    <div class="barra-turno"><span class="tenue piccolo">Tocca a</span><span class="chi">${a ? esc(M.etichetta(a)) : '—'}</span>
      ${a && a.prepara ? `<span class="piccolo">Azione preparata: ${esc(a.prepara.azione)}${a.prepara.innesco ? ' — se ' + esc(a.prepara.innesco) : ''}</span>` : ''}
      ${a ? barraMalus(a) : ''}${a ? barraTattiche(a) : ''}
      <span class="tenue piccolo">Poi: ${esc(pros.join(', ') || '—')}</span></div>
    <div class="comandi"><button class="btn grande prim" data-az="cmd" data-c="avanti">Avanti ▸</button>
      <button class="btn" data-az="indietro" ${cb.storia.length ? '' : 'disabled'}>◂ Indietro</button>
      <button class="btn" data-az="cmd" data-c="ritardare">Ritardare</button>
      ${cb.timer ? `<button class="btn" data-az="cmd" data-c="pausa">${cb.timer.pausa !== null ? 'Riprendi' : 'Pausa'}</button>` : ''}</div>
    <ol class="ordine">${righe}</ol>
    ${attesa ? `<div class="pannello"><h3>In attesa</h3>${attesa}</div>` : ''}
    ${S.ui.sel && cb.righe[S.ui.sel] ? disegnaAzioniRiga(cb.righe[S.ui.sel]) : '<p class="tenue piccolo">Tocca una riga per le sue azioni (Preparare, Punto eroe, Separa, Fuori combattimento, Nascondi, Correggi) e, se ha una scheda, per lo stat block di lato.</p>'}
    <div class="comandi"><button class="btn" data-az="rinforzi">+ Rinforzi</button><span class="spazio"></span><button class="btn peric" data-az="fineComb">Fine combattimento</button></div>`;
}
function disegnaAzioniRiga(r) {
  const cb = S.camp.combattimento, inOrdine = cb.ordine.includes(r.id);
  const pg = r.tipo === 'pg' ? S.camp.pg.find(p => p.id === r.pgId) : null;
  return `<div class="azioni-riga"><div class="fila"><h3>${esc(M.etichetta(r))}</h3><span class="tenue piccolo num">iniziativa ${r.totale} (bonus ${segno(r.bonus)}${r.nat ? ', d20 ' + r.nat : ''})</span></div>
    <div class="fila" style="margin-top:6px">
      ${r.prepara ? `<button class="btn min oro" data-az="cmd" data-c="scatta" data-id="${r.id}">Scatta</button>` : `<button class="btn min" data-az="preparare" data-id="${r.id}">Preparare</button>`}
      ${pg ? `<button class="btn min oro" data-az="cmd" data-c="puntoEroe" data-id="${r.id}" ${pg.stato.eroe ? '' : 'disabled'}>Punto eroe</button>` : ''}
      ${r.n > 1 ? `<button class="btn min" data-az="separa" data-id="${r.id}">Separa</button>` : ''}
      ${inOrdine ? `<button class="btn min" data-az="cmd" data-c="fuori" data-id="${r.id}" data-ritorna="${r.stato === 'fuori' ? 1 : ''}">${r.stato === 'fuori' ? 'Rientra' : 'Fuori combattimento'}</button>` : ''}
      <button class="btn min" data-az="cmd" data-c="nascondi" data-id="${r.id}" data-nascosta="${r.nascosta ? '' : 1}">${r.nascosta ? 'Rivela' : 'Nascondi'}</button>
      <button class="btn min oro" data-az="malus" data-chi="${r.tipo === 'pg' ? 'pg:' + r.pgId : 'riga:' + r.id}">Malus/Bonus</button>
      <button class="btn min" data-az="correggi" data-id="${r.id}">Correggi</button>
      <button class="btn min peric" data-az="togli" data-id="${r.id}">Togli</button></div>
    ${r.tipo !== 'pg' ? `<div class="fila" style="margin-top:6px">${r.rif ? `<button class="btn min" data-az="statBlockRiga" data-id="${r.id}">Stat block</button>` : ''}
      ${r.pf ? `<button class="btn min" data-az="dannoRiga" data-id="${r.id}">Danno</button><button class="btn min" data-az="curaRiga" data-id="${r.id}">Cura</button>`
        : r.rif ? `<button class="btn min${r.faticaFinita ? ' oro' : ''}" data-az="cmd" data-c="faticaFinita" data-id="${r.id}">${r.faticaFinita ? 'Fatica finita ✓' : 'Fatica finita'}</button>` : ''}
      <button class="btn min" data-az="feritaRiga" data-id="${r.id}">Ferita grave</button></div>` : ''}</div>`;
}
function nuovoAvvio() {
  const av = { usaD20: false, pg: {}, nemici: [{ nome: '', bonus: 0, n: 1, modo: 'tipo', imp: false, nascosto: false, nomeTv: '' }] };
  for (const p of S.camp.pg) av.pg[p.id] = { incluso: true, valore: '', imp: false };
  return av;
}
function disegnaAvvio() {
  const c = S.camp;
  if (!S.ui.avvio || S.ui.avvio.campagna !== c.id) { S.ui.avvio = nuovoAvvio(); S.ui.avvio.campagna = c.id; }
  const av = S.ui.avvio;
  for (const p of c.pg) if (!av.pg[p.id]) av.pg[p.id] = { incluso: true, valore: '', imp: false };
  const pg = c.pg.map(p => { const x = av.pg[p.id]; return `<div class="pgini">
      <label class="spunta"><input type="checkbox" data-bind="pg.${p.id}.incluso" ${x.incluso ? 'checked' : ''}> ${esc(p.scheda.nome)} <span class="tenue piccolo num">${segno(p.scheda.iniziativa)}</span></label>
      <input type="number" inputmode="numeric" data-bind="pg.${p.id}.valore" value="${esc(x.valore)}" placeholder="${av.usaD20 ? 'd20' : 'totale'}" aria-label="${av.usaD20 ? 'd20' : 'Totale'} di ${esc(p.scheda.nome)}">
      <label class="spunta piccolo" title="Impreparato: −${p.scheda.imp_pen}"><input type="checkbox" data-bind="pg.${p.id}.imp" ${x.imp ? 'checked' : ''}> impr.</label></div>`; }).join('');
  const nem = av.nemici.map((x, i) => `<div class="nemico">
      <input type="text" data-bind="nemici.${i}.nome" value="${esc(x.nome)}" placeholder="Nome (es. Lupo)" aria-label="Nome"${x.rif ? ` title="Con la scheda: ${esc((schedaDi(x.rif) || { nome: 'non trovata' }).nome)}" style="border-color:var(--oro-scuro)"` : ''}>
      <input type="number" data-bind="nemici.${i}.bonus" value="${esc(x.bonus)}" aria-label="Bonus di iniziativa" title="Bonus di iniziativa">
      <input type="number" min="1" data-bind="nemici.${i}.n" value="${esc(x.n)}" aria-label="Quantità" title="Quantità">
      <select data-bind="nemici.${i}.modo" aria-label="Tiro"><option value="tipo" ${x.modo === 'tipo' ? 'selected' : ''}>per tipo</option><option value="singolo" ${x.modo === 'singolo' ? 'selected' : ''}>per singolo</option></select>
      <div class="fila"><label class="spunta piccolo"><input type="checkbox" data-bind="nemici.${i}.imp" ${x.imp ? 'checked' : ''}> impr.</label>
        <label class="spunta piccolo"><input type="checkbox" data-bind="nemici.${i}.nascosto" ${x.nascosto ? 'checked' : ''}> nascosto</label>
        <button class="btn min" data-az="togliNemico" data-i="${i}" aria-label="Togli">✕</button></div></div>`).join('');
  const inc = av.incontro && c.incontri.find(x => x.id === av.incontro);
  return `<div class="pannello" id="avvio"><h3>Avvio del combattimento</h3>
      ${inc ? `<div class="fila"><span class="chip ok">Incontro: ${esc(inc.titolo)}</span>${(av.promemoria || []).length ? `<span class="tenue piccolo">${av.promemoria.length} promemoria per round</span>` : ''}<button class="btn min" data-az="staccaIncontro" title="Avvia senza l'incontro">✕</button></div>` : ''}
      <label class="spunta piccolo"><input type="checkbox" data-az-cambio="usaD20" ${av.usaD20 ? 'checked' : ''}> Inserisco il d20 dei PG (l'app aggiunge il bonus; 20 = 30, 1 = −10)</label>
      ${pg || '<span class="tenue piccolo">Nessun PG nella campagna.</span>'}
      <h3>Nemici</h3><div class="tab-nemici">${nem}</div>
      <div class="fila"><button class="btn min" data-az="aggNemico">+ Nemico</button>
        ${c.png.length || Best.mostri.length ? `<select data-az-cambio="aggScheda" aria-label="Aggiungi dal bestiario" style="width:auto;max-width:100%"><option value="">+ dal bestiario…</option>${opzSchede('').replace('<option value="">— senza scheda —</option>', '')}</select>` : ''}
        <span class="spazio"></span><span class="tenue piccolo">Per tipo: una riga «Lupo ×5»; per singolo: Lupo 1, 2…</span></div>
      <div class="fila"><button class="btn prim grande" data-az="avvia">Tira e avvia</button></div></div>`;
}

// ---------- terza colonna: viaggio e log
function disegnaTerza() {
  let sch = S.ui.scheda; if (sch === 'vista' && !S.ui.vista) sch = S.ui.scheda = 'bestiario';
  const tab = (k, t) => `<button role="tab" class="${sch === k ? 'on' : ''}" data-az="scheda" data-s="${k}">${t}</button>`;
  return `<div class="schede" role="tablist">${tab('viaggio', 'Viaggio')}${tab('bestiario', 'Bestiario')}${tab('incontri', 'Incontri')}${tab('log', 'Log')}${S.ui.vista ? tab('vista', 'Scheda') : ''}</div>
    ${sch === 'log' ? disegnaLog() : sch === 'bestiario' ? disegnaBestiario() : sch === 'incontri' ? disegnaIncontri() : sch === 'vista' ? disegnaVista() : disegnaViaggio()}`;
}
function disegnaViaggio() {
  const c = S.camp, m = M.meteoCorrente(c, MET), sc = c.scorte, k = M.consumoGiornaliero(c);
  const staz = M.stagione(c, MET, c.tempo.R);
  const opz = m && m.opzioni.length > 1 ? `<div class="fila">${m.opzioni.map((o, i) => `<button class="btn min ${i === m.scelta ? 'oro' : ''}" data-az="opzMeteo" data-i="${i}">${esc(o.join(' + '))}</button>`).join('')}</div>` : '';
  const bast = chi => { const b = M.bastanoPer(c, chi); return b === Infinity ? '—' : `bastano per ${b} ${b === 1 ? 'giorno' : 'giorni'}`; };
  const stato = (nome, x) => x && x.penalita ? `<span class="chip sv">${nome} ${x.penalita}</span>${x.giorni_senza ? ` <span class="tenue piccolo">${x.giorni_senza} ${x.giorni_senza === 1 ? 'giorno' : 'giorni'} senza</span>` : ''}` : '';
  const perPG = c.pg.map(p => { const x = stato('Sete', p.stato.sete) + ' ' + stato('Fame', p.stato.fame); return x.trim() ? `<div class="fila"><span class="piccolo">${esc(p.scheda.nome)}</span> ${x}</div>` : ''; }).join('');
  const z = M.razionamentoAperto(c);
  return `<div class="pannello"><div class="fila"><h3>Meteo</h3><span class="tenue piccolo">${esc(M.nomeStagione(MET, c.zona, staz))}${m && m.tiro ? ` · d% ${m.tiro}` : m && m.manuale ? ' · a mano' : ''}</span></div>
      ${m ? `<div class="risultato" style="font-size:1.15rem">${esc(m.testo)}</div>${opz}${m.effetti.map(e => `<div class="effetto"><b>${esc(e.nome)}</b> ${coloraCondizioni(esc(e.testo))}</div>`).join('')}` : '<span class="tenue">Nessun meteo.</span>'}
      <div class="fila"><label class="campo" style="flex:1"><span>Zona climatica</span><select id="zona" data-az-cambio="zona">${MET.zone.map(z => `<option value="${z.id}" ${z.id === c.zona ? 'selected' : ''}>${z.nome}</option>`).join('')}</select></label>
        <button class="btn" data-az="ritira">Ritira</button><button class="btn" data-az="impostaMeteo">Imposta</button></div></div>
    <div class="pannello"><div class="fila"><h3>Scorte</h3><span class="tenue piccolo">consumo ${k} al giorno (${c.pg.length} PG + ${sc.accompagnatori} accompagnatori)</span></div>
      ${['cibo', 'acqua'].map(chi => `<div class="scorta"><span class="q">${sc[chi]}</span><span>${chi === 'cibo' ? 'Cibo' : 'Acqua'} <span class="tenue piccolo">razioni · ${bast(chi)}</span></span>
        <span class="fila"><button class="btn min" data-az="scorta" data-chi="${chi}" data-d="-1">−1</button><button class="btn min" data-az="scorta" data-chi="${chi}" data-d="1">+1</button><button class="btn min" data-az="scortaN" data-chi="${chi}">±…</button></span></div>`).join('')}
      ${z ? `<div class="fila"><span class="chip sv">${z.scorta === 'acqua' ? 'Acqua' : 'Cibo'} da razionare</span><button class="btn min prim" data-az="razionamento" data-id="${z.id}">Scegli chi</button></div>` : ''}${perPG}
      <div class="fila"><span class="spazio piccolo tenue">Accompagnatori</span><button class="btn min" data-az="accomp" data-d="-1">−</button><span class="num">${sc.accompagnatori}</span><button class="btn min" data-az="accomp" data-d="1">+</button></div></div>`;
}
function coloraCondizioni(html) {
  return html.replace(/\b(affaticat[oaie]|esaust[oaie]|prive? di sensi|privo di sensi|prona|prono)\b/gi, m => `<span class="cond-t">${m}</span>`);
}
function disegnaLog() {
  const c = S.camp, v = c.log.slice(-300).reverse();
  return `<div class="pannello"><div class="fila"><h3>Log della sessione</h3><span class="spazio"></span><button class="btn min" data-az="esportaLog">Esporta .txt</button></div>
    <ul class="log">${v.map(e => `<li><span class="q">${esc(M.formatoData(c, e.R).replace(/^\S+ /, ''))}</span><span>${esc(e.testo)}</span></li>`).join('')}</ul></div>`;
}
function aggiornaTimer() {
  const el = $('#timer'), cb = S.camp && S.camp.combattimento; if (!el || !cb || !cb.timer) return;
  const L = M.timerLetture(cb, Date.now()), soglia = S.camp.impostazioni.soglia_timer;
  el.textContent = `turno ${M.mmss(L.turno)} · totale ${M.mmss(L.combattimento)}${L.inPausa ? ' · in pausa' : ''}`;
  el.classList.toggle('allarme', soglia > 0 && L.turno > soglia * 1000);
}
setInterval(aggiornaTimer, 1000);

// ================================================================= azioni
const AZ = {
  async apri(el) { const c = await Archivio.leggi(el.dataset.id); if (!c) return avviso('Campagna non trovata', true); S.camp = M.migra(c); S.schermata = 'campagna'; S.ui.sel = null; S.ui.avvio = null; disegna(); },
  async campagne() { salvaOra(); S.camp = null; S.schermata = 'campagne'; await ricaricaElenco(); },
  temaElenco() { scriviPref('tema', leggiPref('tema') === 'chiaro' ? 'scuro' : 'chiaro'); disegna(); },
  crea() { procedura(); },
  async duplica(el) { const c = await Archivio.leggi(el.dataset.id); await Archivio.scrivi(M.duplicaCampagna(c, rng, Date.now())); await ricaricaElenco(); avviso('Campagna duplicata'); },
  elimina(el) {
    const e = S.elenco.find(x => x.id === el.dataset.id);
    conferma('Elimina campagna', `Eliminare <b>${esc(e.nome)}</b>? PG, calendario, scorte e log andranno persi. Se vuoi tenerla, prima usa Esporta.`, () => { Archivio.elimina(e.id).then(ricaricaElenco); avviso('Campagna eliminata'); }, 'Elimina', 'peric');
  },
  async esportaCamp(el) { const c = await Archivio.leggi(el.dataset.id); finestraEsporta(`${c.nome}.json`, M.esporta(c, 'campagna', M.mostriUsati(M.migra(c), Best.mostri))); },
  async esportaTutto() { const tutte = await Promise.all(S.elenco.map(e => Archivio.leggi(e.id))); finestraEsporta('schermo-tutte-le-campagne.json', M.esporta({ campagne: tutte, bestiario: docBest() }, 'tutto')); },
  importa() { finestraImporta(); },
  async esempio() { await Archivio.scrivi(campagnaEsempio()); await ricaricaElenco(); avviso('Campagna d\'esempio caricata (con un PNG, un mostro condiviso e un incontro)'); },
  // tempo

  const st = { blocchi: [] };
  const anteprima = el => {
    el.querySelector('#inc-ant').innerHTML = st.blocchi.length ? `<p class="piccolo"><b>${st.blocchi.length}</b> ${st.blocchi.length === 1 ? 'stat block trovato' : 'stat block trovati'}.</p>${st.blocchi.map((b, i) => { const s = b.scheda, sg = M.segnalazioni(s, DIV);
      return `<div class="voce-inc"><label class="spunta"><input type="checkbox" name="k${i}" checked> <b>${esc(s.nome)}</b></label>
        <span class="tenue piccolo">${esc([s.tipo_scheda === 'png' ? 'PNG' : 'mostro', s.classi_testo || s.epiteto, s.gs !== '' ? 'GS ' + s.gs : '', s.n_suggerito > 1 ? '×' + s.n_suggerito : '', s.ca !== null ? 'CA ' + s.ca : '', s.pf !== null ? `PF ${s.pf} (${s.fatica}/${s.ferita})` : '', s.iniziativa !== null ? 'Iniz. ' + segno(s.iniziativa) : ''].filter(Boolean).join(' · '))}</span>
        <select name="d${i}" aria-label="Dove"><option value="png" ${s.tipo_scheda === 'png' ? 'selected' : ''}>PNG della campagna</option><option value="mostro" ${s.tipo_scheda !== 'png' ? 'selected' : ''}>Mostri condivisi</option></select>
        ${b.avvisi.length ? `<div class="piccolo tenue">${esc(b.avvisi.join(' · '))}</div>` : ''}${sg.length ? `<div class="piccolo">${badgeSegn(s)} ${esc(sg.slice(0, 3).map(x => x.testo).join(' · '))}${sg.length > 3 ? ' …' : ''}</div>` : ''}</div>`; }).join('')}`
      : '<p class="tenue piccolo">Nessuno stat block: la riga del titolo deve essere come «NOME — Classe N · GS N · XP N» (o «NOME · GS N · XP N»).</p>';
  };
  const el = apri({ titolo: 'Incolla stat block', larga: true, corpo: `<p class="tenue piccolo">Incolla uno o più stat block copiati da un documento d'avventura (anche un'intera sezione): l'app trova i blocchi «NOME — … · GS N» e li legge campo per campo. Ciò che non riconosce resta come testo nella scheda.</p>
      <textarea name="t" rows="10" placeholder="MERKH — Pistolero 7 · GS 6 · XP 2.400&#10;Razza: …&#10;Iniziativa +7 | Sensi: … | Percezione +13&#10;── DIFESA ──&#10;…"></textarea><div id="inc-ant"></div>`,
    azioni: [{ testo: 'Annulla' }, { testo: 'Leggi', fn: f => { st.blocchi = M.leggiStatBlock(testo(f, 't')); anteprima(f); return false; } },
      { testo: 'Importa', classe: 'prim', fn: f => {
        if (!st.blocchi.length) { st.blocchi = M.leggiStatBlock(testo(f, 't')); anteprima(f); if (!st.blocchi.length) throw new Error('Nessuno stat block da importare'); return false; }
        const ora = Date.now(); let c = S.camp, mostri = Best.mostri, n = 0, ultimo = null;
        st.blocchi.forEach((b, i) => { if (!spunta(f, 'k' + i)) return; const dove = val(f, 'd' + i).value, s = M.nuovaScheda(b.scheda, rng, ora, dove === 'mostro' ? 'm' : 'p');
          if (dove === 'mostro') mostri = M.salvaScheda(mostri, s, ora); else c = M.salvaPNG(c, s, ora); n++; ultimo = { fonte: dove, id: s.id }; });
        if (!n) throw new Error('Nessuno stat block scelto');
        Best.mostri = mostri; salvaBestiario(); S.ui.scheda = 'bestiario'; S.ui.best.fonte = c.png.length > S.camp.png.length ? 'png' : 'mostro'; if (n === 1) { S.ui.vista = { rif: ultimo }; S.ui.scheda = 'vista'; }
        applica(c); avviso(`Importate ${n} schede`);
      } }] });
  el.addEventListener('input', ev => { if (ev.target.name === 't') { st.blocchi = []; el.querySelector('#inc-ant').innerHTML = ''; } });
