ccultamento dovuto alla luce fioca."},{"nome":"Corpo scaglioso","testo":"ottengono bonus +1 alla CA Naturale."},{"nome":"Sangue freddo","testo":"ottengono bonus razziale +2 ai Tiri Salvezza contro effetti di \\[INFLUENZA MENTALE: CHARME, COMPULSIONE, FINZIONE, TRAMA E MORALE\\]."},{"nome":"Resistenza al veleno","testo":"ottengono bonus razziale +2 ai Tiri Salvezza contro effetti di \\[VELENO\\]."},{"nome":"Inquietanti","testo":"ottengono bonus razziale +2 Intimidire (umanoidi)."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Assimilazione ritardata","descrizione":"Lo stomaco a digestione lenta di alcuni nagaji consente di ritardare gli effetti dell'ingerimento di sostanze varie.","testo":"Il personaggio può assumere una singola pozione e ritardarne gli effetti per un numero di ore pari al bonus di Costituzione (massimo una alla volta). Durante quel lasso di tempo, come azione veloce il personaggio può attivare la pozione beneficiandone degli effetti. La pozione è considerata sprecata se non viene attivata."},{"nome":"Benedizione dei naga","descrizione":"Alcuni nagaji sono destinati a guidare i propri alleati tramite la fede e i propri incantesimi.","testo":"Due volte al giorno, quando il personaggio influenza due o più alleati con un incantesimo, la durata di questo è aumentata del 50%. Questo aumento non è cumulabile con quello concesso da altre fonti."},{"nome":"Impercettibile","descrizione":"Alcuni nagaji sono particolarmente abili nello spostarsi senza fare rumore.","testo":"Il personaggio non subisce la penalità di −5 alle prove di Furtività mentre si muove silenziosamente a velocità normale."},{"nome":"Marchio dei naga","descrizione":"In rarissimi casi, un nagaji nasce con un segno sul corpo, formato da scaglie colorate in modo diverso, segno evidente del legame diretto con i naga e della propria superiorità.","testo":"Una volta al giorno, quando il personaggio ottiene un 1 naturale in un Tiro Salvezza o prova di abilità, può ripetere tale tiro."},{"nome":"Rapidità del serpente","descrizione":"I nagaji sono rapidi e capaci di ghermire gli incauti che gli passano troppo vicino.","testo":"Il personaggio ottiene il talento Riflessi in combattimento."},{"nome":"Saliva tossica","descrizione":"Molti nagaji possiedono una saliva che è in realtà un potente veleno narcotizzante, che può essere utilizzato tanto mordendo le vittime quanto cospargendolo sulle armi leccandole.","testo":"Due volte al giorno, come azione veloce il personaggio può avvelenare per 1 minuto un'arma oppure l'attacco di supporto di Morso. La prima creatura ferita dall'attacco velenoso deve superare un Tiro Salvezza su Tempra con CD 10 + metà livello di personaggio + bonus di Costituzione o diventare inferma per 1 minuto."},{"nome":"Sguardo ipnotico (Mag)","descrizione":"Lo sguardo di alcuni nagaji è così intenso da paralizzare gli altri.","testo":"Due volte al giorno, il personaggio può lanciare l'incantesimo Ipnosi (durata 1d3+1 round) con CD 10 + metà livello di personaggio + bonus di caratteristica mentale più alto."},{"nome":"Sinuoso","descrizione":"Certi nagaji sono particolarmente viscidi e sfuggevoli.","testo":"Una volta al giorno, il personaggio può ottenere **vantaggio** con +2 in una prova di Artista della fuga."}]},"tipo":"umanoide con sottotipo rettile","taglia":"media","tipo_scheda":"Umanoide Medio (rettile)","movimento":"9 m","sensi":["visione crepuscolare"]},{"nome":"Vishkanya","descrizione":"I vishkanya sembrano umani finché non li si guarda bene: allora si notano le pupille verticali, la pelle che al tatto è squamosa in modo impercettibile, i capelli che si muovono un istante dopo il resto del corpo. Sono un popolo antico e riservato, che vive in comunità chiuse nelle giungle e nelle città portuali, e che ha fatto del proprio corpo un'arma: il loro sangue, la loro saliva e il loro sudore sono veleno, e imparano da bambini a non ferirsi per sbaglio e a non baciare nessuno per distrazione. Questa condizione li ha resi impareggiabili avvelenatori, spie e assassini, e altrettanto impareggiabili nel farsi desiderare da chi sa perfettamente quanto sia pericoloso desiderarli. Trovano l'idea di essere temuti abbastanza divertente da non fare mai nulla per smentirla.","dati":{"Tipo":"umanoide con sottotipo rettile.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Destrezza, +2 Intelligenza, −2 Saggezza. I vishkanya sono agili e di mente fredda, ma poco inclini alla prudenza.","Linguaggi iniziali":"quello di residenza e il vishkanya. Inoltre, possono scegliere tra draconico, elfico, gripli e silvano come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"1,55-1,90 m, 50-85 kg, aspettativa di vita massima di 110 anni circa."},"tratti":[{"nome":"Visione crepuscolare","testo":"ignorano l'occultamento dovuto alla luce fioca."},{"nome":"Familiarità con le armi","testo":"ottengono la competenza con la cerbottana, il kukri, gli shuriken e la spada corta."},{"nome":"Sangue velenoso (Str)","testo":"una volta al giorno, come azione veloce, possono cospargere un'arma o una munizione con il proprio sangue o la propria saliva. La prima creatura ferita da essa deve superare un Tiro Salvezza su Tempra con CD 10 + metà livello di personaggio + bonus di Costituzione o subire 1d2 danni a Destrezza al round per 6 round. Un solo Tiro Salvezza superato pone fine all'effetto. Il veleno perde efficacia dopo 1 minuto se non viene usato."},{"nome":"Resistenza tossica","testo":"ottengono bonus razziale +4 ai Tiri Salvezza contro effetti di \\[VELENO\\]."},{"nome":"Movenze serpentine","testo":"ottengono bonus razziale +2 Artista della fuga e +2 Furtività."},{"nome":"Fascino letale","testo":"ottengono bonus razziale +2 Raggirare."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Bacio avvelenato","descrizione":"Il contatto con la pelle di questi vishkanya è già di per sé un rischio calcolato.","testo":"Il personaggio può utilizzare il tratto razziale Sangue velenoso anche per avvelenare i propri colpi senz'armi e attacchi naturali, e in tal caso l'effetto dura fino al termine del proprio turno successivo anziché applicarsi a un solo attacco."},{"nome":"Danza del cobra","descrizione":"Certi vishkanya si muovono con un'ondulazione ipnotica che confonde chi cerca di colpirli.","testo":"Il personaggio ottiene bonus di schivare +1 alla CA. Inoltre, una volta al giorno può ottenere **vantaggio** in una prova di Acrobazia o di Artista della fuga."},{"nome":"Ghiandole abbondanti","descrizione":"Le ghiandole velenifere di alcuni vishkanya producono molto più del necessario.","testo":"Il personaggio può utilizzare il tratto razziale Sangue velenoso due volte al giorno, anziché una."},{"nome":"Occhi del serpente","descrizione":"Lo sguardo fisso di questi vishkanya inchioda chiunque lo incroci.","testo":"Il personaggio ottiene bonus razziale +2 Intimidire. Inoltre, una volta al giorno, come azione standard, può fissare una creatura entro 9 m: questa deve superare un Tiro Salvezza su Volontà con CD 10 + metà livello di personaggio + bonus di Carisma o rimanere affascinata per 1 minuto. Questo è un effetto di \\[AMMALIAMENTO\\] e \\[VISIVO\\]."},{"nome":"Pelle squamosa","descrizione":"La pelle di questi vishkanya è più rettile che umana, e ne porta i vantaggi.","testo":"Il personaggio ottiene bonus +1 alla CA Naturale e bonus razziale +2 alla DMC contro i tentativi di Lottare."},{"nome":"Sangue corrosivo","descrizione":"Il sangue di alcuni vishkanya non si limita ad avvelenare: brucia.","testo":"Ogni volta che il personaggio subisce danni taglienti o perforanti da un attacco in mischia, l'attaccante subisce 1 danno da acido, più 1 ogni quattro livelli di personaggio."},{"nome":"Tolleranza assoluta","descrizione":"Alcuni vishkanya hanno un organismo che non è semplicemente resistente ai veleni: li ignora.","testo":"Il bonus del tratto razziale Resistenza tossica diventa +6. Inoltre, il personaggio ottiene **vantaggio** ai Tiri Salvezza contro effetti di \\[VELENO\\] derivanti dagli attacchi di creature."},{"nome":"Veleno raffinato","descrizione":"Questi vishkanya sanno concentrare le proprie tossine fino a renderle quasi impossibili da respingere.","testo":"La prima creatura ferita dal tratto razziale Sangue velenoso subisce **svantaggio** al Tiro Salvezza per resistervi."}]},"tipo":"umanoide con sottotipo rettile","taglia":"media","tipo_scheda":"Umanoide Medio (rettile)","movimento":"9 m","sensi":["visione crepuscolare"]},{"nome":"Goblin","descrizione":"I deboli goblin sono originari degli stessi monti abitati da nani e gnomi. Il fatto che siano dotati di un'agilità straordinaria però, ha permesso a questi piccoli e sgraziati pelleverde di sopravvivere e col tempo dire la propria nell'immaginario collettivo delle razze esistenti. I goblin odiano profondamente i cani (pallida imitazione dei cani goblin) e i cavalli (dai quali sono terrorizzati). Sebbene siano intimoriti dalle razze più brutali, la loro curiosità e il loro appetito sconfinato sono il motivo per cui questi piccoletti si trovano spesso in città e villaggi multietnici.","dati":{"Tipo":"umanoide con sottotipo pelleverde.","Taglia":"piccola (+1 CA, +1 ai tiri per colpire, −2 BMC, −2 DMC, +2 Furtività).","Movimento":"6 m (4 caselle).","Caratteristiche":"−2 Forza, +4 Destrezza, −2 Carisma. Gli insicuri goblin compensano la debolezza fisica con una sveltezza ineguagliabile.","Linguaggi iniziali":"quello di residenza e il pelleverde. Inoltre, possono scegliere tra gnoll, halfling e nanico come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"85 cm – 1 m, 20-35 kg, aspettativa di vita massima di 60 anni circa."},"tratti":[{"nome":"Scurovisione","testo":"in zone di oscurità vedono in bianco e nero entro 18 m."},{"nome":"Nemici giurati","testo":"ottengono +1 ai tiri per colpire contro cavalli e canidi (eccetto i cani goblin)."},{"nome":"Familiarità con le armi","testo":"ottengono la competenza con le armi con la qualità Goblin."},{"nome":"Istinto di sopravvivenza","testo":"ottengono bonus razziale +2 Furtività e +2 Intuizione."},{"nome":"Guidatori nati","testo":"ottengono bonus razziale +2 Pilotare mezzi terrestri."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Aggressiva dizperazione","descrizione":"I goblin sanno che per restare vivi è necessario mettere più spazio possibile tra sé e i nemici. Per questo motivo, quando vengono trattenuti, alcuni goblin entrano in uno stato di panico aggressivo che li tramuta in disperate furie scatenate.","testo":"Il personaggio ottiene bonus razziale +2 Artista della fuga. Inoltre, al termine di ogni proprio turno in cui è inghiottito o viene tenuto in lotta, può infliggere a un singolo avversario che lo sta trattenendo 2d4 danni contundenti, taglienti e perforanti."},{"nome":"Avvezzo allo squallore","descrizione":"I goblin sono spesso costretti a vivere a lungo presso i margini rancidi ed antigienici della società e solo i più forti sopravvivono all'esperienza.","testo":"Il personaggio ottiene bonus razziale +2 ai Tiri Salvezza contro effetti di \\[MALATTIA\\], \\[INFERMITÀ\\] e \\[NAUSEA\\]."},{"nome":"Fugace","descrizione":"Certi goblin sono per natura abilissimi nel distrarre interi gruppi di nemici e disimpegnarsi velocemente quando le cose si mettono male.","testo":"Quando il personaggio effettua un'azione di ritirata, non provoca attacchi di opportunità da parte di nessun nemico durante tutto il movimento di tale azione."},{"nome":"Goblin delle forezte","descrizione":"Più selvaggi e brutali dei goblin comuni, quelli delle foreste non disdegnano l'uso di armi rudimentali, si adornano di pitture tribali e berciano costantemente.","testo":"Il personaggio ottiene bonus razziale +2 Sopravvivenza (ambienti boschivi) e può effettuare i passi di 1,5 m all'interno dei terreni difficili boschivi, eccetto quelli manipolati magicamente. Infine, sostituisce la competenza con le armi con la qualità Goblin con quella con l'arco corto e il randello pesante."},{"nome":"Kauto","descrizione":"Quando c'è da spartirsi cibo o bottino i goblin sono sempre gli ultimi: alcuni imparano quindi, che se vogliono ottenere qualcosa, devono essere veloci ma cauti… molto cauti.","testo":"Quando il personaggio effettua una manovra di Rubare, la vittima effettua prima la prova di Percezione. Il personaggio può quindi decidere se effettuare o meno il furto dopo aver visto il risultato di tale prova. Se il personaggio rinuncia alla manovra, la vittima si accorgerà delle sue malintenzioni a meno che questi non vinca una prova di Raggirare contrapposta a Intuizione della vittima."},{"nome":"Okki kranti e orekkie lunke","descrizione":"Sebbene i goblin non siano mai particolarmente aggraziati, alcuni hanno occhi e orecchie assurdamente grandi.","testo":"Il personaggio ottiene bonus razziale +3 Percezione."},{"nome":"Patetiko","descrizione":"Rispetto a chiunque altro, i goblin sembrano deboli e inoffensivi… semplicemente, alcuni riescono a sembrarlo più degli altri.","testo":"Quando il personaggio viene scelto come bersaglio di un'azione ostile che richiede un tiro per colpire, ha il 10% di essere invece ignorato; se il tiro riesce, il nemico deve scegliere di effettuare un'azione diversa che non abbia come bersaglio principale il personaggio. Se il tiro fallisce, la vittima diventa immune per 24 ore a questo tratto razziale da parte del medesimo goblin. Il tiro va effettuato prima che il nemico inizi ad agire, poiché non avrebbe senso che si muova fino al goblin per attaccarlo e poi lo ignori."},{"nome":"Tezta krante e bocca larga","descrizione":"La testa del goblin è tonda e grande come un pallone e dura come la pietra e la sua bocca è irta di denti acuminati.","testo":"Il personaggio ottiene un attacco di supporto di Morso che infligge 1d4 danni. Inoltre, ha una probabilità del 33% di ignorare gli effetti di \\[FRASTORNAMENTO\\] e \\[STORDIMENTO\\]."}]},"tipo":"umanoide con sottotipo pelleverde","taglia":"piccola","tipo_scheda":"Umanoide Piccolo (pelleverde)","movimento":"6 m","sensi":["scurovisione 18 m"]},{"nome":"Orchi","descrizione":"Gli orchi sono aggressivi, brutali e dominatori. Essi amano più di ogni altra cosa la lotta, poiché a tutti gli effetti è l'unica cosa che sanno fare (e bene\\!), essendo creature di scarsa intelligenza e giudizio. Spesso non sono più alti di un uomo ma hanno una muscolatura molto più forte. Gli orchi si sentono autorizzati a prendere qualsiasi cosa desiderano, a meno che qualcuno di più cattivo non impedisca loro di farlo. Quei pochi orchi che riescono a “civilizzarsi” invece, capiscono che nella vita c'è ben di più che sollevare una mannaia ed abbatterla sul nemico, e riescono a conquistarsi di diritto il proprio posto nella società.","dati":{"Tipo":"umanoide con sottotipo pelleverde.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+4 Forza, −2 Intelligenza, −2 Saggezza. Gli orchi sono dotati di una forza smisurata ma sono ottusi e spesso avventati.","Linguaggi iniziali":"quello di residenza e il pelleverde. Inoltre, possono scegliere tra gigante, gnoll e nanico come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"1,65-2 m, 82-130 kg, aspettativa di vita massima di 60 anni circa."},"tratti":[{"nome":"Scurovisione","testo":"in zone di oscurità vedono in bianco e nero entro 18 m."},{"nome":"Familiarità con le armi","testo":"ottengono la competenza con l'ascia bipenne, il falchion e con le armi con la qualità Orchesca."},{"nome":"Resilienza orchesca","testo":"ottengono il talento Duro a morire (non devono soddisfarne i requisiti)."},{"nome":"Minacciosi","testo":"ottengono bonus razziale +2 Intimidire."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Fiuto","descrizione":"Alcuni orchi hanno un senso dell'olfatto molto sviluppato, a scapito di una vista scadente.","testo":"Il personaggio ottiene la regola Fiuto, ma subisce penalità −2 Percezione (vista)."},{"nome":"Inztankabile","descrizione":"Un passato da prigionieri o lavoratori, rende alcuni orchi pressoché insensibili alla stanchezza e capaci di maneggiare alcuni utili strumenti.","testo":"La prima volta della giornata in cui il personaggio dovrebbe diventare affaticato, può invece ignorare tale condizione. Inoltre, ottiene la competenza con accetta, martello leggero, piccone e falce."},{"nome":"Muzo a muzo","descrizione":"In quasi tutti gli orchi arde un fuoco che non può essere estinto. Questi individui si crogiolano nella sfida uno contro uno, fino a lasciarsi andare a risate incontrollate nel cuore dei duelli.","testo":"Il personaggio ottiene +1 ai tiri per colpire in mischia contro i nemici che non sono minacciati da nessun'altra creatura."},{"nome":"Orko di montagna","descrizione":"Gli orchi che vivono o che hanno vissuto a lungo in montagna, sono abili nel combattere creature volanti come viverne, manticore e grifoni oltre ad avere un ottimo equilibrio e resistenza al clima freddo.","testo":"Il personaggio ottiene bonus razziale +1 ai tiri per colpire e +2 di schivare alla CA contro le creature volanti o in posizione sopraelevata. Inoltre, ottiene bonus razziale +2 Scalare e non perde mai il bonus di Destrezza quando scala o è appeso. Infine, conta sempre come indossare abiti invernali (vedi Volume 3 – Equipaggiamento: Sarti e mercerie)."},{"nome":"Orko nero","descrizione":"Gli orchi neri sono creature in grado di sopportare la fatica in modo eccezionale.","testo":"Il personaggio ottiene il talento Resistenza fisica. Inoltre, può dormire in armatura pesante senza svegliarsi affaticato."},{"nome":"Zadiko","descrizione":"Alcuni orchi sviluppano forme di sadismo e sono ossessionati dal colpire i propri nemici nel modo più doloroso possibile.","testo":"Il personaggio ottiene bonus razziale +2 ai tiri per confermare le minacce di critico in mischia."},{"nome":"Zangue troll","descrizione":"In rari casi, un orco ha una stilla di sangue troll nelle vene ed è in grado di recuperare le forze molto velocemente.","testo":"Durante il Rifiatare, il personaggio può ripetere i risultati di dado pari a 1 e 2. Questi tiri possono essere ripetuti un qualsiasi numero di volte."},{"nome":"Zuperstizioso","descrizione":"Alcuni orchi nascono ancora meno socievoli, ma più saggi della norma. Essi si adornano spesso con monili protettivi e compiono gesti scaramantici per scacciare il malocchio.","testo":"Il personaggio ottiene −2 Carisma al posto di −2 Saggezza come caratteristica razziale. Inoltre, ottiene bonus razziale +2 ai Tiri Salvezza contro effetti di \\[MALEDIZIONE\\] e \\[MORTE\\]. Infine, ottiene RE (energia negativa) 5."}]},"tipo":"umanoide con sottotipo pelleverde","taglia":"media","tipo_scheda":"Umanoide Medio (pelleverde)","movimento":"9 m","sensi":["scurovisione 18 m"]},{"nome":"Hobgoblin","descrizione":"Gli hobgoblin sembrano goblin troppo cresciuti dalla pelle grigiastra. Sono dotati di grande giudizio (spesso malevolo) e di un'inspiegabile resistenza. Questi pelleverde amano alla follia le gerarchie militari e le armi e possono dimostrarsi ambiziosi, subdoli, traditori e lunatici. È grazie a questi pericolosi tratti caratteriali infatti, che molti di essi si sono fatti un nome all'interno dell'ambito militare, che sia di una tribù selvaggia che di un esercito vero e proprio. Freddi e calcolatori, gli hobgoblin provano scarso affetto o fiducia nei confronti del prossimo o dei loro simili.","dati":{"Tipo":"umanoide con sottotipo pelleverde.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Costituzione, −2 Intelligenza, +2 Saggezza. Gli hobgoblin sono sorprendentemente robusti e lungimiranti ma anche poco capaci di adattarsi alle situazioni.","Linguaggi iniziali":"quello di residenza e il pelleverde. Inoltre, possono scegliere tra gigante, gnoll e nanico come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"1,30-1,65 m, 70-90 kg, aspettativa di vita massima di 60 anni circa."},"tratti":[{"nome":"Scurovisione","testo":"in zone di oscurità vedono in bianco e nero entro 18 m."},{"nome":"Autocontrollo","testo":"quando sono confusi, sottraggono 15 dal risultato del tiro per determinare il proprio comportamento."},{"nome":"Freddi calcolatori","testo":"possono preparare due azioni contemporaneamente e scegliere quale attivare."},{"nome":"Subdoli","testo":"ottengono bonus razziale +2 Raggirare."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Fanatiko delle armi leggere","descrizione":"Gli hobgoblin amano tagliare, trafiggere e pestare i propri avversari in modo rapido e ripetuto… alcuni di essi ne sono letteralmente ossessionati.","testo":"Una volta al giorno, quando il personaggio ottiene un 1 naturale in un tiro per colpire con un'arma da mischia leggera, può ripetere tale tiro."},{"nome":"Leader","descrizione":"Gli hobgoblin sono ossessionati dalla guerra e dal comando e quelli più carismatici occupano spesso ruoli di rilievo nella gerarchia militare.","testo":"Il personaggio ottiene +2 Carisma al posto di +2 Saggezza come caratteristica razziale e può utilizzare il bonus di Carisma al posto di quello di Saggezza ai fini del talento Concedere iniziativa. Inoltre, due volte al giorno, può scegliere un umanoide pacifico a cui parlare per 1 minuto consecutivo: se vince una prova di Raggirare contrapposta a Intuizione +2 dell'umanoide, la vittima subisce gli effetti dell'incantesimo Charme su persone per 10 minuti. Questo è un effetto \\[UDITIVO\\] e \\[DIPENDENTE DAL LINGUAGGIO\\]."},{"nome":"Occhio per le opportunità","descrizione":"Anche se non è un comportamento propriamente leale, molti hobgoblin attendono che i nemici si scoprano per portare attacchi più efficaci.","testo":"Il personaggio ottiene bonus razziale +1 ai tiri per colpire con gli attacchi di opportunità."},{"nome":"Paranoiko","descrizione":"La società hobgoblin promuove il tradimento e la scalata sociale, per questo la maggior parte di queste creature sono oltremodo guardinghe e diffidenti.","testo":"Quando il personaggio è impreparato, subisce penalità di −3 alla prova di Iniziativa, anziché di −6."},{"nome":"Pelle zfregiata","descrizione":"Alcuni hobgoblin si sfregiano sia con le lame che con il fuoco, al fine di indurire la propria pelle in una massa callosa di cicatrici.","testo":"Il personaggio ottiene bonus +2 alla CA contro i tiri di conferma delle minacce di critico subite."},{"nome":"Skiva inkantezimi","descrizione":"La maggior parte degli hobgoblin non ama l'uso della magia, misteriosa e infingarda, e molti sviluppano uno speciale sesto senso che li aiuta ad evitare quella altrui.","testo":"Il personaggio può effettuare le prove di Sapienza magica anche senza addestramento ma solo per identificare incantesimi al momento del lancio. Se la prova ha successo, il personaggio ottiene bonus +2 alla CA o +2 al Tiro Salvezza contro l'incantesimo identificato. Il personaggio non può mai lanciare incantesimi, eccetto quelli scaturiti dagli oggetti magici."},{"nome":"Vile","descrizione":"Per molti hobgoblin sopravvivere è la cosa più importante. Di conseguenza, chiunque è sacrificabile.","testo":"Una volta al giorno, il personaggio può effettuare un tiro per colpire in mischia contrapposto a un attacco che lo ha appena colpito. Se vince la prova, ridirige metà del danno subito su un alleato entro portata; se vince con uno scarto di almeno 10 punti, deve ridirigere tutto il danno. Gli alleati sono sempre ignari dell'accaduto."},{"nome":"Zampe ztorte","descrizione":"Alcuni hobgoblin nascono con gambe arcuate ma forti. Sebbene ciò non li renda particolarmente aggraziati, i vantaggi che ne derivano sono innegabili.","testo":"Il personaggio ottiene bonus razziale +2 Cavalcare, +2 Scalare e +2 DMC contro le manovre di Sbilanciare e Spingere."}]},"tipo":"umanoide con sottotipo pelleverde","taglia":"media","tipo_scheda":"Umanoide Medio (pelleverde)","movimento":"9 m","sensi":["scurovisione 18 m"]},{"nome":"Bugbear","descrizione":"Senza dubbio i più massicci tra i pelleverde, i bugbear sono alti, pesanti e dotati di mani sproporzionate. La loro pelle è generalmente giallastra, sono ricoperti di durissimo pelo ruvido e le loro orecchie sono a forma di cuneo. I bugbear non sono famosi né per la loro simpatia, né per la loro intelligenza ma di sicuro sono avversari difficili da sconfiggere, poiché in grado di sopportare spropositate quantità di danni prima di soccombere. Come gli orchi, i bugbear sono creature universalmente prepotenti, che se la prendono con gli esseri più piccoli ma che fuggono quando si trovano di fronte a un avversario palesemente superiore a loro.","dati":{"Tipo":"umanoide con sottotipo pelleverde.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+4 Costituzione, −2 Intelligenza, −2 Carisma. I bugbear sono esseri ottusi e intrattabili ma dotati di corpi capaci di sopportare anche le prove più incredibili.","Linguaggi iniziali":"quello di residenza e il pelleverde. Inoltre, possono scegliere tra gigante, gnoll e nanico come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"2,10-2,30 m, 170-190 kg, aspettativa di vita massima di 60 anni circa."},"tratti":[{"nome":"Scurovisione","testo":"in zone di oscurità vedono in bianco e nero entro 18 m."},{"nome":"Pelliccia ispida","testo":"ottengono bonus +1 alla CA Naturale."},{"nome":"Presa possente","testo":"possono scegliere di impugnare una singola arma da mischia a due mani con una sola mano subendo −2 ai tiri per colpire con essa. L'arma così usata deve essere della stessa taglia del personaggio e viene considerata come ad una mano per determinare gli effetti del talento Attacco poderoso, il combattere con due armi, il bonus di Forza ai danni, etc."},{"nome":"Minacciosi","testo":"ottengono bonus razziale +2 Intimidire."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Fanatiko delle armi massicce","descrizione":"I bugbear amano pestare i propri avversari in modo rapido e ripetuto… alcuni di essi ne sono letteralmente entusiasti.","testo":"Una volta al giorno, quando il personaggio ottiene un 1 naturale in un tiro per colpire con un'arma a due mani, può ripetere tale tiro."},{"nome":"Fiuto","descrizione":"Alcuni bugbear hanno un senso dell'olfatto molto sviluppato, a scapito di una vista scadente.","testo":"Il personaggio ottiene la regola Fiuto, ma subisce penalità −2 Percezione (vista)."},{"nome":"Groppone","descrizione":"Sono molti i bugbear con la schiena talmente grande e possente, da risultare quasi impossibili da spostare.","testo":"Il personaggio ottiene bonus razziale +4 DMC contro le manovre di Sbilanciare e Spingere."},{"nome":"Pelliccia ankora più izpida","descrizione":"Alcuni bugbear hanno un pelo più irto e duro della norma che li protegge dai colpi più duri.","testo":"Il personaggio ottiene bonus +2 alla CA contro i tiri di conferma delle minacce di critico subite."},{"nome":"Strozzatore","descrizione":"Le braccia lunghe e sproporzionate dei bugbear sono perfette per afferrare al collo gli avversari.","testo":"Quando il personaggio afferra in lotta un avversario superandone la DMC di almeno 5 punti, quest'ultimo è preso alla gola e non può parlare finché non si libera. Inoltre, la CD della prova di Artista della fuga per liberarsi dallo strangolamento è pari a 15 o alla DMC del bugbear, a seconda di quale sia il valore più alto."},{"nome":"Terrificante","descrizione":"I bugbear sono combattenti feroci e violenti ma alcuni di essi sono veri e propri incubi viventi.","testo":"Tre volte al giorno, una volta per round, quando colpisce con un attacco in mischia, come azione gratuita il personaggio può dimezzare i danni inferti per effettuare una prova di Intimidire (demoralizzare) contro l'avversario appena ferito. Questo è un effetto \\[UDITIVO\\]."},{"nome":"Urla e zberci","descrizione":"I bugbear sono creature rumorose e borbottanti e le loro grida senza senso confondono spesso gli avversari.","testo":"Il personaggio può utilizzare Intimidire al posto di Raggirare (fintare) contro gli avversari in mischia."},{"nome":"Zadiko","descrizione":"Molti bugbear sviluppano forme di sadismo e sono ossessionati dal colpire i propri nemici nel modo più doloroso possibile.","testo":"Il personaggio ottiene bonus razziale +2 ai tiri per confermare le minacce di critico in mischia."}]},"tipo":"umanoide con sottotipo pelleverde","taglia":"media","tipo_scheda":"Umanoide Medio (pelleverde)","movimento":"9 m","sensi":["scurovisione 18 m"]},{"nome":"Aslan","descrizione":"Gli aslan sono i più imponenti tra i popoli felini: leoni, tigri e pantere che camminano eretti, con criniere folte, spalle larghe e zanne che non hanno bisogno di essere mostrate per essere temute. Cacciano in gruppi affiatati e misurano il valore di un individuo da ciò che porta al branco, non da ciò che possiede. Sono creature dirette, incapaci di dissimulare e poco inclini alla prudenza: quando un aslan è infastidito lo si capisce subito, e non ci sono secondi avvertimenti. Gli altri popoli li trovano compagni leali e formidabili, a patto di non scambiare la loro pazienza per debolezza.","dati":{"Tipo":"umanoide con sottotipo felino.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Forza, +2 Costituzione, −2 Saggezza. Gli aslan sono possenti e tenaci, ma raramente brillano per prudenza.","Linguaggi iniziali":"quello di residenza e il felino. Inoltre, possono scegliere tra elfico, gigante, gnoll e silvano come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"1,70-2 m, 75-120 kg, aspettativa di vita massima di 100 anni circa."},"tratti":[{"nome":"Sangue felino","testo":"contano come felinidi al fine di qualsiasi requisito, ad eccezione di quelli degli archetipi."},{"nome":"Visione crepuscolare","testo":"ignorano l'occultamento dovuto alla luce fioca."},{"nome":"Morso","testo":"ottengono un attacco di supporto di Morso che infligge 1d6 danni."},{"nome":"Scattanti","testo":"ottengono bonus razziale +3 m alla velocità base su terreno quando effettuano un'azione di carica, corsa o ritirata."},{"nome":"Minacciosi","testo":"ottengono bonus razziale +2 Intimidire."},{"nome":"Sensi acuti","testo":"ottengono bonus razziale +2 Percezione."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Agguatista","descrizione":"Gli aslan sono maestri delle imboscate rapide e silenziose.","testo":"Il personaggio ottiene bonus razziale +1 ai tiri per colpire e ai danni contro gli avversari impreparati. Inoltre, una volta al giorno può ottenere **vantaggio** in un tiro per colpire contro un avversario impreparato."},{"nome":"Caccia di branco","descrizione":"Gli aslan cacciano da sempre in gruppo e sanno stringere il cerchio attorno alla preda meglio di chiunque altro.","testo":"Quando il personaggio fiancheggia un nemico, il bonus di fiancheggiamento suo e di tutti gli alleati che fiancheggiano quel nemico diventa +3, anziché +2. Questo aumento non è cumulabile con altri aumenti al bonus di fiancheggiamento concessi da privilegi di classe o archetipi."},{"nome":"Carica maestosa","descrizione":"Il balzo di un aslan lanciato alla carica è una delle poche cose che nessuno dimentica.","testo":"Quando effettua una carica, il personaggio non subisce la consueta penalità di −2 alla CA e può effettuare due deviazioni di massimo 1 casella in diagonale, anziché una."},{"nome":"Errante dei boschi","descrizione":"Molti aslan trascorrono gran parte della propria vita tra boschi, foreste e giungle.","testo":"Il personaggio ottiene bonus razziale +2 Sopravvivenza (ambienti boschivi). Inoltre, può effettuare i passi di 1,5 m all'interno dei terreni difficili boschivi, eccetto quelli manipolati magicamente."},{"nome":"Fauci possenti","descrizione":"Gli aslan hanno dentature poderose, ma quelle di alcuni sono vere e proprie presse idrauliche.","testo":"Ogni turno in cui il personaggio tiene un avversario in lotta, può infliggergli automaticamente 1d6 danni + bonus di Forza con il morso."},{"nome":"Possanza felina","descrizione":"Certi aslan hanno una muscolatura che sfigura anche quella degli orchi più massicci.","testo":"Il personaggio conta come di una taglia più grande ai fini di BMC e DMC e per stabilire quali creature può afferrare, spingere e sbilanciare."},{"nome":"Ruggente","descrizione":"Un boato e denti scoperti possono instillare il terrore nel cuore di chiunque.","testo":"Il personaggio può effettuare le prove di Intimidire per demoralizzare contro qualsiasi avversario che possa udirlo entro 9 m, anziché solo adiacente. Inoltre, una volta al giorno può ottenere **vantaggio** in una prova di Intimidire."},{"nome":"Scalatore","descrizione":"Molti aslan eccellono nello scalare alberi, rocce e altri vantaggiosi punti elevati, in attesa delle loro prede.","testo":"Il personaggio ottiene bonus razziale +4 Scalare e non perde mai il bonus di Destrezza alla CA quando scala o è appeso."}]},"tipo":"umanoide con sottotipo felino","taglia":"media","tipo_scheda":"Umanoide Medio (felino)","movimento":"9 m","sensi":["visione crepuscolare"]},{"nome":"Felinidi","descrizione":"I felinidi sono un popolo di cacciatori dal passo silenzioso e dalla curiosità inesauribile, il cui aspetto varia enormemente da individuo a individuo: c'è chi ricorda un gatto domestico, chi una lince, chi un ghepardo. Sono creature socievoli e allegre, che si affezionano in fretta e altrettanto in fretta si annoiano, e che passano gran parte della vita a spostarsi da un posto all'altro per il puro gusto di vedere cosa c'è oltre. La loro cultura non scoraggia mai questa irrequietezza, anzi la alimenta, e i felinidi sono convinti che la fortuna accompagni sempre chi ha il coraggio di ficcare il naso dove non dovrebbe — cosa che, stranamente, sembra quasi sempre vera.","dati":{"Tipo":"umanoide con sottotipo felino.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Destrezza, +2 Carisma, −2 Saggezza. I felinidi sono agili e socievoli, ma incorreggibilmente avventati.","Linguaggi iniziali":"quello di residenza e il felino. Inoltre, possono scegliere tra elfico, gnoll, halfling e silvano come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"1,50-1,85 m, 55-90 kg, aspettativa di vita massima di 100 anni circa."},"tratti":[{"nome":"Visione crepuscolare","testo":"ignorano l'occultamento dovuto alla luce fioca."},{"nome":"Artigli","testo":"ottengono due attacchi di supporto di Artiglio che infliggono 1d4 danni ciascuno."},{"nome":"Fortuna felina","testo":"una volta al giorno, quando effettuano un Tiro Salvezza su Riflessi, ottengono **vantaggio**."},{"nome":"Atterrare in piedi","testo":"non finiscono proni quando subiscono danni in seguito a una caduta e riducono di 3 m l'altezza considerata per calcolare i danni da caduta."},{"nome":"Cacciatori naturali","testo":"ottengono bonus razziale +2 Furtività e +2 Sopravvivenza."},{"nome":"Sensi acuti","testo":"ottengono bonus razziale +2 Percezione."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Astuzia felina","descrizione":"Un carattere abitualmente amichevole non preclude la scaltrezza, e non pochi felinidi considerano gli intrighi sociali vere e proprie sfide da giocare e vincere.","testo":"Il personaggio ottiene bonus razziale +2 Intuizione e +2 Raggirare."},{"nome":"Cascatore agile","descrizione":"Alcuni felinidi hanno un senso dell'equilibrio e una conoscenza del proprio baricentro semplicemente innaturali.","testo":"Il personaggio ottiene bonus razziale +2 Acrobazia e +2 alla DMC contro le manovre di Sbilanciare. Inoltre, l'altezza ridotta dal tratto razziale Atterrare in piedi diventa 6 m."},{"nome":"Come un gatto in trappola","descrizione":"Quando vengono afferrati, alcuni felinidi usano i propri artigli come rasoi per liberarsi.","testo":"Il personaggio ottiene bonus razziale +2 Artista della fuga. Inoltre, ogni turno in cui viene tenuto in lotta o fallisce nel liberarsi da essa, può infliggere a un singolo avversario che lo sta trattenendo 1d4 danni + bonus di Forza con gli artigli."},{"nome":"Curiosità incorreggibile","descrizione":"La fama dei felinidi di ficcare il naso ovunque è ampiamente meritata, ma è anche il motivo per cui notano cose che sfuggono a chiunque altro.","testo":"Il personaggio ottiene bonus razziale +2 Percezione (perquisire aree e trovare porte segrete) e può effettuare le prove di Disattivare congegni anche senza addestramento."},{"nome":"Errante dei boschi","descrizione":"I felinidi sono esploratori per natura e molti passano gran parte della vita tra boschi, foreste e giungle.","testo":"Il personaggio ottiene bonus razziale +2 Sopravvivenza (ambienti boschivi). Inoltre, può effettuare i passi di 1,5 m all'interno dei terreni difficili boschivi, eccetto quelli manipolati magicamente."},{"nome":"Impercettibile","descrizione":"Alcuni felinidi sono particolarmente abili nello spostarsi senza fare rumore.","testo":"Il personaggio non subisce la penalità di −5 alle prove di Furtività mentre si muove silenziosamente a velocità normale."},{"nome":"Sette vite","descrizione":"Si dice che i felinidi abbiano più di una vita a disposizione. Alcuni sembrano davvero deciderlo sul momento.","testo":"Il tratto razziale Fortuna felina si applica a qualsiasi tipo di Tiro Salvezza, anziché ai soli Riflessi."},{"nome":"Scalatore","descrizione":"Molti felinidi si arrampicano prima ancora di imparare a camminare.","testo":"Il personaggio ottiene bonus razziale +4 Scalare e non perde mai il bonus di Destrezza alla CA quando scala o è appeso."}]},"tipo":"umanoide con sottotipo felino","taglia":"media","tipo_scheda":"Umanoide Medio (felino)","movimento":"9 m","sensi":["visione crepuscolare"]},{"nome":"Gnoll","descrizione":"Gli gnoll sono creature sorprendentemente possenti ma anche goffe e scoordinate. Assomigliano alle iene e ne condividono le abitudini, tanto da tenerne spesso qualcuna come animale da compagnia. Sono cacciatori dall'olfatto finissimo, ma preferiscono di gran lunga ripulire e trafugare piuttosto che cacciare davvero, e questo li porta a frequentare cadaveri e luoghi infetti, cosa che ha sviluppato in loro difese immunitarie formidabili. Quando possono, si procurano dei lacchè perché raccolgano il cibo per loro (o perché fungano da esso). I più “civilizzati” però non mangiano gli altri umanoidi e li trattano da alleati, o almeno finché ciò gli è conveniente. Gli gnoll provano gusto per il combattimento, ma solo quando sono in superiorità numerica: in caso contrario preferiscono l'imboscata, e sostengono che sia meglio scappare con la coda tra le gambe piuttosto che perderla del tutto.","dati":{"Tipo":"umanoide con sottotipo gnoll.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Forza, +2 Costituzione, −2 Destrezza. Gli gnoll sono possenti e resistenti, ma goffi e scoordinati.","Linguaggi iniziali":"quello di residenza e lo gnoll. Inoltre, possono scegliere tra felino, gigante, nanico e pelleverde come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"1,60-1,95 m, 80-120 kg, aspettativa di vita massima di 60 anni circa."},"tratti":[{"nome":"Visione crepuscolare","testo":"ignorano l'occultamento dovuto alla luce fioca."},{"nome":"Morso","testo":"ottengono un attacco di supporto di Morso che infligge 1d6 danni."},{"nome":"Fiuto","testo":"ottengono la regola Fiuto."},{"nome":"Scattanti","testo":"ottengono bonus razziale +3 m alla velocità base su terreno quando effettuano un'azione di carica, corsa o ritirata."},{"nome":"Avvezzi alla decadenza","testo":"ottengono bonus razziale +2 ai Tiri Salvezza contro effetti di \\[MALATTIA\\], \\[INFERMITÀ\\] e \\[NAUSEA\\]."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Branco affamato","descrizione":"Gli gnoll combattono volentieri solo quando sono in netta superiorità numerica, e in quel caso diventano spietati.","testo":"Il personaggio ottiene bonus razziale +1 ai tiri per colpire e ai danni contro un nemico che sia minacciato da almeno altri due suoi alleati."},{"nome":"Codardo","descrizione":"Un temperamento pavido e una giovinezza trascorsa a evitare i più forti rendono alcuni gnoll straordinariamente pronti a defilarsi.","testo":"Il personaggio subisce penalità razziale −2 ai Tiri Salvezza contro gli effetti di \\[PAURA\\]. Di contro, quando effettua un'azione di ritirata non provoca attacchi di opportunità da parte di nessun nemico durante tutto il movimento di tale azione, e ottiene bonus razziale +2 Artista della fuga."},{"nome":"Domatore","descrizione":"Grazie alla loro attitudine ad addestrare iene giganti e altri animali feroci (e a volte schiavi), molti gnoll diventano domatori eccellenti.","testo":"Il personaggio ottiene bonus razziale +2 Cavalcare e la competenza con la frusta e la frusta a nove sezioni. Inoltre, ottiene il talento Maestria con la frusta (non deve soddisfarne i requisiti)."},{"nome":"Fauci possenti","descrizione":"Gli gnoll hanno dentature poderose, ma quelle di alcuni sono vere e proprie presse idrauliche.","testo":"Ogni turno in cui il personaggio tiene un avversario in lotta, può infliggergli automaticamente 1d6 danni + bonus di Forza con il morso."},{"nome":"Ghiandole odorifere","descrizione":"Come le iene, gli gnoll hanno ghiandole odorifere molto sviluppate, e queste possono dargli un vantaggio contro le creature più semplici.","testo":"Il personaggio ottiene bonus di circostanza +2 alla CA contro animali e parassiti. Inoltre, una volta al giorno può ottenere **vantaggio** in una prova di Intimidire per demoralizzare."},{"nome":"Mangia cadaveri","descrizione":"Lo gnoll è in grado di nutrirsi per rimarginare le proprie ferite.","testo":"Una volta al giorno, come azione standard il personaggio può nutrirsi di un cadavere non più vecchio di 1 settimana per curarsi di un numero di danni pari a 5 + livello di personaggio. Quando ciò avviene, a causa del ventre gonfio subisce penalità −2 Forza e −2 Destrezza per 1 ora."},{"nome":"Spazzino","descrizione":"Molti gnoll sopravvivono cercando tra rifiuti e carcasse, imparando a separare l'utile dall'inutile con minuziosa maestria.","testo":"Il personaggio ottiene bonus razziale +2 Percezione (perquisire aree e trovare porte segrete) e +2 Valutare."},{"nome":"Tinture mimetiche","descrizione":"Facendo sapiente uso di tinture e odori naturali, alcuni gnoll riescono a mimetizzarsi con l'ambiente.","testo":"Il personaggio può impiegare 1 minuto per ottenere bonus razziale +3 Furtività (nascondersi) per 1 ora. Inoltre, una volta al giorno può ottenere **vantaggio** in una prova di Furtività."}]},"tipo":"umanoide con sottotipo gnoll","taglia":"media","tipo_scheda":"Umanoide Medio (gnoll)","movimento":"9 m","sensi":["visione crepuscolare","fiuto"]},{"nome":"Gripli","descrizione":"I gripli sono minuscoli anfibi eretti dalla pelle liscia e cangiante, che vivono tra le fronde delle foreste pluviali e nei villaggi sospesi sopra le paludi. Diffidano di tutto ciò che non conoscono e hanno l'abitudine, sconcertante per chi non ci è abituato, di sparire semplicemente restando fermi dove sono. Sono artigiani pazienti e cacciatori pazientissimi: preferiscono di gran lunga una trappola ben piazzata e un dardo intinto nel veleno giusto a qualunque scontro diretto, e considerano la forza bruta una scorciatoia da creature che non hanno saputo pensare per tempo. Chi riesce a guadagnarsi la loro fiducia scopre un popolo curioso, spiritoso e sorprendentemente allegro, che sa dell'ambiente in cui vive più di qualsiasi druido di passaggio.","dati":{"Tipo":"umanoide con sottotipo gripli.","Taglia":"piccola (+1 CA, +1 ai tiri per colpire, −2 BMC, −2 DMC, +2 Furtività).","Movimento":"6 m (4 caselle).","Caratteristiche":"−2 Forza, +2 Destrezza, +2 Saggezza. I gripli sono minuti e fragili, ma agili e dotati di un istinto infallibile.","Linguaggi iniziali":"quello di residenza e il gripli. Inoltre, possono scegliere tra elfico, felino, gnoll e silvano come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"60-75 cm, 11-14 kg, aspettativa di vita massima di 60 anni circa."},"tratti":[{"nome":"Scurovisione","testo":"in zone di oscurità vedono in bianco e nero entro 18 m."},{"nome":"Familiarità con le armi","testo":"ottengono la competenza con la cerbottana e la rete."},{"nome":"Arrampicatori","testo":"ottengono bonus razziale +4 Scalare e non perdono mai il bonus di Destrezza alla CA quando scalano o sono appesi."},{"nome":"Zampe posteriori","testo":"ottengono bonus razziale +4 Acrobazia (saltare)."},{"nome":"Mimetismo","testo":"ottengono bonus razziale +4 Furtività all'interno di boschi e paludi."},{"nome":"Uso dei veleni","testo":"ottengono il talento Uso dei veleni (non devono soddisfarne i requisiti)."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Anfibio","descrizione":"Alcuni gripli conservano il legame con l'acqua molto più dei loro simili arboricoli.","testo":"Il personaggio ottiene bonus razziale +4 Nuotare. Inoltre, può trattenere il fiato sott'acqua per un numero di round pari a quattro volte (anziché due) il proprio punteggio di Costituzione."},{"nome":"Balzo prodigioso","descrizione":"Le zampe di certi gripli sono molle capaci di scagliarli a distanze che sfidano il buonsenso.","testo":"Il personaggio non ha mai bisogno di prendere la rincorsa per effettuare un salto. Inoltre, una volta al giorno può ottenere **vantaggio** in una prova di Acrobazia (saltare)."},{"nome":"Cacciatore di paludi","descrizione":"I gripli delle torbiere si muovono nel fango e tra le radici sommerse come se camminassero su una strada lastricata.","testo":"Il personaggio ottiene bonus razziale +2 Sopravvivenza (paludi). Inoltre, può effettuare i passi di 1,5 m all'interno dei terreni difficili paludosi, eccetto quelli manipolati magicamente."},{"nome":"Costruttore di trappole","descrizione":"Nessuno sa disporre lacci, contrappesi e spuntoni come un gripli che abbia avuto un pomeriggio libero.","testo":"Il personaggio ottiene bonus razziale +2 Disattivare congegni e può effettuare le prove in tale abilità anche senza addestramento. Inoltre, ottiene bonus razziale +2 Percezione (trovare trappole)."},{"nome":"Lingua appiccicosa","descrizione":"La lingua di alcuni gripli è lunga, rapida e sufficientemente forte da sollevare oggetti a distanza.","testo":"Come azione di movimento, il personaggio può recuperare con la lingua un oggetto non custodito entro 3 m. Inoltre, può effettuare le manovre di Rubare contro bersagli entro 3 m, anziché solo adiacenti."},{"nome":"Pelle tossica","descrizione":"La pelle di questi gripli secerne le stesse tossine che i loro antenati usavano per intingere i dardi.","testo":"Il personaggio ottiene bonus razziale +4 ai Tiri Salvezza contro effetti di \\[VELENO\\]. Inoltre, una volta al giorno può raccogliere dalla propria pelle una dose di veleno da contatto: la prima creatura che ne viene a contatto deve superare un Tiro Salvezza su Tempra con CD 10 + metà livello di personaggio + bonus di Costituzione o diventare inferma per 1 minuto."},{"nome":"Piccolo e sfuggente","descrizione":"Chi passa la vita a schivare creature dieci volte più grandi impara presto dove non farsi trovare.","testo":"Il personaggio ottiene bonus di schivare +2 alla CA contro le creature di taglia grande o superiore."},{"nome":"Veleno persistente","descrizione":"Certi gripli sanno miscelare le tossine in modo che si attacchino alla ferita e non mollino la presa.","testo":"Quando il personaggio applica un veleno a un'arma, la prima creatura ferita da essa subisce **svantaggio** al Tiro Salvezza per resistervi."}]},"tipo":"umanoide con sottotipo gripli","taglia":"piccola","tipo_scheda":"Umanoide Piccolo (gripli)","movimento":"6 m","sensi":["scurovisione 18 m"]},{"nome":"Kitsune","descrizione":"“Astuto come una volpe” è un adagio che si addice particolarmente bene a un kitsune. Agili e, per l'appunto, furbi, i kitsune sono mutaforma noti per il loro amore per il riso, i fagioli dolci, gli imbrogli e l'arte. Nonostante un'irresistibile inclinazione per gli inganni, apprezzano la lealtà e possono diventare compagni fedelissimi. Adorano ogni forma di espressione artistica, in particolare gli indovinelli, la narrazione e la pittura. Sono grandi ammaliatori e sanno creare le kitsunebi, fiammelle fredde che usano tanto per distrarre i nemici quanto per prendere in giro gli ignari passanti.","dati":{"Tipo":"umanoide con sottotipo kitsune e sottotipo mutaforma.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"−2 Forza, +2 Destrezza, +2 Carisma. I kitsune sono minuti e sfuggenti, ma irresistibilmente affascinanti.","Linguaggi iniziali":"quello di residenza e il silvano. Inoltre, possono scegliere tra elfico, felino, nanico e tengu come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"1,50-1,85 m, 55-90 kg, aspettativa di vita massima di 100 anni circa."},"tratti":[{"nome":"Duplice forma","testo":"i kitsune hanno due forme, quella originale di volpe antropomorfa e quella umana. Le due forme devono essere dello stesso sesso e sono fisse: non possono cambiare ad ogni trasformazione. Il passaggio da una forma all'altra è un'azione standard che non provoca attacchi di opportunità, e possono rimanere nella forma scelta a tempo indefinito."},{"nome":"Visione crepuscolare","testo":"ignorano l'occultamento dovuto alla luce fioca."},{"nome":"Morso","testo":"in forma originale ottengono un attacco di supporto di Morso che infligge 1d4 danni."},{"nome":"Forma umana","testo":"in forma umana non necessitano di superare prove di Camuffare per apparire come umani."},{"nome":"Kitsunebi (Mag)","testo":"quando lanciano un incantesimo della scuola di Ammaliamento, possono aumentare di 1 la CD dell'incantesimo. Inoltre, possono lanciare tre volte al giorno l'incantesimo Luci danzanti."},{"nome":"Flessuosi","testo":"ottengono bonus razziale +2 Acrobazia."},{"nome":"Furfanti","testo":"ottengono bonus razziale +2 Raggirare."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Affabile","descrizione":"Anche per gli standard della loro razza, certi kitsune hanno una capacità di stringere amicizie che rasenta il soprannaturale.","testo":"Quando il personaggio usa con successo Diplomazia per migliorare l'atteggiamento di un individuo, questi subisce penalità −2 alle prove contrapposte basate su Carisma del kitsune per le successive 24 ore."},{"nome":"Basso profilo","descrizione":"Molti kitsune sanno che evitare l'attenzione, talvolta, è una scelta più saggia che mostrarsi affabili e socievoli.","testo":"Il personaggio ottiene bonus razziale +2 Camuffare e +2 Raggirare."},{"nome":"Fuoco delle volpi (Mag)","descrizione":"Alcuni kitsune imparano a scaldare le proprie kitsunebi fino a renderle tutt'altro che innocue.","testo":"Le luci create dal personaggio con il tratto razziale Kitsunebi possono essere fatte esplodere come azione veloce: ogni creatura adiacente a una luce subisce 1d6 danni da fuoco, più 1d6 ogni quattro livelli di personaggio, con un Tiro Salvezza su Riflessi con CD 10 + metà livello di personaggio + bonus di Carisma per dimezzarli."},{"nome":"Kaze (volpe del vento)","descrizione":"Questa particolare genìa di kitsune si muove indisturbata tanto dentro grandi bufere e cicloni, quanto tra le grinfie dei propri avversari.","testo":"Il personaggio conta come di due taglie più grande allo scopo di risolvere gli effetti basati sul vento e per resistere ai tentativi di Lottare."},{"nome":"Mutaforma veloce","descrizione":"Alcuni kitsune nascono con una propensione naturale per passare da una forma all'altra.","testo":"Il personaggio può alternare la propria forma da originale a umana e viceversa come azione veloce, anziché come azione standard."},{"nome":"Riserva di chakra","descrizione":"Alcuni kitsune riescono a impastare il chakra, un'energia in parte fisica e in parte spirituale che può essere utilizzata per compiere imprese straordinarie.","testo":"Il personaggio ottiene 1 punto chakra più 1 punto addizionale ogni quattro livelli di personaggio. Come azione veloce, il personaggio può spendere 1 punto chakra per ottenere bonus +2 a una prova di abilità o di caratteristica. Se possiede una riserva ki, può usare i punti ki al posto dei punti chakra e viceversa."},{"nome":"Sacro marchio di Kurama (Sop)","descrizione":"Rarissimi kitsune portano il marchio del kami conosciuto come Kurama, la volpe a nove code. Questi individui sono destinati a compiere prodigi.","testo":"Il personaggio manifesta una seconda coda, e ne manifesta un'altra ogni quattro livelli di personaggio oltre il 1°. Ottiene bonus razziale +1 Diplomazia per ogni coda posseduta oltre la prima. Inoltre, una volta al giorno può ottenere **vantaggio** in una prova di Diplomazia o di Raggirare. Ogni volta che il personaggio ottiene il talento Coda magica manifesta immediatamente una coda, che si somma a quelle già possedute e anticipa questa progressione; il talento può essere ottenuto più volte. Un kitsune non può in nessun caso possedere più di nove code."},{"nome":"Yako (volpe di campo)","descrizione":"Questa particolare genìa di kitsune è caratterizzata da movenze silenziose e un carattere piuttosto malizioso.","testo":"Il personaggio non subisce la penalità di −5 alle prove di Furtività mentre si muove silenziosamente a velocità normale."}]},"tipo":"umanoide con sottotipo kitsune e sottotipo mutaforma","taglia":"media","tipo_scheda":"Umanoide Medio (kitsune, mutaforma)","movimento":"9 m","sensi":["visione crepuscolare"]},{"nome":"Mutapelle","descrizione":"I mutapelle sono i discendenti lontani dei licantropi: non sono maledetti, non mutano con la luna e non trasmettono nulla a chi mordono, ma nel loro sangue resta un'eco della bestia che si può ancora richiamare a volontà. Nascono con qualche dettaglio che non torna — un'iride troppo gialla, canini appena lunghi, ciuffi di pelo dove non dovrebbero esserci — e crescono sapendo che quel dettaglio, un giorno, si aprirà. Molti villaggi li scacciano per semplice superstizione, confondendoli con i mostri da cui discendono; altri li accolgono volentieri come cacciatori, guide ed esploratori, perché nessuno legge una pista o fiuta un pericolo come un mutapelle. Loro, da parte propria, hanno imparato a non chiedere il permesso a nessuno.","dati":{"Tipo":"umanoide con sottotipo umano e sottotipo mutapelle.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Forza, +2 Saggezza, −2 Intelligenza. I mutapelle sono vigorosi e dotati di istinto infallibile, ma poco inclini allo studio.","Linguaggi iniziali":"quello di residenza. Inoltre, possono scegliere tra felino, gnoll, silvano e qualsiasi linguaggio (non segreto) come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"1,60-1,95 m, 70-115 kg, aspettativa di vita massima di 100 anni circa."},"tratti":[{"nome":"Sangue umano","testo":"contano come umani al fine di qualsiasi requisito, ad eccezione di quelli degli archetipi."},{"nome":"Visione crepuscolare","testo":"ignorano l'occultamento dovuto alla luce fioca."},{"nome":"Istinto animale","testo":"ottengono bonus razziale +2 Intuizione e +2 Sopravvivenza."},{"nome":"Non licantropi","testo":"i mutapelle non sono affetti da licantropia, non la trasmettono e non sono soggetti alle relative regole."},{"nome":"Forma bestiale (Sop)","testo":"come azione veloce, il personaggio può assumere un aspetto ferino per un numero di minuti al giorno pari al proprio livello di personaggio, non necessariamente consecutivi (minimo 1 minuto). Mentre è in forma bestiale ottiene i benefici del proprio retaggio bestiale e subisce penalità −2 alle prove di abilità basate su Carisma nei confronti di umanoidi che non siano mutapelle. Terminare la forma bestiale è un'azione gratuita. La forma bestiale non modifica la taglia né il tipo del personaggio e non conta come forma selvatica ai fini di talenti, privilegi ed effetti. Non è possibile assumerla mentre si è sotto l'effetto di un'altra trasformazione."}],"opzioni":{"titolo":"Retaggi bestiali","intro":"Si sceglie un retaggio tra quelli sotto elencati. In alternativa, si può scegliere uno dei tratti razziali generici descritti alla fine di questo volume.","voci":[{"nome":"Retaggio del lupo","descrizione":"I discendenti dei lupi mannari sono i mutapelle più numerosi e i più temuti: nessuno abbandona una pista una volta che l'ha trovata.","testo":"Il personaggio ottiene bonus razziale +2 Sopravvivenza per trovare e seguire le tracce. In forma bestiale ottiene +2 Forza, un attacco di supporto di Morso che infligge 1d6 danni, la regola Fiuto e bonus razziale +4 BMC per Sbilanciare."},{"nome":"Retaggio del ratto","descrizione":"Piccoli, sudici e indistruttibili: i mutapelle del ratto passano dove nessun altro passerebbe e sopravvivono a ciò che ucciderebbe chiunque.","testo":"Il personaggio ottiene bonus razziale +2 ai Tiri Salvezza contro effetti di \\[MALATTIA\\] e \\[VELENO\\]. In forma bestiale ottiene +2 Destrezza, un attacco di supporto di Morso che infligge 1d4 danni, Scurovisione 18 m e può stringersi come una creatura di due taglie più piccola."},{"nome":"Retaggio della tigre","descrizione":"La tigre non insegue: aspetta. E quando si muove, è già finita.","testo":"Il personaggio ottiene bonus razziale +2 Furtività. In forma bestiale ottiene +2 Forza, un attacco di supporto di Artiglio che infligge 1d6 danni, la regola Fiuto e non subisce la consueta penalità di −2 alla CA quando effettua una carica."},{"nome":"Retaggio del coccodrillo","descrizione":"La pelle di questi mutapelle si indurisce in placche cornee e il loro morso è una tagliola che non si apre.","testo":"Il personaggio ottiene bonus razziale +4 Nuotare e può trattenere il fiato sott'acqua per un numero di round pari a quattro volte (anziché due) il proprio punteggio di Costituzione. In forma bestiale ottiene +2 Costituzione, un attacco di supporto di Morso che infligge 1d6 danni e bonus +1 alla CA Naturale."},{"nome":"Retaggio del pipistrello","descrizione":"Questi mutapelle non hanno bisogno di vedere: sentono dove sono tutti, e questo mette a disagio persino i loro alleati.","testo":"Il personaggio ottiene bonus razziale +2 Percezione (udito). In forma bestiale ottiene +2 Destrezza, un attacco di supporto di Morso che infligge 1d4 danni, Scurovisione 18 m e percepisce la posizione esatta di tutte le creature udibili entro 9 m, ignorando l'occultamento dovuto alla sola vista."},{"nome":"Retaggio dello squalo","descrizione":"Una goccia di sangue in acqua, o nell'aria, e questi mutapelle smettono di ragionare.","testo":"Il personaggio ottiene bonus razziale +4 Nuotare. In forma bestiale ottiene +2 Costituzione, un attacco di supporto di Morso che infligge 1d6 danni, la regola Fiuto (solo per creature ferite) e bonus razziale +1 ai tiri per colpire contro le creature ridotte a metà o meno Punti Ferita."},{"nome":"Retaggio dell'orso","descrizione":"Non sono i più rapidi né i più astuti, ma ciò che un mutapelle dell'orso afferra, non lo lascia più.","testo":"Il personaggio ottiene bonus razziale +2 Intimidire. In forma bestiale ottiene +2 Forza, un attacco di supporto di Artiglio che infligge 1d6 danni, la regola Fiuto e bonus razziale +4 BMC e DMC per le manovre di Lottare."},{"nome":"Retaggio della iena","descrizione":"La risata di questi mutapelle è la cosa peggiore che si possa sentire in un campo di battaglia, e loro lo sanno benissimo.","testo":"Il personaggio ottiene bonus razziale +2 Percezione. In forma bestiale ottiene +2 Costituzione, un attacco di supporto di Morso che infligge 1d6 danni e la regola Fiuto. Inoltre, quando riduce un nemico a 0 o meno Punti Ferita, può effettuare come azione gratuita una prova di Intimidire per demoralizzare tutti i nemici entro 9 m che possano udirlo."}]},"tipo":"umanoide con sottotipo umano e sottotipo mutapelle","taglia":"media","tipo_scheda":"Umanoide Medio (umano, mutapelle)","movimento":"9 m","sensi":["visione crepuscolare"]},{"nome":"Tengu","descrizione":"I tengu sono creature corvine dalla corporatura fragile e dalla reputazione pessima: saprofagi, ladruncoli, portatori di sfortuna. In realtà sono uno dei popoli più versatili del mondo conosciuto, dotati di un'astuzia notevole, di un talento naturale per la spada e della capacità di riprodurre qualunque voce abbiano udito. Furono a lungo trattati come servi e schiavi da razze più potenti, e in quel periodo impararono a sopravvivere frugando nell'immondizia delle città o cacciando nelle terre selvagge. Oggi i loro discendenti si sono ritagliati un posto nelle società multietniche, ma devono ancora combattere ogni giorno contro la superstizione che li vuole araldi di disgrazie — una fama che i tengu, quando fa comodo, alimentano volentieri.","dati":{"Tipo":"umanoide con sottotipo tengu.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Destrezza, −2 Costituzione, +2 Saggezza. I tengu sono rapidi e acuti, ma di costituzione fragile.","Linguaggi iniziali":"quello di residenza e il tengu. Inoltre, possono scegliere qualsiasi linguaggio (non segreto) come linguaggio bonus dovuto all'Intelligenza.","Altezza, peso ed età":"1,25-1,50 m, 35-50 kg, aspettativa di vita massima di 110 anni circa."},"tratti":[{"nome":"Visione crepuscolare","testo":"ignorano l'occultamento dovuto alla luce fioca."},{"nome":"Becco","testo":"ottengono un attacco di supporto di Becco che infligge 1d4 danni."},{"nome":"Spadaccini nati","testo":"ottengono la competenza con la scimitarra, la spada bastarda, la spada corta, la spada lunga, lo spadone e lo stocco."},{"nome":"Planare","testo":"quando cadono, possono effettuare una prova di Volare con CD 15 per non subire danni da caduta. Se la prova riesce, possono effettuare un'ulteriore prova di Volare con CD 15 per planare, spostandosi lateralmente di 1,5 m per ogni 6 m di caduta. Non possono trasportare altre creature mentre planano."},{"nome":"Imitatori","testo":"come azione gratuita possono memorizzare la voce di un umanoide udita di recente (massimo una alla volta). Una volta al giorno possono imitare per 1 ora la voce memorizzata. Chi ascolta l'imitazione deve superare un Tiro Salvezza su Volontà con CD 10 + metà livello di personaggio + bonus di Saggezza per accorgersi dell'inganno; se lo supera, è immune per 24 ore a questa capacità da parte del medesimo tengu."},{"nome":"Astuti","testo":"ottengono bonus razziale +2 Furtività e +2 Percezione."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Addestramento nelle lame orientali","descrizione":"I tengu sono spadaccini naturali e alcuni apprendono l'utilizzo di armi ben più insolite.","testo":"Il personaggio ottiene la competenza con tre delle seguenti armi a scelta: kama, katana, sai, sciabola dentata, spada dentata, spada farfalla, ventaglio da guerra e wakizashi."},{"nome":"Corvo ciarliero","descrizione":"La voce di alcuni tengu non si limita a imitare: si moltiplica, si sposta, arriva da dove non dovrebbe.","testo":"Il tratto razziale Imitatori permette di memorizzare fino a tre voci contemporaneamente. Inoltre, il personaggio può lanciare a volontà l'incantesimo Ventriloquio."},{"nome":"Malaugurio","descrizione":"Dare fastidio a un tengu porta sfortuna. Dare fastidio ad alcuni tengu in particolare può risultare in una vera tragedia.","testo":"Una volta al giorno, come azione immediata, quando un nemico entro 9 m effettua un tiro per colpire, un Tiro Salvezza o una prova di abilità, il personaggio può imporgli **svantaggio** in quel tiro."},{"nome":"Percepire carcasse","descrizione":"Molti tengu possiedono un olfatto specificamente sintonizzato sul fetore emesso dalle creature ferite o morte.","testo":"Il personaggio ottiene la regola Fiuto, ma solo per percepire cadaveri e creature ridotte a metà o meno Punti Ferita."},{"nome":"Piumaggio invernale","descrizione":"Alcuni tengu secernono una sostanza oleosa e isolante che li protegge dal freddo. Inoltre, possono mutare il colore delle proprie piume in breve tempo.","testo":"Il personaggio non subisce mai gli effetti del clima freddo, come per l'incantesimo Contrastare elementi. Inoltre, nel giro di 1 ora può far diventare bianche le proprie piume, ottenendo bonus di circostanza +2 Furtività per nascondersi nel ghiaccio e nella neve."},{"nome":"Richiamo aviario","descrizione":"Alcuni tengu riescono ad attrarre gli uccelli, sfruttando il loro linguaggio similare.","testo":"Una volta al giorno, come azione di round completo, il personaggio richiama un uccello. L'animale deve essere presente nel raggio di 5 km e si muoverà al massimo delle proprie possibilità per rispondere alla chiamata. L'animale risponderà automaticamente alle domande postegli come per l'incantesimo Parlare con gli animali."},{"nome":"Uccello rapace","descrizione":"I tengu hanno uno spiccato istinto per le imboscate. Alcuni, semplicemente, più degli altri.","testo":"Il personaggio ottiene bonus razziale +1 ai tiri per colpire e ai danni contro gli avversari impreparati. Inoltre, una volta al giorno può ottenere **vantaggio** in un tiro per colpire nel primo round di un combattimento."},{"nome":"Volo controllato","descrizione":"Certi tengu hanno ali sufficientemente forti da trasformare una caduta in qualcosa che assomiglia molto al volo.","testo":"Le prove di Volare del tratto razziale Planare riescono automaticamente. Inoltre, il personaggio si sposta lateralmente di 3 m per ogni 6 m di caduta, anziché 1,5 m, e può trasportare una creatura di taglia media o inferiore mentre plana."}]},"tipo":"umanoide con sottotipo tengu","taglia":"media","tipo_scheda":"Umanoide Medio (tengu)","movimento":"9 m","sensi":["visione crepuscolare"]},{"nome":"Vanara","descrizione":"I vanara sono un popolo di scimmie antropomorfe dal pelo folto e dagli occhi vividi, che vivono tra le chiome delle foreste tropicali e nelle città costruite sui pendii dove nessun altro si prenderebbe la briga di salire. Sono creature esuberanti, chiassose e incurabilmente curiose, convinte che qualunque cosa valga la pena di essere fatta valga anche la pena di essere fatta subito. Questa impulsività li mette regolarmente nei guai e altrettanto regolarmente li tira fuori, perché è difficile inseguire un vanara che ha deciso di andarsene: passa dove non c'è appiglio, afferra ciò che nessuno pensava fosse afferrabile e ride mentre lo fa. Chi li giudica frivoli di solito cambia idea la prima volta che uno di loro affronta un pericolo vero: sotto la baldoria c'è un popolo di antica saggezza e di lealtà assoluta.","dati":{"Tipo":"umanoide con sottotipo vanara.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Destrezza, +2 Saggezza, −2 Carisma. I vanara sono agili e assennati, ma chiassosi e impulsivi.","Linguaggi iniziali":"quello di residenza e il vanara. Inoltre, possono scegliere tra felino, gripli, silvano e tengu come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"1,50-1,80 m, 50-85 kg, aspettativa di vita massima di 100 anni circa."},"tratti":[{"nome":"Visione crepuscolare","testo":"ignorano l'occultamento dovuto alla luce fioca."},{"nome":"Arrampicatori","testo":"ottengono bonus razziale +4 Scalare e non perdono mai il bonus di Destrezza alla CA quando scalano o sono appesi."},{"nome":"Coda prensile","testo":"possono usare la coda per recuperare gli oggetti dallo zaino come azione di movimento, anziché come azione di round completo e senza necessariamente togliersi lo zaino dalle spalle. Non si può usare la coda in questo modo se è munita di un'estensione per coda."},{"nome":"Agilità arborea","testo":"ottengono bonus razziale +2 Acrobazia. Inoltre, possono effettuare i passi di 1,5 m all'interno dei terreni difficili boschivi, eccetto quelli manipolati magicamente."},{"nome":"Sensi acuti","testo":"ottengono bonus razziale +2 Percezione."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Baldoria contagiosa","descrizione":"L'allegria di certi vanara è tanto sfacciata da rendere ridicola qualunque minaccia.","testo":"Una volta al giorno, come azione veloce, il personaggio e tutti gli alleati entro 9 m che possano udirlo ottengono **vantaggio** al prossimo Tiro Salvezza contro effetti di \\[PAURA\\] effettuato entro 1 minuto."},{"nome":"Coda forte","descrizione":"La coda di alcuni vanara è tanto robusta da reggerne il peso senza il minimo sforzo.","testo":"Il personaggio può appendersi per la coda mantenendo entrambe le mani libere e non è considerato in posizione precaria mentre lo fa. Inoltre, ottiene bonus razziale +2 alla DMC contro i tentativi di Sbilanciare e Spingere e non finisce prono quando subisce danni in seguito a una caduta."},{"nome":"Errante dei boschi","descrizione":"I vanara conoscono le foreste come nessun altro, avendovi trascorso intere generazioni tra un ramo e l'altro.","testo":"Il personaggio ottiene bonus razziale +2 Sopravvivenza (ambienti boschivi) e +2 Furtività all'interno di boschi e foreste."},{"nome":"Ladro di frutti","descrizione":"Rubare, per un vanara, non è un mestiere: è una forma di conversazione.","testo":"Il personaggio ottiene bonus razziale +2 Rapidità di mano e può effettuare le prove in tale abilità anche senza addestramento. Inoltre, può effettuare le manovre di Rubare usando la coda contro bersagli entro 3 m, anziché solo adiacenti."},{"nome":"Mente scimmiesca","descrizione":"Sotto la baldoria, alcuni vanara nascondono una lucidità che nessuno si aspetta.","testo":"Il personaggio ottiene bonus razziale +2 ai Tiri Salvezza contro effetti di \\[AMMALIAMENTO: CHARME E COMPULSIONE\\] e la CD delle prove per Intimidirlo aumenta di 2."},{"nome":"Passo tra i rami","descrizione":"Certi vanara si spostano di ramo in ramo tanto in fretta che seguirli a terra è impossibile.","testo":"Quando il personaggio effettua un'azione di ritirata all'interno di boschi, foreste o di qualsiasi ambiente che offra appigli sopraelevati, non provoca attacchi di opportunità da parte di nessun nemico durante tutto il movimento di tale azione."},{"nome":"Saggio della montagna","descrizione":"Alcuni vanara trascorrono decenni nei monasteri d'alta quota, e ne escono cambiati.","testo":"Il personaggio ottiene bonus razziale +2 Conoscenze (religioni) e può effettuare le prove in tale abilità anche senza addestramento. Inoltre, ottiene bonus razziale +2 alle prove di Concentrazione."},{"nome":"Spericolato","descrizione":"L'impulsività di alcuni vanara sfiora l'incoscienza, e stranamente sembra premiarli.","testo":"Una volta al giorno, il personaggio può ottenere **vantaggio** in una prova di Acrobazia o di Scalare. Inoltre, riduce di 3 m l'altezza considerata per calcolare i danni da caduta."}]},"tipo":"umanoide con sottotipo vanara","taglia":"media","tipo_scheda":"Umanoide Medio (vanara)","movimento":"9 m","sensi":["visione crepuscolare"]},{"nome":"Gathlain","descrizione":"I gathlain sono minuscoli esseri nati dall'incontro tra il sangue dei folletti e la linfa delle piante: hanno corpi sottili percorsi da venature verdi, capelli di foglie o petali che cambiano con le stagioni, e un paio di ali iridescenti da libellula che tengono ripiegate sulla schiena. Vivono in comunità disordinate e allegrissime nel folto delle foreste antiche, dove passano le giornate a inventare scherzi elaborati, a discutere di questioni astrusissime e a dimenticarsi di ciò che stavano facendo. Non hanno alcun senso della proprietà — considerano loro qualunque cosa nessuno stia guardando in quel momento — e altrettanto poco senso del pericolo. Le loro ali, purtroppo, non li sostengono davvero: servono a planare, a rallentare una caduta, a compiere balzi che sfidano il buonsenso, e i gathlain adulti passano l'esistenza a lamentarsi di quanto sarebbe bello volare per davvero. Quelli che vivono abbastanza a lungo, prima o poi, ci riescono.","dati":{"Tipo":"umanoide con sottotipo folletto e sottotipo vegetale.","Taglia":"piccola (+1 CA, +1 ai tiri per colpire, −2 BMC, −2 DMC, +2 Furtività).","Movimento":"6 m (4 caselle).","Caratteristiche":"+2 Destrezza, +2 Intelligenza, −2 Costituzione. I gathlain sono agili e di ingegno vivace, ma minuscoli e fragili.","Linguaggi iniziali":"quello di residenza e il silvano. Inoltre, possono scegliere tra elfico, gnomesco, gripli e vanara come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"90 cm – 1,10 m, 12-18 kg, aspettativa di vita massima di 300 anni circa."},"tratti":[{"nome":"Visione crepuscolare","testo":"ignorano l'occultamento dovuto alla luce fioca."},{"nome":"Ali fatate","testo":"ottengono bonus razziale +2 Acrobazia (saltare) e non hanno mai bisogno di prendere la rincorsa per effettuare un salto."},{"nome":"Planare","testo":"quando cadono, possono effettuare una prova di Volare con CD 15 per non subire danni da caduta. Se la prova riesce, possono effettuare un'ulteriore prova di Volare con CD 15 per planare, spostandosi lateralmente di 1,5 m per ogni 6 m di caduta. Non possono trasportare altre creature mentre planano."},{"nome":"Natura vegetale","testo":"ottengono bonus razziale +2 ai Tiri Salvezza contro effetti di \\[INFLUENZA MENTALE\\] e \\[VELENO\\]. Di contro, subiscono +25% ai danni da fuoco."},{"nome":"Vulnerabilità al ferro freddo","testo":"subiscono +25% ai danni inflitti dalle armi in ferro freddo."},{"nome":"Innesto simbiotico","testo":"alla creazione il personaggio sceglie una pianta che vive innestata nel proprio corpo. Ottiene bonus razziale +2 Conoscenze (natura) e può effettuare le prove in tale abilità anche senza addestramento. Inoltre, una volta al giorno può lanciare l'incantesimo Amicizia con le piante."},{"nome":"Magia silvana (Mag)","testo":"quando lanciano un incantesimo della scuola di Trasmutazione, possono aumentare di 1 la CD dell'incantesimo."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Corteccia","descrizione":"La pelle di alcuni gathlain si indurisce in una scorza sottile ma sorprendentemente resistente.","testo":"Il personaggio ottiene bonus +1 alla CA Naturale. Inoltre, il malus ai danni da fuoco di Natura vegetale scende dal 25% al 10%."},{"nome":"Fiore di stagione (Mag)","descrizione":"L'innesto di questi gathlain sboccia una volta al giorno, e ciò che sboccia dipende dalla stagione.","testo":"Una volta al giorno, il personaggio può lanciare come capacità magica uno tra Cura ferite leggere, Intralciare, Luminescenza e Ritirata rapida. La scelta va fatta all'alba di ogni giorno."},{"nome":"Fusto flessibile","descrizione":"Il corpo di questi gathlain è più stelo che carne, e si piega dove chiunque altro si spezzerebbe.","testo":"Il personaggio ottiene bonus razziale +2 Artista della fuga e +2 alla DMC contro i tentativi di Lottare. Inoltre, può stringersi come una creatura di una taglia più piccola."},{"nome":"Linfa curativa","descrizione":"La linfa che scorre nelle vene di alcuni gathlain rimargina ciò che il sangue non saprebbe rimarginare.","testo":"Durante il Rifiatare, il personaggio può ripetere i risultati di dado pari a 1 e 2. Questi tiri possono essere ripetuti un qualsiasi numero di volte."},{"nome":"Radici profonde","descrizione":"Certi gathlain sanno affondare i piedi nel terreno e diventare, per qualche istante, un albero vero.","testo":"Come azione veloce, il personaggio può radicarsi: fino alla fine del turno successivo ottiene bonus razziale +4 alla DMC contro le manovre di Sbilanciare e Spingere e non può essere mosso contro la propria volontà da alcun effetto che non sia magico. Mentre è radicato la sua velocità è 0."},{"nome":"Scherzo di bosco","descrizione":"I gathlain considerano lo scherzo una forma d'arte e alcuni hanno raggiunto vette che i loro pari giudicano insuperabili.","testo":"Il personaggio ottiene bonus razziale +2 Raggirare. Inoltre, una volta al giorno può ottenere **vantaggio** in una prova di Raggirare o di Rapidità di mano."},{"nome":"Testa fra le nuvole","descrizione":"Alcuni gathlain sono così assorti nei propri pensieri da risultare imprevedibili anche per chi li sta attaccando.","testo":"Una volta al giorno, come azione immediata, il personaggio può imporre **svantaggio** a un singolo tiro per colpire effettuato contro di lui."},{"nome":"Volo delle libellule","descrizione":"Le ali di questi gathlain sono più larghe, più forti e più rumorose della norma. Un giorno basteranno.","testo":"Le prove di Volare del tratto razziale Planare riescono automaticamente e il personaggio si sposta lateralmente di 3 m per ogni 6 m di caduta, anziché 1,5 m. Inoltre, al 17° livello di personaggio ottiene una velocità di Volare di 12 m (scarsa)."}]},"tipo":"umanoide con sottotipo folletto e sottotipo vegetale","taglia":"piccola","tipo_scheda":"Umanoide Piccolo (folletto, vegetale)","movimento":"6 m","sensi":["visione crepuscolare"]},{"nome":"Fauno","descrizione":"I fauni sono folletti dal busto umano e dalle gambe caprine, con corna ricurve, occhi dalla pupilla orizzontale e un'allegria che nessuna disgrazia sembra scalfire. Vivono ai margini dei boschi antichi, in radure che nessuna mappa registra, dove suonano, bevono, discutono di filosofia con estrema serietà e poi si dimenticano di ciò che hanno concluso. Considerano il lavoro una forma di malattia e la fretta una volgarità, ma sanno essere alleati di rara lealtà con chi li tratta da pari. Ogni fauno impara da bambino a suonare qualcosa, e ogni fauno è convinto di suonarlo meglio di chiunque altro. La cosa notevole è che, quando suonano davvero, le creature del bosco smettono di fare quello che stavano facendo e si voltano ad ascoltare.","dati":{"Tipo":"umanoide con sottotipo folletto.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Destrezza, +2 Carisma, −2 Costituzione. I fauni sono agili e magnetici, ma di fibra sorprendentemente delicata.","Linguaggi iniziali":"quello di residenza e il silvano. Inoltre, possono scegliere tra elfico, gnomesco, gripli e vanara come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"1,60-1,90 m, 60-100 kg, aspettativa di vita massima di 200 anni circa."},"tratti":[{"nome":"Visione crepuscolare","testo":"ignorano l'occultamento dovuto alla luce fioca."},{"nome":"Zoccoli","testo":"ottengono un attacco di supporto di Zoccoli che infligge 1d4 danni."},{"nome":"Passo silvano","testo":"ottengono bonus razziale +2 Sopravvivenza (ambienti boschivi). Inoltre, possono effettuare i passi di 1,5 m all'interno dei terreni difficili boschivi, eccetto quelli manipolati magicamente."},{"nome":"Incanto silvano (Mag)","testo":"quando lanciano un incantesimo della scuola di Ammaliamento, possono aumentare di 1 la CD dell'incantesimo. Inoltre, possono lanciare una volta al giorno l'incantesimo Charme su animali."},{"nome":"Resistenza dei folletti","testo":"ottengono bonus razziale +2 ai Tiri Salvezza contro effetti di \\[AMMALIAMENTO\\] e \\[ILLUSIONE: ALLUCINAZIONE, FINZIONE, MASCHERAMENTO, OMBRA E TRAMA\\]."},{"nome":"Sensi acuti","testo":"ottengono bonus razziale +2 Percezione."},{"nome":"Vulnerabilità al ferro freddo","testo":"subiscono +25% ai danni inflitti dalle armi in ferro freddo."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Balzo caprino","descrizione":"Le zampe di alcuni fauni sono molle che li scagliano dove nessuno si aspetta di trovarli.","testo":"Il personaggio ottiene bonus razziale +4 Acrobazia (saltare) e non ha mai bisogno di prendere la rincorsa per effettuare un salto."},{"nome":"Corna ricurve","descrizione":"Certi fauni portano corna talmente possenti da poterle usare come un ariete.","testo":"Il personaggio sostituisce l'attacco di supporto di Zoccoli con un attacco di supporto di Corna che infligge 1d6 danni. Quando effettua una carica, l'attacco di Corna conta come attacco primario."},{"nome":"Danza del bosco","descrizione":"Quando certi fauni cominciano a danzare, fermarsi a guardarli è più forte della prudenza.","testo":"Il personaggio ottiene bonus razziale +2 Intrattenere (danzare) e può utilizzare tale abilità al posto di Diplomazia per migliorare l'atteggiamento altrui. Inoltre, una v
