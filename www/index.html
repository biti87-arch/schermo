sta.org, Condizioni","adattato":""},{"nome":"Accovacciato","gruppo":"Paura","rossa":true,"effetto":"CA −2; la CA mostrata è quella colto alla sprovvista","sintesi":"Non può compiere azioni, -2 CA, no Des","sintesi_fonte":"Guida del DM","testo":["Il personaggio è congelato dalla paura ed è incapace di compiere azioni. Un personaggio accovacciato subisce penalità –2 alla Classe Armatura e perde qualsiasi bonus di Destrezza (se posseduto)."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni","adattato":""},{"nome":"Affascinato","gruppo":"Altre","rossa":true,"effetto":"Percezione −4","sintesi":"Sta tranquilla senza compiere azioni; -4 Percezione; si libera se attaccata","sintesi_fonte":"Guida del DM","testo":["Una creatura affascinata è soggiogata da un effetto soprannaturale o di un incantesimo. La creatura rimane in piedi o si siede tranquilla, senza effettuare alcuna azione se non prestare attenzione alla fonte del fascino, fintanto che dura l’effetto. L’effetto provoca penalità –4 alle Prove di Abilità richieste come reazione, come ad esempio le prove di Percezione. Qualsiasi potenziale minaccia, come ad esempio una creatura ostile in avvicinamento, consente alla creatura affascinata un nuovo Tiro Salvezza contro l’effetto del fascino. Qualsiasi minaccia palese, come ad esempio qualcuno che estrae un’arma, lancia un incantesimo o punta un’arma a distanza verso la creatura affascinata, interrompe automaticamente l’effetto. Un alleato della creatura affascinata può scuoterla per liberarla dall’effetto come Azione Standard."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni","adattato":""},{"nome":"Assordato","gruppo":"Altre","rossa":true,"effetto":"Iniziativa −4","sintesi":"-4 Iniziativa, fallisce prove di percezione basate sull’udito; 20% di fallimento incantesimi vocali","sintesi_fonte":"Guida del DM","testo":["Un personaggio assordato non può ascoltare. Subisce penalità –4 alle prove di Iniziativa, fallisce automaticamente tutte le prove di Percezione basate sul suono e ha una probabilità del 20% di fallire il lancio degli incantesimi con componenti verbali. I personaggi che rimangono assordati per lunghi periodi di tempo, possono abituarsi a queste penalità e superarne alcune, a discrezione del GM."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni","adattato":""},{"nome":"Barcollante","gruppo":"Altre","rossa":true,"effetto":"","sintesi":"O azione di movimento o azione standard","sintesi_fonte":"Guida del DM","testo":["Un personaggio barcollante può effettuare una singola Azione di Movimento o una Standard ad ogni round (ma non entrambe, e non può effettuare azioni di round completo). Una creatura barcollante può sempre compiere Azioni Gratuite, Veloci o Immediate. Una creatura i cui danni non letali eguagliano i Punti Ferita attuali ottiene la condizione barcollante."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni","adattato":""},{"nome":"Confuso","gruppo":"Altre","rossa":true,"effetto":"all’inizio del suo turno la barra del turno tira il d%","sintesi":"Tira d100: 1-25 agisce normalmente; 26-50: non agisce; 51-75: si infligge 1d8+For; 76-00: attacca il più vicino","sintesi_fonte":"Guida del DM","testo":["Una creatura confusa è mentalmente ottenebrata e non può agire normalmente. Una creatura confusa non riesce a distinguere un alleato da un nemico, e considera tutti come nemici. Gli alleati che vogliono lanciare un incantesimo a vantaggio della creatura confusa devono comunque toccarla con un attacco di contatto in mischia riuscito. Se una creatura confusa è attaccata, attacca sempre l’ultima creatura che la ha attaccata, finché quella creatura non muore o esce dalla sua visuale.","Tirate sulla tabella seguente all’inizio di ogni turno della creatura confusa ad ogni round per vedere quello che la creatura fa in quel round.","D% | COMPORTAMENTO","01-25 | Agisce normalmente","26-50 | Non fa altro che balbettare in modo incoerente","51-75 | Si infligge 1d8 + modificatore di Forza con l'arma che tiene in mano","76-100 | Attacca la creatura più vicina (a tale scopo, un Famiglio conta come parte del soggetto stesso)","Una creatura confusa che non è in grado di eseguire l’azione indicata non farà altro che balbettare in modo incoerente. Gli aggressori non hanno alcun vantaggio speciale quando attaccano una creatura confusa. Qualsiasi creatura confusa che venga attaccata, attacca automaticamente a sua volta il suo aggressore al suo turno successivo, fintanto che rimane confusa quando giunge il suo turno. Una creatura confusa non effettua Attacchi di Opportunità contro nessuno con cui non sia già impegnata a combattere (perché così richiedeva la sua azione più recente, o perché è stata appena attaccata)."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni","adattato":""},{"nome":"Esausto","gruppo":"Fatica","rossa":true,"effetto":"il Riposo 8 ore lo toglie (non se viene da fame o sete)","sintesi":"Come affaticato ma velocità dimezzata, -6 For e Des. Dopo 1 ora di riposo diventa affaticata.","sintesi_fonte":"Guida del DM","testo":["Un personaggio esausto si muove a velocità dimezzata e subisce penalità –6 a Forza e Destrezza. Dopo 1 ora di completo riposo, un personaggio esausto diventa solo Affaticato. Un personaggio Affaticato diventa esausto compiendo un’azione che normalmente lo affaticherebbe.","Affaticato o esausto: una creatura affaticata o esausta a causa di fame o sete può rimuovere tali condizioni solamente rifocillandosi."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni + Vol. 1 2.5.2","adattato":"Aggiunta la regola del Vol. 1 su fame e sete."},{"nome":"Frastornato","gruppo":"Altre","rossa":true,"effetto":"","sintesi":"Non può agire ma non ha penalità alla CA","sintesi_fonte":"Guida del DM","testo":["La creatura è incapace di agire normalmente. Una creatura frastornata non può eseguire azioni, ma non subisce penalità alla CA. La condizione frastornato dura solitamente 1 round."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni","adattato":""},{"nome":"Immobilizzato","gruppo":"Altre","rossa":true,"effetto":"la CA mostrata è quella colto alla sprovvista, −4","sintesi":"No azioni di movimento ed è impreparato. -4 CA, no Des alla CA e alla DMC, no AdO senza Riflessi in combattimento o Schivare prodigioso. No azioni immediate","sintesi_fonte":"Guida del DM","testo":["Una creatura immobilizzata è strettamente limitata nei movimenti e può compiere solo alcune azioni. Una creatura immobilizzata non può muoversi ed è Impreparata. Un personaggio immobilizzato inoltre subisce una ulteriore penalità –4 alla sua Classe Armatura. Una creatura immobilizzata è limitata nelle azioni che può compiere. Una creatura immobilizzata può tentare sempre di liberarsi, solitamente attraverso una prova di Manovra in Combattimento o una prova di Artista della Fuga. Una creatura immobilizzata può compiere azioni verbali e mentali, ma non può lanciare incantesimi che richiedono una componente somatica o materiale. Un personaggio immobilizzato che tenta di lanciare un incantesimo o usare una Capacità Magica deve effettuare una prova di Concentrazione (CD 10 + BMC dell’aggressore + livello dell’incantesimo) o perde l’incantesimo. Immobilizzato è una condizione più grave di In Lotta, ed i loro effetti non si cumulano."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni","adattato":""},{"nome":"Impreparato","gruppo":"Altre","rossa":true,"effetto":"la CA mostrata è quella colto alla sprovvista","sintesi":"No Des alla CA e alla DMC, non può effettuare AdO senza Riflessi in combattimento. Nessuna azione immediata","sintesi_fonte":"Guida del DM","testo":["Un personaggio che non ha ancora agito durante un Combattimento è Impreparato, incapace di reagire normalmente alla situazione. Un personaggio Impreparato perde il suo bonus di Destrezza alla CA e alla DMC (se presente) e non può effettuare Attacchi di Opportunità, a meno che non abbia il Talento Riflessi in Combattimento o il privilegio di Classe Schivare Prodigioso.","I personaggi con Schivare Prodigioso mantengono il loro bonus di Destrezza alla CA e possono fare Attacchi di Opportunità prima di aver agito nel primo round di Combattimento.","Nota del redattore: non si possono intraprendere Azioni Immediate mentre si è Impreparati.","Essere impreparati (Vol. 1): I personaggi impreparati, anziché non poter agire nel primo round di combattimento, subiscono una penalità di −6 alla prova di Iniziativa. Per il resto, la sorpresa funziona come di consueto (bonus di Destrezza negato alla CA, possibilità di subire attacchi furtivi, etc.)."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni + Vol. 1 2.5.2","adattato":"Aggiunta la regola del Vol. 1 «Essere impreparati»."},{"nome":"In Lotta","gruppo":"Altre","rossa":true,"effetto":"","sintesi":"-4 Des, -2 ai TpC e alle manovre in combattimento e non possono usare azioni con due mani","sintesi_fonte":"Guida del DM","testo":["Una creatura in lotta è trattenuta da una creatura, da una trappola o da un effetto. Le creature in lotta non possono muoversi e subiscono penalità –4 a Destrezza. Una creatura in lotta subisce penalità –2 a tutti i Tiri per Colpire e alle prove di Manovra in Combattimento, tranne quelle effettuate per lottare o sfuggire ad una lotta. Inoltre, le creature in lotta non possono compiere azioni che richiedano due mani per essere effettuate. Un personaggio in lotta che tenta di lanciare un incantesimo o usare una Capacità Magica deve effettuare una prova di Concentrazione (CD 10 + BMC dell’aggressore + livello dell’incantesimo) o perde l’incantesimo. Le creature in lotta non possono effettuare Attacchi di Opportunità.","Una creatura in lotta non può usare Furtività per nascondersi dalla creatura con cui sta lottando, anche se una capacità speciale, come nascondersi in piena vista, lo permetterebbe. Se una creatura in lotta diventa Invisibile, con un incantesimo o un’altra capacità, guadagna Bonus di Circostanza +2 alla sua DMC per evitare di essere afferrata, ma non riceve altri benefici."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni","adattato":""},{"nome":"Inabile","gruppo":"Altre","rossa":true,"effetto":"","sintesi":"O azione di movimento o azione standard; velocità dimezzata","sintesi_fonte":"app","testo":["Un personaggio inabile può compiere solo un’Azione di Movimento o un’Azione Standard per round (ma non entrambe, e non può effettuare Azioni di Round Completo, ma può sempre compiere Azioni Veloci, Immediate e Gratuite). Si muove a velocità dimezzata."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni (adattato)","adattato":"Tenuti solo gli effetti: il testo di golarion parla di 0 PF, PF negativi e morente, che nella Collana non esistono."},{"nome":"Incorporeo","gruppo":"Altre","rossa":true,"effetto":"","sintesi":"Immune a qualsiasi azione fisica non magica, subisce metà danni da armi magiche, incantesimi, etc.","sintesi_fonte":"Guida del DM","testo":["Le creature di questo tipo non possiedono un corpo fisico. Le creature incorporee sono immuni a tutte le forme di attacco non magico e subiscono solo metà danni (50%) da armi magiche, incantesimi ed effetti di Capacità Magiche o Soprannaturali. Le creature incorporee subiscono danno pieno da altri soggetti ed effetti incorporei, così come tutti gli effetti di Forza."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni","adattato":""},{"nome":"Indifeso","gruppo":"Indifeso","rossa":true,"effetto":"etichetta «Des 0, +4 ai TpC in mischia contro»","sintesi":"Des 0 (-5); gli avversari hanno +4 ai TpC; può subire un Colpo di grazia","sintesi_fonte":"Guida del DM","testo":["Un personaggio addormentato, bloccato, legato, Paralizzato, Privo di Sensi o per qualche altro motivo completamente alla mercé dei suoi avversari, è considerato indifeso. Un personaggio indifeso viene considerato come se avesse Destrezza 0 (modificatore di –5). Gli attacchi in mischia contro un personaggio indifeso ottengono bonus +4 (equivalente ad attaccare un personaggio Prono). Gli attacchi a distanza, non ottengono alcun bonus particolare contro i bersagli indifesi. I Ladri possono effettuare Attacchi Furtivi contro un bersaglio indifeso."],"sezioni":[{"titolo":"Colpo di grazia","testo":["Come azione di round completo, un nemico può utilizzare un'arma da mischia per infliggere un colpo di grazia ad un personaggio indifeso. Un nemico può anche usare un arco o una balestra, l’importante è che sia adiacente al bersaglio. L’attaccante colpisce automaticamente ed infligge un colpo critico. (Un Ladro aggiunge anche i danni addizionali del suo Attacco Furtivo contro un nemico indifeso, quando sferra un colpo di grazia.) Se il difensore sopravvive, deve superare un Tiro Salvezza su Tempra (CD 10 + danni inflitti) o muore. Infliggere un colpo di grazia provoca Attacchi di Opportunità.","Le creature immuni ai colpi critici, non subiscono danni critici, né devono superare un Tiro Salvezza su Tempra per evitare di essere uccisi da un colpo di grazia."]}],"fonte":"golarion.altervista.org, Condizioni","adattato":""},{"nome":"Infermo","gruppo":"Altre","rossa":true,"effetto":"TS e abilità −2","sintesi":"-2 TpC, danni, TS e prove","sintesi_fonte":"Guida del DM","testo":["Un personaggio infermo subisce una penalità –2 a tutti i Tiri per Colpire e per i danni delle armi, ai Tiri Salvezza, alle Prove di Abilità e di caratteristica."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni","adattato":""},{"nome":"Intralciato","gruppo":"Altre","rossa":true,"effetto":"","sintesi":"Non può correre o caricare, Velocità dimezzata, -2 TpC e -4 Des; concentrazione per lanciare incantesimi","sintesi_fonte":"Guida del DM","testo":["Il personaggio rimane intrappolato. Un personaggio intralciato ha difficoltà di movimento, ma può comunque provare a muoversi, a meno che i legami che lo intralciano non siano ancorati a un oggetto immobile o impugnati da una forza contrapposta. Una creatura intralciata può muoversi a velocità dimezzata ma non può Correre o Caricare, e subisce penalità –2 ai Tiri per Colpire e penalità –4 alla Destrezza. Un personaggio intralciato che cerca di lanciare un incantesimo deve superare una prova di Concentrazione (CD 15 + il livello dell’incantesimo) o perde l’incantesimo."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni","adattato":""},{"nome":"Invisibile","gruppo":"Altre","rossa":true,"effetto":"","sintesi":"+2 TpC contro creature visibili, nega Des, occultamento totale ma individuabile con Percezione CD 20","sintesi_fonte":"Guida del DM","testo":["Le creature invisibili non sono percepibili dalla vista, ricevono bonus +2 al Tiro per Colpire contro avversari visibili e negano il bonus di Destrezza alla CA dei loro avversari (se posseduto).","Ha occultamento totale (50% di probabilità di essere mancata), ma è individuabile con una prova di Percezione CD 20 (Guida del DM)."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni + Guida del DM","adattato":"Tolto il rimando all’incantesimo Invisibilità (non esiste); aggiunta la riga della Guida."},{"nome":"Morto","gruppo":"Altre","rossa":true,"effetto":"","sintesi":"Fuori gioco; solo la magia può riportarlo in vita","sintesi_fonte":"app","testo":["Il personaggio muore per una Ferita grave (riga «Sei morto», emorragie), quando i danni alla Costituzione ne eguagliano il punteggio, quando i livelli negativi eguagliano i Dadi Vita, o per un incantesimo o un effetto che uccide sul colpo. L’anima del personaggio abbandona permanentemente il suo corpo. I personaggi morti non possono beneficiare delle cure normali o magiche, ma possono essere riportati in vita dalla magia. Un corpo morto subisce un normale decadimento a meno che non sia conservato magicamente, ma la magia che riporta in vita un personaggio dalla morte, riporta anche il suo corpo in piena salute e alle condizioni in cui si trovava al momento della morte (in base all’incantesimo o al congegno). Ad ogni modo, i personaggi risorti non si devono preoccupare di rigor mortis, decomposizione ed altre condizioni che colpiscono i cadaveri.","Una creatura vivente che muore in combattimento ha il 20% di probabilità di restare invece morente per 1 minuto; il DM può anche deciderlo a sua discrezione. (Vol. 1)"],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni (adattato) + Vol. 1 2.5.2","adattato":"Prima frase riscritta: nella Collana si muore per le Ferite gravi, non per i PF negativi; aggiunta la riga del Vol. 1 sul Morente."},{"nome":"Nauseato","gruppo":"Altre","rossa":true,"effetto":"","sintesi":"Solo un’azione di movimento per turno","sintesi_fonte":"Guida del DM","testo":["Le creature Nauseate soffrono di disturbi di stomaco. Le creature Nauseate non sono in grado di attaccare, lanciare Incantesimi, concentrarsi sugli Incantesimi o fare qualsiasi altra cosa che richieda attenzione. La sola azione che un tale personaggio può compiere è una singola Azione di Movimento per turno."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni","adattato":""},{"nome":"Paralizzato","gruppo":"Indifeso","rossa":true,"effetto":"etichetta «Des 0, +4 ai TpC in mischia contro»","sintesi":"Ha For e Des 0 (-5); gli avversari hanno +4 ai TpC; può subire colpi di grazia","sintesi_fonte":"Guida del DM","testo":["Un personaggio paralizzato è bloccato sul posto ed è incapace di muoversi od agire. Ha punteggi effettivi di Forza e Destrezza pari a 0, è Indifeso e può compiere azioni esclusivamente mentali. Una creatura alata in volo, nel momento in cui viene paralizzata non può più battere le ali e precipita. Un nuotatore paralizzato non può più Nuotare e potrebbe annegare. Una creatura può attraversare un quadretto occupato da una creatura paralizzata, che sia un alleato o meno, ma ogni quadretto occupato da una creatura paralizzata conta come 2 quadretti di movimento."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni","adattato":""},{"nome":"Scosso","gruppo":"Paura","rossa":true,"effetto":"TS e abilità −2; su chi ha già paura vale il Terrore crescente","sintesi":"-2 TpC, TS e prove","sintesi_fonte":"Guida del DM","testo":["I personaggi che sono Scossi subiscono penalità morale –2 ai Tiri per Colpire, ai Tiri Salvezza e alle prove."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni","adattato":""},{"nome":"Spaventato","gruppo":"Paura","rossa":true,"effetto":"TS e abilità −2; su chi ha già paura vale il Terrore crescente","sintesi":"Come scosso ma fugge dalla fonte della paura e rifugge se essa si ripresenta per la durata di quell’effetto di paura","sintesi_fonte":"Guida del DM","testo":["I personaggi Spaventati sono anche Scossi, e inoltre fuggono dalla fonte della loro Paura il più velocemente possibile, anche se possono scegliere la direzione di fuga. A parte ciò, una volta che sono fuori vista (o udito) dalla fonte della loro Paura, possono agire normalmente. Se la durata della Paura non è ancora arrivata al termine, qualora dovessero incontrare di nuovo la fonte della loro Paura, cercherebbero nuovamente di fuggire. I personaggi che non sono in grado di fuggire possono combattere (anche se continuano ad essere Scossi)."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni","adattato":""},{"nome":"In Preda al Panico","gruppo":"Paura","rossa":true,"effetto":"TS e abilità −2","sintesi":"Come spaventato ma fa cadere al 50% oggetti di mano; se non può fuggire diventa accovacciato","sintesi_fonte":"Guida del DM","testo":["I personaggi In Preda al Panico sono Scossi e, inoltre, hanno una probabilità del 50% di far cadere a terra qualsiasi cosa stanno tenendo in mano, e di fuggire dalla fonte del loro terrore il più in fretta possibile seguendo un percorso di fuga completamente casuale. I personaggi In Preda al Panico fuggono davanti a qualsiasi altro pericolo che possano trovarsi di fronte. A parte ciò, una volta che sono fuori vista (o udito) dalla fonte della loro Paura, possono agire normalmente. I personaggi In Preda al Panico prendono anche la condizione Accovacciato se non possono fuggire."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni","adattato":""},{"nome":"Pietrificato","gruppo":"Altre","rossa":true,"effetto":"","sintesi":"Trasformato in pietra; conta come privo di sensi","sintesi_fonte":"app","testo":["Un personaggio pietrificato è stato trasformato in pietra ed è Privo di Sensi. Se un personaggio pietrificato si incrina o si rompe, ma i pezzi rotti sono uniti al corpo quando ritorna di carne, il personaggio non viene ferito o danneggiato. Se il corpo pietrificato del personaggio è incompleto quando viene ritrasformato in carne, il corpo rimane incompleto e potrebbe avere una qualche perdita permanente di punti ferita e/o altre menomazioni."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni","adattato":""},{"nome":"Privo di Sensi","gruppo":"Indifeso","rossa":true,"effetto":"etichetta «Des 0, +4 ai TpC in mischia contro»","sintesi":"Des 0 (-5); gli avversari hanno +4 ai TpC; può subire un Colpo di grazia","sintesi_fonte":"Guida del DM","testo":["Le creature prive di sensi sono abbattute e Indifese. La condizione può risultare da una Ferita grave o dai Danni Non Letali che superano i Punti Ferita attuali."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni (adattato)","adattato":"Nella Collana i PF negativi non esistono: si perdono i sensi per una Ferita grave o per i danni non letali."},{"nome":"Prono","gruppo":"Altre","rossa":true,"effetto":"−4 CA in mischia / +4 a distanza","sintesi":"-4 TpC e CA in mischia, nessun attacco a distanza (solo balestre), si rialza subendo AdO, +4 CA contro attacchi a distanza","sintesi_fonte":"Guida del DM","testo":["Il personaggio è a terra e subisce penalità –4 al Tiro per Colpire in mischia e non può usare armi a distanza (eccetto per la balestra). Un difensore prono ottiene bonus +4 alla Classe Armatura contro gli attacchi a distanza, ma subisce penalità –4 alla CA negli attacchi in mischia. Rialzarsi è un’azione di movimento che provoca Attacchi di Opportunità."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni","adattato":""},{"nome":"Rotto","gruppo":"Oggetti","rossa":true,"effetto":"","sintesi":"Armi −4 TpC e critico 20/×2; armature e scudi 1/3 del bonus, penalità di armatura doppia; oggetti vari senza beneficio","sintesi_fonte":"app","testo":["Quando un oggetto si danneggia ottiene 1 livello di danneggiamento. I livelli di danneggiamento sono cumulabili e sono: scheggiato → rotto → distrutto.","Le armi rotte impongono penalità -4 ai tiri per colpire e hanno un critico fisso di 20/x2.","Le armature e gli scudi rotti forniscono un terzo del bonus alla CA (per difetto e minimo +0) e raddoppiano la penalità di armatura.","Gli oggetti vari rotti non forniscono alcun beneficio.","Un oggetto rotto ha subito ingenti danni e può essere riparato solo utilizzando un bancone da artigiano ben fornito."],"sezioni":[{"titolo":"Oggetti distrutti","testo":["Le armi, le armature, gli scudi e gli oggetti vari distrutti hanno subito danni critici, non sono più utilizzabili e non possono più essere riparati (salvo diversamente indicato dal DM)."]}],"fonte":"Vol. 3 2.5.8, Riparare oggetti rotti","adattato":""},{"nome":"Sanguinante","gruppo":"Altre","rossa":true,"effetto":"","sintesi":"Subisce il danno indicato all’inizio del suo turno; si ferma con Professione (cerusico) CD 10, Sopravvivenza CD 15 o la magia","sintesi_fonte":"app","testo":["Una creatura che sta subendo danni da sanguinamento subisce la quantità di danno indicata all'inizio del suo turno. Il sanguinamento può essere interrotto con una prova di Professione (cerusico) CD 10, con una prova di Sopravvivenza CD 15 o con la magia (Vol. 1). Alcuni effetti di sanguinamento causano un danno di caratteristica o persino un risucchio di caratteristica. Gli effetti di sanguinamento non si cumulano a meno che non causino tipi differenti di danno. Quando due o più effetti di sanguinamento causano lo stesso tipo di danno, si tenga l’effetto peggiore. In questo caso, il risucchio di caratteristica è peggiore del danno di caratteristica.","Le emorragie delle Ferite gravi si fermano invece con la tabella «Fermare le emorragie» (Vol. 3)."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni (adattato) + Vol. 1 2.5.2","adattato":"Guarire non è un’abilità del sistema: vale la regola del Vol. 1 «Sanguinamento»."},{"nome":"Scheggiato","gruppo":"Oggetti","rossa":true,"effetto":"","sintesi":"Armi −2 TpC e critico 20/×2; armature e scudi metà bonus, penalità di armatura doppia; oggetti vari senza beneficio","sintesi_fonte":"app","testo":["Quando un oggetto si danneggia ottiene 1 livello di danneggiamento. I livelli di danneggiamento sono cumulabili e sono: scheggiato → rotto → distrutto.","Le armi scheggiate impongono penalità -2 ai tiri per colpire e hanno un critico fisso di 20/x2.","Le armature e gli scudi scheggiati forniscono metà bonus alla CA (per difetto e minimo +0) e raddoppiano la penalità di armatura.","Gli oggetti vari scheggiati non forniscono alcun beneficio.","Un oggetto scheggiato ha subito danni minimi e può essere riparato utilizzando un bancone da artigiano ben fornito o dei semplici attrezzi da artigiano, anche mentre si è in viaggio."],"sezioni":[],"fonte":"Vol. 3 2.5.8, Riparare oggetti rotti","adattato":""},{"nome":"Stabilizzato","gruppo":"Altre","rossa":true,"effetto":"","sintesi":"Emorragie fermate: non rischia più di morirne","sintesi_fonte":"app","testo":["Una creatura le cui emorragie sono state fermate (Professione (cerusico) o magia) è stabilizzata: non rischia più di morire per quelle emorragie, ma le ferite gravi restano finché non sono curate."],"sezioni":[],"fonte":"Collana (Massy, 01/11/2026)","adattato":"Il testo di golarion descrive il morente di Pathfinder, che nella Collana non esiste: testo riscritto (Massy, 01/11/2026)."},{"nome":"Stordito","gruppo":"Altre","rossa":true,"effetto":"CA −2; la CA mostrata è quella colto alla sprovvista","sintesi":"Fa cadere oggetti di mano, non può agire, -2 CA e no Des","sintesi_fonte":"Guida del DM","testo":["Una creatura stordita lascia cadere a terra qualsiasi cosa abbia in mano, non può compiere azioni, subisce penalità –2 alla CA, e perde il suo bonus di Destrezza alla CA (se presente)."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni (adattato)","adattato":""},{"nome":"Morente","gruppo":"Nuove","rossa":false,"effetto":"condizione narrativa degli ultimi istanti","sintesi":"Una creatura vivente sconfitta durante un combattimento ha il 20% di essere morente per un minuto.","sintesi_fonte":"Guida del DM","testo":["Morente: la creatura sta vivendo gli ultimi istanti di vita e non può essere salvata in alcun modo, né con cure né con la magia. Non può compiere azioni, ma può parlare con un filo di voce per pronunciare le ultime parole, una confessione o un indizio. Al termine della condizione muore. Una creatura vivente che muore in combattimento ha il 20% di probabilità di restare invece morente per 1 minuto; il DM può anche deciderlo a sua discrezione."],"sezioni":[],"fonte":"Vol. 1 2.5.2, Nuove condizioni","adattato":""},{"nome":"Addormentato","gruppo":"Indifeso","rossa":false,"effetto":"","sintesi":"Des 0 (-5); gli avversari hanno +4 ai TpC; può subire un Colpo di grazia","sintesi_fonte":"Guida del DM","testo":["È uno degli stati che rendono Indifeso: vedi Indifeso."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni, Indifeso","adattato":""},{"nome":"Bloccato","gruppo":"Indifeso","rossa":false,"effetto":"","sintesi":"Des 0 (-5); gli avversari hanno +4 ai TpC; può subire un Colpo di grazia","sintesi_fonte":"Guida del DM","testo":["È uno degli stati che rendono Indifeso: vedi Indifeso."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni, Indifeso","adattato":""},{"nome":"Legato","gruppo":"Indifeso","rossa":false,"effetto":"","sintesi":"Des 0 (-5); gli avversari hanno +4 ai TpC; può subire un Colpo di grazia","sintesi_fonte":"Guida del DM","testo":["È uno degli stati che rendono Indifeso: vedi Indifeso."],"sezioni":[],"fonte":"golarion.altervista.org, Condizioni, Indifeso","adattato":""},{"nome":"Livelli negativi","gruppo":"Altre","rossa":false,"effetto":"TS, abilità e DMC −N; Fatica e Ferita (massimi e correnti) −5 per livello, metà e metà, il dispari ai Ferita","sintesi":"−1 a prove, TpC, TS, BMC e DMC per livello; −5 al totale di Fatica e Ferita per livello","sintesi_fonte":"app","testo":["Ci sono creature non morte con capacità soprannaturali ed incantesimi con effetti magici che possono risucchiare la vita e l'energia vitale; questo terrificante attacco è noto come Risucchio di Energia e comporta dei Livelli Negativi che infliggono delle penalità alle creature.","Per ogni livello negativo che grava su una creatura, subisce penalità cumulativa –1 a qualsiasi prova di abilità e di caratteristica, ai tiri per colpire e ai tiri salvezza, alle prove di manovra in combattimento (BMC) e alla Difesa da Manovra in Combattimento (DMC). Inoltre, la creatura riduce il totale dei suoi Punti Fatica e Punti Ferita, massimi e correnti, di 5 per ogni livello negativo (metà ai Fatica e metà ai Ferita, il punto dispari ai Ferita). La creatura è anche considerata come se avesse un livello in meno nei riguardi dei parametri dipendenti dal livello (come il lancio degli incantesimi o alcune capacità speciali dipendenti dal livello) per ogni livello negativo posseduto.","Gli incantatori non perdono gli incantesimi preparati o gli slot in conseguenza dei livelli negativi.","Se i livelli negativi di una creatura sono uguali o superiori ai suoi Dadi Vita totali, la creatura muore."],"sezioni":[{"titolo":"Livelli negativi temporanei","testo":["Una creatura con livelli negativi temporanei ha diritto ogni giorno ad un nuovo Tiro Salvezza per rimuovere il livello negativo. La CD di questo Tiro Salvezza è la stessa dell'effetto che ha causato i livelli negativi."]},{"titolo":"Livelli negativi permanenti","testo":["Alcune capacità e certi incantesimi, come Rianimare Morti, comportano un risucchio di livello permanente ad una creatura. Questi sono trattati come livelli negativi temporanei, ma non permettono di effettuare ogni giorno un nuovo tiro salvezza per rimuoverli. I livelli negativi permanenti che gravano su una creatura vivente che dovesse morire, permangono anche dopo che la creatura morta viene riportata in vita."]},{"titolo":"Ristorare livelli negativi","testo":["Il risucchio di livello può essere eliminato con incantesimi come Ristorare. Se i livelli negativi permanenti sono pari ai Dadi Vita della creatura, questa non può essere riportata in vita con incantesimi come Rianimare Morti e Resurrezione salvo che si possa infonderle un incantesimo Ristorare, lanciato nel round immediatamente successivo a quello in cui viene riportata in vita."]}],"fonte":"golarion.altervista.org, Condizioni (adattato)","adattato":"Nella Collana i 5 PF per livello si tolgono dal totale di Punti Fatica e Punti Ferita (Massy, 01/11/2026)."}],"regole":[{"nome":"Paura","gruppo":"Paura","testo":["Incantesimi, Oggetti Magici e certe creature possono influenzare i personaggi con Paura. In molti casi, il personaggio deve effettuare un Tiro Salvezza su Volontà per resistere agli effetti, e un Tiro Salvezza fallito indica che il personaggio è Scosso, Spaventato o In Preda al Panico."],"sezioni":[{"titolo":"Terrore crescente","testo":["Gli effetti della Paura sono cumulativi. Un personaggio Scosso che viene nuovamente Scosso diventa Spaventato, mentre invece un personaggio Scosso che viene Spaventato cade In Preda Al Panico. Un personaggio Spaventato che viene Scosso o Spaventato cade In Preda al Panico."]}],"fonte":"golarion.altervista.org, Condizioni"},{"nome":"Danni non letali","gruppo":"Regole","testo":["Quando i danni non letali sono pari ai propri Punti Ferita attuali, si acquisisce la condizione barcollante, e quando li superano si perdono i sensi.","Si può usare un'arma da mischia che infligge danni letali per infliggere danni non letali, ma con penalità –4 al tiro per colpire."],"sezioni":[],"fonte":"Guida del DM, Cure e recupero"},{"nome":"Danni alle caratteristiche","gruppo":"Regole","testo":["Per ogni 2 danni inflitti ad una singola caratteristica, si applica penalità -1 alle Abilità ed alle statistiche indicate con la relativa caratteristica. Se la quantità di danno inflitto ad una caratteristica è pari o eccede il punteggio di caratteristica stesso, si perdono i sensi fino a che il danno non sia inferiore al punteggio di caratteristica. L'unica eccezione a questa regola è relativa al punteggio di Costituzione. Se il danno alla Costituzione è pari o maggiore al punteggio di Costituzione, si muore."],"sezioni":[],"fonte":"Guida del DM, Cure e recupero"}],"confuso":[{"da":1,"a":25,"testo":"Agisce normalmente"},{"da":26,"a":50,"testo":"Non fa altro che balbettare in modo incoerente"},{"da":51,"a":75,"testo":"Si infligge 1d8 + modificatore di Forza con l'arma che tiene in mano"},{"da":76,"a":100,"testo":"Attacca la creatura più vicina (a tale scopo, un Famiglio conta come parte del soggetto stesso)"}],"note":["Guida, Danni non letali: «ma con di penalità» → «ma con penalità».","Guida, Indifeso: l’asterisco «*» dopo «Colpo di grazia» non ha una nota nel PDF; tolto nella sintesi."]},"razze":{"fonte":"Razze.md (Vol. 1 «Regole e Razze» v2.5.1, Capitolo 2), copia in sorgenti/guida/razze.md","razze":[{"nome":"Umani","descrizione":"Gli umani sono la razza più numerosa al mondo. I loro imperi e nazioni sono ampi e in espansione e i cittadini di queste società scolpiscono i loro nomi con la forza delle armi e il potere dei loro incantesimi. L'umanità è meglio caratterizzata dalla sua turbolenza e diversità e le culture umane spaziano dalle tribù selvagge alle metropoli affollate. La curiosità e l'ambizione umane trionfano spesso sulla predilezione per uno stile di vita sedentario e molti lasciano le loro case per esplorare i numerosi angoli dimenticati del mondo o per condurre potenti eserciti in nome della propria nazione.","dati":{"Tipo":"umanoide con sottotipo umano.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 a una caratteristica a scelta e +1 a una seconda ma diversa caratteristica a scelta. Gli umani sono versatili, adattabili e dalle mille sfaccettature.","Linguaggi iniziali":"quello di residenza. Inoltre, possono scegliere qualsiasi linguaggio (non segreto) come linguaggio bonus dovuto all'Intelligenza.","Altezza, peso ed età":"1,50-1,95 m, 65-110 kg, aspettativa di vita massima di 100 anni circa."},"tratti":[{"nome":"Esperti","testo":"ottengono 1 punto abilità aggiuntivo per livello di personaggio."},{"nome":"Talentuosi","testo":"ottengono un talento bonus a scelta (devono soddisfarne i requisiti)."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Adattabilità marziale","descrizione":"Molti umani imparano sin da piccoli l'uso delle armi, alcuni per mera necessità, altri perché intraprendono una più o meno lunga carriera militare.","testo":"Il personaggio ottiene la competenza con tre armi da guerra a scelta. Quando il personaggio ottiene un nuovo livello, se lo desidera può cambiare una o più di queste armi così scelte."},{"nome":"Eclettico","descrizione":"Sovente umani di etnie diverse si uniscono, dando alla luce figli che si adattano con facilità agli usi e ai costumi di entrambi i genitori.","testo":"Alla creazione il personaggio non ottiene il tratto razziale Esperti. Di contro, seleziona due tratti razziali generici."},{"nome":"Eroico","descrizione":"Alcuni umani nascono per superare le avversità, proprio come gli eroi delle leggende.","testo":"Alla creazione il personaggio non ottiene il tratto razziale Talentuosi. Di contro, ottiene bonus +1 ai Tiri Salvezza."},{"nome":"Lavoro giovanile","descrizione":"Data la breve durata delle loro vite e la difficoltà a tirare avanti, molte famiglie umili devono avviare i giovani figli al duro lavoro. Questi fanciulli però, si portano dietro una grande resistenza alla fatica e la conoscenza degli strumenti tipici delle attività svolte in gioventù.","testo":"La prima volta della giornata in cui il personaggio dovrebbe diventare affaticato, può invece ignorare tale condizione. Inoltre, ottiene la competenza con accetta, martello leggero, piccone e falce."},{"nome":"Lingua d'argento","descrizione":"Gli umani sono spesso abili a manipolare il prossimo, risultando così capaci di ottenere vantaggi personali.","testo":"Una volta al giorno, il personaggio può ottenere **vantaggio** in una prova di Diplomazia o Raggirare (mentire)."},{"nome":"Mente focalizzata","descrizione":"Tutti gli umani sono molto versatili, ma alcuni, anziché esserlo in senso generale, tendono a specializzarsi in un ristretto numero di campi.","testo":"Alla creazione il personaggio non ottiene il tratto razziale Talentuosi. Di contro, al 1°, all'8° e al 16° livello ottiene il talento Abilità focalizzata."},{"nome":"Razionale","descrizione":"Nessuno più degli umani è caratterizzato da uno spirito concreto e capace di restare saldo alla realtà dei fatti.","testo":"Il personaggio ottiene bonus razziale +2 ai Tiri Salvezza contro effetti di \\[ILLUSIONE: ALLUCINAZIONE, FINZIONE, MASCHERAMENTO, OMBRA E TRAMA\\]."},{"nome":"Sfuggevole","descrizione":"Molti umani vivono sul filo del rasoio, ritrovandosi spesso in situazioni da cui è meglio tagliare la corda.","testo":"Una volta al giorno, il personaggio può ottenere **vantaggio** con +2 in una prova di Artista della fuga."}]},"tipo":"umanoide con sottotipo umano","taglia":"media","tipo_scheda":"Umanoide Medio (umano)","movimento":"9 m","sensi":[]},{"nome":"Halfling","descrizione":"All'aspetto, gli halfling sono umani in miniatura e compensano la loro piccola stazza con abbondanti spavalderia e curiosità. I loro piedi sono coperti da una soffice peluria e presentano piante spesse come suole di cuoio, motivo per cui non indossano quasi mai calzature. Agili, attenti e ottimisti per natura, gli halfling sembrano benedetti da una fortuna sfacciata. Anche nei momenti più catastrofici, gli halfling non perdono quasi mai il senso dell'umorismo e questo prendere tutto un po' alla leggera, li aiuta a proteggersi dagli orrori che solitamente atterriscono anche i combattenti più tenaci.","dati":{"Tipo":"umanoide con sottotipo halfling.","Taglia":"piccola (+1 CA, +1 ai tiri per colpire, −2 BMC, −2 DMC, +2 Furtività).","Movimento":"6 m (4 caselle).","Caratteristiche":"−2 Forza, +2 Destrezza, +2 Carisma. Gli halfling sono agili e caparbi ma deboli a causa della loro stazza.","Linguaggi iniziali":"quello di residenza e l'halfling. Inoltre, possono scegliere tra elfico, gigante, halfling e nanico come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"85 cm – 1 m, 20-35 kg, aspettativa di vita massima di 100 anni circa."},"tratti":[{"nome":"Familiarità con le armi","testo":"ottengono la competenza con la fionda e con le armi con la qualità Halfling."},{"nome":"Fortuna degli halfling","testo":"ottengono bonus razziale +1 ai Tiri Salvezza."},{"nome":"Temerarietà","testo":"ottengono bonus razziale +2 ai Tiri Salvezza contro effetti di \\[PAURA\\]. Inoltre, la CD delle prove per Intimidirli aumenta di 2."},{"nome":"Piedi saldi","testo":"ottengono bonus razziale +2 Acrobazia e +2 Scalare."},{"nome":"Sensi acuti","testo":"ottengono bonus razziale +2 Percezione."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Bambola inquietante","descrizione":"Occhi vitrei e pelle di porcellana rendono certi halfling più simili a bambole che a esseri viventi.","testo":"Se non è osservato, il personaggio può effettuare una prova di Furtività per far sì che le altre creature lo scambino per un fantoccio, come per la capacità universale dei mostri Immobilità (ma senza poter prendere 20). Questo tratto non ha effetto se gli osservatori hanno visto il personaggio muoversi di recente."},{"nome":"Colpi bassi","descrizione":"Data la stazza ridotta, per avere la meglio molti halfling si addestrano a combattere utilizzando trucchi non propriamente leali.","testo":"Il personaggio ottiene bonus razziale +2 ai tiri per confermare le minacce di critico contro gli avversari di taglia media o superiore."},{"nome":"Fanatico delle fionde","descrizione":"Gli halfling sono famosi per la loro dedizione nel tiro con la fionda, arte che praticano sin dai primi anni di vita.","testo":"Il personaggio ottiene il talento Ricarica rapida (fionde e bastoni-fionda). Se il personaggio ottiene nuovamente tale talento, una volta al giorno, quando ottiene un 1 naturale in un tiro per colpire con una fionda o un bastone-fionda, può ripetere tale tiro."},{"nome":"Fugace","descrizione":"Grazie alla loro fisionomia, gli halfling sono abilissimi a disimpegnarsi da interi gruppi di nemici sgattaiolando tra le loro gambe, facendo capriole o ardite scivolate.","testo":"Quando il personaggio effettua un'azione di ritirata, non provoca attacchi di opportunità da parte di nessun nemico durante tutto il movimento di tale azione."},{"nome":"Impercettibile","descrizione":"Gli halfling sono famosi per essere molto abili ad agire senza far rumore.","testo":"Il personaggio non subisce la penalità di −5 alle prove di Furtività mentre si muove silenziosamente a velocità normale."},{"nome":"Ingegnoso","descrizione":"Gli halfling hanno la fama di sapersela cavare con poco o nulla nelle situazioni di bisogno.","testo":"Il personaggio ottiene bonus razziale +2 Sopravvivenza e, salvo indicato dal DM, conta sempre come possedere un kit per i trucchi e degli arnesi da scasso. Inoltre, può usare metà del valore totale di Sopravvivenza al posto di Camuffare e di Disattivare congegni."},{"nome":"Schiena forte","descrizione":"Si narra che una linea di sangue degli halfling sia mischiata con sangue nanico. Vero o no, alcuni halfling hanno davvero un talento speciale per sopportare i carichi pesanti.","testo":"Il personaggio ignora la penalità al movimento imposta dalle armature medie."},{"nome":"Spirito contagioso","descrizione":"Alcuni halfling sono così temerari da essere un vero e proprio esempio di coraggio e forza d'animo.","testo":"Il bonus derivante dal tratto razziale Temerarietà diventa +4. Inoltre, se il personaggio supera un Tiro Salvezza contro un effetto di \\[PAURA\\], tutti gli alleati entro 15 m che falliscono il tiro per il medesimo effetto possono ripeterlo."}]},"tipo":"umanoide con sottotipo halfling","taglia":"piccola","tipo_scheda":"Umanoide Piccolo (halfling)","movimento":"6 m","sensi":[]},{"nome":"Nani","descrizione":"Stoici, leali, severi e coraggiosi, i nani sono tra i compagni d'avventura migliori che si possano desiderare. Si dice che al mondo nessuno possa eguagliarli come fabbri e nell'avidità con cui accumulano i tesori. Sebbene ne facciano normalmente uso, i nani sono dotati di una certa repellenza alla magia. Data la loro abitudine a vivere su picchi montani quasi inaccessibili, in costante guerra con giganti, pelleverde ed altri orrori simili, i nani sono una razza solitaria e diffidente. Coloro che nascono o che vivono a lungo in città multietniche però, sviluppano una parvenza di giovialità e finiscono quasi sempre per occupare riverite posizioni di prestigio all'interno della società.","dati":{"Tipo":"umanoide con sottotipo nano.","Taglia":"media.","Movimento":"6 m (4 caselle).","Caratteristiche":"+2 Costituzione, +2 Saggezza, −2 Carisma. I nani sono robusti e saggi ma anche molto burberi.","Linguaggi iniziali":"quello di residenza e il nanico. Inoltre, possono scegliere tra gigante e pelleverde come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"1,18-1,33 m, 72-95 kg, aspettativa di vita massima di 450 anni circa."},"tratti":[{"nome":"Scurovisione","testo":"in zone di oscurità vedono in bianco e nero entro 18 m."},{"nome":"Lenti ma determinati","testo":"ignorano la penalità al movimento imposta dalle armature."},{"nome":"Nemici giurati","testo":"ottengono +1 ai tiri per colpire contro le creature con il sottotipo pelleverde."},{"nome":"Familiarità con le armi","testo":"ottengono la competenza con l'ascia, il martello da guerra, il piccone e con le armi con la qualità Nanica."},{"nome":"Addestramento specifico","testo":"ottengono bonus di schivare +2 alla CA contro le creature con sottotipo gigante."},{"nome":"Resistenza nanica","testo":"ottengono bonus razziale +2 ai Tiri Salvezza contro gli effetti di incantesimi e capacità magiche."},{"nome":"Stabilità","testo":"ottengono bonus razziale +4 DMC per resistere alle manovre di Sbilanciare e Spingere quando si trovano sui terreni solidi."},{"nome":"Cupidigia","testo":"ottengono bonus razziale +2 Valutare (oggetti preziosi non magici e gemme)."},{"nome":"Esperti minatori","testo":"ottengono bonus razziale +2 Percezione (pericoli ambientali sotterranei; trappole e porte segrete situate su muri o pavimenti di pietra)."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Custode dei sepolcri","descrizione":"Certi nani trascorrono la gioventù sorvegliando le camere funerarie del proprio clan, spesso proteggendo gli antenati dai tombaroli, e a volte proteggendo i viventi dagli antenati stessi.","testo":"Il personaggio ottiene contro i non morti +1 ai tiri per colpire, bonus di schivare +1 alla CA, +2 ai Tiri Salvezza, +2 Intuizione e +2 Percezione."},{"nome":"Errante del sottosuolo","descrizione":"Alcuni nani sanno come muoversi all'interno di dungeon, grotte e caverne come pochi altri.","testo":"Il personaggio ottiene bonus razziale +2 Sopravvivenza (ambienti sotterranei). Inoltre, può effettuare i passi di 1,5 m all'interno dei terreni difficili sotterranei, eccetto quelli manipolati magicamente."},{"nome":"Fanatico delle armi da fuoco","descrizione":"Poche razze sono così ossessionate dalle armi da fuoco quanto i nani, tanto che alcuni le padroneggiano con un'abilità unica.","testo":"Una volta al giorno, il personaggio può disinceppare un'arma da fuoco come azione di movimento, anziché come azione di round completo."},{"nome":"Grande destino","descrizione":"Una profezia, il peso della propria genealogia o un compito di vitale importanza spinge alcuni nani a compiere gesta incredibili nel momento del più cupo bisogno.","testo":"Una volta al giorno, quando il personaggio ottiene un 1 naturale in un Tiro Salvezza o prova di abilità, può ripetere tale tiro."},{"nome":"Guardia dei picchi","descrizione":"Certi nani, per punizione o perché compito di famiglia, trascorrono la gioventù sulle vette dei monti, fungendo da vedette e difendendo le fortezze dagli attacchi nemici.","testo":"Il personaggio ottiene bonus razziale +1 ai tiri per colpire e +2 di schivare alla CA contro le creature volanti o in posizione sopraelevata. Inoltre, ottiene bonus razziale +2 Scalare e non perde mai il bonus di Destrezza quando scala o è appeso. Infine, conta sempre come indossare abiti invernali (vedi Volume 3 – Equipaggiamento: Sarti e mercerie)."},{"nome":"Nano di collina","descrizione":"Alcuni clan nanici creano da tempo immemore le loro comunità all'interno delle colline. Più svegli ma meno giudiziosi dei loro cugini, questi nani sono grandi custodi del sapere.","testo":"Il personaggio ottiene +2 Intelligenza al posto di +2 Saggezza come caratteristica razziale. Inoltre, ottiene i tratti razziali generici Studi approfonditi e Studi personali."},{"nome":"Negoziatore","descrizione":"I nani sono famosi per la loro cocciutaggine nel commercio, nelle trattative e nell'ottenere quello che vogliono in generale.","testo":"Il personaggio ottiene bonus razziale +2 Diplomazia, +2 Intuizione e +2 Valutare."},{"nome":"Oltremodo rancoroso","descrizione":"I nani sono famosi per la loro capacità nel serbare rancore. Alcuni più di altri.","testo":"Una volta al giorno, il personaggio può ottenere **vantaggio** nei tiri per colpire con armi o con colpi senz'armi del turno effettuati contro un nemico che lo abbia ferito nel round precedente."}]},"tipo":"umanoide con sottotipo nano","taglia":"media","tipo_scheda":"Umanoide Medio (nano)","movimento":"6 m","sensi":["scurovisione 18 m"]},{"nome":"Gnomi","descrizione":"Gli gnomi sono simili a nani con orecchie leggermente a punta. Sono infatti loro cugini, ne parlano la lingua e ne condividono fedi e tradizioni e, sebbene siano più minuti di loro, ne condividono inspiegabilmente la robustezza fisica. La maggior parte dei clan gnomici coesiste con quelli nanici nelle montagne, occupando di solito le zone più calde e ricche di sorgenti naturali sotterranee, zone che ospitano una grande quantità di melme attirate dai tiepidi vapori. Gli gnomi che vivono in città multietniche invece, spesso rivestono ruoli di prestigio come inventori e all'interno delle accademie scientifiche in generale. Gli gnomi hanno sensi molto sviluppati e sono dotati di una mente molto pratica, cose che li rendono meno suscettibili alle illusioni. Sono inoltre ossessionati dal proprio lavoro e dotati di un'attitudine naturale per la magia: quasi sempre le due cose si fondono garantendo risultati ottimali.","dati":{"Tipo":"umanoide con sottotipo gnomo.","Taglia":"piccola (+1 CA, +1 ai tiri per colpire, −2 BMC, −2 DMC, +2 Furtività).","Movimento":"6 m (4 caselle).","Caratteristiche":"−2 Forza, +2 Costituzione, +2 Carisma. Gli gnomi sono simpatici per natura e per quanto deboli, risultano inaspettatamente robusti.","Linguaggi iniziali":"quello di residenza e il nanico. Inoltre, possono scegliere tra gigante e pelleverde come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"95 cm – 1,10 m, 19-22 kg, aspettativa di vita massima di 300 anni circa."},"tratti":[{"nome":"Visione crepuscolare","testo":"ignorano l'occultamento dovuto alla luce fioca."},{"nome":"Nemici giurati","testo":"ottengono +1 ai tiri per colpire contro melme e le creature con il sottotipo pelleverde."},{"nome":"Familiarità con le armi","testo":"ottengono la competenza con la piccozza e con le armi con la qualità Gnomesca."},{"nome":"Addestramento specifico","testo":"ottengono bonus di schivare +2 alla CA contro le creature con sottotipo gigante."},{"nome":"Resistenza gnomesca","testo":"ottengono bonus razziale +2 ai Tiri Salvezza contro effetti di \\[ILLUSIONE: ALLUCINAZIONE, FINZIONE, MASCHERAMENTO, OMBRA E TRAMA\\]."},{"nome":"Magia pratica (Mag)","testo":"quando lanciano un incantesimo della scuola di Trasmutazione, possono aumentare di 1 il proprio livello di incantatore. Inoltre, possono lanciare una volta al giorno ciascuno gli incantesimi Aprire/Chiudere, Mano magica, Raffinare arma improvvisata e Vista dell'artigiano."},{"nome":"Sensi acuti","testo":"ottengono bonus razziale +2 Percezione."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Aggeggione","descrizione":"Gli gnomi amano toccare e provare qualsiasi cosa susciti la loro curiosità e alcuni sono ossessionati dagli oggetti magici.","testo":"Il personaggio ottiene il talento Abilità focalizzata (Utilizzare congegni magici). Inoltre, ottiene +2 Valutare (determinare se un oggetto è magico)."},{"nome":"Distratto","descrizione":"Alcuni gnomi sono sempre con la testa tra le nuvole: può capitare infatti che si ritrovino a schivare un'ascia abbassandosi per ispezionare un luccichio sospetto, o che evitino una freccia in testa chinandosi per ispezionare uno strano fungo, il tutto lasciando alleati e nemici sbigottiti e increduli.","testo":"Una volta al giorno, come azione immediata il personaggio può dichiararsi “momentaneamente distratto” per ottenere per quel turno bonus di schivare +2 alla CA contro gli attacchi non di opportunità di una singola creatura. L'uso di questo tratto razziale deve essere dichiarato prima che i tiri per colpire vengano effettuati."},{"nome":"Errante del sottosuolo","descrizione":"Alcuni gnomi sanno come muoversi all'interno di dungeon, grotte e caverne come pochi altri.","testo":"Il personaggio ottiene bonus razziale +2 Sopravvivenza (ambienti sotterranei). Inoltre, può effettuare i passi di 1,5 m all'interno dei terreni difficili sotterranei, eccetto quelli manipolati magicamente."},{"nome":"Parlantina sciolta","descrizione":"Agli gnomi piace parlare, ma alcuni sono dei veri e propri fiumi in piena in grado di confondere il prossimo.","testo":"Due volte al giorno, il personaggio può scegliere un umanoide pacifico a cui parlare per 1 minuto consecutivo. Se il personaggio vince una prova di Raggirare contrapposta a Intuizione +2 dell'umanoide, la vittima subisce gli effetti dell'incantesimo Charme su persone per 10 minuti. Questo è un effetto \\[UDITIVO\\] e \\[DIPENDENTE DAL LINGUAGGIO\\]."},{"nome":"Persecutore","descrizione":"Alcuni gnomi sono in grado di combattere con spietata efficienza e dedizione, focalizzandosi su specifici nemici.","testo":"Una volta al giorno, come azione standard il personaggio può osservare una specifica creatura, ottenendo contro di essa per 1 minuto bonus di circostanza +1 ai tiri per colpire, +2 ai danni, +2 Intuizione, +2 Percezione, +2 Raggirare (fintare) e +2 Rapidità di mano (rubare)."},{"nome":"Scienza pura","descrizione":"Tutti gli gnomi amano armeggiare, costruire e smontare. Alcuni, meno portati per la magia, senza troppi rimorsi compensano dedicandosi anima e corpo alla scienza.","testo":"Il personaggio ottiene +2 Intelligenza al posto di +2 Carisma come caratteristica razziale. Inoltre, non ottiene il tratto razziale Magia pratica e deve scegliere Professione (fabbro) come abilità di classe. Infine, ottiene la dote da inventore Mechanus potenziati."},{"nome":"Sfuggevole","descrizione":"Gli gnomi sono per natura bravissimi a ficcare il naso e a fuggire inspiegabilmente una volta colti sul fatto.","testo":"Una volta al giorno, il personaggio può ottenere **vantaggio** con +2 in una prova di Artista della fuga."},{"nome":"Vitalità gnomesca","descrizione":"Molti gnomi sono caratterizzati da una capacità di recupero sorprendente e sono in grado di recuperare dalle ferite più velocemente delle altre creature.","testo":"Il personaggio raddoppia il numero di Punti Ferita recuperati con 8 ore di riposo e viene curato di un ammontare di danni extra pari al livello di incantatore di chi lo cura dagli incantesimi che curano tramite l'energia positiva."}]},"tipo":"umanoide con sottotipo gnomo","taglia":"piccola","tipo_scheda":"Umanoide Piccolo (gnomo)","movimento":"6 m","sensi":["visione crepuscolare"]},{"nome":"Elfi","descrizione":"Gli elfi cercano di vivere in equilibrio con la natura, comprendendola meglio della maggior parte delle altre razze mortali. Parte di tale comprensione è mistica, ma altrettanta deriva dall'immortalità della razza elfica. Queste creature fatate danno valore alla riservatezza e alle tradizioni e, sebbene sia per loro piuttosto difficile instaurare nuove amicizie, una volta che uno straniero è accettato come compagno, tale alleanza può durare a lungo, talvolta estendendosi per generazioni ai figli dei figli dei figli. Gli elfi che passano le loro vite mischiati ad altre razze, spesso sviluppano una percezione distorta della mortalità, poiché il veder invecchiare e morire un infinito numero di compagni, rende queste creature cupe e silenziose.","dati":{"Tipo":"umanoide con sottotipo elfo.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Destrezza, −2 Costituzione, +2 Intelligenza. Gli elfi sono agili e dotati di grande acume, ma anche molto delicati.","Linguaggi iniziali":"quello di residenza e l'elfico. Inoltre, possono scegliere tra draconico, gnoll, pelleverde e silvano come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"1,75-2 m, 50-80 kg, una volta maturi mantengono per sempre un aspetto giovanile."},"tratti":[{"nome":"Visione crepuscolare","testo":"ignorano l'occultamento dovuto alla luce fioca."},{"nome":"Immortali","testo":"ottengono immunità agli effetti di \\[INVECCHIAMENTO\\]."},{"nome":"Sonno degli elfi","testo":"ottengono immunità agli effetti di \\[SONNO\\]. Inoltre, non necessitano di dormire per riposarsi: entrano invece in una trance vigile di quattro ore, che conta come otto ore di riposo a tutti gli effetti (subiscono comunque le penalità dovute al riposare in armatura)."},{"nome":"Familiarità con le armi","testo":"ottengono la competenza con l'arco corto, l'arco lungo, la spada lunga, lo stocco e con le armi con la qualità Elfica."},{"nome":"Resistenza elfica","testo":"ottengono bonus razziale +2 ai Tiri Salvezza contro effetti di \\[AMMALIAMENTO: CHARME E COMPULSIONE\\]."},{"nome":"Magia elfica","testo":"ottengono bonus razziale +2 alle prove di livello di incantatore effettuate per superare la RI."},{"nome":"Sensi acuti","testo":"ottengono bonus razziale +2 Percezione."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Accuratezza degli elfi","descrizione":"Molti elfi sviluppano una precisione sorprendente, anche per un popolo rinomato per tale caratteristica.","testo":"Il personaggio riduce di 10 punti percentuali la probabilità di essere mancato dovuta a occultamento e occultamento totale dei bersagli attaccati a distanza (dal 20% al 10%, dal 50% al 40%, dal 33% al 23%). Questa riduzione si applica anche agli incantesimi che forniscono probabilità di essere mancati."},{"nome":"Arroganza elfica","descrizione":"Non pochi elfi sono convinti della superiorità della razza elfica rispetto alle altre, risultando xenofobi ed avendo difficoltà nel rapportarsi col prossimo.","testo":"Il bonus del tratto razziale Resistenza elfica diventa +3 nei confronti degli effetti di \\[AMMALIAMENTO: CHARME E COMPULSIONE\\] provocati dalle creature senza il sottotipo elfo. Di contro, il personaggio subisce penalità −2 Diplomazia nei confronti delle creature senza il sottotipo elfo."},{"nome":"Attitudine magica","descrizione":"Gli elfi sono abilissimi nello sfruttare al massimo gli oggetti magici più disparati.","testo":"Il personaggio ottiene il talento Abilità focalizzata (Utilizzare congegni magici). Inoltre, ottiene +2 Valutare (determinare se un oggetto è magico)."},{"nome":"Bellezza disarmante","descrizione":"Gli elfi in generale hanno tratti particolarmente delicati e attraenti. Alcuni però, sono talmente belli che è quasi impossibile non notarli e rimanerne affascinati.","testo":"Il personaggio ottiene bonus razziale +2 Diplomazia, +2 Intrattenere e +2 Raggirare nei confronti di coloro che già sono o che potrebbero essere attratti sessualmente da lui."},{"nome":"Elfo alto","descrizione":"Quelli alti sono l'etnia di elfi più antica e nel loro sangue scorre potente la magia.","testo":"Il personaggio ottiene +2 Sapienza magica. Inoltre, ottiene +2 alle prove di Concentrazione."},{"nome":"Errante dei boschi","descrizione":"Gli elfi sono una razza con un'affinità naturale per le foreste e molti di loro sono in grado di muoversi tra alberi e cespugli con consumata abilità.","testo":"Il personaggio ottiene bonus razziale +2 Sopravvivenza (ambienti boschivi). Inoltre, può effettuare i passi di 1,5 m all'interno dei terreni difficili boschivi, eccetto quelli manipolati magicamente."},{"nome":"Impercettibile","descrizione":"Alcuni elfi sono particolarmente abili nello spostarsi senza fare rumore.","testo":"Il personaggio non subisce la penalità di −5 alle prove di Furtività mentre si muove silenziosamente a velocità normale."},{"nome":"Rapidità degli elfi","descrizione":"Alcuni elfi sviluppano una velocità a dir poco impressionante.","testo":"Il personaggio ottiene bonus di potenziamento +1,5 m alla velocità base su terreno quando non indossa armature medie o pesanti."}]},"tipo":"umanoide con sottotipo elfo","taglia":"media","tipo_scheda":"Umanoide Medio (elfo)","movimento":"9 m","sensi":["visione crepuscolare"]},{"nome":"Mezzelfi","descrizione":"Da sempre, l'immortalità, l'affinità magica e l'innata grazia degli elfi hanno contribuito a suscitare ammirazione (e spesso invidia) nel prossimo. Di tutte queste caratteristiche però, nessuna è più attraente per gli umani della loro bellezza e da sempre questi vedono gli elfi come modelli di perfezione fisica e versioni idealizzate di sé stessi. Da parte loro, molti elfi trovano gli umani grezzi ma attraenti, ammaliati dalla passione e dall'impeto con cui i membri di questa giovane razza vivono la propria breve esistenza. Benché solitamente di breve durata, queste unioni possono portare alla nascita di una razza che discende da due culture, ma che non è erede di nessuna. Presi tra il destino e la derisione, i mezzelfi sono al contempo odiati e desiderati per il loro fascino esotico. Ciò li porta a essere creature molto sole e sempre sul chi va là.","dati":{"Tipo":"umanoide con sottotipo umano e sottotipo elfo.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 ad una caratteristica a scelta. I mezzelfi ereditano l'ecletticità del sangue umano, risultando creature altamente adattabili.","Linguaggi iniziali":"quello di residenza. Inoltre, possono scegliere qualsiasi linguaggio (non segreto) come linguaggio bonus dovuto all'Intelligenza.","Altezza, peso ed età":"1,50-1,95 m, 65-110 kg, aspettativa di vita massima di 185 anni circa."},"tratti":[{"nome":"Mezzosangue","testo":"contano sia come umani che elfi al fine di qualsiasi requisito, ad eccezione di quelli degli archetipi."},{"nome":"Visione crepuscolare","testo":"ignorano l'occultamento dovuto alla luce fioca."},{"nome":"Sonno degli elfi","testo":"ottengono immunità agli effetti di \\[SONNO\\]."},{"nome":"Resistenza elfica","testo":"ottengono bonus razziale +2 ai Tiri Salvezza contro effetti di \\[AMMALIAMENTO: CHARME E COMPULSIONE\\]."},{"nome":"Vigili","testo":"quando sono impreparati, subiscono penalità di −3 alla prova di Iniziativa, anziché di −6."},{"nome":"Scaltri","testo":"ottengono bonus razziale +2 Diplomazia e +2 Intuizione. Inoltre, una volta al giorno possono ripetere una prova di Diplomazia fallita."},{"nome":"Sensi acuti","testo":"ottengono bonus razziale +2 Percezione."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Ammaliatore","descrizione":"Grazie al loro bell'aspetto e ai modi cordiali, alcuni mezzelfi diventano degli ammaliatori senza pari.","testo":"Quando il personaggio lancia un incantesimo della scuola di Ammaliamento, può aumentare di 1 il proprio livello di incantatore o la CD dell'incantesimo."},{"nome":"Familiarità con le armi elfiche","descrizione":"Certi mezzelfi ricevono un addestramento marziale dai genitori, al fine di esser meglio preparati ad affrontare l'incerto futuro.","testo":"Il personaggio ottiene la competenza con l'arco corto, l'arco lungo, la spada lunga, lo stocco e con le armi con la qualità Elfica."},{"nome":"Generazione avanzata","descrizione":"I mezzelfi di terza generazione o più, sono caratterizzati dalla tipica curiosità umana, presentando lineamenti meno fini e orecchie tonde.","testo":"Il personaggio non ottiene il tratto razziale Resistenza elfica. Di contro, ottiene il talento Astuto (non deve soddisfarne i requisiti) e non necessita di superare prove di Camuffare per apparire come un umano."},{"nome":"Mente duplice","descrizione":"La fusione di due distinti modi di pensare rende alcuni mezzelfi decisi e tenaci.","testo":"Il personaggio ottiene bonus razziale +1 ai Tiri Salvezza contro effetti di \\[AMMALIAMENTO: CHARME E COMPULSIONE\\]. Inoltre, la CD delle prove per Intimidire il personaggio aumenta di 2."},{"nome":"Opportunista","descrizione":"Vivendo costantemente a cavallo di due razze diverse, alcuni mezzelfi sviluppano un talento eccezionale per scovare le buone opportunità, specialmente durante i combattimenti.","testo":"Il personaggio ottiene bonus razziale +1 ai tiri per colpire con gli attacchi di opportunità."},{"nome":"Sangue degli elfi alti","descrizione":"Alcuni mezzosangue nati dagli elfi alti, ereditano la spiccata affinità con la magia tipica di tale etnia elfica.","testo":"Il personaggio ottiene +2 Sapienza magica. Inoltre, non appena ha 4 gradi in Sapienza magica, ottiene il talento Incantatore provetto."},{"nome":"Sangue dei drow","descrizione":"Alcuni mezzosangue nati da drow, ne ereditano l'innata resistenza alla magia.","testo":"Il personaggio ottiene RI 6 + livello di personaggio. Si può sopprimere o riattivare questa RI come azione veloce."},{"nome":"Svelto","descrizione":"Il tempismo è tutto per un mezzelfo ed alcuni sembrano proprio avere una marcia in più in questo senso.","testo":"Il personaggio ottiene bonus +2 alle prove di Iniziativa, non cumulabile con il talento Iniziativa migliorata."}]},"tipo":"umanoide con sottotipo umano e sottotipo elfo","taglia":"media","tipo_scheda":"Umanoide Medio (umano, elfo)","movimento":"9 m","sensi":["visione crepuscolare"]},{"nome":"Mezzorchi","descrizione":"I primi mezzorchi nacquero come il risultato di perversione e violenza e ciò da sempre contribuisce a fomentare l'idea che tali creature siano degli abomini o, nel migliore dei casi, delle bestie. Questo porta molti mezzorchi a reagire con forza a tali pregiudizi, e quindi anche a confermarli senza volerlo. Attenti sin da piccoli ad evitare le pietre e le bastonate scagliate a tradimento, i mezzorchi sono soliti guardarsi sempre le spalle. Il sangue pelleverde caratterizza queste creature con una grande resistenza mentre quello umano dona loro una versatilità che li rende capaci di destreggiarsi in molteplici campi e situazioni.","dati":{"Tipo":"umanoide con sottotipo umano e sottotipo pelleverde.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Forza, +2 Costituzione, −2 Destrezza. I mezzorchi devono compensare la forte muscolatura orchesca con corpi robusti, il che li rende un po' goffi.","Linguaggi iniziali":"quello di residenza. Inoltre, possono scegliere tra gigante, gnoll e pelleverde come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"1,65-2 m, 82-130 kg, aspettativa di vita massima di 100 anni circa."},"tratti":[{"nome":"Mezzosangue","testo":"contano sia come umani che orchi al fine di qualsiasi requisito, ad eccezione di quelli degli archetipi."},{"nome":"Scurovisione","testo":"in zone di oscurità vedono in bianco e nero entro 18 m."},{"nome":"Familiarità con le armi","testo":"ottengono la competenza con l'ascia bipenne, il falchion e con le armi con la qualità Orchesca."},{"nome":"Cauti combattenti","testo":"i nemici che fiancheggiano il personaggio riducono di 2 il bonus ai tiri per colpire derivante dal fiancheggiamento."},{"nome":"Resilienza orchesca","testo":"ottengono il talento Duro a morire (non devono soddisfarne i requisiti)."},{"nome":"Minacciosi","testo":"ottengono bonus razziale +2 Intimidire."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Avvezzo allo squallore","descrizione":"I mezzorchi sono a volte costretti a vivere a lungo presso i margini rancidi ed antigienici della società e solo i più forti sopravvivono all'esperienza.","testo":"Il personaggio ottiene bonus razziale +2 ai Tiri Salvezza contro effetti di \\[MALATTIA\\], \\[INFERMITÀ\\] e \\[NAUSEA\\]."},{"nome":"Domatore","descrizione":"Alcuni mezzorchi hanno una speciale attitudine all'addestrare animali feroci (e a volte schiavi), diventando domatori eccellenti.","testo":"Il personaggio ottiene bonus razziale +2 Intimidire. Inoltre, ottiene la competenza con la frusta e la frusta a nove sezioni. Infine, ottiene il talento Maestria con la frusta (non deve soddisfarne i requisiti)."},{"nome":"Faccia a faccia","descrizione":"In alcuni mezzorchi arde un fuoco che non può essere estinto. Questi individui si crogiolano nella sfida uno contro uno, fino a lasciarsi andare a risate incontrollate nel cuore dei duelli.","testo":"Il personaggio ottiene bonus razziale +1 ai tiri per colpire in mischia contro i nemici che non sono minacciati da nessun'altra creatura."},{"nome":"Fiuto","descrizione":"Il sangue orchesco offre ad alcuni mezzorchi un olfatto sviluppato, a discapito di una vista più scadente.","testo":"Il personaggio ottiene la regola Fiuto, ma subisce penalità −2 Percezione (vista)."},{"nome":"Generazione avanzata","descrizione":"Mezzorchi di terza generazione o più, spesso risentono quasi totalmente del loro retaggio umano rispetto a quello orchesco, presentando lineamenti più fini e orecchie tonde.","testo":"Il personaggio non ottiene il tratto razziale Scurovisione. Di contro, ottiene il talento Astuto (non deve soddisfarne i requisiti) e non necessita di superare prove di Camuffare per apparire come un umano."},{"nome":"Mente duplice","descrizione":"La fusione di due distinti modi di pensare rende alcuni mezzorchi decisi e tenaci.","testo":"Il personaggio ottiene bonus razziale +1 ai Tiri Salvezza contro effetti di \\[AMMALIAMENTO: CHARME E COMPULSIONE\\]. Inoltre, la CD delle prove per Intimidire il personaggio aumenta di 2."},{"nome":"Sadico","descrizione":"Alcuni mezzorchi sviluppano forme di sadismo e sono ossessionati dal colpire i propri nemici nel modo più doloroso possibile.","testo":"Il personaggio ottiene bonus razziale +2 ai tiri per confermare le minacce di critico in mischia."},{"nome":"Sangue degli orchi neri","descrizione":"I mezzorchi discendenti dagli orchi neri ne ereditano l'incredibile capacità di sopportare la fatica.","testo":"Il personaggio ottiene il talento Resistenza fisica. Inoltre, può dormire in armatura pesante senza svegliarsi affaticato."}]},"tipo":"umanoide con sottotipo umano e sottotipo pelleverde","taglia":"media","tipo_scheda":"Umanoide Medio (umano, pelleverde)","movimento":"9 m","sensi":["scurovisione 18 m"]},{"nome":"Dhampir","descrizione":"I dhampir sono il risultato dell'accoppiamento tra un vampiro e un mortale. Il sangue non morto dona loro una grande forza ma, al contempo, li rende un passo più vicini alla morte dei comuni mortali. A dispetto del loro fascino innato, i dhampir crescono solitamente in solitudine, dovendo affrontare un'esistenza di pregiudizio, sfiducia, paura e persecuzione. Gli umani testimoni della natura apparentemente sinistra di un dhampir, sono colti da una serie di reazioni che variano dal timore all'odio. Sebbene ogni vampiro abbia poteri unici che lo contraddistinguono, è impossibile sapere quali di essi verranno ereditati dalla sua progenie mortale. I dhampir vivono e muoiono proprio come qualsiasi altra creatura vivente, spesso tra mille tribolazioni.","dati":{"Tipo":"umanoide con sottotipo dhampir.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Destrezza, −2 Costituzione, +2 Carisma. Agili e seducenti, i dhampir sono più vicini alla morte della maggior parte delle altre razze.","Linguaggi iniziali":"quello di residenza. Inoltre, possono scegliere qualsiasi linguaggio (non segreto) come linguaggio bonus dovuto all'Intelligenza.","Altezza, peso ed età":"1,50-1,95 m, 65-110 kg, aspettativa di vita massima di 110 anni circa."},"tratti":[{"nome":"Scurovisione","testo":"in zone di oscurità vedono in bianco e nero entro 18 m."},{"nome":"Sangue non morto","testo":"ottengono bonus razziale +2 ai Tiri Salvezza contro l'energia negativa e gli effetti di \\[MALATTIA\\] e \\[INFLUENZA MENTALE: CHARME, COMPULSIONE, FINZIONE, TRAMA E MORALE\\]."},{"nome":"Resistenza non morta","testo":"non subiscono penalità quando acquisiscono livelli negativi temporanei ma muoiono se accumulano più livelli negativi dei propri Dadi Vita. Dopo 24 ore, qualsiasi livello negativo temporaneo ottenuto viene rimosso automaticamente."},{"nome":"Manipolatori","testo":"ottengono bonus razziale +2 Raggirare."},{"nome":"Sensi acuti","testo":"ottengono bonus razziale +2 Percezione."}],"opzioni":{"titolo":"Poteri vampirici","intro":"Si ottengono due poteri casuali tra quelli sotto elencati o se ne sceglie uno. Il personaggio può usare ciascun potere una volta al giorno e la CD per resistervi è pari a 10 + metà livello di personaggio + bonus di caratteristica mentale più alto. In alternativa, si può scegliere uno dei tratti razziali generici descritti alla fine di questo volume.","voci":[{"nome":"01 – Aspetto terrificante (Sop)","descrizione":"","testo":"Come azione standard il personaggio appare come mostruoso e tutti i nemici viventi entro 6 m devono superare un Tiro Salvezza o diventare spaventati per 2 round. Coloro che superano il tiro sono comunque scossi per 1 round. Questo potere non ha effetto sui nemici con 4 o più Dadi Vita rispetto al personaggio."},{"nome":"02 – Barriera di vento (Sop)","descrizione":"","testo":"Come azione standard il personaggio si circonda per 1 minuto di un vento impetuoso che respinge automaticamente gli attacchi delle armi da tiro e da lancio di taglia media o inferiore, i gas (compresi i soffi gassosi) e le creature volanti di taglia piccola o inferiore."},{"nome":"03 – Chiamata del padrone (Sop)","descrizione":"","testo":"Come azione di round completo il personaggio richiama un lupo, un pipistrello, un topo o un parassita. L'animale deve essere presente nel raggio di 5 km e si muoverà al massimo delle proprie possibilità per rispondere alla chiamata. L'animale risponderà automaticamente alle domande postegli dal personaggio come per l'incantesimo Parlare con gli animali."},{"nome":"04 – Forma di bruma (Sop)","descrizione":"","testo":"Come azione veloce fino alla fine del turno il personaggio ottiene occultamento totale verso gli attacchi di opportunità dovuti al movimento."},{"nome":"05 – Mesmerismo (Mag)","descrizione":"","testo":"Come azione standard il personaggio proietta uno sguardo ipnotico con gli effetti dell'incantesimo Charme su persone o Charme su animali (durata 1 ora)."},{"nome":"06 – Possanza del sangue (Sop)","descrizione":"","testo":"Come azione veloce il personaggio ottiene per 3 round +2 alle prove di abilità basate su Forza, +2 BMC, +2 DMC e la capacità di compiere salti fino a 4,5 m in lunghezza e 1,5 m in altezza."},{"nome":"07 – Prosciuga vita (Sop)","descrizione":"","testo":"Come azione veloce il personaggio circonda la propria mano di un vivido alone cremisi. Finché l'alone persiste, il personaggio può compiere attacchi di contatto in mischia contro le creature viventi; questi attacchi infliggono 1d3+1 danni ogni due livelli di personaggio e curano il personaggio di un pari ammontare di danni (non si può curare più danni dei Punti Ferita attuali del bersaglio). L'alone scompare quando il personaggio mette a segno un colpo o dopo 3 round."},{"nome":"08 – Scatto controllato (Sop)","descrizione":"","testo":"Quando effettua una carica o una ritirata, il personaggio ottiene bonus +3 m alla velocità base su terreno (e quindi un totale di +6 m durante tali azioni) e non subisce la consueta penalità di −2 alla CA dovuta alla carica."},{"nome":"09 – Sensi oscuri (Sop)","descrizione":"","testo":"Come azione standard il personaggio può individuare per 10 minuti la presenza di non morti e creature malvagie entro 9 m."},{"nome":"10 – Traslazione (Sop)","descrizione":"","testo":"Quando il personaggio compie un passo di 1,5 m può invece spostarsi di 3 m, con i medesimi effetti."}]},"tipo":"umanoide con sottotipo dhampir","taglia":"media","tipo_scheda":"Umanoide Medio (dhampir)","movimento":"9 m","sensi":["scurovisione 18 m"]},{"nome":"Strigoi","descrizione":"Uno strigoi è il frutto dell'unione tra una megera e un mortale, irretito grazie alla magia o chissà quale terribile espediente. Gli strigoi ereditano alcuni tratti matriarcali, che variano da megera a megera e questo si manifesta col tempo. Quasi sempre abbandonati, i piccoli strigoi vengono spesso cresciuti da estranei, a volte amorevolmente, a volte nella miseria e nell'astio ma crescendo introversi e poco inclini alla socialità. Raggiunta la pubertà, sentono un impulso interiore che li incita a viaggiare e scoprire le loro vere origini. Coloro che resistono a questo richiamo, possono scegliere il proprio destino. Quelli che non vi riescono invece, o che addirittura lo assecondano consciamente, vanno alla ricerca delle loro vere madri, ignari di ciò che li attende lungo il cammino. In qualunque caso, gli strigoi sono creature misteriose che variano da eleganti signorotti, a solitari eremiti che vivono in luoghi isolati.","dati":{"Tipo":"umanoide con sottotipo strigoi.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Costituzione, +2 Intelligenza, −2 Carisma. Gli strigoi ereditano l'innaturale robustezza e l'acume delle megere ma a causa della loro oscura natura sono esseri schivi e riservati.","Linguaggi iniziali":"quello di residenza. Inoltre, possono scegliere qualsiasi linguaggio (non segreto) come linguaggio bonus dovuto all'Intelligenza.","Altezza, peso ed età":"1,50-1,95 m, 65-110 kg, aspettativa di vita massima di 110 anni circa."},"tratti":[{"nome":"Tratti indistinguibili","testo":"non necessitano di superare prove di Camuffare per apparire come umani."},{"nome":"Pelle spessa","testo":"ottengono bonus +1 alla CA Naturale."},{"nome":"Resistenza delle megere","testo":"ottengono bonus razziale +2 ai Tiri Salvezza contro effetti di \\[CHARME\\] e \\[MALEDIZIONE\\]."},{"nome":"Passo stregato","testo":"ignorano le penalità al movimento dovute a uno specifico tipo di terreno difficile a scelta, eccetto quelli manipolati magicamente. La lista degli ambienti include: acquatico, caldo, deserto, foresta, freddo, montagna, pianura e collina, palude, sotterraneo e urbano."}],"opzioni":{"titolo":"Retaggi oscuri","intro":"Si sceglie un retaggio tra quelli sotto elencati. In alternativa, si può scegliere uno dei tratti razziali generici descritti alla fine di questo volume. La CD per resistere ai retaggi è pari a 10 + metà livello di personaggio + bonus di caratteristica mentale più alto.","voci":[{"nome":"Sangue delle megere annis","descrizione":"I discendenti delle annis ereditano la forza inumana delle loro madri.","testo":"Il personaggio ottiene bonus +1 ai danni in mischia."},{"nome":"Sangue delle megere ardenti","descrizione":"Questi strigoi possono canalizzare l'energia derivante dal loro retaggio, per infliggere danni aggravati a base di fuoco.","testo":"Il personaggio infligge 1 danno extra per dado lanciato con gli incantesimi che infliggono danni da fuoco. Questo danno extra non è cumulabile con altri simili."},{"nome":"Sangue delle megere delle ceneri (Sop)","descrizione":"La progenie di una megera delle ceneri è in grado di riempire i polmoni dei nemici con cenere e fuliggine.","testo":"Due volte al giorno, come azione standard il personaggio può riempire con cenere bollente i polmoni di una creatura entro 9 m. La vittima deve superare un Tiro Salvezza su Tempra o diventare barcollante per 1 round."},{"nome":"Sangue delle megere cieche","descrizione":"I figli delle megere cieche sono in grado di combattere senza l'ausilio della vista, percependo i nemici attraverso il movimento.","testo":"Il personaggio ottiene il talento Combattere alla cieca."},{"nome":"Sangue delle megere marine","descrizione":"La progenie di una megera marina è capace di trattenere il respiro per lunghi periodi di tempo.","testo":"Il personaggio ottiene bonus razziale +4 Nuotare. Inoltre, può trattenere il fiato sott'acqua per un numero di round pari a quattro volte (anziché due) il proprio punteggio di Costituzione."},{"nome":"Sangue delle megere notturne","descrizione":"Alcuni strigoi scoprono di riuscire a vedere nella penombra e sviluppano una particolare resistenza alle malattie, chiaro retaggio della loro discendenza.","testo":"Il personaggio ottiene Visione crepuscolare e +2 ai Tiri Salvezza contro gli effetti di \\[MALATTIA\\]."},{"nome":"Sangue delle megere sanguinarie (Sop)","descrizione":"Questi strigoi, come le loro madri, possono alterare la propria aura, facendo sì che gli altri li percepiscano in modo diverso.","testo":"All'alba di ogni giorno, il personaggio può scegliere un allineamento fino a due passi di distanza dal proprio e le divinazioni considerano il personaggio come avere tale allineamento."},{"nome":"Sangue delle megere verdi","descrizione":"Proprio come le loro mostruose madri, i discendenti delle megere verdi sono in grado di apparire irresistibili e affascinare il prossimo.","testo":"Il personaggio ottiene bonus razziale +2 Diplomazia, +2 Intrattenere e
