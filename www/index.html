a, lo stocco e con le armi con la qualità Elfica."},{"nome":"Generazione avanzata","descrizione":"I mezzelfi di terza generazione o più, sono caratterizzati dalla tipica curiosità umana, presentando lineamenti meno fini e orecchie tonde.","testo":"Il personaggio non ottiene il tratto razziale Resistenza elfica. Di contro, ottiene il talento Astuto (non deve soddisfarne i requisiti) e non necessita di superare prove di Camuffare per apparire come un umano."},{"nome":"Mente duplice","descrizione":"La fusione di due distinti modi di pensare rende alcuni mezzelfi decisi e tenaci.","testo":"Il personaggio ottiene bonus razziale +1 ai Tiri Salvezza contro effetti di \\[AMMALIAMENTO: CHARME E COMPULSIONE\\]. Inoltre, la CD delle prove per Intimidire il personaggio aumenta di 2."},{"nome":"Opportunista","descrizione":"Vivendo costantemente a cavallo di due razze diverse, alcuni mezzelfi sviluppano un talento eccezionale per scovare le buone opportunità, specialmente durante i combattimenti.","testo":"Il personaggio ottiene bonus razziale +1 ai tiri per colpire con gli attacchi di opportunità."},{"nome":"Sangue degli elfi alti","descrizione":"Alcuni mezzosangue nati dagli elfi alti, ereditano la spiccata affinità con la magia tipica di tale etnia elfica.","testo":"Il personaggio ottiene +2 Sapienza magica. Inoltre, non appena ha 4 gradi in Sapienza magica, ottiene il talento Incantatore provetto."},{"nome":"Sangue dei drow","descrizione":"Alcuni mezzosangue nati da drow, ne ereditano l'innata resistenza alla magia.","testo":"Il personaggio ottiene RI 6 + livello di personaggio. Si può sopprimere o riattivare questa RI come azione veloce."},{"nome":"Svelto","descrizione":"Il tempismo è tutto per un mezzelfo ed alcuni sembrano proprio avere una marcia in più in questo senso.","testo":"Il personaggio ottiene bonus +2 alle prove di Iniziativa, non cumulabile con il talento Iniziativa migliorata."}]},"tipo":"umanoide con sottotipo umano e sottotipo elfo","taglia":"media","tipo_scheda":"Umanoide Medio (umano, elfo)","movimento":"9 m","sensi":["visione crepuscolare"]},{"nome":"Mezzorchi","descrizione":"I primi mezzorchi nacquero come il risultato di perversione e violenza e ciò da sempre contribuisce a fomentare l'idea che tali creature siano degli abomini o, nel migliore dei casi, delle bestie. Questo porta molti mezzorchi a reagire con forza a tali pregiudizi, e quindi anche a confermarli senza volerlo. Attenti sin da piccoli ad evitare le pietre e le bastonate scagliate a tradimento, i mezzorchi sono soliti guardarsi sempre le spalle. Il sangue pelleverde caratterizza queste creature con una grande resistenza mentre quello umano dona loro una versatilità che li rende capaci di destreggiarsi in molteplici campi e situazioni.","dati":{"Tipo":"umanoide con sottotipo umano e sottotipo pelleverde.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Forza, +2 Costituzione, −2 Destrezza. I mezzorchi devono compensare la forte muscolatura orchesca con corpi robusti, il che li rende un po' goffi.","Linguaggi iniziali":"quello di residenza. Inoltre, possono scegliere tra gigante, gnoll e pelleverde come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"1,65-2 m, 82-130 kg, aspettativa di vita massima di 100 anni circa."},"tratti":[{"nome":"Mezzosangue","testo":"contano sia come umani che orchi al fine di qualsiasi requisito, ad eccezione di quelli degli archetipi."},{"nome":"Scurovisione","testo":"in zone di oscurità vedono in bianco e nero entro 18 m."},{"nome":"Familiarità con le armi","testo":"ottengono la competenza con l'ascia bipenne, il falchion e con le armi con la qualità Orchesca."},{"nome":"Cauti combattenti","testo":"i nemici che fiancheggiano il personaggio riducono di 2 il bonus ai tiri per colpire derivante dal fiancheggiamento."},{"nome":"Resilienza orchesca","testo":"ottengono il talento Duro a morire (non devono soddisfarne i requisiti)."},{"nome":"Minacciosi","testo":"ottengono bonus razziale +2 Intimidire."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Avvezzo allo squallore","descrizione":"I mezzorchi sono a volte costretti a vivere a lungo presso i margini rancidi ed antigienici della società e solo i più forti sopravvivono all'esperienza.","testo":"Il personaggio ottiene bonus razziale +2 ai Tiri Salvezza contro effetti di \\[MALATTIA\\], \\[INFERMITÀ\\] e \\[NAUSEA\\]."},{"nome":"Domatore","descrizione":"Alcuni mezzorchi hanno una speciale attitudine all'addestrare animali feroci (e a volte schiavi), diventando domatori eccellenti.","testo":"Il personaggio ottiene bonus razziale +2 Intimidire. Inoltre, ottiene la competenza con la frusta e la frusta a nove sezioni. Infine, ottiene il talento Maestria con la frusta (non deve soddisfarne i requisiti)."},{"nome":"Faccia a faccia","descrizione":"In alcuni mezzorchi arde un fuoco che non può essere estinto. Questi individui si crogiolano nella sfida uno contro uno, fino a lasciarsi andare a risate incontrollate nel cuore dei duelli.","testo":"Il personaggio ottiene bonus razziale +1 ai tiri per colpire in mischia contro i nemici che non sono minacciati da nessun'altra creatura."},{"nome":"Fiuto","descrizione":"Il sangue orchesco offre ad alcuni mezzorchi un olfatto sviluppato, a discapito di una vista più scadente.","testo":"Il personaggio ottiene la regola Fiuto, ma subisce penalità −2 Percezione (vista)."},{"nome":"Generazione avanzata","descrizione":"Mezzorchi di terza generazione o più, spesso risentono quasi totalmente del loro retaggio umano rispetto a quello orchesco, presentando lineamenti più fini e orecchie tonde.","testo":"Il personaggio non ottiene il tratto razziale Scurovisione. Di contro, ottiene il talento Astuto (non deve soddisfarne i requisiti) e non necessita di superare prove di Camuffare per apparire come un umano."},{"nome":"Mente duplice","descrizione":"La fusione di due distinti modi di pensare rende alcuni mezzorchi decisi e tenaci.","testo":"Il personaggio ottiene bonus razziale +1 ai Tiri Salvezza contro effetti di \\[AMMALIAMENTO: CHARME E COMPULSIONE\\]. Inoltre, la CD delle prove per Intimidire il personaggio aumenta di 2."},{"nome":"Sadico","descrizione":"Alcuni mezzorchi sviluppano forme di sadismo e sono ossessionati dal colpire i propri nemici nel modo più doloroso possibile.","testo":"Il personaggio ottiene bonus razziale +2 ai tiri per confermare le minacce di critico in mischia."},{"nome":"Sangue degli orchi neri","descrizione":"I mezzorchi discendenti dagli orchi neri ne ereditano l'incredibile capacità di sopportare la fatica.","testo":"Il personaggio ottiene il talento Resistenza fisica. Inoltre, può dormire in armatura pesante senza svegliarsi affaticato."}]},"tipo":"umanoide con sottotipo umano e sottotipo pelleverde","taglia":"media","tipo_scheda":"Umanoide Medio (umano, pelleverde)","movimento":"9 m","sensi":["scurovisione 18 m"]},{"nome":"Dhampir","descrizione":"I dhampir sono il risultato dell'accoppiamento tra un vampiro e un mortale. Il sangue non morto dona loro una grande forza ma, al contempo, li rende un passo più vicini alla morte dei comuni mortali. A dispetto del loro fascino innato, i dhampir crescono solitamente in solitudine, dovendo affrontare un'esistenza di pregiudizio, sfiducia, paura e persecuzione. Gli umani testimoni della natura apparentemente sinistra di un dhampir, sono colti da una serie di reazioni che variano dal timore all'odio. Sebbene ogni vampiro abbia poteri unici che lo contraddistinguono, è impossibile sapere quali di essi verranno ereditati dalla sua progenie mortale. I dhampir vivono e muoiono proprio come qualsiasi altra creatura vivente, spesso tra mille tribolazioni.","dati":{"Tipo":"umanoide con sottotipo dhampir.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Destrezza, −2 Costituzione, +2 Carisma. Agili e seducenti, i dhampir sono più vicini alla morte della maggior parte delle altre razze.","Linguaggi iniziali":"quello di residenza. Inoltre, possono scegliere qualsiasi linguaggio (non segreto) come linguaggio bonus dovuto all'Intelligenza.","Altezza, peso ed età":"1,50-1,95 m, 65-110 kg, aspettativa di vita massima di 110 anni circa."},"tratti":[{"nome":"Scurovisione","testo":"in zone di oscurità vedono in bianco e nero entro 18 m."},{"nome":"Sangue non morto","testo":"ottengono bonus razziale +2 ai Tiri Salvezza contro l'energia negativa e gli effetti di \\[MALATTIA\\] e \\[INFLUENZA MENTALE: CHARME, COMPULSIONE, FINZIONE, TRAMA E MORALE\\]."},{"nome":"Resistenza non morta","testo":"non subiscono penalità quando acquisiscono livelli negativi temporanei ma muoiono se accumulano più livelli negativi dei propri Dadi Vita. Dopo 24 ore, qualsiasi livello negativo temporaneo ottenuto viene rimosso automaticamente."},{"nome":"Manipolatori","testo":"ottengono bonus razziale +2 Raggirare."},{"nome":"Sensi acuti","testo":"ottengono bonus razziale +2 Percezione."}],"opzioni":{"titolo":"Poteri vampirici","intro":"Si ottengono due poteri casuali tra quelli sotto elencati o se ne sceglie uno. Il personaggio può usare ciascun potere una volta al giorno e la CD per resistervi è pari a 10 + metà livello di personaggio + bonus di caratteristica mentale più alto. In alternativa, si può scegliere uno dei tratti razziali generici descritti alla fine di questo volume.","voci":[{"nome":"01 – Aspetto terrificante (Sop)","descrizione":"","testo":"Come azione standard il personaggio appare come mostruoso e tutti i nemici viventi entro 6 m devono superare un Tiro Salvezza o diventare spaventati per 2 round. Coloro che superano il tiro sono comunque scossi per 1 round. Questo potere non ha effetto sui nemici con 4 o più Dadi Vita rispetto al personaggio."},{"nome":"02 – Barriera di vento (Sop)","descrizione":"","testo":"Come azione standard il personaggio si circonda per 1 minuto di un vento impetuoso che respinge automaticamente gli attacchi delle armi da tiro e da lancio di taglia media o inferiore, i gas (compresi i soffi gassosi) e le creature volanti di taglia piccola o inferiore."},{"nome":"03 – Chiamata del padrone (Sop)","descrizione":"","testo":"Come azione di round completo il personaggio richiama un lupo, un pipistrello, un topo o un parassita. L'animale deve essere presente nel raggio di 5 km e si muoverà al massimo delle proprie possibilità per rispondere alla chiamata. L'animale risponderà automaticamente alle domande postegli dal personaggio come per l'incantesimo Parlare con gli animali."},{"nome":"04 – Forma di bruma (Sop)","descrizione":"","testo":"Come azione veloce fino alla fine del turno il personaggio ottiene occultamento totale verso gli attacchi di opportunità dovuti al movimento."},{"nome":"05 – Mesmerismo (Mag)","descrizione":"","testo":"Come azione standard il personaggio proietta uno sguardo ipnotico con gli effetti dell'incantesimo Charme su persone o Charme su animali (durata 1 ora)."},{"nome":"06 – Possanza del sangue (Sop)","descrizione":"","testo":"Come azione veloce il personaggio ottiene per 3 round +2 alle prove di abilità basate su Forza, +2 BMC, +2 DMC e la capacità di compiere salti fino a 4,5 m in lunghezza e 1,5 m in altezza."},{"nome":"07 – Prosciuga vita (Sop)","descrizione":"","testo":"Come azione veloce il personaggio circonda la propria mano di un vivido alone cremisi. Finché l'alone persiste, il personaggio può compiere attacchi di contatto in mischia contro le creature viventi; questi attacchi infliggono 1d3+1 danni ogni due livelli di personaggio e curano il personaggio di un pari ammontare di danni (non si può curare più danni dei Punti Ferita attuali del bersaglio). L'alone scompare quando il personaggio mette a segno un colpo o dopo 3 round."},{"nome":"08 – Scatto controllato (Sop)","descrizione":"","testo":"Quando effettua una carica o una ritirata, il personaggio ottiene bonus +3 m alla velocità base su terreno (e quindi un totale di +6 m durante tali azioni) e non subisce la consueta penalità di −2 alla CA dovuta alla carica."},{"nome":"09 – Sensi oscuri (Sop)","descrizione":"","testo":"Come azione standard il personaggio può individuare per 10 minuti la presenza di non morti e creature malvagie entro 9 m."},{"nome":"10 – Traslazione (Sop)","descrizione":"","testo":"Quando il personaggio compie un passo di 1,5 m può invece spostarsi di 3 m, con i medesimi effetti."}]},"tipo":"umanoide con sottotipo dhampir","taglia":"media","tipo_scheda":"Umanoide Medio (dhampir)","movimento":"9 m","sensi":["scurovisione 18 m"]},{"nome":"Strigoi","descrizione":"Uno strigoi è il frutto dell'unione tra una megera e un mortale, irretito grazie alla magia o chissà quale terribile espediente. Gli strigoi ereditano alcuni tratti matriarcali, che variano da megera a megera e questo si manifesta col tempo. Quasi sempre abbandonati, i piccoli strigoi vengono spesso cresciuti da estranei, a volte amorevolmente, a volte nella miseria e nell'astio ma crescendo introversi e poco inclini alla socialità. Raggiunta la pubertà, sentono un impulso interiore che li incita a viaggiare e scoprire le loro vere origini. Coloro che resistono a questo richiamo, possono scegliere il proprio destino. Quelli che non vi riescono invece, o che addirittura lo assecondano consciamente, vanno alla ricerca delle loro vere madri, ignari di ciò che li attende lungo il cammino. In qualunque caso, gli strigoi sono creature misteriose che variano da eleganti signorotti, a solitari eremiti che vivono in luoghi isolati.","dati":{"Tipo":"umanoide con sottotipo strigoi.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Costituzione, +2 Intelligenza, −2 Carisma. Gli strigoi ereditano l'innaturale robustezza e l'acume delle megere ma a causa della loro oscura natura sono esseri schivi e riservati.","Linguaggi iniziali":"quello di residenza. Inoltre, possono scegliere qualsiasi linguaggio (non segreto) come linguaggio bonus dovuto all'Intelligenza.","Altezza, peso ed età":"1,50-1,95 m, 65-110 kg, aspettativa di vita massima di 110 anni circa."},"tratti":[{"nome":"Tratti indistinguibili","testo":"non necessitano di superare prove di Camuffare per apparire come umani."},{"nome":"Pelle spessa","testo":"ottengono bonus +1 alla CA Naturale."},{"nome":"Resistenza delle megere","testo":"ottengono bonus razziale +2 ai Tiri Salvezza contro effetti di \\[CHARME\\] e \\[MALEDIZIONE\\]."},{"nome":"Passo stregato","testo":"ignorano le penalità al movimento dovute a uno specifico tipo di terreno difficile a scelta, eccetto quelli manipolati magicamente. La lista degli ambienti include: acquatico, caldo, deserto, foresta, freddo, montagna, pianura e collina, palude, sotterraneo e urbano."}],"opzioni":{"titolo":"Retaggi oscuri","intro":"Si sceglie un retaggio tra quelli sotto elencati. In alternativa, si può scegliere uno dei tratti razziali generici descritti alla fine di questo volume. La CD per resistere ai retaggi è pari a 10 + metà livello di personaggio + bonus di caratteristica mentale più alto.","voci":[{"nome":"Sangue delle megere annis","descrizione":"I discendenti delle annis ereditano la forza inumana delle loro madri.","testo":"Il personaggio ottiene bonus +1 ai danni in mischia."},{"nome":"Sangue delle megere ardenti","descrizione":"Questi strigoi possono canalizzare l'energia derivante dal loro retaggio, per infliggere danni aggravati a base di fuoco.","testo":"Il personaggio infligge 1 danno extra per dado lanciato con gli incantesimi che infliggono danni da fuoco. Questo danno extra non è cumulabile con altri simili."},{"nome":"Sangue delle megere delle ceneri (Sop)","descrizione":"La progenie di una megera delle ceneri è in grado di riempire i polmoni dei nemici con cenere e fuliggine.","testo":"Due volte al giorno, come azione standard il personaggio può riempire con cenere bollente i polmoni di una creatura entro 9 m. La vittima deve superare un Tiro Salvezza su Tempra o diventare barcollante per 1 round."},{"nome":"Sangue delle megere cieche","descrizione":"I figli delle megere cieche sono in grado di combattere senza l'ausilio della vista, percependo i nemici attraverso il movimento.","testo":"Il personaggio ottiene il talento Combattere alla cieca."},{"nome":"Sangue delle megere marine","descrizione":"La progenie di una megera marina è capace di trattenere il respiro per lunghi periodi di tempo.","testo":"Il personaggio ottiene bonus razziale +4 Nuotare. Inoltre, può trattenere il fiato sott'acqua per un numero di round pari a quattro volte (anziché due) il proprio punteggio di Costituzione."},{"nome":"Sangue delle megere notturne","descrizione":"Alcuni strigoi scoprono di riuscire a vedere nella penombra e sviluppano una particolare resistenza alle malattie, chiaro retaggio della loro discendenza.","testo":"Il personaggio ottiene Visione crepuscolare e +2 ai Tiri Salvezza contro gli effetti di \\[MALATTIA\\]."},{"nome":"Sangue delle megere sanguinarie (Sop)","descrizione":"Questi strigoi, come le loro madri, possono alterare la propria aura, facendo sì che gli altri li percepiscano in modo diverso.","testo":"All'alba di ogni giorno, il personaggio può scegliere un allineamento fino a due passi di distanza dal proprio e le divinazioni considerano il personaggio come avere tale allineamento."},{"nome":"Sangue delle megere verdi","descrizione":"Proprio come le loro mostruose madri, i discendenti delle megere verdi sono in grado di apparire irresistibili e affascinare il prossimo.","testo":"Il personaggio ottiene bonus razziale +2 Diplomazia, +2 Intrattenere e +2 Raggirare nei confronti di coloro che già sono o che potrebbero essere attratti sessualmente da lui."}]},"tipo":"umanoide con sottotipo strigoi","taglia":"media","tipo_scheda":"Umanoide Medio (strigoi)","movimento":"9 m","sensi":[]},{"nome":"Aasimar","descrizione":"In occasioni più uniche che rare, un celestiale in forma fisica può unirsi a un mortale dando vita a un aasimar. In passato i frutti di queste unioni non conducevano vite facili ed erano spesso scacciati dal popolo e braccati dall'inquisizione. Ai tempi d'oggi però, come accade per dhampir, mezzorchi, necrarchi, fattucchieri e molti altri individui giudicati ambigui, gli aasimar sono tollerati e anzi, grazie alla loro affinità con i piani esterni, alcuni sono addirittura arruolati dall'inquisizione al fine di scovare cabale e culti eretici. Questa sorta di tolleranza però non fa dormire sonni tranquilli a queste creature, poiché coloro che li reputano ancora abomini sono molti e pericolosi. Gli aasimar hanno occhi senza pupille e manifestano caratteristiche che variano in base alla loro discendenza ma, per il resto, hanno i vizi e le virtù che caratterizzano tutti i mortali.","dati":{"Tipo":"esterno con sottotipo nativo.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Saggezza, −2 Destrezza, +2 Carisma. Gli aasimar sono saggi e amichevoli, ma la loro serafica compostezza li rende poco reattivi.","Linguaggi iniziali":"quello di residenza. Inoltre, possono scegliere tra draconico, elfico, nanico, halfling e pelleverde come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"1,50-1,95 m, 65-110 kg, aspettativa di vita massima di 110 anni circa."},"tratti":[{"nome":"Esterni nativi","testo":"ottengono immunità a incantesimi e capacità (sia benefiche che ostili) che bersagliano specificamente gli umanoidi, come Blocca persone*, Charme su persone, Dominare persone*, Ingrandire persone, Ridurre persone, etc."},{"nome":"Resistenze","testo":"ottengono RE (acido ed elettricità) 5. Questa RE è cumulabile con altre simili."},{"nome":"Magia innata (Mag)","testo":"una volta al giorno, possono lanciare l'incantesimo Luce diurna."},{"nome":"Ascendente","testo":"ottengono bonus razziale +2 Diplomazia."}],"opzioni":{"titolo":"Retaggi planari","intro":"Si sceglie un retaggio tra quelli sotto elencati. In alternativa, si può scegliere uno dei tratti razziali generici descritti alla fine di questo volume.","voci":[{"nome":"Anima divina","descrizione":"Alcuni aasimar hanno una scintilla di divinità dentro di loro che li protegge da certi tipi di minacce.","testo":"Il personaggio ottiene bonus razziale +2 ai Tiri Salvezza contro effetti di \\[MALEDIZIONE\\] e \\[MORTE\\]. Inoltre, ottiene RE (energia negativa) 5."},{"nome":"Aureola (Mag)","descrizione":"Alcuni aasimar hanno la capacità di manifestare una luminescenza sotto forma di aureola, bagliore infuocato o altro.","testo":"A volontà, il personaggio può lanciare l'incantesimo Luce (durata 1 ora) centrato sulla propria testa; quando ciò accade, il personaggio ottiene bonus di circostanza +2 Intimidire e +2 ai Tiri Salvezza per evitare di rimanere abbagliato o accecato."},{"nome":"Benedizione celeste","descrizione":"Rari aasimar godono di uno speciale favore divino che, seppur in minima parte, li protegge da coloro che vogliono fargli del male.","testo":"Tutti gli attacchi effettuati contro il personaggio nel primo turno di combattimento subiscono penalità −2 ai tiri per colpire. Se nessuno attacca il personaggio nel primo turno di un combattimento, il primo nemico a farlo nei turni seguenti subirà penalità −2 a tutti i tiri per colpire contro il personaggio per quel round."},{"nome":"Generazione avanzata","descrizione":"Aasimar di terza generazione o più, spesso risentono quasi totalmente del loro retaggio umano rispetto a quello celestiale, presentando lineamenti meno angelici e occhi con pupilla.","testo":"Il personaggio è considerato un umanoide con sottotipo umano, ottiene il talento Astuto (non deve soddisfarne i requisiti) e non necessita di superare prove di Camuffare per apparire come un umano."},{"nome":"Resistenza angelica","descrizione":"Alcuni aasimar sviluppano una discreta repulsione magica nei confronti degli empi e dei corrotti.","testo":"Il personaggio ottiene RI 8 + livello di personaggio contro incantesimi e capacità magiche utilizzati dalle creature malvagie. Si può sopprimere o riattivare questa RI come azione veloce."},{"nome":"Sacro crociato","descrizione":"Molti aasimar si sentono in dovere di difendere il creato dalla minaccia dei demoni e altre malvagie creature extraplanari.","testo":"Il personaggio ottiene contro gli esterni +1 ai tiri per colpire, bonus di schivare +1 alla CA, +2 ai Tiri Salvezza, +2 Intuizione e +2 Percezione."},{"nome":"Sguardo severo","descrizione":"Uno sguardo fermo e deciso (specialmente se privo di pupille) può instillare il terrore nel cuore di molti.","testo":"Tre volte al giorno, una volta per round, quando colpisce con un attacco in mischia, come azione gratuita il personaggio può dimezzare i danni inferti per effettuare una prova di Intimidire (demoralizzare) contro l'avversario appena ferito. Questo è un effetto \\[VISIVO\\]."},{"nome":"Visione crepuscolare","descrizione":"Alcuni aasimar scoprono di riuscire a vedere nella penombra, chiaro retaggio della loro discendenza.","testo":"Il personaggio ottiene Visione crepuscolare e ignora quindi l'occultamento dovuto alla luce fioca."}]},"tipo":"esterno con sottotipo nativo","taglia":"media","tipo_scheda":"Esterno Medio (nativo)","movimento":"9 m","sensi":[]},{"nome":"Tiefling","descrizione":"In occasioni più uniche che rare, un demone in forma fisica può unirsi a un mortale dando vita a un tiefling. In passato i frutti di queste unioni non conducevano vite facili ed erano spesso scacciati dal popolo e braccati dall'inquisizione. Ai tempi d'oggi però, come accade per dhampir, mezzorchi, necrarchi, fattucchieri e molti altri individui giudicati ambigui, i tiefling sono tollerati e anzi, grazie alla loro affinità con i piani esterni, alcuni sono addirittura arruolati dall'inquisizione al fine di scovare cabale e culti eretici. Questa sorta di tolleranza però non fa dormire sonni tranquilli a queste creature, poiché coloro che li reputano ancora abomini sono molti e pericolosi. I tiefling hanno code, corna e una pelle che varia dal rosso al viola in varie tonalità, oltre a caratteristiche che variano in base alla loro discendenza.","dati":{"Tipo":"esterno con sottotipo nativo.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Destrezza, −2 Saggezza, +2 Intelligenza. I tiefling sono agili, astuti ma spesso avventati.","Linguaggi iniziali":"quello di residenza. Inoltre, possono scegliere tra draconico, elfico, nanico, halfling e pelleverde come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"1,50-1,95 m, 65-110 kg, aspettativa di vita massima di 110 anni circa."},"tratti":[{"nome":"Esterni nativi","testo":"ottengono immunità a incantesimi e capacità (sia benefiche che ostili) che bersagliano specificamente gli umanoidi, come Blocca persone*, Charme su persone, Dominare persone*, Ingrandire persone, Ridurre persone, etc."},{"nome":"Resistenze","testo":"ottengono RE (fuoco e freddo) 5. Questa RE è cumulabile con altre simili."},{"nome":"Magia innata (Mag)","testo":"una volta al giorno, possono lanciare l'incantesimo Produrre fiamma."},{"nome":"Ascendente","testo":"ottengono bonus razziale +2 Raggirare."}],"opzioni":{"titolo":"Retaggi planari","intro":"Si sceglie un retaggio tra quelli sotto elencati. In alternativa, si può scegliere uno dei tratti razziali generici descritti alla fine di questo volume.","voci":[{"nome":"Artigli e zoccoli","descrizione":"Alcuni tiefling possiedono artigli affilati e zoccoli possenti, chiaro retaggio del loro progenitore immortale.","testo":"Il personaggio ottiene un attacco di supporto di Artiglio che infligge 1d6 danni. Inoltre, ottiene bonus di potenziamento +1,5 m alla velocità base su terreno quando non indossa armature medie o pesanti."},{"nome":"Cauto","descrizione":"Molti tiefling imparano sin da piccoli che se vogliono ottenere qualcosa, devono essere veloci ma cauti… molto cauti.","testo":"Quando il personaggio effettua una manovra di Rubare, la vittima effettua prima la prova di Percezione. Il personaggio può quindi decidere se effettuare o meno il furto dopo aver visto il risultato di tale prova. Se il personaggio rinuncia alla manovra, la vittima si accorgerà delle sue malintenzioni a meno che questi non vinca una prova di Raggirare contrapposta a Intuizione della vittima."},{"nome":"Coda robusta","descrizione":"Non sono rari i tiefling con la coda ma solo pochi ne hanno una sufficientemente forte da brandire oggetti e armi.","testo":"Il personaggio può usare la coda per recuperare gli oggetti dallo zaino come azione di movimento, anziché come azione di round completo e senza necessariamente togliersi lo zaino dalle spalle. Inoltre, ottiene la competenza con le estensioni per coda. Non si può usare la coda per recuperare oggetti dallo zaino se ad essa è applicata un'estensione per coda (vedi Volume 3 – Equipaggiamento: Armorieri)."},{"nome":"Disturbo arcano","descrizione":"Certi tiefling emanano un'aura destabilizzante che rende difficile l'accumulo dei venti della magia da parte dei nemici.","testo":"I nemici entro 6 m dal personaggio che lanciano incantesimi sulla difensiva subiscono **svantaggio** nelle prove di Concentrazione."},{"nome":"Generazione avanzata","descrizione":"Tiefling di terza generazione o più, spesso risentono quasi totalmente del loro retaggio umano rispetto a quello demoniaco, presentando lineamenti meno mostruosi.","testo":"Il personaggio è considerato un umanoide con sottotipo umano, ottiene il talento Astuto (non deve soddisfarne i requisiti) e non necessita di superare prove di Camuffare per apparire come un umano."},{"nome":"Ingannatore","descrizione":"Alcuni tiefling sono dei veri e propri maestri nell'arte della menzogna.","testo":"Una volta al giorno, il personaggio può ottenere **vantaggio** con +2 in una prova di Raggirare (mentire)."},{"nome":"Vile","descrizione":"Molti tiefling preferiscono saggiamente attaccare i nemici che sono già impegnati nel combattimento.","testo":"Il personaggio ottiene bonus razziale +1 ai tiri per colpire e ai danni in mischia contro i nemici che sono minacciati anche da almeno altre due creature."},{"nome":"Visione crepuscolare","descrizione":"Alcuni tiefling scoprono di riuscire a vedere nella penombra, chiaro retaggio della loro discendenza.","testo":"Il personaggio ottiene Visione crepuscolare e ignora quindi l'occultamento dovuto alla luce fioca."}]},"tipo":"esterno con sottotipo nativo","taglia":"media","tipo_scheda":"Esterno Medio (nativo)","movimento":"9 m","sensi":[]},{"nome":"Ghermiti","descrizione":"Sono molte le storie per bambini che narrano di mostri nascosti negli armadi o sotto il letto, di babau e uomini neri che attendono nell'oscurità di afferrare i dormienti. Ogni storia, si sa, si basa su un fondo di verità e non sono pochi i casi di umani, grandi o piccoli, scomparsi misteriosamente durante il sonno. Molti eruditi e specialisti dell'occulto, sostengono che la causa di tali sparizioni sia una razza di creature predatorie native del piano delle ombre. Cosa accada ai rapiti non è dato saperlo, ma la rara unione di queste creature con gli umani, genera ibridi di luce e tenebra intrecciate, i cosiddetti ghermiti. I ghermiti sviluppano tratti e capacità tipiche dei loro oscuri genitori, primi tra tutti una pelle grigio pallida, occhi gialli e un carattere taciturno e pacato. Alcune di queste creature (poche a dire il vero) sono fiere dei loro oscuri natali e si autoproclamano “kàyal”, un termine elfico che si traduce approssimativamente come “popolo delle ombre”.","dati":{"Tipo":"esterno con sottotipo nativo.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Destrezza, +2 Saggezza, −2 Carisma. I ghermiti sono agili e giudiziosi ma anche cupi e silenziosi.","Linguaggi iniziali":"quello di residenza e l'aklo. Inoltre, possono scegliere qualsiasi linguaggio (non segreto) come linguaggio bonus dovuto all'Intelligenza.","Altezza, peso ed età":"1,50-1,95 m, 65-110 kg, aspettativa di vita massima di 110 anni circa."},"tratti":[{"nome":"Esterni nativi","testo":"ottengono immunità a incantesimi e capacità (sia benefiche che ostili) che bersagliano specificamente gli umanoidi, come Blocca persone*, Charme su persone, Dominare persone*, Ingrandire persone, Ridurre persone, etc."},{"nome":"Scurovisione","testo":"in zone di oscurità vedono in bianco e nero entro 18 m."},{"nome":"Resistenza","testo":"ottengono RE (freddo) 5. Questa RE è cumulabile con altre simili."},{"nome":"Ombre sfocate","testo":"quando hanno una probabilità di essere mancati, questa aumenta del 5%."},{"nome":"Magia dell'oscurità (Mag)","testo":"una volta al giorno, possono lanciare l'incantesimo Oscurità."},{"nome":"Furtivi","testo":"ottengono bonus razziale +2 Furtività."}],"opzioni":{"titolo":"Retaggi planari","intro":"Si sceglie un retaggio tra quelli sotto elencati. In alternativa, si può scegliere uno dei tratti razziali generici descritti alla fine di questo volume.","voci":[{"nome":"Generazione avanzata","descrizione":"Ghermiti di terza generazione o più, spesso risentono quasi totalmente del loro retaggio umano, presentando lineamenti extraplanari meno evidenti.","testo":"Il personaggio è considerato un umanoide con sottotipo umano, ottiene il talento Astuto (non deve soddisfarne i requisiti) e non necessita di superare prove di Camuffare per apparire come un umano."},{"nome":"Impercettibile","descrizione":"I ghermiti possono essere estremamente silenziosi.","testo":"Il personaggio non subisce la penalità di −5 alle prove di Furtività mentre si muove silenziosamente a velocità normale."},{"nome":"Magia delle ombre","descrizione":"I ghermiti che trascorrono il loro tempo studiando la subdola magia del piano delle ombre, guadagnano acume arcano nell'utilizzo degli incantesimi tipici di tale luogo.","testo":"Quando lancia un incantesimo della sottoscuola di Ombra o col descrittore \\[oscurità\\], il personaggio può aumentare di 1 il proprio livello di incantatore o la CD dell'incantesimo."},{"nome":"Pianificatore subdolo","descrizione":"Alcuni ghermiti sviluppano un innaturale ascendente che di contro li rende più impulsivi e meno cauti.","testo":"Il personaggio ottiene −2 Saggezza e +2 Carisma al posto di +2 Saggezza e −2 Carisma come caratteristiche razziali. Inoltre, una volta al giorno può ottenere **vantaggio** con +2 in una prova di Raggirare (mentire)."},{"nome":"Resistenza umbrale","descrizione":"Non pochi ghermiti risentono maggiormente del sangue esterno che umano e sviluppano una potente resistenza alla magia delle ombre.","testo":"Il personaggio ottiene RI 10 + livello di personaggio se lui o la creatura che lo sta attaccando si trova in zone di buio o penombra."},{"nome":"Riserva oscura","descrizione":"Alcuni ghermiti possiedono un'energia impalpabile che può essere utilizzata per compiere imprese fuori dal comune.","testo":"Il personaggio ottiene un numero di punti oscurità pari a 1 + 1 punto ogni quattro livelli di personaggio. Come azione veloce il personaggio può spendere 1 punto oscurità o 1 punto ki per ottenere bonus +2 a una prova di abilità."},{"nome":"Sguardo inquietante","descrizione":"Alcuni ghermiti hanno uno sguardo particolarmente raggelante, in grado di far vacillare anche i più coraggiosi come bambini tremanti nel letto.","testo":"Una volta al giorno, come azione standard il personaggio può effettuare un attacco con lo sguardo che colpisce tutte le creature in un cono di 9 m. Tutte le creature nell'area devono superare un Tiro Salvezza su Volontà con CD 10 + metà livello di personaggio + bonus di caratteristica mentale più alto o diventare scosse per 1d3+1 round. Questa capacità non cumula gli stati di paura. Quando il ghermito raggiunge il 10° livello di personaggio, può decidere che il suo sguardo renda invece le vittime barcollanti per 1 round e poi scosse per 1d3 round. Questo è un effetto di \\[PAURA\\]."},{"nome":"Servitore delle ombre","descrizione":"Alcuni ghermiti si guadagnano da vivere come agenti segreti, assassini e spie, rivelandosi killer perfetti in assenza di luce.","testo":"Il personaggio ottiene il talento Umbrale."}]},"tipo":"esterno con sottotipo nativo","taglia":"media","tipo_scheda":"Esterno Medio (nativo)","movimento":"9 m","sensi":["scurovisione 18 m"]},{"nome":"Suli","descrizione":"Un suli è il discendente di un mortale e un ifrit, un ondine, un'oreade o una silfide. Né umani né elementali, essi vivono a cavallo tra due realtà e quasi tutti sentono di non appartenere a nessuna delle due. I suli manifestano il loro retaggio nell'adolescenza o quando viene risvegliato dall'incontro con un elementale, cosa che spesso li porta ad abbandonare la propria comunità. Chiamati anche mezzi-elementali, i suli possono appellarsi alle energie elementali per amplificare la loro prestanza in combattimento e non è raro che ciò tenda a riflettersi anche sulla loro personalità.","dati":{"Tipo":"esterno con sottotipo nativo.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Forza, −2 Saggezza, +2 Carisma; oppure +2 Costituzione, −2 Intelligenza, +2 Saggezza; oppure +2 Forza, −2 Intelligenza, +2 Saggezza; oppure +2 Destrezza, −2 Costituzione, +2 Carisma. I suli variano in base al loro retaggio.","Linguaggi iniziali":"quello di residenza e ignan o terran o aquan o auran. Inoltre, possono scegliere qualsiasi linguaggio (non segreto) come linguaggio bonus dovuto all'Intelligenza.","Altezza, peso ed età":"1,50-1,95 m, 65-110 kg, aspettativa di vita massima di 110 anni circa."},"tratti":[{"nome":"Discendenza","testo":"alla creazione si sceglie a quale discendenza elementale il personaggio appartenga tra efreeti, shaitan, marid e djinn (il colore contraddistingue i bonus e le capacità ottenute)."},{"nome":"Tratti indistinguibili","testo":"non necessitano di superare prove di Camuffare per apparire come umani."},{"nome":"Resistenza elementale","testo":"ottengono RE (fuoco) 5 o RE (acido) 5 o RE (freddo) 5 o RE (elettricità) 5; questa RE è cumulabile con altre simili."},{"nome":"Potere elementale","testo":"in base al retaggio, come azione gratuita ottengono uno tra: Scudo infuocato (1/giorno, barriera 1 minuto, deviazione +1 CA, 1 danno crescente a 1d4/1d6/1d8/1d10 ai livelli 5°/9°/13°/17° al primo avversario che colpisce in mischia con arma senza portata, colpo senz'armi o attacco naturale); Passo stabile (passi di 1,5 m nei terreni difficili naturali asciutti non manipolati magicamente, e bonus razziale +4 DMC contro Sbilanciare e Spingere su terreni solidi); Rallentare il flusso (a volontà, concentrandosi 3 round, Guarigione rapida 1 fino a 3× Dadi Vita al giorno); Raggi folgoranti (contatto a distanza, gittata 9 m, 2 danni da elettricità crescenti a 2d4/2d6/2d8/2d10 ai livelli 5°/9°/13°/17°)."}],"opzioni":{"titolo":"Retaggi planari","intro":"Si sceglie un retaggio tra quelli sotto elencati. In alternativa, si può scegliere uno dei tratti razziali generici descritti alla fine di questo volume.","voci":[{"nome":"Flagello degli elementali","descrizione":"Per sfida o per dimostrare che il sangue mortale è superiore a quello del genitore, alcuni suli si specializzano nell'abbattere gli elementali.","testo":"Il personaggio ottiene contro gli elementali +1 ai tiri per colpire, bonus di schivare +1 alla CA, +2 ai Tiri Salvezza, +2 Intuizione e +2 Percezione."},{"nome":"Incantesimi elementali (Mag)","descrizione":"I suli talvolta ereditano alcune capacità magiche che possono tornar loro molto utili.","testo":"Due volte al giorno, il personaggio può lanciare l'incantesimo Ritirata rapida o Palla di fango o Foschia occultante o Movimento sfocato, con CD 10 + metà livello di personaggio + bonus di caratteristica mentale più alto."},{"nome":"Vista elementale","descrizione":"Col tempo, alcuni suli scoprono di riuscire a vedere anche in condizioni difficili, chiaro retaggio della loro discendenza.","testo":"Il personaggio vede normalmente in condizioni ambientali e climatiche avverse, eccetto quelle di origine magica (es. acque torbide, acque buie, fumo, cenere, fuliggine, gas, nebbia, nevischio, polvere)."},{"nome":"Assalto elementale (Sop)","descrizione":"Alcuni suli imparano ad emettere un assalto elementale che devasta la mente dei loro avversari, rendendoli più facili da sconfiggere.","testo":"Una volta al giorno, come azione veloce il personaggio può scegliere un nemico entro 9 m e ottenere per 1 minuto contro di lui +1 ai tiri per colpire e ai danni. Questo è un effetto di \\[DOLORE\\]."},{"nome":"Recupero rapido","descrizione":"In rari casi i suli manifestano sorprendenti capacità rigenerative.","testo":"Durante il Rifiatare, il personaggio può ripetere i risultati di dado pari a 1 e 2. Questi tiri possono essere ripetuti un qualsiasi numero di volte."},{"nome":"Repulsione elementale","descrizione":"Alcuni suli sviluppano una discreta resistenza per gli elementi opposti al proprio retaggio.","testo":"Il personaggio ottiene RI 10 + livello di personaggio contro incantesimi e capacità magiche con descrittore \\[acqua o freddo\\] o \\[aria o elettricità\\] o \\[fuoco\\] o \\[terra o acido\\]. Si può sopprimere o riattivare questa RI come azione veloce."},{"nome":"Talento elementale","descrizione":"Molti suli sviluppano tratti specifici in base al loro retaggio.","testo":"Il personaggio ottiene il talento Armi roventi o Robustezza o Mobilità o Astuto (non deve soddisfarne i requisiti)."},{"nome":"Visione crepuscolare","descrizione":"Alcuni suli scoprono di riuscire a vedere nella penombra, chiaro retaggio della loro discendenza.","testo":"Il personaggio ottiene Visione crepuscolare e ignora quindi l'occultamento dovuto alla luce fioca."}]},"tipo":"esterno con sottotipo nativo","taglia":"media","tipo_scheda":"Esterno Medio (nativo)","movimento":"9 m","sensi":[]},{"nome":"Forgiati","descrizione":"In seguito alla creazione dei primi automaton, non pochi iniziarono a vederli come veri compagni, sebbene restassero solo macchine. Un gruppo di scienziati e mecenati ambiziosi si riunì con uno scopo preciso: creare un automaton dotato di coscienza propria. Rifiutati dai druidi, fondarono in segreto la gilda dei forgianime, un'unione di inventori e druidi dissidenti che, dopo decenni, riuscì nell'impossibile: la Pietra dell'anima, capace di raccogliere la coscienza di una creatura morta di recente e mantenerla attiva incanalando i venti della magia. Posta in un automaton, in seguito ribattezzato “forgiato”, questo si risvegliava con le proprie qualità intatte, seppur più ovattate che in un essere vivente. La gilda dei forgianime divenne un'istituzione legale, indipendente sia dall'accademia delle scienze che dai druidi.","dati":{"Tipo":"umanoide con sottotipo forgiato.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Costituzione, +2 Intelligenza, −2 Carisma. La struttura dei forgiati li rende resistenti e precisi, ma le loro espressioni sintetiche raramente ispirano fiducia.","Linguaggi iniziali":"quello di residenza e il forgiato (linguaggio segreto, non emettibile dai non forgiati poiché consiste in suoni, bip e modulazioni). Inoltre, possono scegliere qualsiasi linguaggio (non segreto) come linguaggio bonus dovuto all'Intelligenza.","Altezza, peso ed età":"1,75-2 m, 100-160 kg, i forgiati non invecchiano."},"tratti":[{"nome":"Potenti","testo":"ottengono il talento Colpo senz'armi migliorato e i loro attacchi senz'armi infliggono 1d6 danni."},{"nome":"Punti critici rinforzati","testo":"hanno il 25% di ignorare i colpi critici e i danni da precisione."},{"nome":"Piastre protettive","testo":"possono proteggersi fissando al telaio rinforzi in metallo o legno, equivalenti a normali armature (costo, benefici e penalità invariati), rispettando le limitazioni della propria classe. Possono sganciarle come farebbero con un'armatura."},{"nome":"Resistenza mentale","testo":"ottengono bonus razziale +4 ai Tiri Salvezza contro gli effetti di \\[INFLUENZA MENTALE\\], \\[MALATTIA\\], \\[PARALISI\\], \\[SANGUINAMENTO\\], \\[STORDIMENTO\\] e \\[VELENO\\]."},{"nome":"Nanomacchine (Sop)","testo":"una volta al giorno, come azione veloce, ottengono +20 a una prova di abilità. I circuiti si illuminano: il personaggio non può effettuare prove di Furtività fino alla fine del turno successivo."},{"nome":"Impassibile","testo":"penalità razziale −4 Intuizione."},{"nome":"Immunità","testo":"sono immuni agli effetti di \\[AFFATICAMENTO\\] e \\[INVECCHIAMENTO\\], e ai danni non letali."},{"nome":"Necessità","testo":"non necessitano di bere, nutrirsi o dormire per riposarsi (entrano invece per quattro ore in una modalità stand-by vigile) e non subiscono gli effetti del clima."},{"nome":"Percezione e cure","testo":"grazie a tubi collegati alla Pietra dell'anima percepiscono normalmente odori e sapori e beneficiano pienamente di pozioni e oggetti alchemici (le sostanze non magiche ingerite non hanno alcun effetto). Cure ai Punti Ferita o alle caratteristiche fisiche garantiscono loro solo metà dei benefici."},{"nome":"Natura ibrida","testo":"guariscono naturalmente dai danni letali, ripristinano i Punti Fatica, respirano normalmente e subiscono solo metà danni dall'energia negativa. Sono influenzati sia da effetti sui costrutti sia da quelli sulle creature viventi (guariscono con Cura ferite gravi e con Ripara danni gravi; sono soggetti a Disattivare costrutto e a Charme su persone) e da incantesimi che agiscono sul metallo."},{"nome":"Ferite e arti","testo":"non provano dolore ma subiscono gli effetti delle Ferite gravi come malfunzionamenti di sistema. Se perdono parti del corpo, non possono legarsi ad arti sostitutivi, salvo protesi meccaniche costruite da un forgianime al triplo del costo."}],"opzioni":{"titolo":"Upgrade di sistema","intro":"Si sceglie un upgrade tra quelli sotto elencati. In alternativa, si può scegliere uno dei tratti razziali generici descritti alla fine di questo volume.","voci":[{"nome":"Assimilazione ritardata","descrizione":"Un piccolo vano posto prima della Pietra dell'anima può ritardare gli effetti dell'ingerimento di sostanze varie.","testo":"Il personaggio può assumere una singola pozione e ritardarne gli effetti per un numero di ore pari al bonus di Costituzione (massimo una alla volta). Come azione veloce può attivarla beneficiandone degli effetti; se non attivata entro quel lasso di tempo è considerata sprecata. Non è possibile bere una seconda pozione nel turno in cui si attiva quella assimilata."},{"nome":"Campo di disturbo","descrizione":"Il corpo di alcuni forgiati emette onde che contrastano inspiegabilmente i costrutti.","testo":"Il personaggio ottiene bonus di competenza +2 ai tiri per i danni in mischia contro i costrutti. Inoltre, se ottiene una minaccia di critico contro un costrutto, può rinunciare a confermare il tiro; se l'attacco infligge danni, la vittima deve superare un Tiro Salvezza su Tempra con CD 12 + metà livello di personaggio + bonus di Costituzione o essere frastornata per 1 round."},{"nome":"Firewall cognitivo","descrizione":"Alcuni forgiati sviluppano protocolli di verifica che scartano gli stimoli incoerenti.","testo":"Il personaggio ottiene bonus razziale +4 ai Tiri Salvezza contro gli effetti di \\[ILLUSIONE: ALLUCINAZIONE, FINZIONE, MASCHERAMENTO, OMBRA E TRAMA\\] e \\[PAURA\\]."},{"nome":"Isolamento strutturale","descrizione":"Il corpo di alcuni forgiati è isolato grazie a uno speciale gel interno.","testo":"Il personaggio ottiene RE (elettricità) 5. Questa RE è cumulabile con altre simili."},{"nome":"Modulatore vocale","descrizione":"Un sistema di variazione audiofonica permette al forgiato di effettuare piccoli cambi nel tono e nella frequenza vocale.","testo":"Due volte al giorno, il personaggio può emulare gli effetti dell'incantesimo Ventriloquio con CD 10 + metà livello di personaggio + bonus di caratteristica mentale più alto."},{"nome":"Sistema di soppressione del dolore","descrizione":"Un sistema di soppressione del dolore aumenta le capacità di sopportazione del forgiato.","testo":"Il personaggio ottiene bonus +2 alla CA contro i tiri di conferma delle minacce di critico subite."},{"nome":"Sovraccarico metabolico","descrizione":"Il personaggio è in grado di reindirizzare l'energia in modo da riparare il corpo, perdendo però in prestanza fisica.","testo":"Una volta al giorno, come azione standard che non provoca attacchi di opportunità, il personaggio può curarsi di un numero di danni pari a 5 + livello di personaggio. Quando ciò avviene, subisce penalità −1 ai tiri per colpire e ai danni e −1 ai Tiri Salvezza su Tempra e Riflessi per 1 ora."},{"nome":"Strumentazione ottica avanzata","descrizione":"Grazie a sensori ottici migliorati, alcuni forgiati sono in grado di adattare la vista in caso di scarsità luminosa.","testo":"Il personaggio ottiene Visione crepuscolare e ignora quindi l'occultamento dovuto alla luce fioca."}]},"tipo":"umanoide con sottotipo forgiato","taglia":"media","tipo_scheda":"Umanoide Medio (forgiato)","movimento":"9 m","sensi":[]},{"nome":"Drow","descrizione":"I drow sono creature che abitano le profondità della terra, sebbene non scavino loro stessi le gallerie, ma occupino quelle scavate dalle altre creature, come i duergar. Al giorno d'oggi però, i drow possono essere trovati un po' ovunque. Astuti, ambiziosi e maestri nel manipolare i pensieri e i desideri altrui, quasi tutti non provano vero amore per nient'altro che se stessi. Sebbene non siano malvagi di nascita, la spietatezza è profondamente radicata nella cultura e società dei drow e gli anticonformisti prima o poi devono abbandonare le città della loro razza, per dirigersi in comunità multietniche. I drow sono schiavisti, fortemente competitivi e molti considerano la guerra e il sotterfugio veri e propri stili di vita; tuttavia sono anche profondamente edonisti, in quanto ricercano il piacere attraverso le esperienze più varie.","dati":{"Tipo":"umanoide con sottotipo elfo.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Destrezza, −2 Costituzione, +2 Carisma. I drow sono agili, di corporatura fragile e molto sicuri di sé.","Linguaggi iniziali":"quello di residenza e il drow. Inoltre, possono scegliere tra draconico, nanico, pelleverde e linguaggio dei segni dei drow come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"1,75-2 m, 50-80 kg, una volta maturi mantengono per sempre un aspetto giovanile."},"tratti":[{"nome":"Scurovisione","testo":"in zone di oscurità vedono in bianco e nero entro 18 m."},{"nome":"Sangue elfico","testo":"contano come elfi al fine di qualsiasi requisito (archetipi, talenti, bersaglio di incantesimi e capacità, etc.)."},{"nome":"Immortali","testo":"ottengono immunità agli effetti di \\[INVECCHIAMENTO\\]."},{"nome":"Sonno degli elfi","testo":"ottengono immunità agli effetti di \\[SONNO\\]. Inoltre, non necessitano di dormire per riposarsi: entrano invece in una trance vigile di quattro ore, che conta come otto ore di riposo a tutti gli effetti (subiscono comunque le penalità dovute al riposare in armatura)."},{"nome":"Familiarità con le armi","testo":"ottengono la competenza con la balestra a mano, la frusta, lo stocco, la forca da prigionieri e con le armi con la qualità Drow."},{"nome":"Resistenza elfica","testo":"ottengono bonus razziale +2 ai Tiri Salvezza contro effetti di \\[AMMALIAMENTO: CHARME E COMPULSIONE\\]."},{"nome":"Resistenza dei drow","testo":"ottengono RI 6 + livello di personaggio. Si può sopprimere o riattivare questa RI come azione veloce."},{"nome":"Sensi acuti","testo":"ottengono bonus razziale +2 Percezione."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Accuratezza drow","descrizione":"Molti drow sviluppano una precisione sorprendente, anche per un popolo rinomato per tale caratteristica.","testo":"Il personaggio riduce di 10 punti percentuali la probabilità di essere mancato dovuta a occultamento e occultamento totale dei bersagli attaccati a distanza (dal 20% al 10%, dal 50% al 40%, dal 33% al 23%). Questa riduzione si applica anche agli incantesimi che forniscono probabilità di essere mancati."},{"nome":"Bellezza disarmante","descrizione":"I drow in generale hanno tratti particolarmente delicati e attraenti. Alcuni però, sono talmente belli che è quasi impossibile non notarli e rimanerne colpiti.","testo":"Il personaggio ottiene bonus razziale +2 Diplomazia, +2 Intrattenere e +2 Raggirare nei confronti di coloro che già sono o che potrebbero essere attratti sessualmente da lui."},{"nome":"Errante del sottosuolo","descrizione":"Alcuni drow sanno come muoversi all'interno di dungeon, grotte e caverne come pochi altri.","testo":"Il personaggio ottiene bonus razziale +2 Sopravvivenza (ambienti sotterranei). Inoltre, può effettuare i passi di 1,5 m all'interno dei terreni difficili sotterranei, eccetto quelli manipolati magicamente."},{"nome":"Fanatico delle balestre","descrizione":"La balestra è un'arma molto amata dai drow e molti ne praticano l'arte con una dedizione unica.","testo":"Il personaggio ottiene il talento Ricarica rapida (balestre). Se il personaggio ottiene nuovamente tale talento, una volta al giorno, quando ottiene un 1 naturale in un tiro per colpire con una balestra, può ripetere tale tiro."},{"nome":"Impercettibile","descrizione":"Alcuni drow sono particolarmente abili nello spostarsi senza fare rumore.","testo":"Il personaggio non subisce la penalità di −5 alle prove di Furtività mentre si muove silenziosamente a velocità normale."},{"nome":"Magia delle profondità","descrizione":"Secoli di battaglie hanno reso gli incantatori drow naturalmente portati per aggirare l'innata resistenza agli incantesimi posseduta da molti loro avversari, specialmente quelli del sottosuolo.","testo":"Il personaggio ottiene bonus razziale +2 alle prove di livello di incantatore effettuate per superare la RI."},{"nome":"Patti blasfemi","descrizione":"Sin dagli albori della loro razza, i drow fanno appello ad antichi e osceni rituali per assicurarsi i servigi dei demoni più potenti.","testo":"Gli esterni di tipo demone evocati dal personaggio tramite evoca esterno (vedi privilegi di classe del convocatore) ottengono bonus +1 alla CA e permangono per 1 minuto per livello, anziché per 1 minuto ogni due livelli."},{"nome":"Rapidità dei drow","descrizione":"Alcuni drow sviluppano una velocità a dir poco impressionante.","testo":"Il personaggio ottiene bonus di potenziamento +1,5 m alla velocità base su terreno quando non indossa armature medie o pesanti."}]},"tipo":"umanoide con sottotipo elfo","taglia":"media","tipo_scheda":"Umanoide Medio (elfo)","movimento":"9 m","sensi":["scurovisione 18 m"]},{"nome":"Duergar","descrizione":"In antichità, duergar e nani erano i khàzad, un'unica razza che dimorava nelle profondità della terra. Una guerra ancestrale che coinvolse tutti i clan, portò però ad una profonda scissione. Gli odierni nani andarono a vivere nelle roccaforti montane, mentre i duergar rimasero sottoterra. Col tempo, i duergar abbracciarono sempre più la magia, perdendo di conseguenza la resistenza ad essa, tipica dei nani. Di contro, svilupparono corpi in grado di resistere agli attacchi velenosi e paralizzanti delle creature sotterranee. Nell'aspetto, i duergar assomigliano a nani dalla pelle meno colorita e con occhi freddi e spenti. Sono meno avidi dei nani ma egualmente burberi e scontrosi. I duergar tendono a mettere sé stessi avanti agli altri ma, in quanto khàzad, anche per loro onorare e mantenere la parola data è tutto, e in circostanze specifiche alcuni di essi possono diventare compagni di avventura degni di fiducia. In battaglia i duergar preferiscono prendere prigionieri, con l'eccezione dei nani ostili, che invece trucidano senza esitazione. Molti duergar considerano la vita una sequenza di tribolazioni che ha termine solo con la morte.","dati":{"Tipo":"umanoide con sottotipo nano.","Taglia":"media.","Movimento":"6 m (4 caselle).","Caratteristiche":"+2 Costituzione, +2 Saggezza, −2 Carisma. I duergar sono robusti, dotati di buon giudizio ma incredibilmente intolleranti.","Linguaggi iniziali":"quello di residenza e il nanico. Inoltre, possono scegliere tra gigante e pelleverde come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"1,18-1,33 m, 72-95 kg, aspettativa di vita massima di 450 anni circa."},"tratti":[{"nome":"Scurovisione","testo":"in zone di oscurità vedono in bianco e nero entro 18 m."},{"nome":"Sangue khàzad","testo":"contano come nani al fine di qualsiasi requisito, ad eccezione di quelli degli archetipi."},{"nome":"Lenti ma determinati","testo":"ignorano la penalità al movimento imposta dalle armature."},{"nome":"Familiarità con le armi","testo":"ottengono la competenza con l'ascia, il martello da guerra, il piccone e con le armi con la qualità Nanica."},{"nome":"Immunità duergar","testo":"ottengono immunità agli effetti di \\[PARALISI\\] e \\[VELENO\\]."},{"nome":"Stabilità","testo":"ottengono bonus razziale +4 DMC per resistere alle manovre di Sbilanciare e Spingere quando si trovano sui terreni solidi."},{"nome":"Esperti minatori","testo":"ottengono bonus razziale +2 Percezione (pericoli ambientali sotterranei; trappole e porte segrete situate su muri o pavimenti di pietra)."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Errante del sottosuolo","descrizione":"Alcuni duergar sanno come muoversi all'interno di dungeon, grotte e caverne come pochi altri.","testo":"Il personaggio ottiene bonus razziale +2 Sopravvivenza (ambienti sotterranei). Inoltre, può effettuare i passi di 1,5 m all'interno dei terreni difficili sotterranei, eccetto quelli manipolati magicamente."},{"nome":"Grande destino","descrizione":"Una profezia, il peso della propria genealogia o un compito di vitale importanza spinge alcuni duergar a compiere gesta incredibili nel momento del più cupo bisogno.","testo":"Una volta al giorno, quando il personaggio ottiene un 1 naturale in un Tiro Salvezza o prova di abilità, può ripetere tale tiro."},{"nome":"Magia delle profondità","descrizione":"Secoli di battaglie hanno reso gli incantatori duergar naturalmente portati per aggirare l'innata resistenza agli incantesimi posseduta da molti loro avversari, specialmente quelli del sottosuolo.","testo":"Il personaggio ottiene bonus razziale +2 alle prove di livello di incantatore effettuate per superare la RI."},{"nome":"Nemico delle aberrazioni","descrizione":"Molti insediamenti duergar sono visti dalle aberrazioni come luoghi sicuri dove nidificare. Coloro che vengono scelti per difenderli da tali creature, imparano presto a combatterle efficacemente.","testo":"Il personaggio ottiene contro le aberrazioni +1 ai tiri per colpire, bonus di schivare +1 alla CA, +2 ai Tiri Salvezza, +2 Intuizione e +2 Percezione."},{"nome":"Oltremodo rancoroso","descrizione":"I duergar sono famosi per la loro capacità nel serbare rancore. Alcuni più di altri.","testo":"Una volta al giorno, il personaggio può ottenere **vantaggio** nei tiri per colpire con armi o con colpi senz'armi del turno effettuati contro un nemico che lo abbia ferito nel round precedente."},{"nome":"Sadico","descrizione":"Alcuni duergar sviluppano forme di sadismo e sono ossessionati dal colpire i propri nemici nel modo più doloroso possibile.","testo":"Il personaggio ottiene bonus razziale +2 ai tiri per confermare le minacce di critico in mischia."},{"nome":"Schiavista","descrizione":"Alcuni clan di duergar hanno una lunga tradizione di schiavisti. Che portino avanti tale attività o meno, i giovani del clan vengono iniziati all'uso delle armi del mestiere sin dalla tenera età.","testo":"Il personaggio ottiene la competenza con la forca da prigionieri, la frusta e la frusta a nove sezioni. Infine, ottiene il talento Maestria con la frusta (non deve soddisfarne i requisiti)."},{"nome":"Spietato","descrizione":"Alcuni clan duergar danno più valore alla scaltrezza e all'intraprendenza che al giudizio e alla cautela. I membri che non mostrano tali requisiti, vengono spesso allontanati e talvolta uccisi.","testo":"Il personaggio ottiene +2 Intelligenza al posto di +2 Saggezza come caratteristica razziale. Inoltre, ottiene bonus +2 alle prove di Iniziativa, non cumulabile con il talento Iniziativa migliorata."}]},"tipo":"umanoide con sottotipo nano","taglia":"media","tipo_scheda":"Umanoide Medio (nano)","movimento":"6 m","sensi":["scurovisione 18 m"]},{"nome":"Grar","descrizione":"I grar sono piccole creature dagli occhi bianchi e senza pupilla. Essi sono ciò che nella famiglia gnomesca si avvicina di più ad una “pecora nera”. Sebbene dotati di buon cuore, i grar sono spesso maltrattati poiché vengono erroneamente accomunati agli ambigui duergar. Data questa premessa, si può facilmente intuire perché siano sospettosi e lenti nel concedere la propria fiducia. I grar amano scavare le loro case nelle colline in periferia, dove possono creare gallerie che si estendono per lunghezza, piuttosto che in profondità, in una lotta di amore e odio per gli animali scavatori che cercano rifugio all'interno dei tunnel. I grar sono estremamente timidi, tanto da considerare oltremodo maleducato chiunque li fissi (o anche chi li guardi e basta). Accade, tuttavia, che degli estranei riescano a fare amicizia con uno di loro, di solito scoprendo in quest'ultimo un compagno leale e intrepido, la cui apparenza pragmatica è bilanciata da un contorto spirito di autocritica.","dati":{"Tipo":"umanoide con sottotipo gnomo.","Taglia":"piccola (+1 CA, +1 ai tiri per colpire, −2 BMC, −2 DMC, +2 Furtività).","Movimento":"6 m (4 caselle).","Caratteristiche":"−2 Forza, +2 Costituzione, +2 Saggezza. I grar sono deboli ma resistenti e prudenti come pochi altri.","Linguaggi iniziali":"quello di residenza e il nanico. Inoltre, possono scegliere tra draconico, drow, gigante e pelleverde come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"95 cm – 1,10 m, 19-22 kg, aspettativa di vita massima di 300 anni circa."},"tratti":[{"nome":"Sangue gnomesco","testo":"contano come gnomi al fine di qualsiasi requisito, ad eccezione di quelli degli archetipi."},{"nome":"Visione crepuscolare","testo":"ignorano l'occultamento dovuto alla luce fioca."},{"nome":"Familiarità con le armi","testo":"ottengono la competenza con la piccozza e con le armi con la qualità Gnomesca."},{"nome":"Difensivi","testo":"ottengono il talento Schivare (non devono soddisfarne i requisiti)."},{"nome":"Magia elusiva (Mag)","testo":"quando lanciano un incantesimo della scuola di Illusione possono aumentarne di 1 la CD. Inoltre, possono lanciare una volta al giorno ciascuno gli incantesimi Conversazione clandestina, Prestidigitazione, Spegnere e Camuffare sé stesso (durata 30 minuti)."},{"nome":"Furtivi","testo":"ottengono bonus razziale +2 Furtività, che diventa +4 all'interno di ambienti sotterranei."},{"nome":"Sensi acuti","testo":"ottengono bonus razziale +2 Percezione."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Aptofobico","descrizione":"Alcuni grar sono così schivi e riservati da sviluppare una vera e propria ossessione per l'essere toccati dagli altri.","testo":"Il personaggio ottiene bonus di schivare +4 alla CA contro gli attacchi di contatto in mischia."},{"nome":"Difese immunitarie","descrizione":"I grar hanno sempre a che fare con parassiti e animali da buca, spesso velenosi o poco igienici. Questo conferisce una buona resistenza immunitaria.","testo":"Il personaggio ottiene bonus razziale +2 ai Tiri Salvezza contro gli effetti di \\[MALATTIA\\] e \\[VELENO\\]."},{"nome":"Errante del sottosuolo","descrizione":"Alcuni grar sanno come muoversi all'interno di dungeon, grotte e caverne come pochi altri.","testo":"Il personaggio ottiene bonus razziale +2 Sopravvivenza (ambienti sotterranei). Inoltre, può effettuare i passi di 1,5 m all'interno dei terreni difficili sotterranei, eccetto quelli manipolati magicamente."},{"nome":"Fugace","descrizione":"Certi grar sono per natura abilissimi nel distrarre interi gruppi di nemici e disimpegnarsi velocemente quando le cose si mettono male.","testo":"Quando il personaggio effettua un'azione di ritirata, non provoca attacchi di opportunità da parte di nessun nemico durante tutto il movimento di tale azione."},{"nome":"Grar di profondità","descrizione":"I grar di profondità costruiscono le loro tane in tunnel verticali che scendono nelle viscere della terra. Essi sono più svegli dei normali grar, anche se un po' meno giudiziosi.","testo":"Il personaggio ottiene +2 Intelligenza al posto di +2 Saggezza come caratteristica razziale. Inoltre, ottiene Scurovisione 18 m."},{"nome":"Occhio per le opportunità","descrizione":"Anche se non è un comportamento propriamente leale, molti grar attendono che i nemici si scoprano per portare attacchi più efficaci.","testo":"Il personaggio ottiene bonus razziale +1 ai tiri per colpire con gli attacchi di opportunità."},{"nome":"Ossessionato dalla morte","descrizione":"Molti grar sono ossessionati dall'idea di sfortuna e morte e compiono riti scaramantici e/o sacri al fine di allontanarle il più possibile. Suggestione o no, per alcuni pare funzionare.","testo":"Il personaggio ottiene bonus razziale +2 ai Tiri Salvezza contro effetti di \\[MALEDIZIONE\\] e \\[MORTE\\]. Inoltre, ottiene RE (energia negativa) 5."},{"nome":"Paranoico","descrizione":"I grar si aspettano sempre che qualcosa di brutto gli accada da un momento all'altro. Per alcuni questo timore diventa un'ossessione.","testo":"Quando il personaggio è impreparato, subisce penalità di −3 alla prova di Iniziativa, anziché di −6."}]},"tipo":"umanoide con sottotipo gnomo","taglia":"piccola","tipo_scheda":"Umanoide Piccolo (gnomo)","movimento":"6 m","sensi":["visione crepuscolare"]},{"nome":"Skaven","descrizione":"Gli skaven sono piccoli e velocissimi umanoidi, simili a ratti, che vivono nelle profondità della terra e nei sistemi fognari, tanto delle grandi megalopoli che delle piccole città. Come i topi a cui assomigliano, gli skaven sono accumulatori per natura, specie quando si parla di oggetti magici. Sono molti gli skaven che si rivelano astuti mercanti e che si barcamenano attentamente tra le fragili alleanze dei mercati neri. I più però, sono interessati maggiormente ai propri oggetti più che al denaro di per sé, e preferiscono mercanteggiare per fare aggiunte ai loro possedimenti, piuttosto che in cambio di valuta. È un fatto piuttosto comune vedere un gruppo di mercanti skaven, uscire da una città con un carico di dimensioni superiori a quello che avevano al loro ingresso, con gli oggetti impilati in modo precario su un carro trainato.","dati":{"Tipo":"umanoide con sottotipo skaven.","Taglia":"piccola (+1 CA, +1 ai tiri per colpire, −2 BMC, −2 DMC, +2 Furtività).","Movimento":"9 m (6 caselle).","Caratteristiche":"−2 Forza, +2 Destrezza, +2 Intelligenza. Gli skaven sono deboli, agili e molto astuti.","Linguaggi iniziali":"quello di residenza e lo skaven. Inoltre, possono scegliere tra gigante, gnoll, halfling, nanico e pelleverde come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"95 cm – 1,10 m, 20-35 kg, aspettativa di vita massima di 60 anni circa."},"tratti":[{"nome":"Visione crepuscolare","testo":"ignorano l'occultamento dovuto alla luce fioca."},{"nome":"Familiarità con le armi","testo":"ottengono la competenza con le armi con la qualità Skaven."},{"nome":"Coda prensile","testo":"possono usare la coda per recuperare gli oggetti dallo zaino come azione di movimento, anziché come azione di round completo e senza necessariamente togliersi lo zaino dalle spalle. Non si può usare la coda in questo modo se è munita di un'estensione per coda (vedi Volume 3 – Equipaggiamento: Armorieri)."},{"nome":"Reattivi","testo":"ottengono bonus +2 alle prove di Iniziativa, non cumulabile con il talento Iniziativa migliorata."},{"nome":"Sensi acuti","testo":"ottengono bonus razziale +2 Percezione."},{"nome":"Furtivi","testo":"ottengono bonus razziale +2 Furtività."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Albino","descrizione":"Taluni rarissimi skaven nascono con il pelo bianco, simbolo di un'affinità innata con la magia.","testo":"Il personaggio ottiene +2 Sapienza magica. Inoltre, ottiene +2 alle prove di Concentrazione."},{"nome":"Fiuto","descrizione":"Alcuni skaven hanno un senso dell'olfatto molto sviluppato, a scapito di una vista scadente.","testo":"Il personaggio ottiene la regola Fiuto, ma subisce penalità −2 Percezione (vista)."},{"nome":"Furia codarda","descrizione":"Alcuni skaven, quando sono feriti e isolati dai propri alleati, sono capaci di combattere in modo sorprendentemente feroce.","testo":"Se il personaggio viene ridotto a metà o meno Punti Ferita, fintanto che non ha alleati coscienti entro 9 m ottiene bonus razziale +1 ai tiri per colpire in mischia e +1 di schivare alla CA."},{"nome":"Inafferrabile","descrizione":"Molti skaven, come i ratti, sono quasi impossibili da contenere.","testo":"Una volta al giorno, il personaggio può ottenere **vantaggio** con +2 in una prova di Artista della fuga."},{"nome":"Inquietante","descrizione":"A causa del proprio stesso essere, alcuni skaven innervosiscono naturalmente gli animali.","testo":"Il personaggio subisce penalità −3 alle prove di abilità basate su Carisma effettuate per influenzare le creature di tipo animale. Di contro, riceve bonus di schivare +2 alla CA contro gli attacchi di tali creature."},{"nome":"Inventore di talento","descrizione":"Certi skaven sono ossessionati dalle invenzioni, meglio se pericolose e imprevedibili… come i mechanus, ad esempio.","testo":"Il personaggio ottiene la dote da inventore Mechanus potenziati."},{"nome":"Topo di fogna","descrizione":"Gli skaven che hanno vissuto a lungo in luoghi insalubri sviluppano delle difese immunitarie eccelse, nonché un'alta resistenza a sostanze e creature stomachevoli.","testo":"Il personaggio ottiene bonus razziale +2 ai Tiri Salvezza contro effetti di \\[MALATTIA\\], \\[INFERMITÀ\\] e \\[NAUSEA\\]."},{"nome":"Veggente cornuto","descrizione":"Alcuni skaven nascono con un paio di piccole corna. Questi individui sono solitamente dotati di un ottimo giudizio e di flebili capacità di preveggenza.","testo":"Il personaggio ottiene +2 Saggezza al posto di +2 Intelligenza come caratteristica razziale. Inoltre, una volta al giorno può lanciare l'incantesimo Presagio."}]},"tipo":"umanoide con sottotipo skaven","taglia":"piccola","tipo_scheda":"Umanoide Piccolo (skaven)","movimento":"9 m","sensi":["visione crepuscolare"]},{"nome":"Samsaran","descrizione":"I samsaran hanno pelle di un azzurro pallido, capelli scuri e occhi completamente bianchi, privi di iride e pupilla, che sembrano guardare sempre un punto leggermente oltre l'interlocutore. Non è un'impressione: un samsaran non nasce davvero, rinasce. Alla morte il suo spirito ritorna in un nuovo corpo identico, e con esso ritornano frammenti di ciò che è stato — un mestiere imparato tre vite fa, la faccia di qualcuno morto da secoli, il rimorso per un torto commesso da una persona che non esiste più. Sono creature pacate, cortesi e malinconiche, che affrontano tutto con la calma di chi ha già visto molte cose finire. Non temono la morte, la trovano semmai imbarazzante. Ciò che temono davvero è dimenticare, e per questo scrivono: ogni samsaran tiene un diario che non finirà mai di riempire, e che alla sua morte verrà bruciato, perché la vita successiva se lo ritrovi dentro anziché fra le mani.","dati":{"Tipo":"umanoide con sottotipo samsaran.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Intelligenza, +2 Saggezza, −2 Costituzione. I samsaran sono acuti e assennati come chi ha vissuto molte volte, ma abitano corpi fragili e passeggeri.","Linguaggi iniziali":"quello di residenza. Inoltre, possono scegliere qualsiasi linguaggio (non segreto) come linguaggio bonus dovuto all'Intelligenza.","Altezza, peso ed età":"1,60-1,90 m, 55-85 kg, aspettativa di vita massima di 500 anni circa."},"tratti":[{"nome":"Visione crepuscolare","testo":"ignorano l'occultamento dovuto alla luce fioca."},{"nome":"Spirito ciclico","testo":"ottengono bonus razziale +2 ai Tiri Salvezza contro effetti di \\[MORTE\\], \\[ENERGIA NEGATIVA\\] e \\[RISUCCHIO DI ENERGIA\\]."},{"nome":"Riverbero delle vite","testo":"alla creazione il personaggio sceglie tre abilità qualsiasi: le considera abilità di classe e ottiene bonus razziale +1 in ciascuna di esse."},{"nome":"Mente serena","testo":"ottengono bonus razziale +2 alle prove di Concentrazione e la CD delle prove per Intimidirli aumenta di 2."},{"nome":"Memoria delle lingue","testo":"ottengono bonus razziale +2 Conoscenze (storia e leggende) e possono effettuare le prove in tale abilità anche senza addestramento."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Déjà-vu","descrizione":"Alcuni samsaran hanno la sensazione, precisa e insopportabile, di aver già vissuto esattamente quel momento.","testo":"Una volta al giorno, come azione immediata, quando il personaggio sta per effettuare un tiro per colpire, un Tiro Salvezza o una prova di abilità, può ottenere **vantaggio** in quel tiro."},{"nome":"Eco di un maestro","descrizione":"In una delle sue vite passate, questo samsaran è stato addestrato da qualcuno che sapeva davvero il fatto proprio.","testo":"Il personaggio ottiene un talento bonus a scelta, purché ne soddisfi i requisiti."},{"nome":"Karma pesante","descrizione":"Certi samsaran portano il peso di colpe commesse da persone che non esistono più, e la sfortuna sembra riconoscerli.","testo":"Una volta al giorno, come azione immediata, il personaggio può imporre **svantaggio** a un tiro per colpire, a un Tiro Salvezza o a una prova di abilità di una creatura entro 9 m. Quando lo fa, subisce penalità −2 a tutti i propri tiri di d20 fino alla fine del turno successivo."},{"nome":"Mani che ricordano","descrizione":"Il corpo di alcuni samsaran esegue mestieri che la loro mente non ha mai imparato.","testo":"Il personaggio ottiene bonus razziale +3 a una Professione a scelta e la considera abilità di classe. Inoltre, può effettuare le prove in tale Professione anche senza gli attrezzi necessari, senza subire la penalità di −5."},{"nome":"Occhi del ciclo","descrizione":"Gli occhi bianchi di questi samsaran vedono ciò che è già morto e ciò che non è mai stato vivo.","testo":"Il personaggio percepisce automaticamente la presenza di non morti entro 9 m e ottiene bonus razziale +2 ai tiri per colpire contro di essi."},{"nome":"Pace interiore","descrizione":"Alcuni samsaran raggiungono una serenità che nessuna magia riesce a incrinare.","testo":"Il personaggio ottiene bonus razziale +2 ai Tiri Salvezza contro effetti di \\[INFLUENZA MENTALE\\] e \\[PAURA\\]. Inoltre, se supera un Tiro Salvezza contro uno di questi effetti, può ripetere immediatamente un Tiro Salvezza fallito in precedenza contro un altro effetto della stessa categoria ancora attivo su di lui."},{"nome":"Rimpianto ardente","descrizione":"Ciò che questo samsaran non ha portato a termine in una vita, lo porta a termine nella successiva, a costo di consumarsi.","testo":"Una volta al giorno, come azione veloce, il personaggio sceglie un nemico entro 9 m: per 1 minuto ottiene bonus razziale +2 ai tiri per colpire e ai danni contro quella creatura, ma subisce penalità −2 alla CA contro tutte le altre."},{"nome":"Voce delle vite precedenti","descrizione":"Alcuni samsaran sanno interrogare sé stessi come si interroga un archivio.","testo":"Il personaggio ottiene bonus razziale +2 a tutte le abilità di Conoscenze e può effettuare le prove in tali abilità anche senza addestramento."}]},"tipo":"umanoide con sottotipo samsaran","taglia":"media","tipo_scheda":"Umanoide Medio (samsaran)","movimento":"9 m","sensi":["visione crepuscolare"]},{"nome":"Centauri","descrizione":"Leggendari cacciatori e abili guerrieri, i centauri sono in parte uomini e in parte cavalli, e i più comuni tra essi vivono nelle zone collinari e di campagna. Generalmente collocata ai margini della civilizzazione, questa stoica popolazione varia enormemente come aspetto in base al luogo in cui vive: la parte superiore somiglia agli umani delle regioni limitrofe, mentre quella inferiore ha le tonalità degli equini locali. Sono creature forti e sagge, dotate di una memoria lunghissima per i torti subiti e di un orgoglio che nessun affronto scalfisce due volte. Diffidano delle città, dove i loro corpi non trovano spazio e dove ogni porta è un'umiliazione, e considerano l'idea stessa di portare qualcuno sulla propria groppa come un'offesa che solo un amico di lunga data può permettersi di proporre.","dati":{"Tipo":"umanoide mostruoso.","Taglia":"grande speciale (basetta da 1×2 caselle, −1 CA, −1 ai tiri per colpire, −2 Furtività, +2 BMC, +2 DMC).","Movimento":"12 m (8 caselle).","Caratteristiche":"+2 Forza, +2 Costituzione, −2 Destrezza. I centauri sono possenti e instancabili, ma la loro mole li rende tutt'altro che agili.","Linguaggi iniziali":"quello di residenza. Inoltre, possono scegliere tra elfico, felino, gnoll e silvano come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"1,70-2,10 m, 320-350 kg, aspettativa di vita massima di 100 anni circa."},"tratti":[{"nome":"Non umanoidi","testo":"in quanto umanoidi mostruosi, ottengono immunità a incantesimi e capacità (sia benefiche che ostili) che bersagliano specificamente gli umanoidi, come Blocca persone*, Charme su persone, Dominare persone*, Ingrandire persone, Ridurre persone, etc."},{"nome":"Armi sottodimensionate","testo":"anche se un centauro è di taglia grande, la parte superiore del suo corpo è quella di un umanoide di taglia media: impugna quindi armi di una taglia più piccola della propria e ha una normale portata di 1,5 m."},{"nome":"Zoccoli","testo":"ottengono un attacco di supporto di Zoccoli che infligge 1d6 danni."},{"nome":"Pelle spessa","testo":"ottengono bonus +1 alla CA Naturale."},{"nome":"Quadrupedi","testo":"non possono cavalcare altre creature, ma ottengono bonus razziale +4 alla DMC contro i tentativi di Sbilanciare."},{"nome":"Cavalcatura speciale","testo":"se un privilegio di classe conferisce loro una cavalcatura speciale, ottengono invece un talento qualsiasi a scelta, più un altro al 10° livello di quella classe."},{"nome":"Instancabili","testo":"ottengono il talento Resistenza fisica (non devono soddisfarne i requisiti)."},{"nome":"Travolgenti","testo":"ottengono bonus razziale +2 alle prove di Oltrepassare."},{"nome":"Pessimi scalatori","testo":"penalità razziale −2 Scalare."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Arciere delle pianure","descrizione":"I centauri delle grandi distese imparano a tirare in corsa prima ancora di imparare a camminare al passo.","testo":"Il personaggio non subisce la penalità di −4 ai tiri per colpire con armi a distanza mentre effettua un'azione di corsa o di carica. Inoltre, ottiene la competenza con l'arco corto e l'arco lungo."},{"nome":"Centauro delle pianure","descrizione":"Questi centauri vivono nelle sconfinate praterie e fungono spesso da emissari e diplomatici tra le comunità che abitano i territori circostanti.","testo":"Il personaggio ottiene bonus razziale +2 Diplomazia e +2 Intuizione. Inoltre, una volta al giorno può ottenere **vantaggio** in una prova di Diplomazia."},{"nome":"Grande trotto","descrizione":"Le zampe di alcuni centauri sono capaci di cavalcate lunghe e sostenute che nessun cavallo reggerebbe.","testo":"Il personaggio ottiene il talento Correre (non deve soddisfarne i requisiti). Inoltre, può viaggiare per un numero di ore al giorno pari al doppio del normale senza subire penalità da affaticamento."},{"nome":"Lanciere","descrizione":"In virtù della loro fisionomia, alcuni centauri si addestrano all'utilizzo della lancia da cavaliere.","testo":"Il personaggio ottiene la competenza nella lancia da cavaliere e può usarla come se fosse una creatura in sella, infliggendo danni doppi quando carica."},{"nome":"Scattista","descrizione":"Le zampe di alcuni centauri sono capaci di scatti improvvisi e rapidissimi.","testo":"Il personaggio ottiene bonus razziale +3 m alla velocità base su terreno quando effettua un'azione di carica, corsa o ritirata."},{"nome":"Temprato","descrizione":"Il continuo addestramento fa sì che la difesa diventi una seconda natura per alcuni centauri.","testo":"Il personaggio ottiene bonus razziale +2 alla DMC. Inoltre, non subisce la consueta penalità di −2 alla CA quando effettua una carica."},{"nome":"Torocentauro","descrizione":"Alcuni centauri hanno la parte inferiore di toro anziché di cavallo. Queste creature sono cocciute, ostinate e possenti come frane.","testo":"Il personaggio ottiene bonus razziale +2 ai Tiri Salvezza contro effetti di \\[COMPULSIONE\\] e bonus razziale +4 BMC per Spingere e Oltrepassare. Di contro, il suo movimento base scende a 9 m (6 caselle)."},{"nome":"Vedetta della prateria","descrizione":"Nessuno vede arrivare le cose da lontano come un centauro che sta in piedi da nove ore e non ha alcuna intenzione di sedersi.","testo":"Il personaggio ottiene bonus razziale +2 Percezione e +2 Sopravvivenza. Inoltre, non subisce le penalità dovute al riposare in armatura."}]},"tipo":"umanoide mostruoso","taglia":"grande_speciale","tipo_scheda":"Umanoide mostruoso Grande","movimento":"12 m","sensi":[]},{"nome":"Mezzo-giganti","descrizione":"Nessuno sa con certezza come nasca un mezzo-gigante, e le poche teorie in circolazione sono tutte sgradevoli. La più accreditata parla di antichi esperimenti di stregoni che volevano soldati alti tre metri e ottennero invece qualcosa di più piccolo e molto più intelligente; le comunità di mezzo-giganti, dal canto loro, raccontano storie di antenati che scesero volontariamente dalle montagne e presero moglie tra gli umani. Comunque sia andata, i mezzo-giganti superano di una spanna abbondante chiunque altro, hanno spalle che non passano dalle porte e mani in cui una spada a due mani sembra un coltello. Sono creature calme, di parola, abituate fin da bambini a misurare la propria forza per non fare danni, e profondamente stufe di sentirsi chiedere se sono davvero imparentati con
