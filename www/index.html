olta al giorno può ottenere **vantaggio** in una prova di Intrattenere o di Diplomazia."},{"nome":"Flauto di Pan (Mag)","descrizione":"Il flauto di alcuni fauni non si limita a fare musica: fa addormentare, incanta, chiama.","testo":"Una volta al giorno, il personaggio può lanciare come capacità magica uno tra Sonno, Ipnosi e Charme su persone, con CD 10 + metà livello di personaggio + bonus di Carisma. Questo è un effetto \\[UDITIVO\\] e richiede uno strumento a fiato."},{"nome":"Passo del capro","descrizione":"I fauni delle alture si muovono su pareti verticali con la stessa noncuranza con cui gli altri camminano in pianura.","testo":"Il personaggio ottiene bonus razziale +4 Scalare e non perde mai il bonus di Destrezza alla CA quando scala o è appeso. Inoltre, ottiene bonus razziale +2 Acrobazia (mantenere l'equilibrio)."},{"nome":"Riso contagioso","descrizione":"La risata di certi fauni è tanto sfacciata e fuori luogo da spezzare la concentrazione di chiunque.","testo":"Una volta al giorno, come azione immediata, quando un nemico entro 9 m che possa udirlo effettua una prova di Concentrazione o un tiro per colpire, il personaggio può imporgli **svantaggio** in quel tiro."},{"nome":"Sangue antico dei folletti","descrizione":"In alcuni fauni l'eredità fatata scorre più densa che negli altri, e la magia altrui fatica a trovarli.","testo":"Il personaggio ottiene RI 6 + livello di personaggio. Si può sopprimere o riattivare questa RI come azione veloce."},{"nome":"Temperanza allegra","descrizione":"Un fauno beve tutto ciò che gli viene offerto, e i fauni si offrono molte cose a vicenda. Alcuni ne escono con uno stomaco indistruttibile.","testo":"Il personaggio ottiene bonus razziale +4 ai Tiri Salvezza contro effetti di \\[VELENO DA INGESTIONE\\] e contro gli effetti dell'alcol. Inoltre, ottiene bonus razziale +2 ai Tiri Salvezza contro effetti di \\[MALATTIA\\]."}]},"tipo":"umanoide con sottotipo folletto","taglia":"media","tipo_scheda":"Umanoide Medio (folletto)","movimento":"9 m","sensi":["visione crepuscolare"]},{"nome":"Ghoran","descrizione":"I ghoran non sono nati: sono stati coltivati. Millenni fa un botanico di cui nessuno ricorda più il nome creò una pianta capace di pensare, e da quella pianta discendono tutti loro. Hanno corpi di fibra vegetale e corteccia levigata, capelli di foglie e petali che cambiano colore con l'umore, e un profumo dolce che chi sta loro vicino fatica a dimenticare. Sono creature vanitose, teatrali e profondamente convinte di essere migliori di chi le circonda — convinzione che, va detto, hanno il talento di rendere quasi condivisibile. Vivono a lungo e ricordano molto, e ogni ghoran porta con sé un seme che contiene tutto ciò che è: quando il corpo cede, il seme può essere piantato, e da esso germoglia di nuovo lo stesso individuo, con gli stessi ricordi e la stessa insopportabile sicurezza di sé. Ma il seme è uno solo, e nessun ghoran lo dimentica mai.","dati":{"Tipo":"umanoide con sottotipo vegetale.","Taglia":"media.","Movimento":"9 m (6 caselle).","Caratteristiche":"+2 Costituzione, +2 Carisma, −2 Destrezza. I ghoran sono resistenti e magnetici, ma i loro corpi legnosi sono tutt'altro che agili.","Linguaggi iniziali":"quello di residenza e il silvano. Inoltre, possono scegliere tra elfico, gripli, gnomesco e qualsiasi linguaggio (non segreto) come linguaggi bonus dovuti all'Intelligenza.","Altezza, peso ed età":"1,70-2 m, 45-70 kg, aspettativa di vita massima di 700 anni circa."},"tratti":[{"nome":"Visione crepuscolare","testo":"ignorano l'occultamento dovuto alla luce fioca."},{"nome":"Natura vegetale","testo":"ottengono bonus razziale +4 ai Tiri Salvezza contro effetti di \\[INFLUENZA MENTALE\\], \\[PARALISI\\], \\[SONNO\\], \\[STORDIMENTO\\] e \\[VELENO\\]."},{"nome":"Vulnerabilità al fuoco","testo":"subiscono +25% ai danni da fuoco."},{"nome":"Fotosintesi","testo":"non necessitano di nutrirsi, a patto di esporsi alla luce solare per almeno 2 ore al giorno. Un ghoran che non vi riesca è soggetto alle normali regole della fame a partire dal giorno successivo."},{"nome":"Corteccia","testo":"ottengono bonus +1 alla CA Naturale."},{"nome":"Profumo inebriante","testo":"ottengono bonus razziale +2 Diplomazia e +2 Intrattenere nei confronti delle creature in grado di percepire odori."},{"nome":"Memoria del seme","testo":"alla creazione il personaggio sceglie due abilità di Conoscenze: le considera abilità di classe e ottiene bonus razziale +2 in ciascuna di esse."},{"nome":"Seme di rinascita","testo":"ogni ghoran porta in sé un unico seme, che alla propria morte può essere estratto dal corpo entro 24 ore e piantato in terra fertile. Dopo 1d4 mesi, dal seme germoglia lo stesso individuo, con i propri ricordi, il proprio livello e le proprie capacità, ma privo di ogni oggetto posseduto. Un ghoran può rinascere una sola volta nell'arco della propria esistenza: un ghoran già rigenerato non possiede più alcun seme e la sua morte è definitiva. Un ghoran privo di seme non può essere riportato in vita da alcun incantesimo di resurrezione, poiché non ha un'anima nel senso in cui la intendono gli altri popoli."}],"opzioni":{"titolo":"Tratto razziale bonus","intro":"","voci":[{"nome":"Corteccia spessa","descrizione":"La scorza di alcuni ghoran è tanto densa da respingere le lame e da resistere alle fiamme.","testo":"Il personaggio ottiene bonus +1 alla CA Naturale, cumulativo con quello del tratto razziale Corteccia. Inoltre, il malus da Vulnerabilità al fuoco scende dal 25% al 10%."},{"nome":"Fiore velenoso","descrizione":"I petali di questi ghoran secernono un nettare che seduce e poi tramortisce.","testo":"Una volta al giorno, come azione standard, il personaggio può emettere una nube di polline in un'emanazione di 4,5 m centrata su di sé. Tutte le creature nell'area che respirano devono superare un Tiro Salvezza su Tempra con CD 10 + metà livello di personaggio + bonus di Costituzione o diventare nauseate per 1 minuto."},{"nome":"Linfa rigenerante","descrizione":"La linfa di alcuni ghoran richiude le ferite mentre ancora si aprono.","testo":"Durante il Rifiatare, il personaggio può ripetere i risultati di dado pari a 1 e 2. Questi tiri possono essere ripetuti un qualsiasi numero di volte."},{"nome":"Portamento regale","descrizione":"Certi ghoran hanno una presenza tanto studiata da mettere in soggezione chiunque, che lo vogliano o no.","testo":"Il personaggio ottiene bonus razziale +2 Intimidire e +2 Raggirare. Inoltre, una volta al giorno può ottenere **vantaggio** in una prova di abilità basata su Carisma."},{"nome":"Radici profonde","descrizione":"Certi ghoran sanno affondare i piedi nel terreno e diventare, per qualche istante, un albero vero.","testo":"Come azione veloce, il personaggio può radicarsi: fino alla fine del turno successivo ottiene bonus razziale +4 alla DMC contro le manovre di Sbilanciare e Spingere e non può essere mosso contro la propria volontà da alcun effetto che non sia magico. Mentre è radicato la sua velocità è 0."},{"nome":"Rigermogliare","descrizione":"Il corpo di alcuni ghoran ricostruisce ciò che perde, dato tempo a sufficienza.","testo":"Il personaggio non subisce le penalità permanenti derivanti dalla perdita di arti e organi dovuta alle Ferite gravi: l'arto o l'organo rigermoglia nell'arco di 1 settimana, durante la quale le penalità si applicano normalmente. Questo tratto non ha effetto sulla morte."},{"nome":"Sapere delle radici","descrizione":"Le radici dei ghoran affondano nella terra e nella memoria di chi vi è sepolto.","testo":"Il personaggio ottiene bonus razziale +2 a tutte le abilità di Conoscenze e può effettuare le prove in tali abilità anche senza addestramento. Questo bonus si cumula con quello del tratto razziale Memoria del seme sulle due Conoscenze scelte."},{"nome":"Spine","descrizione":"Il fusto di questi ghoran è irto di spine acuminate che rendono spiacevole afferrarli.","testo":"Il personaggio ottiene un attacco di supporto di Spine che infligge 1d4 danni. Inoltre, ogni turno in cui viene tenuto in lotta o fallisce nel liberarsi da essa, infligge automaticamente 1d4 danni a un singolo avversario che lo sta trattenendo."}]},"tipo":"umanoide con sottotipo vegetale","taglia":"media","tipo_scheda":"Umanoide Medio (vegetale)","movimento":"9 m","sensi":["visione crepuscolare"]}],"generici":{"intro":"Si sceglie un tratto tra quelli sotto elencati al posto del tratto razziale bonus previsto dalla propria razza (o dall'opzione equivalente: poteri vampirici, retaggi oscuri, retaggi planari, retaggi bestiali, discendenze draconiche, upgrade di sistema).","voci":[{"nome":"Addestramento marziale","descrizione":"Alcuni imparano l'uso delle armi per necessità, altri perché intraprendono una carriera militare più o meno lunga.","testo":"Il personaggio ottiene la competenza con tre armi da guerra a scelta."},{"nome":"Artigiano eccelso","descrizione":"Molti artigiani sono famosi per le loro opere, ma alcuni hanno una vera e propria dote naturale per il mestiere.","testo":"Il personaggio sceglie una categoria tra metalli, legno, gioielleria, armi da fuoco e pellami e tessuti. Ottiene bonus razziale +3 Valutare relativamente a quella categoria e può riparare gli oggetti rotti che vi appartengono anche in viaggio, come se avesse sempre con sé un'officina."},{"nome":"Canaglia","descrizione":"Sono molti coloro che trascorrono l'infanzia cercando di barcamenarsi in situazioni difficili. Questi derelitti imparano mezzi poco ortodossi per sopravvivere, mezzi che devono quasi sempre usare a discapito del prossimo.","testo":"Il personaggio ottiene bonus razziale +2 Raggirare. Inoltre, ottiene bonus razziale +2 Rapidità di mano e può effettuare le prove in tale abilità anche senza addestramento."},{"nome":"Cerusico eccelso","descrizione":"Non pochi individui tendono a prendersi cura con grande dedizione della propria salute e di quella degli altri.","testo":"Tramite Professione (cerusico) il personaggio può fornire Assistenza continua anche a sé stesso (s const WEB = false;   // true nella pagina di prova: lì i file non si scaricano, si copiano
// Schermo del Narratore — motore di calcolo (funzioni pure), testato da test_motore.js.
// Usabile da Node (module.exports) e dalla pagina. Ogni funzione che "cambia" una campagna
// ne restituisce una copia: l'originale non viene toccato. Il caso arriva sempre da `rng`
// (funzione che restituisce un numero in [0,1)), così i test sono ripetibili.
// Tempo: tutto in round assoluti dall'inizio dell'anno di partenza (1 round = 6 s,
// 10 round = 1 minuto, 600 = 1 ora, 14400 = 1 giorno).
'use strict';
const Motore = (() => {
const FORMATO = 'schermo-v1';
const ROUND_MIN = 10, ROUND_ORA = 600, ROUND_GIORNO = 14400;
const clona = o => JSON.parse(JSON.stringify(o));
let STRUMENTI = null; // strumenti.json (Build 3a): fonti di luce e Fiamme, impostato con usaStrumenti()
function usaStrumenti(s) { STRUMENTI = s; }
const nuovoId = rng => Math.floor(rng() * 36 ** 8).toString(36).padStart(8, '0');
// id interni (PG, righe dell'iniziativa): contatore della campagna, sempre univoci
const prossimoId = (c, pre) => { c.contatore = (c.contatore || 0) + 1; return pre + c.contatore; };

// ------------------------------------------------------------------ dadi
function d(n, rng) { return 1 + Math.floor(rng() * n); }
// d20 della Collana: 20 naturale = 30, 1 naturale = −10 (Vol. 1)
function valoreD20(nat) { return nat === 20 ? 30 : nat === 1 ? -10 : nat; }
// Espressioni semplici: "2d6+3", "1d20-1", "4d6kh3", "d100", "5". Restituisce {totale, dadi, testo}
function tira(espr, rng) {
  const s = String(espr).replace(/\s+/g, '').toLowerCase();
  if (!/^[+-]?(\d*d\d+(k[hl]\d+)?|\d+)([+-](\d*d\d+(k[hl]\d+)?|\d+))*$/.test(s)) throw new Error('Espressione non valida: ' + espr);
  let totale = 0; const dadi = [];
  for (const m of s.matchAll(/([+-]?)(?:(\d*)d(\d+)(?:k([hl])(\d+))?|(\d+))/g)) {
    const segno = m[1] === '-' ? -1 : 1;
    if (m[6] !== undefined) { totale += segno * +m[6]; continue; }
    const n = m[2] ? +m[2] : 1, f = +m[3];
    let r = Array.from({ length: n }, () => d(f, rng));
    let tenuti = r;
    if (m[4]) { const k = +m[5]; tenuti = [...r].sort((a, b) => m[4] === 'h' ? b - a : a - b).slice(0, k); }
    dadi.push({ facce: f, risultati: r, tenuti });
    totale += segno * tenuti.reduce((a, b) => a + b, 0);
  }
  return { totale, dadi, testo: espr };
}

// ------------------------------------------------------------------ calendario
const MESI_REALI = [['gennaio', 31], ['febbraio', 28], ['marzo', 31], ['aprile', 30], ['maggio', 31], ['giugno', 30],
  ['luglio', 31], ['agosto', 31], ['settembre', 30], ['ottobre', 31], ['novembre', 30], ['dicembre', 31]];
const SETTIMANA_REALE = ['lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato', 'domenica'];
function calendarioReale() {
  return { tipo: 'reale', mesi: MESI_REALI.map(([nome, giorni]) => ({ nome, giorni })), settimana: SETTIMANA_REALE.slice() };
}
function lunghezzaAnno(cal) { return cal.mesi.reduce((a, m) => a + m.giorni, 0); }
function controllaCalendario(cal) {

  if (s.altro) { L.push('── NOTE ──'); L.push(s.altro); }

        d.mods = { altro: testo(f, 'm_altro') }; for (const k of ['ts', 'tempra', 'riflessi', 'volonta', 'ca', 'dmc', 'abilita', 'iniziativa', 'fatica_max']) d.mods[k] = n('m_' + k);

      ${m.pf !== undefined ? riga('Cure', `${Math.min(m.cure, m.pf)}/${m.pf} PF (cure magiche dirette)`) + riga('Cerusico', m.cer.guarisce != null ? 'guarisce ' + esc(M.formatoData(c, m.cer.guarisce)) : `${m.cer.tentativi} tentativi` + (m.cer.prossimo != null ? `, di nuovo da ${esc(M.formatoData(c, m.cer.prossimo))} con CD ${m.cer.cd}` : '')) : ''}

  let out = '', tab = [];
  const chiudi = () => { if (tab.length) { out += `<div class="tabmeteo"><table>${tab.map((r, i) => `<tr>${r.map(x => i ? `<td>${coloraTutte(esc(x))}</td>` : `<th>${esc(x)}</th>`).join('')}</tr>`).join('')}</table></div>`; tab = []; } };
  for (const r of righe) { if (r.includes(' | ')) { tab.push(r.split(' | ')); continue; } chiudi(); out += r.startsWith('• ') ? `<p class="piccolo voce">${coloraTutte(esc(r))}</p>` : `<p class="piccolo">${coloraTutte(esc(r))}</p>`; }

}

function finestraFallimento(chi, tabId) {
  const c = S.camp, cb = c.combattimento;
  const creature = [...c.pg.map(p => [`pg:${p.id}`, p.scheda.nome]), ...(cb ? Object.values(cb.righe).filter(r => r.tipo !== 'pg').map(r => [`riga:${r.id}`, M.etichetta(r)]) : [])];
  if (!creature.length) return avviso('Nessuna creatura', true);
  let fc = null;
  const scelto = f => { const [k, v] = (chi ? chiStr(chi) : val(f, 'chi').value).split(':'); return { [k]: v }; };
  const disegnaAnt = f => {
    const box = f.querySelector('#fc-ant'); if (!fc) { box.innerHTML = '<p class="tenue piccolo">Scegli la tabella e tira.</p>'; return; }
    const ch = scelto(f), altri = creature.filter(([v]) => v !== chiStr(ch));
    box.innerHTML = `<div class="risultato">${esc(fc.dado)} = ${fc.tiro}${fc.passata ? ` <span class="chip">già prono: conta come ${fc.passata.a}</span>` : ''}</div>
      <p>${coloraTutte(esc(fc.testo))}</p>
      ${fc.comps.length ? `<ul class="voci piccolo">${M.descriviFallimento(S.camp, fc).map(x => `<li>${coloraTutte(esc(x))}</li>`).join('')}</ul>` : ''}
      ${fc.note.length ? `<p class="tenue piccolo">${fc.note.map(esc).join(' ')}</p>` : ''}
      ${fc.alleato ? `<label class="campo"><span>Chi viene colpito (¹ ${esc(fc.nota_alleato)})</span><select name="colpito"><option value="">nessun alleato: ti colpisci da solo</option>${altri.map(([v, t]) => `<option value="${v}">${esc(t)}</option>`).join('')}</select></label>` : ''}
      ${fc.fineTurno ? '<p class="piccolo"><b>Il tuo turno termina.</b></p>' : ''}`;
  };
  const tira = f => { fc = M.fallimentoCritico(S.camp, scelto(f), FER, val(f, 't').value, rng); disegnaAnt(f); };
  const applicaFc = (f, fine) => {
    if (!fc) { tira(f); return false; }
    const col = fc.alleato && val(f, 'colpito') && val(f, 'colpito').value ? (([k, v]) => ({ [k]: v }))(val(f, 'colpito').value.split(':')) : null;
    let x = M.applicaFallimento(S.camp, scelto(f), fc, col, rng);
    if (fine && x.combattimento) x = M.comando(x, 'avanti', {}, MET, rng, Date.now());
    applicaS(x);
  };
  const el = apri({ titolo: 'Fallimento critico', larga: true, corpo: `<p class="tenue piccolo">${esc(FER.fallimenti.regola)}</p>
      ${chi ? `<p class="piccolo"><b>${esc(nomeChi(c, chi))}</b></p>` : `<label class="campo"><span>Chi</span><select name="chi">${creature.map(([v, t]) => `<option value="${v}">${esc(t)}</option>`).join('')}</select></label>`}
      <label class="campo"><span>Tabella</span><select name="t">${FER.fallimenti.tabelle.map(T => `<option value="${T.id}" ${T.id === (tabId || S.ui.fcTab) ? 'selected' : ''}>${esc(T.nome)} (${T.dado})</option>`).join('')}</select></label>
      <div class="fila"><button type="button" class="btn oro" data-fc="tira">Tira</button></div><div id="fc-ant"></div>`,
    azioni: [{ testo: 'Annulla' }, ...(cb ? [{ testo: 'Applica e termina il turno', fn: f => applicaFc(f, true) }] : []), { testo: 'Applica', classe: 'prim', fn: f => applicaFc(f, false) }] });
  el.addEventListener('click', ev => { if (ev.target.closest('[data-fc="tira"]')) prova(() => tira(el)); });
  el.addEventListener('change', ev => { if (ev.target.name === 't') { S.ui.fcTab = ev.target.value; fc = null; disegnaAnt(el); } if (ev.target.name === 'chi') { fc = null; disegnaAnt(el); } });
  disegnaAnt(el);
}
// ---------- AB4-1: Dadi
function finestraDadi() {
  const D = S.ui.dadi = S.ui.dadi || { espr: '1d20', modo: 'prova', log: leggiPref('dadi-log') === '1' };
  const storico = () => S.camp.tiri.map((x, i) => `<li><span class="num">${esc(M.testoTiro(x))}</span>${i === 0 && !x.ripetuto && !x.ripete ? ' <button type="button" class="btn min" data-dd="ripeti">Ripeti</button>' : ''}${x.fallimento ? ' <button type="button" class="btn min peric" data-dd="fc">Fallimento critico…</button>' : ''}</li>`).join('');
  const el = apri({ titolo: 'Dadi', larga: true, corpo: `<div class="fila">${['1d20', '1d4', '1d6', '1d8', '1d10', '1d12', '1d100', '2d6', '4d6kh3'].map(x => `<button type="button" class="btn min" data-dd-e="${x}">${x}</button>`).join('')}</div>
      <label class="campo"><span>Tiro (es. 1d20+5, 2d6+3, 4d6kh3)</span><input type="text" name="e" value="${esc(D.espr)}" autocomplete="off"></label>
      <div class="fila">${[['prova', 'Prova/TS (1 = −10, 20 = 30)'], ['colpire', 'Tiro per colpire (20 = 30, 1 = Fallimento critico)'], ['libero', 'Libero']].map(([v, t]) => `<label class="spunta piccolo"><input type="radio" name="m" value="${v}" ${D.modo === v ? 'checked' : ''}> ${t}</label>`).join('')}</div>
      <div class="fila"><label class="spunta piccolo"><input type="checkbox" name="va"> Vantaggio</label><label class="spunta piccolo"><input type="checkbox" name="sv"> Svantaggio</label>
        <label class="spunta piccolo"><input type="checkbox" name="lg" ${D.log ? 'checked' : ''}> anche nel log</label></div>
      <div id="dd-ris"></div><h4 class="sotto">Ultimi tiri</h4><ul class="log piccolo" id="dd-sto">${storico()}</ul>`,
    azioni: [{ testo: 'Chiudi' }, { testo: 'Tira', classe: 'prim', fn: f => {
      D.espr = testo(f, 'e'); D.modo = f.querySelector('[name="m"]:checked').value; D.log = spunta(f, 'lg'); scriviPref('dadi-log', D.log ? '1' : '0');
      const r = M.tiraDadi(S.camp, D.espr, D.modo, { vantaggio: spunta(f, 'va'), svantaggio: spunta(f, 'sv'), log: D.log }, rng); applica(r.camp); mostra(f, r.esito); return false; } }] });
  const mostra = (f, x) => { f.querySelector('#dd-ris').innerHTML = `<div class="risultato">${x.fallimento ? '<span class="cond-t">Fallimento critico</span>' : x.valore}</div>`; f.querySelector('#dd-sto').innerHTML = storico(); };
  el.addEventListener('click', ev => {
    const b = ev.target.closest('[data-dd-e]'); if (b) { val(el, 'e').value = b.dataset.ddE; return; }
    const r = ev.target.closest('[data-dd]'); if (!r) return;
    if (r.dataset.dd === 'ripeti') prova(() => { const x = M.ripetiTiro(S.camp, S.camp.tiri[0].id, rng, { log: spunta(el, 'lg') }); applica(x.camp); mostra(el, x.esito); });
    if (r.dataset.dd === 'fc') { const cb = S.camp.combattimento, a = cb && M.attuale(cb); finestraFallimento(a ? (a.tipo === 'pg' ? { pg: a.pgId } : { riga: a.id }) : null); }
  });
}
// ---------- AB4-2: Luce
function disegnaLuce() {
  const c = S.camp, voci = c.luci.map(x => { const f = M.infoLuce(STR, x.tipo), sp = x.accesa ? '' : M.motivoSpegne(c, MET, STR, x, c.tempo.R);
    return `<div class="membro"><div class="fila"><b>${esc(f.nome)}</b><span class="tenue piccolo">${esc(M.nomeChiLuce(c, x.chi))} · ${f.raggio} m</span>
      <span class="chip ${x.accesa ? 'ok' : ''}">${x.accesa ? 'accesa' : 'spenta'}</span><span class="num piccolo">${x.resta > 0 ? M.formatoDurata(x.resta) : 'consumata'}</span>
      <label class="spunta piccolo"><input type="checkbox" data-az-cambio="riparoLuce" data-id="${x.id}" ${x.riparo ? 'checked' : ''}> al riparo</label><span class="spazio"></span>
      ${x.accesa ? `<button class="btn min" data-az="spegniLuce" data-id="${x.id}">Spegni</button>` : `<button class="btn min oro" data-az="accendiLuce" data-id="${x.id}" ${x.resta <= 0 || sp ? `disabled title="${esc(sp ? 'il tempo la spegne: ' + sp : 'consumata')}"` : ''}>Accendi</button>`}
      <button class="btn min" data-az="ricaricaLuce" data-id="${x.id}">${f.olio ? 'Fiaschetta' : 'Sostituisci'}</button><button class="btn min peric" data-az="togliLuce" data-id="${x.id}" aria-label="Togli">✕</button></div>
      ${!x.accesa && sp && x.resta > 0 ? `<div class="tenue piccolo">Con il tempo di adesso non resta accesa: ${esc(sp)}.</div>` : ''}</div>`; }).join('');
  return `<div class="pannello" id="p-luce"><div class="fila"><h3>Luce</h3><span class="tenue piccolo">${c.luci.filter(x => x.accesa).length} accese</span><span class="spazio"></span><button class="btn min" data-az="nuovaLuce">+ Luce</button></div>
    ${voci || '<p class="tenue piccolo">Nessuna fonte di luce. Si consumano con l\'orologio e il meteo le spegne (tabella delle Fiamme).</p>'}</div>`;
}
function finestraLuce() {
  const c = S.camp, chi = [['gruppo', 'Il gruppo'], ...c.pg.map(p => ['pg:' + p.id, p.scheda.nome]), ...c.compagnia.persone.map(a => ['acc:' + a.id, a.nome])];
  const el = apri({ titolo: 'Nuova fonte di luce', corpo: `<label class="campo"><span>Fonte</span><select name="t">${STR.luce.map(f => `<option value="${f.id}">${esc(f.nome)} (${f.raggio} m, ${f.ore} ${f.ore === 1 ? 'ora' : 'ore'}${f.olio ? ' per fiaschetta' : ''}) · ${esc(f.costo)}</option>`).join('')}</select></label>
      <p class="tenue piccolo" id="l-desc"></p>
      <label class="campo"><span>A chi</span><select name="c">${chi.map(([v, t]) => `<option value="${v}">${esc(t)}</option>`).join('')}</select></label>
      <label class="spunta piccolo"><input type="checkbox" name="r"> Al riparo (al chiuso, in una grotta): il meteo non la spegne</label>
      <label class="spunta piccolo"><input type="checkbox" name="a" checked> Accendila subito</label>`,
    azioni: [{ testo: 'Annulla' }, { testo: 'Aggiungi', classe: 'prim', fn: f => { let x = M.aggiungiLuce(S.camp, STR, { tipo: val(f, 't').value, chi: val(f, 'c').value, riparo: spunta(f, 'r') });
      if (spunta(f, 'a')) { try { x = M.accendiLuce(x, MET, STR, x.luci.at(-1).id); } catch (e) { avviso(e.message, true); } } applica(x); } }] });
  const desc = () => { el.querySelector('#l-desc').textContent = M.infoLuce(STR, val(el, 't').value).testo; };
  el.addEventListener('change', desc); desc();
}
// ---------- AB4-3: Promemoria
function disegnaPromemoria() {
  const c = S.camp, cb = c.combattimento;
  const tempo = c.promemoria.map(p => `<div class="fila"><span class="chip promem num">${esc(M.formatoData(c, p.R))}</span><span class="spazio piccolo">${esc(p.testo)}</span><button class="btn min peric" data-az="togliPromemoria" data-id="${p.id}" aria-label="Togli">✕</button></div>`).join('');
  const round = cb ? cb.promemoria.map((p, i) => `<div class="fila"><span class="chip promem num">round ${p.round}</span><span class="spazio piccolo">${esc(p.testo)}</span><button class="btn min peric" data-az="togliPromRound" data-i="${i}" aria-label="Togli">✕</button></div>`).join('') : '';
  return `<div class="pannello" id="p-promemoria"><div class="fila"><h3>Promemoria</h3><span class="spazio"></span>${cb && cb.incontro && cb.promemoria.length ? '<button class="btn min" data-az="promInIncontro">Salva nell\'incontro</button>' : ''}<button class="btn min" data-az="nuovoPromemoria">+ Promemoria</button></div>
    ${tempo}${round}${tempo || round ? '' : '<p class="tenue piccolo">Nessun promemoria. Scattano da soli, in coda e nel log.</p>'}</div>`;
}
function finestraPromemoria() {
  const c = S.camp, t = M.scomponi(c), cb = c.combattimento;
  const el = apri({ titolo: 'Nuovo promemoria', corpo: `<label class="campo"><span>Testo</span><input type="text" name="t" placeholder="es. Arriva la carovana"></label>
      <div class="fila">${[['fra', 'Fra…'], ['alle', 'Il giorno… alle…'], ...(cb ? [['round', 'Al round…']] : [])].map(([v, x], i) => `<label class="spunta piccolo"><input type="radio" name="q" value="${v}" ${i === 0 ? 'checked' : ''}> ${x}</label>`).join('')}</div>
      <div class="griglia" data-q="fra"><label class="campo"><span>Quantità</span><input type="number" name="n" min="1" value="30"></label><label class="campo"><span>Unità</span><select name="u"><option value="minuti">minuti</option><option value="ore">ore</option><option value="giorni">giorni</option></select></label></div>
      <div class="griglia" data-q="alle" hidden><label class="campo"><span>Giorno</span><select name="g"><option value="0">oggi</option><option value="1">domani</option>${Array.from({ length: 12 }, (_, i) => `<option value="${i + 2}">fra ${i + 2} giorni</option>`).join('')}</select></label>
        <label class="campo"><span>Ora (hh:mm)</span><input type="time" name="h" value="${String((t.ore + 1) % 24).padStart(2, '0')}:00"></label></div>
      ${cb ? `<div class="griglia" data-q="round" hidden><label class="campo"><span>Round</span><input type="number" name="r" min="1" value="${cb.round + 1}"></label></div>` : ''}`,
    azioni: [{ testo: 'Annulla' }, { testo: 'Aggiungi', classe: 'prim', fn: f => { const q = f.querySelector('[name="q"]:checked').value, testoP = testo(f, 't');
      if (q === 'fra') return applica(M.aggiungiPromemoria(S.camp, { testo: testoP, tra: { n: intero(f, 'n'), unita: val(f, 'u').value } }));
      if (q === 'round') return applica(M.aggiungiPromemoria(S.camp, { testo: testoP, round: intero(f, 'r') }));
      const [hh, mm] = (val(f, 'h').value || '00:00').split(':').map(Number), g = M.scomponi(S.camp).N + +val(f, 'g').value;
      applica(M.aggiungiPromemoria(S.camp, { testo: testoP, R: g * M.ROUND_GIORNO + hh * M.ROUND_ORA + mm * M.ROUND_MIN })); } }] });
  el.addEventListener('change', ev => { if (ev.target.name !== 'q') return; for (const x of el.querySelectorAll('[data-q]')) x.hidden = x.dataset.q !== ev.target.value; });
}
// ---------- AB4-4: Log per sessione e per tipo
const TIPI_L = [['combattimento', 'Combattimento'], ['tempo', 'Tempo e meteo'], ['ferite', 'Ferite e cure'], ['scorte', 'Scorte'], ['tiri', 'Tiri'], ['altro', 'Altro']];
function disegnaLog() {
  const c = S.camp, sel = S.ui.logTipi = S.ui.logTipi || [];
  const v = M.righeLog(c, { tipi: sel }).slice(-300).reverse();
  return `<div class="pannello"><div class="fila"><h3>Log</h3><span class="spazio"></span><button class="btn min oro" data-az="iniziaSessione">Inizia sessione</button><button class="btn min" data-az="esportaLog">Esporta .txt</button></div>
    <div class="fila filtri">${TIPI_L.map(([k, t]) => `<button class="btn min${sel.includes(k) ? ' oro' : ''}" data-az="logTipo" data-k="${k}">${t}</button>`).join('')}${sel.length ? '<button class="btn min" data-az="logTipo" data-k="">Tutti</button>' : ''}</div>
    <ul class="log">${v.map(e => `<li${e.sessione ? ' class="sessione"' : ''}><span class="q">${esc(M.formatoData(c, e.R).replace(/^\S+ /, ''))}</span><span>${esc(e.testo)}</span></li>`).join('')}</ul></div>`;
}
Object.assign(AZ, {
  prontSez(el) { S.ui.pront.sez = el.dataset.s; disegna(); },
  prontGruppo(el) { S.ui.pront.gruppo = el.dataset.g; disegna(); },

    const x = document.querySelector(`.cond-card[data-nome="${CSS.escape(n)}"]`); if (x) x.scrollIntoView({ block: 'start' }); },

  fallimento(el) { finestraFallimento(el.dataset.chi ? chiDi(el) : null, el.dataset.t || null); },
  dadi() { finestraDadi(); },
  nuovaLuce() { finestraLuce(); },
  accendiLuce(el) { applica(M.accendiLuce(S.camp, MET, STR, el.dataset.id)); },
  spegniLuce(el) { applica(M.spegniLuce(S.camp, STR, el.dataset.id)); },
  ricaricaLuce(el) { applica(M.ricaricaLuce(S.camp, STR, el.dataset.id)); },
  togliLuce(el) { applica(M.togliLuce(S.camp, STR, el.dataset.id)); },
  nuovoPromemoria() { finestraPromemoria(); },
  togliPromemoria(el) { applica(M.togliPromemoria(S.camp, el.dataset.id)); },
  togliPromRound(el) { applica(M.togliPromemoriaRound(S.camp, +el.dataset.i)); },
  promInIncontro() { applica(M.salvaPromemoriaInIncontro(S.camp)); avviso('Promemoria salvati nell\'incontro'); },
  iniziaSessione() { applica(M.iniziaSessione(S.camp)); avviso('Inizio della sessione segnato nel log'); },
  logTipo(el) { const k = el.dataset.k, s = S.ui.logTipi || []; S.ui.logTipi = !k ? [] : s.includes(k) ? s.filter(x => x !== k) : [...s, k]; disegna(); },
  esportaLog() {
    const c = S.camp, tipi = S.ui.logTipi || [], sess = c.log.some(e => e.sessione);
    apri({ titolo: 'Esporta il log', corpo: `${sess ? `<div class="fila"><label class="spunta"><input type="radio" name="d" value="sessione" checked> Questa sessione</label><label class="spunta"><input type="radio" name="d" value="tutto"> Tutto</label></div>` : '<p class="tenue piccolo">Nessuna sessione segnata: si esporta tutto («Inizia sessione» segna l\'inizio).</p>'}
        ${tipi.length ? `<p class="piccolo">Solo: ${tipi.map(k => TIPI_L.find(x => x[0] === k)[1]).join(', ')}</p>` : ''}`,
      azioni: [{ testo: 'Annulla' }, { testo: 'Esporta', classe: 'prim', fn: f => { const da = sess ? f.querySelector('[name="d"]:checked').value : 'tutto';
        finestraEsporta(`${c.nome} - log${da === 'sessione' ? ' (sessione)' : ''}.txt`, M.testoLog(c, { da, tipi }), 'text/plain'); } }] });
  },
});
Object.assign(CAMBI, { riparoLuce(el) { applica(M.riparoLuce(S.camp, el.dataset.id, el.checked)); } });
document.addEventListener('input', ev => { if (ev.target.id !== 'pront-q') return; S.ui.pront.q = ev.target.value; clearTimeout(S.ui.prontT);
  S.ui.prontT = setTimeout(() => { const pos = ev.target.selectionStart; disegna(); const q = $('#pront-q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }, 250); });

// ================================================================= avvio
async function ricaricaElenco() {
  try { S.elenco = (await Archivio.lista()).sort((a, b) => (b.modificata || 0) - (a.modificata || 0)); }
  catch (e) { S.elenco = []; avviso('Archivio non leggibile: ' + e.message, true); }
  disegna();
}
(async () => { try { const b = await Archivio.leggiBestiario(); Best.mostri = (b && b.mostri) || []; Best.generici = (b && b.generici) || []; } catch (e) { avviso('Bestiario non leggibile: ' + e.message, true); } ricaricaElenco(); })();
